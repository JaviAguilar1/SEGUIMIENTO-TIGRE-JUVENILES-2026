<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tigre Juveniles">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tigre Juveniles — Plataforma de Análisis</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
/* ══════════════════════════════════════════════════════════
   TIGRE JUVENILES — Design System
══════════════════════════════════════════════════════════ */
:root {
  --bg:        #05080f;
  --surface:   #0a0f1e;
  --surface2:  #0d1528;
  --surface3:  #111e38;
  --border:    #1a2d5a;
  --border2:   #243f7a;
  --red:       #c0152a;
  --red2:      #e01830;
  --red-glow:  rgba(192,21,42,0.35);
  --blue:      #1a3a8f;
  --blue2:     #2450c0;
  --gold:      #c9a227;
  --gold2:     #f0c040;
  --win:       #22c55e;
  --draw:      #f59e0b;
  --loss:      #ef4444;
  --text:      #d8e4ff;
  --text2:     #a8c0e8;
  --muted:     #5a7099;
  --white:     #ffffff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Barlow',sans-serif;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 70% 35% at 20% 0%,rgba(26,58,143,0.2) 0%,transparent 65%),
    radial-gradient(ellipse 50% 25% at 80% 0%,rgba(192,21,42,0.12) 0%,transparent 60%);
}
/* While login wall is present, blur all underlying content */
body:has(#login-wall) header,
body:has(#login-wall) .nav-modules,
body:has(#login-wall) .module-panel,
body:has(#login-wall) #save-toast,
body:has(#login-wall) .scroll-top {
  visibility:hidden;
}

/* ── HEADER ─────────────────────────────────────────── */
header {
  background:linear-gradient(180deg,#0d1528 0%,#08111f 100%);
  border-bottom:3px solid var(--red);
  padding:0 20px;
  display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:300;
  min-height:66px;
  box-shadow:0 4px 40px rgba(0,0,0,0.7);
}
header::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;
  height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.crest-img{width:48px;height:48px;object-fit:contain;
  filter:drop-shadow(0 0 10px rgba(192,21,42,0.55));}
.header-titles h1{
  font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:5px;
  color:var(--white);line-height:1;
  text-shadow:0 0 30px rgba(192,21,42,0.4);
}
.header-titles p{color:var(--muted);font-size:10px;margin-top:2px;
  letter-spacing:2px;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;}
.header-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.season-pill{background:var(--red);color:white;font-family:'Bebas Neue',sans-serif;
  font-size:11px;letter-spacing:2px;padding:2px 10px;border-radius:20px;}
#admin-badge{display:none;align-items:center;gap:6px;}
.admin-tag{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);
  border-radius:4px;padding:2px 8px;font-family:'Barlow Condensed',sans-serif;
  font-size:10px;letter-spacing:1px;color:#22c55e;}
.role-tag{background:rgba(240,192,64,0.15);border:1px solid rgba(240,192,64,0.3);
  border-radius:4px;padding:2px 8px;font-family:'Barlow Condensed',sans-serif;
  font-size:10px;letter-spacing:1px;color:var(--gold2);}
#btn-login{display:flex;align-items:center;gap:5px;
  background:rgba(26,58,143,0.3);border:1px solid rgba(36,80,192,0.5);
  border-radius:4px;color:#60a5fa;font-size:10px;padding:3px 8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;transition:all .2s;}
#btn-login:hover{background:rgba(26,58,143,0.6);}
#btn-logout{display:none;align-items:center;gap:5px;
  background:rgba(192,21,42,0.2);border:1px solid rgba(192,21,42,0.4);
  border-radius:4px;color:#fca5a5;font-size:10px;padding:3px 8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}

/* ── NAV TABS (módulos) ─────────────────────────────── */
.nav-modules{
  background:linear-gradient(180deg,#09122a,#05080f);
  border-bottom:2px solid var(--border);
  display:flex;overflow-x:auto;scrollbar-width:none;
  position:sticky;top:66px;z-index:200;
}
.nav-modules::-webkit-scrollbar{display:none;}
.mod-tab{
  padding:14px 28px;
  font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;
  color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;
  transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:8px;
}
.mod-tab:hover{color:var(--text);background:rgba(26,58,143,0.1);}
.mod-tab.active{color:var(--gold2);border-bottom-color:var(--red);background:rgba(26,58,143,0.15);}
.mod-tab .mod-icon{font-size:16px;}

/* ── CAT SUBTABS ────────────────────────────────────── */
.cat-subtabs{
  background:rgba(8,17,31,0.8);
  border-bottom:1px solid var(--border);
  display:flex;overflow-x:auto;scrollbar-width:none;padding:0 16px;
}
.cat-subtabs::-webkit-scrollbar{display:none;}
.cat-tab{
  padding:9px 16px;
  font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
  transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.cat-tab:hover{color:var(--text);}
.cat-tab.active{border-bottom-color:currentColor;}
.cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* ── MAIN CONTENT ───────────────────────────────────── */
.main{padding:20px;max-width:1500px;margin:0 auto;}
.module-panel{display:none;}
.module-panel.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── SECTION TITLE ──────────────────────────────────── */
.st{
  font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;
  color:var(--gold2);margin:20px 0 14px;display:flex;align-items:center;gap:10px;
}
.st .stbar{width:4px;height:16px;background:linear-gradient(180deg,var(--red2),var(--blue2));
  border-radius:2px;flex-shrink:0;}
.st::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}

/* ── STAT CARDS ─────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin-bottom:20px;}
.stat-card{
  background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center;
  transition:all .2s;position:relative;overflow:hidden;
}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:10px 10px 0 0;}
.stat-card.pts::before{background:var(--gold);}
.stat-card.win::before{background:var(--win);}
.stat-card.draw::before{background:var(--draw);}
.stat-card.loss::before{background:var(--loss);}
.stat-card.gf::before{background:var(--blue2);}
.stat-card.gc::before{background:var(--red2);}
.stat-card.dg::before{background:#a78bfa;}
.stat-card.pj::before{background:var(--muted);}
.stat-card:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:0 6px 20px rgba(0,0,0,0.4);}
.stat-card .val{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;margin-bottom:4px;}
.stat-card .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;}
.stat-card.pts .val{color:var(--gold2);}
.stat-card.win .val{color:var(--win);}
.stat-card.draw .val{color:var(--draw);}
.stat-card.loss .val{color:var(--loss);}
.stat-card.gf .val{color:#60a5fa;}
.stat-card.gc .val{color:#f87171;}
.stat-card.dg .val{color:#c4b5fd;}
.stat-card.pj .val{color:var(--text);}

/* ── PERIOD TABS ────────────────────────────────────── */
.periodo-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.ptab{
  padding:5px 13px;background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
  transition:all .2s;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;
}
.ptab:hover{color:var(--text);border-color:var(--red);}
.ptab.active{background:var(--red);color:white;border-color:var(--red);box-shadow:0 2px 10px var(--red-glow);}

/* ── CHARTS ─────────────────────────────────────────── */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.chart-card{background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:12px;padding:18px;}
.chart-card h3{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;
  color:var(--gold);margin-bottom:14px;}
.pies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:24px;}
.pie-card{background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;}
.pie-card h4{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1.5px;
  color:var(--gold);margin-bottom:10px;}
.pie-stat-row{display:flex;justify-content:center;gap:8px;margin-top:8px;
  font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:600;}

/* ── RESULTS TABLE ──────────────────────────────────── */
.table-wrap{overflow-x:auto;margin-bottom:24px;border-radius:10px;
  border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,0.4);}
table{width:100%;border-collapse:collapse;font-size:12px;}
table thead tr.thead-top th{
  background:linear-gradient(180deg,var(--red) 0%,#8a0f1e 100%);
  color:white;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;
  padding:8px 10px;text-align:center;white-space:nowrap;
  border-right:1px solid rgba(255,255,255,0.1);}
table thead tr.thead-sub th{
  background:linear-gradient(180deg,#0d1a3a,#08111f);color:var(--gold);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;
  text-transform:uppercase;letter-spacing:1px;padding:6px 8px;
  border-bottom:1px solid var(--border2);border-right:1px solid var(--border);
  white-space:nowrap;text-align:center;}
table td{padding:5px 7px;border-bottom:1px solid rgba(26,45,90,0.4);
  border-right:1px solid rgba(26,45,90,0.25);text-align:center;vertical-align:middle;}
table td:last-child,table th:last-child{border-right:none;}
table tr:nth-child(even) td{background:rgba(10,15,30,0.4);}
table tr:hover td{background:rgba(26,58,143,0.15);}
.divider-row td{
  background:linear-gradient(90deg,rgba(192,21,42,0.12),transparent)!important;
  font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:11px;
  color:var(--red2)!important;text-align:left!important;padding:5px 14px!important;
  border-left:3px solid var(--red)!important;}
.fecha-num{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--muted);width:30px;}
.rival-name{text-align:left!important;font-family:'Barlow Condensed',sans-serif;
  font-weight:600;font-size:13px;min-width:140px;}
.cond-badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1px;}
.cond-L{background:rgba(26,58,143,0.4);color:#93c5fd;border:1px solid rgba(36,80,192,0.4);}
.cond-V{background:rgba(192,21,42,0.3);color:#fca5a5;border:1px solid rgba(192,21,42,0.4);}
.score-cell{display:flex;align-items:center;justify-content:center;gap:4px;}
.score-input{width:32px;background:rgba(5,8,15,0.9);border:1px solid var(--border2);
  border-radius:4px;color:white;font-size:14px;font-weight:700;text-align:center;
  padding:3px 2px;transition:all .2s;font-family:'Barlow Condensed',sans-serif;}
.score-input:focus{outline:none;border-color:var(--gold);background:rgba(26,58,143,0.3);}
.score-input:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none;}
.score-sep{color:var(--muted);font-weight:900;font-size:13px;}
.result-badge{display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:21px;border-radius:4px;font-weight:800;font-size:10px;
  font-family:'Barlow Condensed',sans-serif;}
.result-W{background:rgba(34,197,94,.2);color:var(--win);border:1px solid rgba(34,197,94,.35);}
.result-D{background:rgba(245,158,11,.2);color:var(--draw);border:1px solid rgba(245,158,11,.35);}
.result-L{background:rgba(239,68,68,.2);color:var(--loss);border:1px solid rgba(239,68,68,.35);}

/* ── MATCH DETAIL PANEL ─────────────────────────────── */
.match-detail-row td{padding:0!important;border-top:none!important;}
.match-detail-panel{
  background:rgba(5,8,15,0.7);border:1px solid rgba(26,45,90,0.6);
  border-top:2px solid var(--gold2);border-radius:0 0 8px 8px;
  padding:14px 16px;margin:-1px 0 4px;animation:fadeIn .2s;
}
.mdp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:700px){.mdp-grid{grid-template-columns:1fr 1fr;}}
.mdp-section h4{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;
  color:var(--gold2);margin-bottom:6px;border-bottom:1px solid rgba(201,162,39,0.2);padding-bottom:3px;}
.mdp-player{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;
  font-family:'Barlow Condensed',sans-serif;color:var(--text2);border-bottom:1px solid rgba(26,45,90,0.2);}
.mdp-num{background:rgba(26,45,90,0.5);border-radius:3px;padding:1px 5px;
  font-size:10px;color:var(--blue2);font-weight:700;min-width:20px;text-align:center;}
.mdp-mins{margin-left:auto;font-size:10px;color:var(--muted);white-space:nowrap;}
.mdp-mins.ok{color:var(--win);}
.mdp-mins.diff{color:var(--gold);}
.mdp-cambio{display:flex;align-items:center;gap:6px;font-size:11px;
  font-family:'Barlow Condensed',sans-serif;padding:3px 0;color:var(--text2);}
.mdp-cambio-min{background:rgba(192,21,42,0.2);color:var(--loss);border-radius:3px;
  padding:1px 5px;font-size:10px;font-weight:700;min-width:28px;text-align:center;}
.mdp-del{background:none;border:none;color:rgba(239,68,68,0.5);cursor:pointer;font-size:12px;margin-left:auto;}
.mdp-del:hover{color:#ef4444;}
.mdp-add-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.mdp-sel{background:rgba(5,8,15,0.8);border:1px solid var(--border2);border-radius:5px;
  color:var(--text);font-size:11px;padding:5px 7px;font-family:'Barlow Condensed',sans-serif;flex:1;min-width:110px;}
.mdp-min-input{background:rgba(5,8,15,0.8);border:1px solid var(--border2);border-radius:5px;
  color:var(--text);font-size:11px;padding:5px 7px;font-family:'Barlow Condensed',sans-serif;width:56px;}
.mdp-add-btn{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);border-radius:5px;
  color:#22c55e;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px;
  padding:5px 10px;cursor:pointer;}
.mdp-add-btn:hover{background:rgba(34,197,94,0.25);}
.mdp-upload-btn{background:rgba(201,162,39,0.1);border:1px solid rgba(201,162,39,0.3);
  border-radius:5px;color:var(--gold2);font-family:'Bebas Neue',sans-serif;
  font-size:11px;letter-spacing:1px;padding:5px 10px;cursor:pointer;white-space:nowrap;}
.mdp-upload-btn:hover{background:rgba(201,162,39,0.2);}
.btn-equipo{background:rgba(201,162,39,0.08);border:1px solid rgba(201,162,39,0.25);
  border-radius:4px;color:var(--gold2);font-size:10px;font-family:'Bebas Neue',sans-serif;
  letter-spacing:1px;padding:2px 7px;cursor:pointer;white-space:nowrap;}
.btn-equipo:hover,.btn-equipo.active{background:rgba(201,162,39,0.2);border-color:var(--gold2);}
.mdp-dur-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;
  font-family:'Barlow Condensed',sans-serif;color:var(--muted);}
.mdp-dur-input{background:rgba(5,8,15,0.8);border:1px solid var(--border2);border-radius:4px;
  color:var(--text);font-size:11px;padding:3px 6px;width:48px;text-align:center;}
.link-cell{min-width:76px;max-width:110px;}
.link-wrap{display:flex;gap:3px;align-items:center;}
.link-input{flex:1;min-width:0;background:rgba(5,8,15,0.6);border:1px solid rgba(26,45,90,0.5);
  border-radius:4px;color:#93c5fd;font-size:9px;padding:3px 5px;transition:all .2s;
  font-family:'Barlow',sans-serif;}
.link-input:focus{outline:none;border-color:var(--gold);}
.link-input::placeholder{color:rgba(90,112,153,0.4);font-style:italic;}
.link-input:disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;}
.link-btn{display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;flex-shrink:0;background:rgba(26,58,143,0.3);
  border:1px solid var(--border2);border-radius:4px;color:#93c5fd;font-size:10px;
  cursor:pointer;text-decoration:none;transition:all .2s;}
.link-btn:hover{background:var(--red);border-color:var(--red);color:white;}
.link-btn.empty{opacity:0.2;pointer-events:none;}

/* ── GOLEADORES ─────────────────────────────────────── */
.goleadores-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:14px;margin-bottom:24px;}
.goleadores-card{background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.goleadores-card .gc-header{
  background:linear-gradient(135deg,var(--red),#8a0f1e);
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.goleadores-card .gc-header h3{font-family:'Bebas Neue',sans-serif;font-size:15px;
  letter-spacing:2px;color:white;}
.goleadores-card .gc-body{padding:0;}
.gol-row{display:flex;align-items:center;gap:10px;padding:8px 14px;
  border-bottom:1px solid rgba(26,45,90,0.4);transition:background .15s;}
.gol-row:hover{background:rgba(26,58,143,0.15);}
.gol-row:last-child{border-bottom:none;}
.gol-rank{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted);
  width:24px;text-align:center;flex-shrink:0;}
.gol-rank.gold{color:var(--gold2);}
.gol-rank.silver{color:#94a3b8;}
.gol-rank.bronze{color:#b45309;}
.gol-name{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;}
.gol-count{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold2);}
.gol-add-row{padding:8px 14px;display:flex;gap:6px;align-items:center;
  border-top:1px solid var(--border);}
.gol-input{flex:1;background:rgba(5,8,15,0.7);border:1px solid var(--border2);
  border-radius:5px;color:var(--text);font-size:12px;padding:5px 8px;
  font-family:'Barlow',sans-serif;}
.gol-input:focus{outline:none;border-color:var(--gold);}
.gol-fecha-input{width:50px;background:rgba(5,8,15,0.7);border:1px solid var(--border2);
  border-radius:5px;color:var(--text);font-size:12px;padding:5px 6px;text-align:center;
  font-family:'Barlow Condensed',sans-serif;}
.gol-fecha-input:focus{outline:none;border-color:var(--gold);}
.btn-add-gol{background:var(--blue2);border:none;border-radius:5px;color:white;
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;
  padding:5px 12px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-add-gol:hover{background:var(--blue);}
.gol-empty{padding:16px;text-align:center;color:var(--muted);font-size:12px;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}

/* ── GENERAL COMPARISON TABLE ───────────────────────── */
.gen-table-wrap{overflow-x:auto;margin-bottom:24px;border-radius:10px;border:1px solid var(--border);}
table.gen-table thead tr th{
  background:linear-gradient(180deg,var(--red),#8a0f1e);color:white;
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1.5px;
  padding:10px 12px;text-align:center;border-right:1px solid rgba(255,255,255,0.1);}
table.gen-table tbody td{padding:8px 12px;border-bottom:1px solid var(--border);
  border-right:1px solid rgba(26,45,90,0.3);text-align:center;}
table.gen-table tbody tr:nth-child(even) td{background:rgba(10,15,30,0.4);}
table.gen-table tbody tr:hover td{background:rgba(26,58,143,0.12);}
table.gen-table .cat-cell{font-family:'Bebas Neue',sans-serif;font-size:15px;
  letter-spacing:1px;text-align:left!important;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}

/* ── MISC UI ────────────────────────────────────────── */
.scroll-top{position:fixed;bottom:20px;right:20px;width:40px;height:40px;
  background:linear-gradient(135deg,var(--red),var(--blue));border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:white;font-size:17px;font-weight:800;
  box-shadow:0 4px 20px rgba(192,21,42,0.5);z-index:99;transition:transform .2s;}
.scroll-top:hover{transform:scale(1.1);}

/* ── LOGIN MODAL ────────────────────────────────────── */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,15,0.92);
  display:flex;align-items:center;justify-content:center;z-index:10000;}
.modal-box{background:linear-gradient(135deg,#0d1528,#08111f);
  border:1px solid var(--border);border-top:3px solid var(--red);
  border-radius:16px;padding:36px;width:320px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.8);}
.modal-box .m-crest{width:60px;margin-bottom:16px;
  filter:drop-shadow(0 0 10px rgba(192,21,42,0.5));}
.modal-box h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px;
  color:var(--gold2);margin-bottom:4px;}
.modal-box p{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);
  margin-bottom:24px;letter-spacing:1px;}
.m-input{width:100%;background:rgba(5,8,15,0.8);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:14px;padding:10px 14px;
  margin-bottom:10px;outline:none;font-family:'Barlow',sans-serif;transition:border-color .2s;}
.m-input:focus{border-color:var(--gold);}
.m-btn{width:100%;background:linear-gradient(135deg,var(--red),#8a0f1e);border:none;
  border-radius:8px;color:white;font-family:'Bebas Neue',sans-serif;font-size:18px;
  letter-spacing:3px;padding:12px;cursor:pointer;margin-bottom:10px;
  box-shadow:0 4px 16px var(--red-glow);transition:opacity .2s;}
.m-btn:hover{opacity:.85;}
.m-cancel{background:none;border:none;color:var(--muted);font-family:'Barlow Condensed',sans-serif;
  font-size:12px;cursor:pointer;letter-spacing:1px;}
.m-error{color:var(--loss);font-size:12px;margin-top:8px;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;display:none;}

/* ── TOASTS ─────────────────────────────────────────── */
#save-toast{position:fixed;bottom:68px;right:20px;
  background:linear-gradient(135deg,#1a3a8f,#0d1528);
  border:1px solid var(--win);border-radius:8px;padding:7px 14px;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;
  color:var(--win);z-index:999;box-shadow:0 4px 16px rgba(0,0,0,0.5);
  transition:opacity .4s;pointer-events:none;opacity:0;}

/* ── ALERT PILLS ─────────────────────────────────── */
#alert-pills{ min-height: 14px; }

/* ── CARGA MODULE ─────────────────────────────────── */
#gym-overlay input:focus { border-color: var(--gold2) !important; outline:none; }

/* ── RESPONSIVE ─────────────────────────────────────── */
@media(max-width:750px){
  .charts-row{grid-template-columns:1fr;}
  .pies-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .stats-grid{grid-template-columns:repeat(4,1fr);}
  .stat-card .val{font-size:26px;}
  .main{padding:10px;}
  header{padding:8px 12px;min-height:56px;gap:10px;}
  .crest-img{width:38px;height:38px;}
  .header-titles h1{font-size:20px;letter-spacing:3px;}
  .header-titles p{display:none;}
  .nav-modules{top:56px;}
  .mod-tab{padding:12px 16px;font-size:14px;letter-spacing:2px;}
  .link-cell{min-width:64px;max-width:88px;}
  .link-input{font-size:9px;padding:3px 4px;}
  .rival-name{min-width:100px;font-size:11px;}
  .score-input{width:28px;font-size:13px;}
  .goleadores-grid{grid-template-columns:1fr;}
}
@media(max-width:400px){
  .stats-grid{grid-template-columns:repeat(4,1fr);gap:6px;}
  .stat-card{padding:10px 6px;}
  .stat-card .val{font-size:22px;}
}

/* ══════════════════════════════════════════════════
   PLANTEL MODULE — CSS
══════════════════════════════════════════════════ */

/* ── Toolbar ─────────────────────────────────── */
.plantel-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.plantel-toolbar input[type="text"] {
  flex: 1;
  min-width: 180px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  padding: 8px 14px;
  font-family: 'Barlow', sans-serif;
  outline: none;
  transition: border-color .2s;
}
.plantel-toolbar input[type="text"]:focus { border-color: var(--gold); }
.plantel-toolbar input[type="text"]::placeholder { color: var(--muted); }
.pos-filter {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.pos-pill {
  padding: 5px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 11px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  letter-spacing: .5px;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s;
}
.pos-pill:hover { color: var(--text); border-color: var(--blue2); }
.pos-pill.active { background: var(--blue2); color: white; border-color: var(--blue2); }
.btn-add-player {
  background: linear-gradient(135deg, var(--red), #8a0f1e);
  border: none;
  border-radius: 8px;
  color: white;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  padding: 8px 18px;
  cursor: pointer;
  transition: opacity .2s;
  white-space: nowrap;
  box-shadow: 0 3px 12px var(--red-glow);
}
.btn-add-player:hover { opacity: .85; }

/* ── Player grid ─────────────────────────────── */
.players-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}
.player-card {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}
.player-card:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.player-card .pc-top {
  background: linear-gradient(135deg, var(--red), #6a0d1b);
  padding: 14px 14px 10px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  position: relative;
}
.player-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  color: white;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.3);
  overflow: hidden;
}
.player-avatar img { width: 100%; height: 100%; object-fit: cover; }
.pc-name-block { flex: 1; min-width: 0; }
.pc-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: white;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pc-pos {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 11px;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.65);
  margin-top: 2px;
}
.pc-body {
  padding: 10px 14px 12px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 10px;
}
.pc-field { }
.pc-field .pf-lbl {
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: 'Barlow Condensed', sans-serif;
}
.pc-field .pf-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.pc-cat-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 2px 7px;
  border-radius: 10px;
  background: rgba(0,0,0,0.35);
  color: white;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-state .es-icon { font-size: 48px; margin-bottom: 14px; opacity: .5; }
.empty-state h3 { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 13px; }

/* ── Player MODAL (ficha completa) ───────────── */
.ficha-modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(5,8,15,0.92);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  z-index: 5000;
  padding: 20px;
  overflow-y: auto;
}
.ficha-modal {
  background: linear-gradient(160deg, #0d1528, #08111f);
  border: 1px solid var(--border);
  border-top: 3px solid var(--red);
  border-radius: 16px;
  width: 100%;
  max-width: 680px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.8);
  overflow: hidden;
  position: relative;
  margin: auto;
}
.ficha-header {
  background: linear-gradient(135deg, var(--red), #6a0d1b);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.ficha-avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  color: white;
  flex-shrink: 0;
  border: 3px solid rgba(255,255,255,0.35);
  overflow: hidden;
  cursor: pointer;
  transition: border-color .2s;
}
.ficha-avatar:hover { border-color: var(--gold2); }
.ficha-avatar img { width: 100%; height: 100%; object-fit: cover; }
.ficha-name-block h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 3px;
  color: white;
  line-height: 1;
}
.ficha-name-block p {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  margin-top: 4px;
  letter-spacing: 1px;
}
.ficha-close {
  position: absolute;
  top: 14px;
  right: 16px;
  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .2s;
}
.ficha-close:hover { background: rgba(255,255,255,0.3); }
.ficha-body { padding: 22px 24px 28px; }
.ficha-section {
  margin-bottom: 22px;
}
.ficha-section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--gold);
  border-bottom: 1px solid var(--border2);
  padding-bottom: 6px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ficha-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 20px;
}
.ficha-fields.three { grid-template-columns: 1fr 1fr 1fr; }
.ficha-field label {
  display: block;
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: 'Barlow Condensed', sans-serif;
  margin-bottom: 4px;
}
.ficha-field input,
.ficha-field select {
  width: 100%;
  background: rgba(5,8,15,0.7);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  padding: 7px 10px;
  font-family: 'Barlow', sans-serif;
  transition: border-color .2s;
  outline: none;
}
.ficha-field input:focus,
.ficha-field select:focus { border-color: var(--gold); background: rgba(26,58,143,0.15); }
.ficha-field input:disabled,
.ficha-field select:disabled { opacity: .55; cursor: not-allowed; }
.ficha-field select option { background: #0d1528; }
.ficha-actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.btn-save-ficha {
  flex: 1;
  background: linear-gradient(135deg, var(--blue2), var(--blue));
  border: none;
  border-radius: 8px;
  color: white;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 2px;
  padding: 11px;
  cursor: pointer;
  transition: opacity .2s;
}
.btn-save-ficha:hover { opacity: .85; }
.btn-del-ficha {
  background: rgba(192,21,42,0.15);
  border: 1px solid rgba(192,21,42,0.4);
  border-radius: 8px;
  color: #f87171;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 1px;
  padding: 11px 16px;
  cursor: pointer;
  transition: all .2s;
}
.btn-del-ficha:hover { background: rgba(192,21,42,0.3); }

/* ── Count badge ──────────────────────────────── */
.player-count {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 14px;
  letter-spacing: .5px;
}
.player-count span { color: var(--gold2); font-weight: 700; }

@media(max-width:600px){
  .ficha-fields { grid-template-columns: 1fr 1fr; }
  .ficha-fields.three { grid-template-columns: 1fr 1fr; }
  .ficha-modal { margin: 10px; width: calc(100% - 20px); }
  .players-grid { grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); }
}


/* ══════════════════════════════════════════════════════
   RENDIMIENTO MODULE — CSS
══════════════════════════════════════════════════════ */

/* ── Rendimiento cat subtabs content ────────────────── */
#rend-content { }

/* ── FORMA RECIENTE ─────────────────────────────────── */
.forma-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.forma-card {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.forma-card .fc-header {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.forma-card .fc-header h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 15px;
  letter-spacing: 2px;
}
.forma-badges {
  display: flex;
  gap: 5px;
  padding: 12px 16px;
  align-items: center;
}
.forma-badge {
  width: 32px; height: 32px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  font-weight: 800;
  flex-shrink: 0;
}
.forma-badge.W { background: rgba(34,197,94,.25); color: var(--win); border: 1px solid rgba(34,197,94,.4); }
.forma-badge.D { background: rgba(245,158,11,.25); color: var(--draw); border: 1px solid rgba(245,158,11,.4); }
.forma-badge.L { background: rgba(239,68,68,.25); color: var(--loss); border: 1px solid rgba(239,68,68,.4); }
.forma-badge.empty { background: rgba(255,255,255,.05); color: var(--muted); border: 1px solid var(--border); }
.forma-pts {
  padding: 0 16px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .5px;
}
.forma-pts span { color: var(--gold2); font-weight: 700; }

/* ── LOCAL VS VISITANTE ─────────────────────────────── */
.lvv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.lvv-card {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.lvv-card .lv-header {
  background: linear-gradient(135deg, var(--red), #6a0d1b);
  padding: 10px 16px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 15px;
  letter-spacing: 2px;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lvv-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border);
}
.lvv-half {
  background: var(--surface2);
  padding: 14px;
  text-align: center;
}
.lvv-half .lvv-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.lvv-stats-mini {
  display: flex;
  justify-content: center;
  gap: 8px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
}
.lvv-pts-big {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  color: var(--gold2);
  line-height: 1;
  margin-bottom: 4px;
}
.lvv-sub {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  color: var(--muted);
}

/* ── ÍNDICE DE RENDIMIENTO ──────────────────────────── */
.indice-table-wrap {
  overflow-x: auto;
  margin-bottom: 24px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.indice-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.indice-table thead th {
  background: linear-gradient(180deg, var(--red), #8a0f1e);
  color: white;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 1.5px;
  padding: 9px 12px;
  text-align: center;
  border-right: 1px solid rgba(255,255,255,.1);
  white-space: nowrap;
}
.indice-table tbody td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid rgba(26,45,90,.3);
  text-align: center;
  vertical-align: middle;
}
.indice-table tbody tr:nth-child(even) td { background: rgba(10,15,30,.4); }
.indice-table tbody tr:hover td { background: rgba(26,58,143,.15); }
.indice-name { text-align: left !important; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; min-width: 140px; }
.indice-bar-wrap { min-width: 80px; }
.indice-bar {
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--blue2), var(--gold2));
  transition: width .4s;
}
.indice-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
}

/* ── LESIONES ───────────────────────────────────────── */
.lesiones-toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  align-items: center;
}
.lesiones-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}
.lesion-item {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-left: 4px solid var(--red);
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 14px;

}

.add-lesion-form select {

  border: 1px solid var(--border);

/* ── TARJETAS ───────────────────────────────────────── */
.tarjetas-grid {

}
.tarjetas-cat-card {

}

}

}

}

.tarjeta-row:last-child { border-bottom: none; }
.tarjeta-name {

  font-weight: 600;
  font-size: 13px;
}
.tarjeta-counts {

  align-items: center;
}
.tc-amarilla {

  font-family: 'Bebas Neue', sans-serif;

}
.tc-roja {
  background: rgba(239,68,68,.2);
  color: var(--loss);
  border: 1px solid rgba(239,68,68,.3);
  border-radius: 4px;
  padding: 2px 8px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  min-width: 28px;
  text-align: center;
}
.tc-alert {
  background: rgba(239,68,68,.15);
  border: 1px solid rgba(239,68,68,.3);

.tc-tarj-btns {

}

.btn-add-am { background: rgba(245,158,11,.5); color: white; }
.btn-add-ro { background: rgba(239,68,68,.5); color: white; }
.btn-sub-am { background: rgba(245,158,11,.2); color: var(--draw); }
.btn-sub-ro { background: rgba(239,68,68,.2); color: var(--loss); }
.tarjetas-add-row {

}
.tarjetas-add-row input {

  background: rgba(5,8,15,.7);
  border: 1px solid var(--border2);
  border-radius: 5px;
  color: var(--text);
  font-size: 12px;
  padding: 5px 8px;
  font-family: 'Barlow', sans-serif;

}
.tarjetas-add-row input:focus { border-color: var(--gold); }
.btn-add-tarjeta {
  background: var(--blue2);
  border: none;
  border-radius: 5px;
  color: white;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px;
  letter-spacing: 1px;
  padding: 5px 10px;

/* ── ALERTAS BANNER ─────────────────────────────────── */
.alertas-banner {
  background: linear-gradient(135deg, rgba(239,68,68,.1), rgba(192,21,42,.05));
  border: 1px solid rgba(239,68,68,.3);

}

}

/* ── PDF CITACIONES ─────────────────────────────────── */
.pdf-section {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 24px;
}
.pdf-section h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 2px;
  color: var(--gold2);
  margin-bottom: 16px;
}
.pdf-form {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 10px;
  align-items: end;
  margin-bottom: 14px;
}
.pdf-form label {
  display: block;
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: 'Barlow Condensed', sans-serif;
  margin-bottom: 4px;
}
.pdf-form input,
.pdf-form select {
  width: 100%;
  background: rgba(5,8,15,.8);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  padding: 8px 10px;
  font-family: 'Barlow', sans-serif;
  outline: none;
  transition: border-color .2s;
}
.pdf-form input:focus,
.pdf-form select:focus { border-color: var(--gold); }
.pdf-form select option { background: #0d1528; }
.btn-gen-pdf {
  background: linear-gradient(135deg, var(--gold2), var(--gold));
  border: none;
  border-radius: 6px;
  color: #08111f;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  padding: 8px 18px;
  cursor: pointer;
  transition: opacity .2s;
  white-space: nowrap;
}
.btn-gen-pdf:hover { opacity: .85; }
.players-checklist {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
  gap: 6px;
  max-height: 240px;
  overflow-y: auto;
  padding: 4px;
}
.check-player {
  display: flex;

.check-player input[type="checkbox"] { accent-color: var(--win); width: 14px; height: 14px; }

@media(max-width:750px){
  .add-lesion-form { grid-template-columns: 1fr 1fr; }

  .lvv-grid,.tarjetas-grid,.forma-grid { grid-template-columns: 1fr; }
}

.gps-subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}

.gps-upload-form select,.gps-upload-form input{width:100%;background:rgba(5,8,15,.8);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:7px 10px;font-family:'Barlow',sans-serif;outline:none;transition:border-color .2s;}
.gps-upload-form select:focus,.gps-upload-form input:focus{border-color:var(--gold);}
.gps-upload-form select option{background:#0d1528;}
.btn-gps-upload{background:var(--red);border:none;border-radius:6px;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;padding:7px 16px;cursor:pointer;white-space:nowrap;transition:opacity .2s;}

.gps-extract-progress{background:linear-gradient(135deg,var(--surface2),var(--surface));border:1px solid var(--gold);border-radius:12px;padding:20px;margin-bottom:20px;text-align:center;display:none;}

.gps-sessions-list{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}

.gps-section-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:3px;color:var(--gold2);margin:20px 0 10px;}
.gps-section-title::after{content:'';display:block;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:4px;}
.gps-player-select{width:100%;background:rgba(5,8,15,.8);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;padding:8px 10px;font-family:'Barlow',sans-serif;outline:none;margin-bottom:14px;}
.gps-player-select:focus{border-color:var(--gold);}

<!-- HEADER -->
<header>
  <img class="crest-img" id="escudoImg" alt="Tigre">
  <div class="header-titles">
    <h1>TIGRE JUVENILES</h1>
    <p>Plataforma de Análisis · Divisiones Inferiores</p>
  </div>
  <div class="header-right">
    <div class="season-pill">TEMPORADA 2026</div>
    <button id="btn-share" onclick="copyShareLink()"
      style="display:flex;align-items:center;gap:5px;margin-top:4px;
      background:rgba(26,58,143,0.25);border:1px solid rgba(36,80,192,0.4);
      border-radius:4px;color:var(--muted);font-size:9px;padding:3px 8px;cursor:pointer;
      font-family:Barlow Condensed,sans-serif;letter-spacing:1px;transition:all .2s;"
      title="Copiar link de vista pública"
      onmouseover="this.style.color='var(--gold2)'"
      onmouseout="this.style.color='var(--muted)'">
      🔗 COMPARTIR
    </button>
    <div id="admin-badge">
      <span class="admin-tag" id="role-tag-txt">ADMIN</span>
      <button id="btn-reset" onclick="clearData()" style="display:none;background:rgba(192,21,42,0.2);border:1px solid rgba(192,21,42,0.4);border-radius:4px;color:rgba(255,100,100,0.7);font-size:9px;padding:2px 6px;cursor:pointer;font-family:Barlow Condensed,sans-serif;letter-spacing:1px;">🗑</button>
    </div>
    <button id="btn-login" onclick="showLoginModal()">🔑 INGRESAR</button>
    <button id="btn-logout" onclick="doLogout()">✕ SALIR</button>
    <!-- Alert pills — shown when there are active warnings -->
    <div id="alert-pills" style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;margin-top:2px;min-height:16px"></div>
  </div>
</header>

<nav class="nav-modules" id="navModules"></nav>

function getResult(gf,gc){ if(gf===null||gc===null)return null; return gf>gc?'W':gf===gc?'D':'L'; }
function calcStats(cat,from,to){
  let pj=0,pg=0,pe=0,pp=0,gf=0,gc=0;
  for(let f=from;f<=to;f++){
    const r=results[cat][f];
    if(r){pj++;gf+=r[0];gc+=r[1];const x=getResult(r[0],r[1]);if(x==='W')pg++;else if(x==='D')pe++;else pp++;}
  }
  return{pj,pg,pe,pp,gf,gc,dg:gf-gc,pts:pg*3+pe};
}
function calcStatsAll(from,to){
  let pj=0,pg=0,pe=0,pp=0,gf=0,gc=0;
  CATEGORIES.forEach(cat=>{const s=calcStats(cat,from,to);pj+=s.pj;pg+=s.pg;pe+=s.pe;pp+=s.pp;gf+=s.gf;gc+=s.gc;});
  return{pj,pg,pe,pp,gf,gc,dg:gf-gc,pts:pg*3+pe};
}
function getPeriodos(cat){
  if(cat==='RESERVA'){
    // Dynamically find last N played matches
    const played = [];
    for(let f=1; f<=18; f++){ if(results['RESERVA']?.[f]) played.push(f); }
    const periods = [{label:'TOTAL', from:1, to:18}];
    if(played.length > 0){
      const last3 = played.slice(-3);
      periods.push({
        label: `ÚLT. ${last3.length}`,
        from: last3[0], to: last3[last3.length-1],
        exactFechas: last3   // used by calcStats if needed
      });
      if(played.length > 3){
        const prev3 = played.slice(-6, -3);
        if(prev3.length) periods.push({
          label: `ANT. ${prev3.length}`,
          from: prev3[0], to: prev3[prev3.length-1],
          exactFechas: prev3
        });
      }
    }
    return periods;
  }
  const p=[{label:'TOTAL',from:1,to:35}];
  for(let s=1;s<=35;s+=5)p.push({label:`F${s}–F${Math.min(s+4,35)}`,from:s,to:Math.min(s+4,35)});
  return p;
}
function getBlocks(cat){
  if(cat==='RESERVA'){
    // Each individual played match = its own bar in the chart
    const played = [];
    for(let f=1; f<=18; f++){ if(results['RESERVA']?.[f]) played.push(f); }
    if(!played.length) return [{label:'F1–F18', from:1, to:18}];
    return played.map(f=>({label:`F${f}`, from:f, to:f}));
  }
  const b=[];
  for(let s=1;s<=35;s+=5)b.push({label:`F${s}–F${Math.min(s+4,35)}`,from:s,to:Math.min(s+4,35)});
  return b;
}

function initFirebase(){
  return new Promise((resolve,reject)=>{
    if(typeof firebase==='undefined'){reject('no sdk');return;}
    try{
      if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
      db=firebase.database();
      fbReady=true;
      firebase.auth().onAuthStateChanged(user=>{
        if(user){
          // Remove login wall if still present (returning user with active session)
          const wall = document.getElementById('login-wall');
          if(wall){ wall.style.transition='opacity .3s'; wall.style.opacity='0'; setTimeout(()=>wall.remove(),300); }
          // Real-time role listener
          db.ref('users/'+user.uid+'/role').on('value', snap=>{
            currentRole = snap.val() || 'viewer';
            isAdmin     = currentRole==='admin';
            canEdit     = ['admin','videoanalista','videoanalista_reserva'].includes(currentRole);
            catRole     = currentRole; // store for cat filtering
            applyViewMode();
            updateAuthUI();
            // Re-render active module with correct permissions
            refreshActiveModule();
          });
          // Real-time data sync — listen for remote changes
          db.ref('stats').on('value', snap=>{
            const p=snap.val();
            if(!p) return;
            CATEGORIES.forEach(cat=>{
              const fl=cat==='RESERVA'?RIVALS_RESERVA:RIVALS;
              if(p.results?.[cat]) fl.forEach(r=>{ if(p.results[cat][r.f]) results[cat][r.f]=p.results[cat][r.f]; });
              if(p.links?.[cat])   fl.forEach(r=>{ if(p.links[cat][r.f]) links[cat][r.f]=p.links[cat][r.f]; });
              if(p.goleadores?.[cat]) goleadores[cat]=p.goleadores[cat];
              if(p.matchData?.[cat]) Object.assign(matchData[cat], p.matchData[cat]);
              if(p.gymData?.[cat])   gymData[cat] = p.gymData[cat];
            });
            refreshActiveModule();
            setTimeout(refreshAlerts, 200);
          });
          db.ref('plantel').on('value', snap=>{ loadPlayers(snap.val()); refreshPlantelIfActive(); });
          db.ref('rendimiento').on('value', snap=>{ loadRendimiento(snap.val()); refreshRendimientoIfActive(); setTimeout(refreshAlerts,100); });
        } else {
          isAdmin=false; canEdit=false; currentRole='viewer'; catRole='viewer';
          applyViewMode(); updateAuthUI();
        }
      });
      resolve();
    }catch(e){reject(e);}
  });
}

function applyViewMode(){
  document.querySelectorAll('.score-input,.link-input,.gol-input,.gol-fecha-input').forEach(el=>{
    el.disabled=!canEdit;
    el.style.opacity=canEdit?'1':'0.6';
  });
  document.querySelectorAll('.btn-add-gol,.btn-del-gol').forEach(el=>{
    el.style.display=canEdit?'':'none';
  });
  const resetBtn=document.getElementById('btn-reset');
  if(resetBtn) resetBtn.style.display=isAdmin?'':'none';

  // Filter category tabs for category-specific roles
  // e.g. role 'cat_4TA' only sees 4TA
  if(currentRole && currentRole.startsWith('cat_')){
    const allowedCat = currentRole.replace('cat_','').toUpperCase();
    document.querySelectorAll('.cat-tab[data-cat]').forEach(t=>{
      // cat_ roles: hide GENERAL and all other categories
      if(t.dataset.cat === 'GENERAL' || t.dataset.cat !== allowedCat){
        t.style.display='none';
      }
    });
    // Auto-select their category
    document.querySelectorAll('.cat-tab[data-cat="'+allowedCat+'"]').forEach(t=>{
      t.click();
    });
  }
}

function updateAuthUI(){
  const loginBtn  =document.getElementById('btn-login');
  const logoutBtn =document.getElementById('btn-logout');
  const badge     =document.getElementById('admin-badge');
  const roleTagEl =document.getElementById('role-tag-txt');
  if(canEdit||isAdmin){
    if(loginBtn)  loginBtn.style.display='none';
    if(logoutBtn) logoutBtn.style.display='flex';
    if(badge)     badge.style.display='flex';
    const roleLabels={'admin':'ADMIN','videoanalista':'VIDEOANALISTA',
      'videoanalista_reserva':'VIDEO RESERVA',
      'director':'DIR. DEPORTIVO','coordinador':'COORDINADOR',
      'reserva_viewer':'RESERVA (VISTA)','cat_RESERVA':'RESERVA'};
    if(roleTagEl) roleTagEl.textContent=roleLabels[currentRole]||currentRole.toUpperCase();
  } else {
    if(loginBtn)  loginBtn.style.display='flex';
    if(logoutBtn) logoutBtn.style.display='none';
    if(badge)     badge.style.display='none';
  }
}

// ── Save ─────────────────────────────────────────────────────
function saveData(){
  if(!fbReady||!db||!canEdit) return;
  clearTimeout(saveTimeout);
  saveTimeout=setTimeout(()=>{
    const payload={results:{},links:{},goleadores:{},rivalData:rivalData,matchData:matchData,gymData:gymData};
    CATEGORIES.forEach(cat=>{
      payload.results[cat]={};
      payload.links[cat]={};
      payload.goleadores[cat]=goleadores[cat]||[];
      const fl=cat==='RESERVA'?RIVALS_RESERVA:RIVALS;
      fl.forEach(r=>{
        payload.results[cat][r.f]=results[cat][r.f]||null;
        payload.links[cat][r.f]=links[cat][r.f]||{};
      });
    });
    db.ref('stats').set(payload)
      .then(()=>showToast('☁ GUARDADO'))
      .catch(e=>console.warn('save error:',e));
  },800);
}

// ── Load ALL data (stats + plantel + rendimiento) in one go ──
function loadData(){
  return new Promise(resolve=>{
    if(!fbReady||!db){resolve();return;}
    showLoading(true);
    Promise.all([
      db.ref('stats').once('value'),
      db.ref('plantel').once('value'),
      db.ref('rendimiento').once('value'),
      db.ref('gps').once('value')
    ]).then(([statsSnap, plantelSnap, rendSnap, gpsSnap])=>{
      // Load plantel
      if(plantelSnap.val()) loadPlayers(plantelSnap.val());
      // Load rendimiento
      if(rendSnap.val()) loadRendimiento(rendSnap.val());
      // Load GPS sessions
      if(gpsSnap.val()&&gpsSnap.val().sessions) gpsSessions = gpsSnap.val().sessions;
      // Continue with stats (reuse snap variable)
      const snap = statsSnap;
      return snap;
    }).then(snap=>{
      const p=snap.val();
      if(p){
        CATEGORIES.forEach(cat=>{
          const fl=cat==='RESERVA'?RIVALS_RESERVA:RIVALS;
          if(p.results?.[cat]) fl.forEach(r=>{ if(p.results[cat][r.f]) results[cat][r.f]=p.results[cat][r.f]; });
          if(p.links?.[cat])   fl.forEach(r=>{ if(p.links[cat][r.f]) links[cat][r.f]=p.links[cat][r.f]; });
          if(p.goleadores?.[cat]) goleadores[cat]=p.goleadores[cat];
          // Load matchData (lineup + cambios)
          if(p.matchData?.[cat]) Object.assign(matchData[cat], p.matchData[cat]);
          if(p.gymData?.[cat])   gymData[cat] = p.gymData[cat];
          // Load RESERVA fixture
          if(cat==='RESERVA'&&p.rivalData?.['RESERVA']){
            Object.assign(rivalData['RESERVA'], p.rivalData['RESERVA']);
          }
        });
      }
      showLoading(false); resolve();
    }).catch(e=>{console.warn('load error:',e);showLoading(false);resolve();});
  });
}

  el.textContent=msg; el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(()=>{el.style.opacity='0';},2000);
}
function showLoading(on){
  let el=document.getElementById('loading-overlay');
  if(on&&!el){

function renderStatsCat(cat){
  const content=document.getElementById('stats-content');

  else renderStatsSingle(cat, content);
}

function renderStatsGeneral(content){
  const blocks=getBlocks('4TA'), periods=getPeriodos('4TA');
  const ptHTML=periods.map((p,i)=>`<div class="ptab${i===0?' active':''}" data-gpidx="${i}">${p.label}</div>`).join('');

  // Summary table rows
  let trows=CATEGORIES.map(cat=>{
    const maxD=cat==='RESERVA'?18:35;
    const s=calcStats(cat,1,maxD);
    const dgC=s.dg>0?'var(--win)':s.dg<0?'var(--loss)':'var(--muted)';
    const pct=s.pj>0?Math.round(s.pts/(s.pj*3)*100):0;
    return `<tr>
      <td class="cat-cell"><span class="dot" style="background:${CAT_COLORS[cat]}"></span>${cat}</td>
      <td style="color:var(--gold2);font-weight:700">${s.pts}</td><td>${s.pj}</td>
      <td style="color:var(--win)">${s.pg}</td><td style="color:var(--draw)">${s.pe}</td>
      <td style="color:var(--loss)">${s.pp}</td><td style="color:#60a5fa">${s.gf}</td>
      <td style="color:#f87171">${s.gc}</td>
      <td style="color:${dgC};font-weight:700">${s.dg>0?'+':''}${s.dg}</td>
      <td style="color:var(--muted)">${pct}%</td></tr>`;
  }).join('');
  const tot=calcStatsAll(1,35);
  const tDgC=tot.dg>0?'var(--win)':tot.dg<0?'var(--loss)':'var(--muted)';
  const tPct=tot.pj>0?Math.round(tot.pts/(tot.pj*3)*100):0;
  trows+=`<tr style="background:rgba(192,21,42,0.1);font-weight:700;">
    <td class="cat-cell" style="color:var(--gold2)">TOTAL</td>
    <td style="color:var(--gold2)">${tot.pts}</td><td>${tot.pj}</td>
    <td style="color:var(--win)">${tot.pg}</td><td style="color:var(--draw)">${tot.pe}</td>
    <td style="color:var(--loss)">${tot.pp}</td><td style="color:#60a5fa">${tot.gf}</td>
    <td style="color:#f87171">${tot.gc}</td>
    <td style="color:${tDgC}">${tot.dg>0?'+':''}${tot.dg}</td>
    <td style="color:var(--muted)">${tPct}%</td></tr>`;

  content.innerHTML=`
    <div class="st"><div class="stbar"></div>RESUMEN GENERAL</div>
    <div class="periodo-tabs" id="gen-ptabs">${ptHTML}</div>
    <div id="gen-stats-area"></div>

    <div class="gen-table-wrap"><table class="gen-table">
      <thead><tr>
        <th>CAT</th><th>PTS</th><th>PJ</th><th>PG</th><th>PE</th>
        <th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>%</th>
      </tr></thead><tbody>${trows}</tbody></table></div>

    <div class="st"><div class="stbar"></div>PUNTOS POR BLOQUE — TODAS LAS CATEGORÍAS</div>
    <div class="chart-card" style="margin-bottom:20px">
      <h3>COMPARATIVA DE PUNTOS</h3>
      <canvas id="cgen-pts" height="200"></canvas>
    </div>
    <div class="charts-row">
      <div class="chart-card"><h3>GOLES A FAVOR</h3><canvas id="cgen-gf" height="180"></canvas></div>
      <div class="chart-card"><h3>GOLES EN CONTRA</h3><canvas id="cgen-gc" height="180"></canvas></div>
    </div>

    <div class="st"><div class="stbar"></div>TORTAS POR CATEGORÍA (TEMPORADA)</div>
    <div class="pies-grid" id="gen-pies-cat"></div>

    <div class="st"><div class="stbar"></div>TORTAS GENERALES POR BLOQUE</div>
    <div class="pies-grid" id="gen-pies-blk"></div>

    <div class="st"><div class="stbar"></div>🏆 TOP GOLEADORES — TODAS LAS CATEGORÍAS</div>
    <div id="gen-top-goleadores"></div>
  `;

  // Period filter
  document.getElementById('gen-ptabs').addEventListener('click',e=>{
    if(!e.target.classList.contains('ptab'))return;
    document.getElementById('gen-ptabs').querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));

    const idx=parseInt(e.target.dataset.gpidx);
    const p=getPeriodos('4TA')[idx];
    document.getElementById('gen-stats-area').innerHTML=statsHTML(calcStatsAll(p.from,p.to));
  });
  document.getElementById('gen-stats-area').innerHTML=statsHTML(calcStatsAll(1,35));

  // Charts
  const def=chartDef(), blocks2=getBlocks('4TA'), labels=blocks2.map(b=>b.label);
  const mkDs=(cat,field)=>({label:cat,data:blocks2.map(b=>calcStats(cat,b.from,b.to)[field]),
    backgroundColor:CAT_COLORS[cat]+'bb',borderColor:CAT_COLORS[cat],borderWidth:1,borderRadius:4,borderSkipped:false});
  const defLeg={...def,plugins:{...def.plugins,legend:{labels:{color:'#5a7099',font:{family:'Barlow Condensed'}}}}};

  killChart('cgen-pts');
  new Chart(document.getElementById('cgen-pts').getContext('2d'),{type:'bar',
    data:{labels,datasets:CATEGORIES.map(c=>mkDs(c,'pts'))},options:defLeg});
  killChart('cgen-gf');
  new Chart(document.getElementById('cgen-gf').getContext('2d'),{type:'bar',
    data:{labels,datasets:CATEGORIES.map(c=>mkDs(c,'gf'))},options:defLeg});
  killChart('cgen-gc');
  new Chart(document.getElementById('cgen-gc').getContext('2d'),{type:'bar',

    gpCat.insertAdjacentHTML('beforeend',pieMini(id,s,`<span class="dot" style="background:${CAT_COLORS[cat]}"></span>${cat}`));

    gpBlk.insertAdjacentHTML('beforeend',pieMini(id,s,b.label+' — TODAS'));
    setTimeout(()=>drawPie(id,s),0);
  });

  // Top 3 goleadores all categories
  const topWrap = document.getElementById('gen-top-goleadores');
  if(topWrap) renderTopGoleadores(topWrap);
}

function renderTopGoleadores(wrap){
  // Flatten all goleadores across all categories
  const all = {};
  CATEGORIES.forEach(cat=>{
    (goleadores[cat]||[]).forEach(g=>{
      const key = g.name.trim().toLowerCase();
      if(!all[key]) all[key] = {name:g.name, goals:0, cats:{}};
      all[key].goals += g.goals;
      all[key].cats[cat] = (all[key].cats[cat]||0) + g.goals;
    });
  });
  const sorted = Object.values(all).sort((a,b)=>b.goals-a.goals).slice(0,3);

  if(sorted.length===0){
    wrap.innerHTML='<div style="text-align:center;padding:24px;color:var(--muted);font-family:Barlow Condensed,sans-serif;letter-spacing:1px;font-size:13px">Sin goleadores registrados aún</div>';
    return;
  }

  const medals=['🥇','🥈','🥉'];
  const colors=['var(--gold2)','#94a3b8','#b45309'];
  wrap.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:28px">
    ${sorted.map((g,i)=>{
      const catTags=Object.entries(g.cats).map(([cat,n])=>
        `<span style="background:${CAT_COLORS[cat]}22;color:${CAT_COLORS[cat]};border:1px solid ${CAT_COLORS[cat]}44;
        border-radius:4px;padding:1px 7px;font-size:10px;font-family:Barlow Condensed,sans-serif;font-weight:700">${cat} ${n>1?'('+n+')':''}</span>`
      ).join(' ');
      return `<div style="background:linear-gradient(135deg,var(--surface2),var(--surface));
        border:1px solid var(--border);border-top:3px solid ${colors[i]};
        border-radius:12px;padding:18px;text-align:center;">
        <div style="font-size:32px;margin-bottom:6px">${medals[i]}</div>
        <div style="font-family:Bebas Neue,sans-serif;font-size:22px;color:${colors[i]};letter-spacing:1px;line-height:1">${esc(g.name)}</div>
        <div style="font-family:Bebas Neue,sans-serif;font-size:48px;color:var(--gold2);line-height:1;margin:8px 0">${g.goals}</div>
        <div style="font-size:10px;color:var(--muted);letter-spacing:1px;font-family:Barlow Condensed,sans-serif;margin-bottom:10px">GOLES</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center">${catTags}</div>
      </div>`;
    }).join('')}
  </div>`;
}

// ── SINGLE CATEGORY VIEW ──────────────────────────────────────
function renderStatsSingle(cat, content){
  const isLink=LINK_CATS.includes(cat);
  const isReserva = cat === 'RESERVA';
  const periods=getPeriodos(cat);
  const fixtureList = isReserva ? RIVALS_RESERVA : RIVALS;
  const maxDate = isReserva ? 18 : 35;
  const ptHTML=periods.map((p,i)=>`<div class="ptab${i===0?' active':''}" data-cpidx="${i}" data-cat="${cat}">${p.label}</div>`).join('');

  // Table rows
  let rows='';
  fixtureList.forEach(r=>{
    // No block dividers for RESERVA (18 matches, no need to split)
    if(!isReserva && (r.f-1)%5===0 && r.f>1){
      const span=6+(isLink?LINK_TYPES.length:0)+1;
      rows+=`<tr class="divider-row"><td colspan="${span}">── BLOQUE F${r.f}–F${Math.min(r.f+4,35)}</td></tr>`;
    }
    const stored=results[cat][r.f];
    const gf=stored?stored[0]:'', gc=stored?stored[1]:'';
    const res=stored?getResult(stored[0],stored[1]):null;
    const rb=res?`<span class="result-badge result-${res}">${res}</span>`:'—';
    const pts=res==='W'?3:res==='D'?1:res==='L'?0:'—';
    const ptC=res==='W'?'var(--win)':res==='D'?'var(--draw)':res==='L'?'var(--loss)':'var(--muted)';

    // RESERVA: use editable rivalData, other cats use fixed RIVALS
    const rName = isReserva ? (rivalData['RESERVA'][r.f]?.rival || '') : r.r;
    const rCond = isReserva ? (rivalData['RESERVA'][r.f]?.cond  || 'L') : r.c;

    // Rival + cond cells
    const rivalCell = isReserva && canEdit
      ? `<td><input class="rival-edit-input" type="text" value="${esc(rName)}"
            data-fecha="${r.f}" data-field="rival"
            placeholder="Rival…"

      </div></td>

      </thead>
      <tbody id="tbody-${cat}">${rows}</tbody>

      <div class="chart-card"><h3>RESULTADOS TOTALES</h3><canvas id="cpie-${cat}" height="200"></canvas></div>
    </div>

    <div class="pies-grid" id="piesgrid-${cat}"></div>

    <div class="st"><div class="stbar"></div>GOLEADORES · <span style="color:${CAT_COLORS[cat]}">${cat}</span></div>
    <div id="goleadores-${cat}"></div>
  `;

  // Events
  attachTableEvents(cat);
  // Period filter
  document.getElementById(`ptabs-${cat}`).addEventListener('click',e=>{
    if(!e.target.classList.contains('ptab'))return;
    document.getElementById(`ptabs-${cat}`).querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
    e.target.classList.add('active');
    const idx=parseInt(e.target.dataset.cpidx);
    const p=getPeriodos(cat)[idx];
    document.getElementById(`stats-area-${cat}`).innerHTML=statsHTML(calcStats(cat,p.from,p.to));
  });
  const totMax = cat==='RESERVA' ? 18 : 35;
  document.getElementById(`stats-area-${cat}`).innerHTML=statsHTML(calcStats(cat,1,totMax));
  renderCatCharts(cat);
  renderGoleadores(cat);
}
