function renderStatsSingle(cat, content){
  const isReserva = cat === 'RESERVA';
  // dataCat: clave real de storage. Para RESERVA depende del semestre elegido.
  const dataCat = isReserva ? (reservaSemestre===2 ? 'RESERVA_S2' : 'RESERVA') : cat;
  // Los links de video (Partido/Resumen/Análisis/Próximo Rival) se mudaron
  // a la pestaña VIDEOANÁLISIS -- acá en ESTADÍSTICAS solo queda Citaciones
  // (a pedido: "tiene que vivir en los dos lugares"). RESERVA nunca tuvo
  // citaciones, así que para RESERVA esta columna directamente no existe.
  const resultadosLinks = (!isReserva && CATEGORIES.includes(cat)) ? LINK_TYPES.filter(lt=>lt.key==='cit') : [];
  const isLink = resultadosLinks.length > 0;
  const showEquipo = false;   // botón/panel de equipo retirado de todas las categorías
  const fixtureList = isReserva ? (reservaSemestre===2 ? RIVALS_RESERVA_S2 : RIVALS_RESERVA) : RIVALS;

  // Selector de semestre (solo RESERVA)
  const semestreSelector = isReserva ? `
    <div class="semestre-tabs" style="display:flex;gap:8px;margin:10px 0 4px;">
      <button type="button" class="sem-tab${reservaSemestre===1?' active':''}" data-sem="1"
        style="flex:1;padding:9px 10px;border-radius:8px;border:1px solid ${reservaSemestre===1?'var(--gold)':'var(--border2)'};
        background:${reservaSemestre===1?'linear-gradient(135deg,#3a2a08,#1a1206)':'rgba(5,8,15,0.5)'};
        color:${reservaSemestre===1?'var(--gold)':'var(--muted)'};font-family:Barlow Condensed,sans-serif;
        font-weight:700;letter-spacing:1px;font-size:13px;cursor:pointer;">1er SEMESTRE</button>
      <button type="button" class="sem-tab${reservaSemestre===2?' active':''}" data-sem="2"
        style="flex:1;padding:9px 10px;border-radius:8px;border:1px solid ${reservaSemestre===2?'var(--gold)':'var(--border2)'};
        background:${reservaSemestre===2?'linear-gradient(135deg,#3a2a08,#1a1206)':'rgba(5,8,15,0.5)'};
        color:${reservaSemestre===2?'var(--gold)':'var(--muted)'};font-family:Barlow Condensed,sans-serif;
        font-weight:700;letter-spacing:1px;font-size:13px;cursor:pointer;">2do SEMESTRE</button>
    </div>` : '';

  // Table rows
  // RESERVA: resultado y rival "100% automáticos" desde statfutbol.com.ar
  // (ver scrape_tablas.py, fetch_statfutbol_reserva_fixture) -- a pedido
  // de Javi, 2026-09-02, es la única categoría sin nada de esto hasta
  // ahora. Solo se usa como RESPALDO cuando todavía no hay nada cargado a
  // mano (results[dataCat][r.f] / rivalData[dataCat][r.f].rival vacíos) --
  // nunca pisa un dato ya guardado, para no perder una corrección manual
  // vieja si alguna vez hiciera falta.
  const statfutbolReserva = isReserva ? (TABLA_DATA?.statfutbol_resultados?.[dataCat] || null) : null;
  let rows='';
  fixtureList.forEach(r=>{
    // No block dividers for RESERVA (18 matches, no need to split)
    if(!isReserva && (r.f-1)%bloqueSize===0 && r.f>1){
      const span=3+(isLink?resultadosLinks.length:0)+(showEquipo?1:0);
      rows+=`<tr class="divider-row"><td colspan="${span}">── BLOQUE F${r.f}–F${Math.min(r.f+bloqueSize-1,35)}</td></tr>`;
    }
    const autoRes = statfutbolReserva ? statfutbolReserva[r.f] : null;
    const stored = results[dataCat][r.f] || (autoRes ? [autoRes.gf, autoRes.gc] : null);
    const gf=stored?stored[0]:'', gc=stored?stored[1]:'';
    const res=stored?getResult(stored[0],stored[1]):null;
    const pts=res==='W'?3:res==='D'?1:res==='L'?0:'—';
    const ptC=res==='W'?'var(--win)':res==='D'?'var(--draw)':res==='L'?'var(--loss)':'var(--muted)';

    // RESERVA: use editable rivalData, other cats use fixed RIVALS
    const rName = isReserva ? (rivalData[dataCat][r.f]?.rival || autoRes?.rival || '') : r.r;
    const rCond = isReserva ? (rivalData[dataCat][r.f]?.cond  || 'L') : condicionCat(cat, r.f);

    // Rival + condición van juntos en una sola celda (antes eran dos
    // columnas separadas) — la condición queda como badge chico al lado
    // del nombre en vez de tener su propio ancho de columna.
    const rivalCell = isReserva && canEdit
      ? `<td><div style="display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap">
          <input class="rival-edit-input" type="text" value="${esc(rName)}"
            data-fecha="${r.f}" data-field="rival"
            placeholder="Rival…"
            style="background:rgba(5,8,15,0.6);border:1px solid var(--border2);border-radius:4px;
            color:var(--text);font-size:12px;padding:3px 7px;width:120px;font-family:Barlow Condensed,sans-serif;
            font-weight:600;outline:none;"
            onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='var(--border2)'">
          <select class="cond-edit-select" data-fecha="${r.f}" data-field="cond"
            style="background:rgba(5,8,15,0.7);border:1px solid var(--border2);border-radius:4px;
            color:var(--text);font-size:11px;padding:3px 6px;font-family:Barlow Condensed,sans-serif;
            font-weight:700;outline:none;cursor:pointer;">
            <option value="L" ${rCond==='L'?'selected':''}>LOCAL</option>
            <option value="V" ${rCond==='V'?'selected':''}>VISIT.</option>
          </select>
        </div></td>`
      : `<td class="rival-name" style="text-align:center">${esc(rName)||'—'} <span class="cond-badge cond-${rCond}" style="margin-left:4px;font-size:10px">${rCond==='L'?'LOCAL':'VISIT.'}</span></td>`;

    const hasTeamData = !!(matchData[dataCat][r.f]?.titulares?.length);
    // Citaciones: no hay campo para pegar link a mano — el ícono abre la
    // ficha ya procesada (extraída del PDF real) si existe, o queda vacío
    // si esa fecha todavía no se cargó. Vive acá Y en VIDEOANÁLISIS (a
    // pedido, mismo botón/comportamiento en los dos lugares).
    const linkCols = isLink ? `<td class="link-cell" style="text-align:center">
        <button class="link-btn${hasTeamData?'':' empty'}" title="Citaciones"
          ${hasTeamData?`onclick="abrirCitacionView('${dataCat}',${r.f})"`:'disabled'}
          style="background:none;border:none;cursor:${hasTeamData?'pointer':'default'};font-size:15px;padding:2px 6px">📋</button>
      </td>` : '';
    const equipoBtn = showEquipo
      ? `<td><button class="btn-equipo${hasTeamData?' active':''}" data-cat="${dataCat}" data-fecha="${r.f}" title="Ver/editar equipo">👥${hasTeamData?' ✓':''}</button></td>`
      : '';

    const fechaCal = isReserva ? '' : fechaCalCompacta(r.f);
    const letraEs = res==='W'?'G':res==='D'?'E':res==='L'?'P':'';

    rows+=`<tr data-cat="${dataCat}" data-fecha="${r.f}">
      <td class="fecha-num" style="white-space:nowrap">F${r.f}${fechaCal?` - (${fechaCal})`:''}</td>${rivalCell}
      <td><div class="score-cell">
        <input class="score-input" type="number" min="0" max="99" value="${gf}"
          data-cat="${dataCat}" data-fecha="${r.f}" data-side="0" placeholder="—" ${canEdit?'':'disabled'}>
        <span class="score-sep">-</span>
        <input class="score-input" type="number" min="0" max="99" value="${gc}"
          data-cat="${dataCat}" data-fecha="${r.f}" data-side="1" placeholder="—" ${canEdit?'':'disabled'}>
        ${res?`<span class="result-inline" style="margin-left:8px;font-weight:700;color:${ptC}">${letraEs} (${pts})</span>`:''}
      </div></td>
      ${linkCols}${equipoBtn}</tr>${showEquipo?`
    <tr class="match-detail-row" id="mdr-${dataCat}-${r.f}" style="display:none">
      <td colspan="${4+(isLink?resultadosLinks.length:0)}">
        <div class="match-detail-panel" id="mdp-${dataCat}-${r.f}"></div>
      </td>
    </tr>`:''}`;
  });

  // Link headers
  let linkGH='', linkSH='';
  if(isLink){
    linkGH=`<th colspan="${resultadosLinks.length}" style="background:linear-gradient(135deg,#0d1a3a,#08111f);color:var(--blue2);border-top:2px solid var(--blue2);font-size:12px;letter-spacing:2px;">📋</th>`;
    resultadosLinks.forEach(lt=>{ linkSH+=`<th title="${lt.label}">${lt.icon} ${lt.label}</th>`; });
  }

  content.innerHTML = `${buildCatTabsHTML()}<div id="cat-tab-content-${dataCat}"></div>`;
  content.querySelectorAll('.cat-subtab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.dataset.tab===catActiveTab) return;
      catActiveTab = btn.dataset.tab;
      renderStatsSingle(cat, content);
    });
  });
  const tabEl = document.getElementById(`cat-tab-content-${dataCat}`);

  if(catActiveTab==='plantel'){
    renderPlantelTab(cat, tabEl);
    return;
  }
  if(catActiveTab==='rendimiento_gps'){
    renderRendimientoGpsTab(tabEl, cat);
    return;
  }
  if(catActiveTab==='videoanalisis' && !(currentRole && currentRole.startsWith('cat_'))){
    renderVideoanalisisTab(cat, tabEl);
    return;
  }
  // Un DT nunca ve el tab de VIDEOANÁLISIS (se saca de buildCatTabsHTML) --
  // si quedó ese estado guardado de una sesión anterior (u otro rol), cae
  // acá y sigue de largo como si fuera 'resultados'.

  const amarillaAlertCat = CONFIABILIDAD_CATS.includes(cat) ? amarillasEnAlerta(cat) : [];
  const amarillaAlertHTML = amarillaAlertCat.length
    ? `<div style="background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.45);border-radius:8px;
        padding:12px 16px;margin-bottom:12px;font-family:'Barlow Condensed',sans-serif">
        <div style="font-size:11px;letter-spacing:1.5px;color:var(--gold2);font-weight:700;text-transform:uppercase;margin-bottom:4px">
          🟨 JUGADORES CON 4 AMARILLAS
        </div>
        <div style="font-size:11px;font-weight:700;color:var(--text);letter-spacing:0.5px;text-transform:uppercase">
          ${amarillaAlertCat.map(p=>esc(p.nombre)).join(' &nbsp;·&nbsp; ')}
        </div>
      </div>`
    : '';

  // RESERVA: alerta de próximo rival (goleador + riesgo de 5ta amarilla),
  // automática desde statfutbol.com.ar -- mismo dato/criterio que ya existe
  // para 4TA-9NA (ver calcular_alerta_rival_reserva en scrape_tablas.py),
  // acá como un bloque simple en vez de la placa/panel completo de
  // "Análisis de Rival" (eso queda para más adelante si hace falta).
  const reservaAlerta = isReserva ? (TABLA_DATA?.rival_alertas?.[dataCat] || null) : null;
  const reservaAlertaHTML = reservaAlerta ? `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:14px">
      <div style="background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:14px 16px">
        <div style="font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Próximo rival (F${reservaAlerta.fecha})</div>
        <div style="font-size:17px;font-weight:700;color:var(--text)">${esc(reservaAlerta.rival)}</div>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:14px 16px">
        <div style="font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px">⚽ Goleador del rival</div>
        ${reservaAlerta.goleador
          ? `<div style="font-size:15px;font-weight:700;color:var(--text)">${esc(reservaAlerta.goleador.nombre)}</div><div style="font-size:13px;color:var(--muted)">${reservaAlerta.goleador.goles} goles</div>`
          : `<div style="font-size:13px;color:var(--muted)">Sin datos todavía.</div>`}
      </div>
      <div style="background:${reservaAlerta.amarillas_riesgo?.length?'rgba(245,158,11,0.12)':'rgba(34,197,94,0.12)'};border:1px solid ${reservaAlerta.amarillas_riesgo?.length?'rgba(245,158,11,0.45)':'rgba(34,197,94,0.4)'};border-radius:10px;padding:14px 16px">
        <div style="font-size:12px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px">🟨 5ta amarilla</div>
        ${reservaAlerta.amarillas_riesgo?.length
          ? `<div style="font-size:14px;color:var(--draw)">${reservaAlerta.amarillas_riesgo.map(a=>esc(a.nombre)+' ('+a.amarillas+')').join('<br>')}</div>`
          : `<div style="font-size:14px;color:var(--win)">Ningún jugador llegó a la 5ta amarilla en el partido previo.</div>`}
      </div>
    </div>` : '';

  tabEl.innerHTML=`
    ${amarillaAlertHTML}
    ${seccionTitulo('resultados-'+dataCat,
      `RESULTADOS · <span style="color:${CAT_COLORS[cat]}">${cat}</span>${isReserva?` · <span style="color:var(--gold)">${reservaSemestre===2?'2do SEMESTRE':'1er SEMESTRE'}</span>`:''}`)}
    <div id="sec-resultados-${dataCat}"${seccionEstiloInicial('resultados-'+dataCat)}>
      ${semestreSelector}
      ${reservaAlertaHTML}
      <div class="table-wrap"><table>
        <thead>
          <tr class="thead-top">
            <th colspan="3" style="background:linear-gradient(135deg,#0a0f1e,#08111f);color:var(--muted);font-size:10px;letter-spacing:2px;">DATOS DEL PARTIDO</th>
            ${linkGH}
            ${showEquipo?`<th style="background:linear-gradient(135deg,#1a2a10,#0f1a08);color:#86a86a;border-top:2px solid #4a7a3a;font-size:10px;letter-spacing:2px;">👥</th>`:''}
          </tr>
          <tr class="thead-sub"><th>FECHA</th><th>RIVAL</th><th>RESULTADO</th>${linkSH}${showEquipo?`<th title="Equipo / Alineación">EQUIPO</th>`:''}</tr>
        </thead>
        <tbody id="tbody-${dataCat}">${rows}</tbody>
      </table></div>
    </div>

    ${seccionTitulo('rendcat-'+dataCat, 'ESTADÍSTICAS POR BLOQUE', isReserva?'':bloqueSliderHTML('cat'))}
    <div id="sec-rendcat-${dataCat}"${seccionEstiloInicial('rendcat-'+dataCat)}>
      <div id="bloque-cat-${dataCat}"></div>
    </div>

    ${isReserva?'':`${seccionTitulo('sistema-'+dataCat, 'ESTADÍSTICAS POR SISTEMA')}
    <div id="sec-sistema-${dataCat}"${seccionEstiloInicial('sistema-'+dataCat)}>
      <div id="sistema-${dataCat}"></div>
    </div>`}

    ${seccionTitulo('goleadores-'+dataCat, `GOLEADORES · <span style="color:${CAT_COLORS[cat]}">${cat}</span>`)}
    <div id="sec-goleadores-${dataCat}"${seccionEstiloInicial('goleadores-'+dataCat)}>
      <div id="goleadores-${dataCat}"></div>
    </div>

    ${seccionTitulo('tablalpf-'+cat, `🏆 TABLA DE POSICIONES · LPF${isReserva?'':` · <span style="color:${CAT_COLORS[cat]}">${cat}</span>`}`)}
    <div id="sec-tablalpf-${cat}"${seccionEstiloInicial('tablalpf-'+cat)}>
      <div id="tabla-lpf-${cat}"></div>
    </div>

    ${(currentRole && currentRole.startsWith('cat_') && GENERAL_CATS.includes(cat)) ? `
    ${seccionTitulo('rivalstats-'+dataCat, 'ESTADÍSTICAS PRÓXIMO RIVAL')}
    <div id="sec-rivalstats-${dataCat}"${seccionEstiloInicial('rivalstats-'+dataCat)}>
      <div id="rival-stats-detalle-${dataCat}"></div>
    </div>` : ''}
  `;

  // Semestre switch (solo RESERVA)
  if(isReserva){
    tabEl.querySelectorAll('.sem-tab').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const sem=parseInt(btn.dataset.sem);
        if(sem===reservaSemestre)return;
        reservaSemestre=sem;
        renderStatsSingle(cat, content);
      });
    });
  }

  // Events
  attachTableEvents(dataCat);
  if(!isReserva) wireBloqueSlider('cat', ()=>renderStatsSingle(cat, content));
  document.getElementById(`bloque-cat-${dataCat}`).innerHTML= isReserva
    ? bloqueComparativaHTML((from,to)=>calcStats(dataCat,from,to), dataCat)
    : buildRendimientoGeneralHTML((from,to)=>calcStats(dataCat,from,to), dataCat, [cat]);
  if(!isReserva) document.getElementById(`sistema-${dataCat}`).innerHTML = buildSistemaTacticoHTML(dataCat);
  if(currentRole && currentRole.startsWith('cat_') && GENERAL_CATS.includes(cat)) renderRivalStatsDetalle(dataCat, cat);
  renderGoleadores(dataCat);
  if(isReserva) renderTablaReserva(`tabla-lpf-${cat}`);
  else renderTablaLPF(cat, `tabla-lpf-${cat}`);
}

// VIDEOANÁLISIS: se organiza en dos ramas -- ANÁLISIS PROPIOS (Placas de
// Post Partido/Fase/Cierre + tabla partido a partido con los links de
// video propios y Citaciones) y ANÁLISIS DE RIVAL (Placas de Portada
// Próximo Rival/Estadísticas + accesos directos a Fase/Cierre + posición
// en la tabla, últimos partidos, goleador y riesgo de suspensión del
// próximo rival). Citaciones vive en LOS DOS lugares (acá y en
// ESTADÍSTICAS) a pedido explícito. Fase y Cierre son UN SOLO juego de
// controles (viven en Propios) -- los botones de Rival generan/comparten
// con esos mismos datos en vez de duplicar sliders y estado.
function renderVideoanalisisTab(cat, tabEl){
  const isReserva = cat === 'RESERVA';
  const dataCat = isReserva ? (reservaSemestre===2 ? 'RESERVA_S2' : 'RESERVA') : cat;
  // Portada/Estadísticas de rival: antes limitado a CONFIABILIDAD_CATS
  // (4TA/5TA/6TA) sin necesidad real -- los datos de base (fixture, tabla
  // LPF, rival_alertas de statfutbol) ya se descargan para las 6
  // categorías juveniles por igual. Se extiende a GENERAL_CATS (4TA-9NA,
  // sin RESERVA, que no tiene este fixture) a pedido de Javi, 2026-09-01.
  const conRival = GENERAL_CATS.includes(cat);

  tabEl.innerHTML = `
    ${seccionTitulo('va-propios-'+dataCat, `🟦 ANÁLISIS PROPIOS · <span style="color:${CAT_COLORS[cat]}">${cat}</span>`)}
    <div id="sec-va-propios-${dataCat}"${seccionEstiloInicial('va-propios-'+dataCat)}>

      ${seccionTitulo('va-prop-placas-'+dataCat, '🎬 PLACAS')}
      <div id="sec-va-prop-placas-${dataCat}"${seccionEstiloInicial('va-prop-placas-'+dataCat)}>
        ${conRival ? `<div id="placa-post-block-${cat}" style="margin-bottom:18px"></div>` : ''}
        <div style="margin-bottom:18px">${placaRotuloHTML('🖼️ FASE')}${placaFaseControlesHTML(cat)}</div>
        <div>${placaRotuloHTML('🖼️ CIERRE')}${placaCierreControlesHTML(cat)}</div>
      </div>

      ${seccionTitulo('va-prop-stats-'+dataCat, '🎥 VIDEOS PROPIOS')}
      <div id="sec-va-prop-stats-${dataCat}"${seccionEstiloInicial('va-prop-stats-'+dataCat)}>
        ${videoLinksTablaPropiosHTML(cat, dataCat)}
      </div>
    </div>

    ${seccionTitulo('va-rival-'+dataCat, `🟥 ANÁLISIS DE RIVAL · <span style="color:${CAT_COLORS[cat]}">${cat}</span>`)}
    <div id="sec-va-rival-${dataCat}"${seccionEstiloInicial('va-rival-'+dataCat)}>

      ${seccionTitulo('va-riv-placas-'+dataCat, '🎬 PLACAS')}
      <div id="sec-va-riv-placas-${dataCat}"${seccionEstiloInicial('va-riv-placas-'+dataCat)}>
        ${conRival ? `<div id="placa-portada-info-${cat}" style="margin-bottom:18px"></div>` : ''}
        ${conRival ? `<div id="placa-stats-block-${cat}" style="margin-bottom:18px"></div>` : ''}
        <div style="margin-bottom:18px">${placaRotuloHTML('🖼️ FASE')}${placaFaseControlesHTML(cat, '-riv')}</div>
        <div>${placaRotuloHTML('🖼️ CIERRE')}${placaCierreControlesHTML(cat, '-riv')}</div>
      </div>

      ${seccionTitulo('va-riv-videos-'+dataCat, '🎥 VIDEOS DE RIVAL')}
      <div id="sec-va-riv-videos-${dataCat}"${seccionEstiloInicial('va-riv-videos-'+dataCat)}>
        ${videoLinksTablaRivalHTML(cat, dataCat)}
      </div>

      ${seccionTitulo('va-riv-stats-'+dataCat, '📊 ESTADÍSTICAS DE RIVAL')}
      <div id="sec-va-riv-stats-${dataCat}"${seccionEstiloInicial('va-riv-stats-'+dataCat)}>
        <div id="rival-stats-detalle-${dataCat}"></div>
      </div>
    </div>
  `;

  attachTableEvents(dataCat); // mismo listener que ESTADÍSTICAS: .link-input/.score-input ya saben guardar
  attachTableEvents(dataCat, `tbody-riv-${dataCat}`); // tabla de VIDEOS DE RIVAL, id propio
  if(conRival){
    renderPlacaPostPartidoBlock(cat);
    renderPlacaProximoRivalBlock(cat);
    renderPlacaStatsControlesBlock(cat);
    renderRivalStatsDetalle(dataCat, cat);
  } else {
    const el = document.getElementById(`rival-stats-detalle-${dataCat}`);
    if(el) el.innerHTML = `<div style="text-align:center;padding:16px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:13px">No disponible para esta categoría todavía.</div>`;
  }
  actualizarPlacaFasePreview(cat);
  actualizarPlacaCierrePreview(cat);
  actualizarPlacaFasePreview(cat, '-riv');
  actualizarPlacaCierrePreview(cat, '-riv');
}

// Tabla partido a partido de "Estadísticas propias": Partido/Resumen/
// Análisis Propio (video embebido) + Citaciones (misma ficha que ya existe
// en ESTADÍSTICAS). "Próximo Rival" NO va acá -- es de Rival.
function videoLinksTablaPropiosHTML(cat, dataCat){
  const isReserva = cat === 'RESERVA';
  const videoLinks = isReserva ? LINK_TYPES.filter(lt=>lt.key==='par') : LINK_TYPES.filter(lt=>lt.key!=='prx');
  const fixtureList = isReserva ? (reservaSemestre===2 ? RIVALS_RESERVA_S2 : RIVALS_RESERVA) : RIVALS;
  const headHTML = videoLinks.map(lt=>`<th title="${lt.label}">${lt.icon} ${lt.label}</th>`).join('');

  let rows = '';
  fixtureList.forEach(r=>{
    if(!isReserva && (r.f-1)%bloqueSize===0 && r.f>1){
      rows += `<tr class="divider-row"><td colspan="${2+videoLinks.length}">── BLOQUE F${r.f}–F${Math.min(r.f+bloqueSize-1,35)}</td></tr>`;
    }
    const rName = isReserva ? (rivalData[dataCat][r.f]?.rival || '') : r.r;
    const hasTeamData = !!(matchData[dataCat][r.f]?.titulares?.length);
    const fechaCal = isReserva ? '' : fechaCalCompacta(r.f);

    const cols = videoLinks.map(lt=>{
      if(lt.key==='cit'){
        return `<td class="link-cell" style="text-align:center">
          <button class="link-btn${hasTeamData?'':' empty'}" title="Citaciones"
            ${hasTeamData?`onclick="abrirCitacionView('${dataCat}',${r.f})"`:'disabled'}
            style="background:none;border:none;cursor:${hasTeamData?'pointer':'default'};font-size:15px;padding:2px 6px">📋</button>
        </td>`;
      }
      const val = links[dataCat][r.f][lt.key] || '';
      const has = val.trim() !== '';
      const titulo = `F${r.f} · ${lt.label}${rName?' · vs '+rName:''}`.replace(/'/g,"\\'");
      return `<td class="link-cell"><div class="link-wrap">
        ${canEdit?`<input class="link-input" type="url" value="${esc(val)}" placeholder="${lt.label}…"
          data-cat="${dataCat}" data-fecha="${r.f}" data-lkey="${lt.key}" title="${lt.label}">`:''}
        <button class="link-btn${has?'':' empty'}" title="${lt.label}"
          onclick="abrirVideoEmbebido(this.previousElementSibling&&this.previousElementSibling.classList.contains('link-input')?this.previousElementSibling.value:'${esc(val).replace(/'/g,"\\'")}','${titulo}')"
          ${has||canEdit?'':'disabled'}
          style="background:none;border:none;cursor:${has||canEdit?'pointer':'default'};font-size:15px;padding:2px 6px">${lt.icon}</button>
      </div></td>`;
    }).join('');

    rows += `<tr data-cat="${dataCat}" data-fecha="${r.f}">
      <td class="fecha-num" style="white-space:nowrap">F${r.f}${fechaCal?` - (${fechaCal})`:''}</td>
      <td class="rival-name" style="text-align:center">${esc(rName)||'—'}</td>
      ${cols}
    </tr>`;
  });

  return `<div class="table-wrap"><table>
      <thead><tr class="thead-sub"><th>FECHA</th><th>RIVAL</th>${headHTML}</tr></thead>
      <tbody id="tbody-${dataCat}">${rows}</tbody>
    </table></div>`;
}

// Tabla de "Análisis de Rival" (link tipo 'prx', "Próximo Rival") -- existía
// el tipo de link en LINK_TYPES pero nunca se armó ninguna tabla para
// cargarlo/verlo (videoLinksTablaPropiosHTML lo excluye a propósito, "es de
// Rival", pero no había ningún otro lugar que lo mostrara) -- reportado por
// Javi, 2026-09-02: "no puedo ver 'análisis de rival'". Mismo patrón que
// videoLinksTablaPropiosHTML, con un solo tipo de link.
function videoLinksTablaRivalHTML(cat, dataCat){
  const isReserva = cat === 'RESERVA';
  const lt = LINK_TYPES.find(x=>x.key==='prx');
  const fixtureList = isReserva ? (reservaSemestre===2 ? RIVALS_RESERVA_S2 : RIVALS_RESERVA) : RIVALS;

  let rows = '';
  fixtureList.forEach(r=>{
    if(!isReserva && (r.f-1)%bloqueSize===0 && r.f>1){
      rows += `<tr class="divider-row"><td colspan="3">── BLOQUE F${r.f}–F${Math.min(r.f+bloqueSize-1,35)}</td></tr>`;
    }
    const rName = isReserva ? (rivalData[dataCat][r.f]?.rival || '') : r.r;
    const fechaCal = isReserva ? '' : fechaCalCompacta(r.f);
    const val = links[dataCat][r.f][lt.key] || '';
    const has = val.trim() !== '';
    const titulo = `F${r.f} · ${lt.label}${rName?' · vs '+rName:''}`.replace(/'/g,"\\'");

    rows += `<tr data-cat="${dataCat}" data-fecha="${r.f}">
      <td class="fecha-num" style="white-space:nowrap">F${r.f}${fechaCal?` - (${fechaCal})`:''}</td>

// Extrae el ID de video de un link de YouTube en cualquiera de sus formas
// (youtu.be/ID, youtube.com/watch?v=ID, /embed/ID, /shorts/ID). null si no
// matchea nada -- ahí se abre en pestaña nueva en vez de embeber.
function extraerYoutubeId(url){
  const m = String(url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  return m ? m[1] : null;
}

function abrirVideoEmbebido(url, titulo){
  url = (url||'').trim();
  if(!url) return;
  const id = extraerYoutubeId(url);
  if(!id){ window.open(url, '_blank', 'noopener'); return; }
  let m = document.getElementById('video-embed-modal');
  if(m) m.remove();
  m = document.createElement('div');
  m.id = 'video-embed-modal'; m.className = 'modal-bg';
  m.addEventListener('click', e=>{ if(e.target===m) m.remove(); });
  m.innerHTML = `<div class="modal-box" style="width:min(1200px,92vw);text-align:left;padding:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px">
      <p style="margin:0;color:var(--gold2);font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px">${esc(titulo||'')}</p>
      <button class="m-cancel" onclick="document.getElementById('video-embed-modal').remove()">✕</button>
    </div>
    <div style="position:relative;padding-top:56.25%;background:#000;border-radius:8px;overflow:hidden">
      <iframe src="https://www.youtube.com/embed/${id}" style="position:absolute;inset:0;width:100%;height:100%;border:0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>`;
  document.body.appendChild(m);
}

// ============================================================
//  RENDIMIENTO — cruce de datos GPS desde "BL GPS Performance"
//  (traídos server-side, ver fetch_bl_players en scrape_tablas.py — nunca
//  se loguea nada desde el navegador). No está separado por categoría de
//  Tigre (Brian no lo carga así), por eso esta pestaña muestra siempre
//  todos los jugadores que haya en su base.
// ============================================================

// Índice de métricas tal cual las guarda BL en metrics[0..16] (orden fijo,
// confirmado leyendo su código fuente — arrays MCH/JUG_MCH).
const BL_METRICAS = [
  {i:0,  label:'Dist. Total',  unit:'m'},
  {i:1,  label:'Mts/min',      unit:'m/min'},
  {i:2,  label:'18-21 km/h',   unit:'m'},
  {i:3,  label:'HSR 21-25',    unit:'m'},
  {i:4,  label:'+25 km/h',     unit:'m'},
  {i:5,  label:'Sprints',      unit:'#'},
  {i:6,  label:'Top Speed',    unit:'km/h'},
  {i:7,  label:'Acel +3',      unit:'#'},
  {i:8,  label:'Desac +3',     unit:'#'},
  {i:9,  label:'Acel2/3',      unit:'#'},
  {i:10, label:'Rhie (no disp. por API)', unit:'#'},
  {i:11, label:'Acel Max',     unit:'m/s²'},
  {i:12, label:'Desac Max',    unit:'m/s²'},
  {i:13, label:'Acc/min',      unit:'#'},
  {i:14, label:'HSR/min',      unit:'m/min'},
  {i:15, label:'+25/min',      unit:'m/min'},
  {i:16, label:'Player Load',  unit:'#'},
];

// BL guarda la fecha como texto libre ("F13", "FECHA 13", etc.) — nos
// quedamos con el número para poder cruzarla contra los datos de Tigre.
function blFechaNum(str){
  const m = String(str||'').match(/\d+/);
  return m ? parseInt(m[0],10) : null;
}

// Config de "RENDIMIENTO GPS" (orden/ocultar/renombrar métricas) --
// compartida como el resto de `stats`, editable solo por canEdit. `order` es
// un array con los índices de BL_METRICAS en el orden elegido, `hidden` los
// índices ocultos, `labels` los renombres -- clave 'm'+i (nunca un número
// pelado: Firebase confunde un objeto con claves 0,1,2... con un array).
let gpsMetricCfg = {order:null, hidden:[], labels:{}};
// Corrección manual de posición por jugador de Catapult, por categoría:
// gpsPosOverride[cat][nombreCatapult] = 'texto libre'. Pisa a futdetail (que
// a su vez pisa al "Position" de Catapult, ver catapultPlayersDeCategoria) --
// para cuando futdetail tampoco tiene la posición correcta o no lo tiene
// cargado (Javi, 2026-09-03: "opcion de poder cambiar cada una de las
// posiciones"). Se guarda en Firebase junto al resto de `stats`.
let gpsPosOverride = {};
function gpsMetricLabel(i){
  const custom = gpsMetricCfg.labels && gpsMetricCfg.labels['m'+i];
  return custom || BL_METRICAS[i].label;
}
// Metrica individual (para dropdowns/lookups por índice) con su label ya
// resuelto -- nunca se oculta acá, solo se usa para mostrar UNA ya elegida.
function gpsMetricByIdx(i){
  return {...BL_METRICAS[i], label: gpsMetricLabel(i)};
}
// Lista efectiva para chips/dropdowns: orden elegido, ocultas afuera, label
// renombrado -- las 4 vistas de "lista de métricas" (comparar/ranking, por
// fecha, perfil) la usan; "Informe de partido" usa métricas fijas a
// propósito y no se toca con esta config.
function gpsVisibleMetrics(){
  const orden = (gpsMetricCfg.order && gpsMetricCfg.order.length) ? gpsMetricCfg.order : BL_METRICAS.map(m=>m.i);
  const ocultas = new Set(gpsMetricCfg.hidden||[]);
  return orden.filter(i=>!ocultas.has(i)).map(i=>gpsMetricByIdx(i));
}

// renderRendimientoTab / blCruceFormHTML / blMode / runBlCruce y el resto de
// la UI de "RENDIMIENTO (BL)" se borraron el 2026-09-03: Catapult directo
// (RENDIMIENTO GPS, más abajo) ganó la comparación y pasa a ser la única
// fuente activa en pantalla. Quedan sin borrar (se siguen usando como
// respaldo en tarjetas/ficha de jugador cuando Catapult todavía no tiene
// datos de alguien): BL_METRICAS, blFechaNum, blPlayers (variable + carga en
// loadTablaData), blTopSpeedInfo y blPlayersDeCategoria (esta última la usa
// también el radar de la ficha completa para la referencia del plantel).
function blPlayersDeCategoria(cat){
  const nombresRoster = new Set((plantelFutdetail[cat]||[]).map(p=>normNombreOrdenIndependiente(p.nombre)));
  const out = {};
  Object.entries(blPlayers).forEach(([nombre,p])=>{
    if(nombresRoster.has(normNombreOrdenIndependiente(nombre))) out[nombre]=p;
  });
  return out;
}

// ============================================================
//  RENDIMIENTO GPS — Catapult OpenField directo (sin pasar por BL)
// ============================================================
// Calco a propósito de todo el bloque de arriba (BL_METRICAS/blCruce...):
// mismo shape de datos (catapultPlayers, ver fetch_catapult_players en
// scrape_tablas.py), mismas 3 vistas (comparar/ranking/perfil). Javi lo
// pidió como módulo aparte, sin compartir código con el de BL, para poder
// mirar los dos lado a lado y decidir con cuál se queda -- si el día de
// mañana se descarta uno de los dos, conviene poder borrarlo entero sin
// tocar el otro (2026-09-02).
// A diferencia de blPlayersDeCategoria (BL trae UN solo equipo, sin separar
// por categoría, así que hay que cruzar por nombre contra el plantel),
// catapultPlayers YA viene separado por categoría desde el server
// (fetch_catapult_players en scrape_tablas.py) -- necesario porque hay
// apellidos repetidos de una categoría a otra y cruzar solo por nombre
// mezclaría partidos de dos jugadores distintos (Javi, 2026-09-02).
// Catapult guarda la posición como texto libre, tipeada a mano por quien
// carga el plantel de cada equipo ahí -- entre categorías (y a veces entre
// jugadores de la MISMA categoría) el mismo puesto real queda escrito
// distinto ("VOL"/"Vol", "VOL CTR"/"Volante Central", "DFC"/"Defensa
// Central"). Se unifican acá SOLO los casos donde no hay ninguna duda de
// que es lo mismo -- nunca se toca el dato en Catapult, esto es solo para
// que la app agrupe bien. "LAT" y "DC" quedan sin tocar a propósito: no
// hay forma de saber si "LAT" es izquierdo o derecho, ni si "DC" significa
// Defensor Central o Delantero Centro en cada caso -- fusionarlos a
// ciegas podría mezclar jugadores de puestos reales distintos, peor que
// dejarlos separados (Javi, 2026-09-03).
const GPS_POS_ALIAS = {
  'vol': 'VOL',
  'vol ctr': 'VOL CTR',
  'volante central': 'VOL CTR',
  'dfc': 'DFC',
  'defensa central': 'DFC',
};
function gpsNormPos(pos){
  const p = (pos||'').trim();
  if(!p) return p;
  const key = p.toLowerCase().replace(/\s+/g,' ');
  return GPS_POS_ALIAS[key] || p;
}
// El campo "Position" que trae Catapult se ignora del todo (Javi,
// 2026-09-03: "Ignora lo que se trae de catapult" -- ya se había visto que
// para 6TA/9NA viene vacío para todos, y para el resto de las categorías
// viene escrito distinto entre jugadores del mismo puesto real). La
// posición que se muestra en ESTA app sale de futdetail (mismo cruce por
// nombre que antes era solo el respaldo de 6TA/9NA) y, si está cargada, un
// override manual por jugador tiene la última palabra (gpsPosOverride, ver
// guardarGpsPosOverride) -- para cuando futdetail tampoco la tiene bien.
// Nunca se sube ni se guarda nada en Catapult.
function gpsPosDeFutdetail(cat, nombre){
  const nn = normNombreOrdenIndependiente(nombre);
  const enFutdetail = (plantelFutdetail[cat]||[]).find(r=>normNombreOrdenIndependiente(r.nombre)===nn);
  return enFutdetail ? enFutdetail.posicion : '';
}
function catapultPlayersDeCategoria(cat){
  const raw = catapultPlayers[cat] || {};
  const out = {};
  Object.entries(raw).forEach(([nombre,p])=>{
    const override = gpsPosOverride[cat]?.[nombre];
    const pos = override || gpsNormPos(gpsPosDeFutdetail(cat, nombre));
    out[nombre] = {...p, pos};
  });
  return out;
}
function guardarGpsPosOverride(cat, nombre, valor){
  if(!canEdit) return;
  gpsPosOverride[cat] = gpsPosOverride[cat] || {};
  const v = (valor||'').trim();
  if(v) gpsPosOverride[cat][nombre] = v; else delete gpsPosOverride[cat][nombre];
  saveData();
}

// ============================================================
//  INFORME DE PARTIDO — resumen visual de un partido, todo el equipo
//  (mismo criterio que la vista equivalente de BL GPS Performance: KPIs
//  del plantel con 60'+ jugados, y un gráfico de barras por jugador para
//  cada métrica clave, ordenado de mayor a menor). Vive dentro del mismo
//  módulo "RENDIMIENTO GPS" (Catapult directo), como 4to modo al lado de
//  comparar/ranking/perfil.
// ============================================================
let gpsInformeFecha = null;
let gpsInformePosFiltro = 'todas';
let gpsInformeMinFiltro = 'todos'; // 'todos' | '85' | '6084' | '60'

// Todas las fechas (con rival) que tengan al menos un jugador con carga de
// Catapult en esta categoría, más recientes primero.
function gpsInformeFechasDeCategoria(cat){
  const mapa = new Map();
  Object.values(catapultPlayersDeCategoria(cat)).forEach(p=>{
    (p.match||[]).forEach(r=>{
      const n = blFechaNum(r.fecha);
      if(n!=null && !mapa.has(n)) mapa.set(n, {num:n, opp:r.opp||''});
    });
  });
  return [...mapa.values()].sort((a,b)=>b.num-a.num);
}

function gpsInformeFormHTML(cat){
  const fechas = gpsInformeFechasDeCategoria(cat);
  if(!fechas.length){

  if(gpsInformeFecha==null || !fechas.some(f=>f.num===gpsInformeFecha)) gpsInformeFecha = fechas[0].num;
  const fechaOpts = fechas.map(f=>`<option value="${f.num}"${f.num===gpsInformeFecha?' selected':''}>F${f.num}${f.opp?' vs '+esc(f.opp):''}</option>`).join('');
  const posiciones = [...new Set(Object.values(catapultPlayersDeCategoria(cat)).map(p=>p.pos).filter(Boolean))].sort();
  const posOpts = posiciones.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
  return `
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin-bottom:16px">

          style="width:100%;background:rgba(5,8,15,.8);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;padding:8px 10px;">${fechaOpts}</select>
      </div>

        <select id="gps-informe-pos" onchange="gpsInformePosFiltro=this.value;renderGpsInforme();"
          style="width:100%;background:rgba(5,8,15,.8);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;padding:8px 10px;">
          <option value="todas">Todas</option>${posOpts}

          <option value="todos">Todos</option>

          <option value="60">-60'</option>
        </select>
      </div>
    </div>
    <div id="gps-informe-content"></div>`;

// Un registro por jugador que jugó la fecha elegida, ya filtrado por
// posición/minutos -- {nombre, pos, fecha, opp, min, metrics:[...]}.
// Un registro por jugador que jugó esa fecha, sin filtrar todavía --
// {nombre, pos, fecha, opp, min, metrics:[...]}. Reusado por "Informe de
// partido" y por "Por fecha" (bandas de minutos).
function gpsRegistrosDeFecha(cat, fecha){
  const out = [];
  Object.entries(catapultPlayersDeCategoria(cat)).forEach(([nombre,p])=>{
    const r = (p.match||[]).find(m=>blFechaNum(m.fecha)===fecha);
    if(r) out.push({nombre, pos:p.pos, ...r});
  });
  return out;
}

function gpsInformeRegistros(cat){
  return gpsRegistrosDeFecha(cat, gpsInformeFecha).filter(r=>{
    if(gpsInformePosFiltro!=='todas' && r.pos!==gpsInformePosFiltro) return false;
    if(gpsInformeMinFiltro==='85'   && !(r.min>=85)) return false;
    if(gpsInformeMinFiltro==='6084' && !(r.min>=60 && r.min<85)) return false;
    if(gpsInformeMinFiltro==='60'   && !(r.min<60)) return false;
    return true;
  });
}

function gpsKpiCardHTML(label, unit, nums){
  if(!nums.length) return '';
  const prom = nums.reduce((a,b)=>a+b,0)/nums.length;
  const min = Math.min(...nums), max = Math.max(...nums);
  return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px">
    <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif">${esc(label)}${unit?` (${esc(unit)})`:''}</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold2)">${fmtGps(prom)}</div>
    <div style="font-size:10px;color:var(--muted)">rango ${fmtGps(min)}–${fmtGps(max)}</div>
  </div>`;
}

function gpsChartWrapHTML(id, titulo){
  return `<div style="margin-bottom:22px">
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:'Barlow Condensed',sans-serif">${esc(titulo)}</div>
    <div class="gic-chart-box"><canvas id="${id}"></canvas></div>
  </div>`;
}

// Barra por jugador (métrica principal) + línea opcional en eje secundario
// (ej. distancia total en barra, m/min en línea) -- mismo patrón visual que
// usa BL GPS Performance en su "Informe de partido".
function gpsDrawBarra(id, regs, idxBar, labelBar, idxLine, labelLine){
  const el = document.getElementById(id);
  if(!el) return;
  const ordenados = [...regs].sort((a,b)=>(b.metrics[idxBar]||0)-(a.metrics[idxBar]||0));
  const labels = ordenados.map(r=>r.nombre);
  killChart(id);
  const datasets = [{type:'bar', label:labelBar, data:ordenados.map(r=>r.metrics[idxBar]||0),
    backgroundColor:'rgba(240,192,64,.75)', borderColor:'#f0c040', borderWidth:1, yAxisID:'y'}];
  const scales = {
    x:{ticks:{color:'#5a7099',font:{family:'Barlow Condensed'}},grid:{display:false}},
    y:{position:'left',ticks:{color:'#5a7099'},grid:{color:'rgba(26,45,90,0.4)'}},
  };
  if(idxLine!=null){
    datasets.push({type:'line', label:labelLine, data:ordenados.map(r=>r.metrics[idxLine]||0),
      borderColor:'#2a78d6', backgroundColor:'#2a78d6', yAxisID:'y1', tension:.3});
    scales.y1 = {position:'right',ticks:{color:'#5a7099'},grid:{display:false}};
  }
  new Chart(el.getContext('2d'), {data:{labels, datasets}, options:{...chartDef(), scales}});
}
function gpsDrawMinutos(id, regs){
  const el = document.getElementById(id);
  if(!el) return;
  const ordenados = [...regs].sort((a,b)=>b.min-a.min);
  killChart(id);
  new Chart(el.getContext('2d'), {
    type:'bar',
    data:{labels: ordenados.map(r=>r.nombre), datasets:[{label:'Minutos', data:ordenados.map(r=>r.min),
      backgroundColor:'rgba(240,192,64,.75)', borderColor:'#f0c040', borderWidth:1}]},
    options: chartDef(),
  });
}

function renderGpsInforme(){
  const cont = document.getElementById('gps-informe-content');
  if(!cont) return;
  const regs = gpsInformeRegistros(gpsCruceCat);
  if(!regs.length){
    cont.innerHTML = `<div style="color:var(--muted);font-size:12px;padding:12px 0">No hay jugadores para esa combinación de filtros.</div>`;
    return;
  }

  const de60 = regs.filter(r=>r.min>=60);
  const excluidos = regs.length - de60.length;
  const numsAt = idx => de60.map(r=>r.metrics[idx]).filter(v=>v!=null).map(Number);
  const hayPL = regs.some(r=>r.metrics[16]!=null);

  const kpis = [
    gpsKpiCardHTML('Distancia Total','m', numsAt(0)),
    gpsKpiCardHTML('Mts/min','m/min', numsAt(1)),
    gpsKpiCardHTML('HSR 21-25','m', numsAt(3)),
    gpsKpiCardHTML('Sprints +25','m', numsAt(4)),
    gpsKpiCardHTML('Top Speed','km/h', numsAt(6)),
    gpsKpiCardHTML('Acel +3','#', numsAt(7)),
    gpsKpiCardHTML('Desac +3','#', numsAt(8)),
    hayPL ? gpsKpiCardHTML('Player Load','', numsAt(16)) : '',
  ].filter(Boolean).join('');

  cont.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:8px">${kpis}</div>
    ${excluidos>0?`<div style="font-size:10px;color:var(--muted);margin-bottom:16px">Promedios calculados sobre ${de60.length} jugador${de60.length===1?'':'es'} con 60' o más (${excluidos} con menos minutos no entran en el promedio, pero sí aparecen en los gráficos de abajo).</div>`:''}
    ${gpsChartWrapHTML('ch-gic-dist','Distancia total y m/min')}
    ${gpsChartWrapHTML('ch-gic-hsr','HSR 21-25 y Sprints +25')}
    ${gpsChartWrapHTML('ch-gic-vel','Top Speed y Cant. Sprints')}
    ${gpsChartWrapHTML('ch-gic-acc','Acel +3 y Desac +3')}
    ${hayPL?gpsChartWrapHTML('ch-gic-pl','Player Load'):''}
    ${gpsChartWrapHTML('ch-gic-min','Minutos jugados')}`;

  // Recién ahora existen los <canvas> en el DOM -- se dibujan después de
  // insertar el HTML, nunca antes (si no, Chart.js mide un elemento que
  // todavía no está).
  gpsDrawBarra('ch-gic-dist', regs, 0,'Distancia total (m)', 1,'m/min');
  gpsDrawBarra('ch-gic-hsr',  regs, 3,'HSR 21-25 (m)', 4,'Sprints +25 (m)');
  gpsDrawBarra('ch-gic-vel',  regs, 6,'Top Speed (km/h)', 5,'Cant. Sprints');
  gpsDrawBarra('ch-gic-acc',  regs, 7,'Acel +3', 8,'Desac +3');

// ============================================================
//  POR FECHA — jugadores de una posición agrupados por banda de minutos
//  (+85' / 60'-84' / -60'), una fecha puntual o todas juntas. Mismo
//  criterio que "Informe de partido" para las bandas (agrupar por los
//  minutos que jugó CADA UNO, no por su rol táctico).
// ============================================================
let gpsPFPos = null;
let gpsPFMetIdx = 0;
let gpsPFFecha = 'todas'; // 'todas' | numero de fecha

function gpsPorFechaPosiciones(cat){
  return [...new Set(Object.values(catapultPlayersDeCategoria(cat)).map(p=>p.pos).filter(Boolean))].sort();
}
function gpsBandaDe(min){ return min>=85 ? 'gt85' : (min>=60 ? 'r6084' : 'lt60'); }

// Mejor valor de la métrica, por banda de minutos, de los jugadores de
// `pos` que jugaron `fecha` -- {gt85, r6084, lt60}, null si nadie cae ahí.
function gpsBandasDePosFecha(cat, pos, fecha, metIdx){
  const regs = gpsRegistrosDeFecha(cat, fecha).filter(r=>pos==='todas'||r.pos===pos);
  const out = {gt85:null, r6084:null, lt60:null};
  regs.forEach(r=>{
    const v = r.metrics[metIdx];
    if(v==null) return;
    const b = gpsBandaDe(r.min);
    if(out[b]==null || Number(v)>out[b]) out[b]=Number(v);
  });
  return out;
}

// Referencia histórica de una posición para una métrica: máximo y promedio
// del "mejor dato de cada fecha" (solo jugadores con 60'+, mismo criterio
// de "máximos y promedios de competencia" que ya usa Perfil de posición).
function gpsHistPos(cat, pos, metIdx){
  const porFecha = {};
  Object.values(catapultPlayersDeCategoria(cat)).forEach(p=>{
    if(pos!=='todas' && p.pos!==pos) return;
    (p.match||[]).forEach(r=>{
      if(r.min<60) return;
      const v = r.metrics[metIdx];
      if(v==null) return;
      const f = blFechaNum(r.fecha);
      if(f==null) return;
      if(porFecha[f]==null || Number(v)>porFecha[f]) porFecha[f]=Number(v);
    });
  });
  const vals = Object.values(porFecha);
  if(!vals.length) return null;
  return {max: Math.max(...vals), prom: vals.reduce((a,b)=>a+b,0)/vals.length, fechas: vals.length};
}

  if(!gpsPFPos || !posiciones.includes(gpsPFPos)) gpsPFPos = posiciones[0];
  const posOpts = posiciones.map(p=>`<option value="${esc(p)}"${p===gpsPFPos?' selected':''}>${esc(p)}</option>`).join('');
  const metChips = gpsVisibleMetrics().map(m=>gpsPFBtnHTML(m.i===gpsPFMetIdx, esc(m.label), `gpsPFMetIdx=${m.i};renderGpsPorFecha();`)).join('');
  const fechas = gpsInformeFechasDeCategoria(cat);
  const fechaPills = gpsPFBtnHTML(gpsPFFecha==='todas', 'TODAS', `gpsPFFecha='todas';renderGpsPorFecha();`)
    + fechas.map(f=>gpsPFBtnHTML(gpsPFFecha===f.num, `F${f.num}${f.opp?' vs '+esc(f.opp):''}`, `gpsPFFecha=${f.num};renderGpsPorFecha();`)).join('');

  return `
    <div style="margin-bottom:12px">
      <label style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px">Posición</label>
      <select id="gps-pf-pos" onchange="gpsPFPos=this.value;renderGpsPorFecha();"
        style="width:100%;max-width:260px;background:rgba(5,8,15,.8);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;padding:8px 10px;">${posOpts}</select>

    <div style="margin-bottom:10px">${metChips}</div>
    <div style="margin-bottom:16px">${fechaPills}</div>
    <div id="gps-pf-content"></div>`;

function gpsPFVal(v){ return v==null ? '—' : fmtGps(v); }

function renderGpsPorFecha(){
  const cont = document.getElementById('gps-pf-content');
  if(!cont) return;
  const cat = gpsCruceCat, pos = gpsPFPos, metIdx = gpsPFMetIdx;
  const met = gpsMetricByIdx(metIdx);
  const hist = gpsHistPos(cat, pos, metIdx);

  if(gpsPFFecha==='todas'){
    const fechas = gpsInformeFechasDeCategoria(cat);
    const filas = fechas.map(f=>{
      const b = gpsBandasDePosFecha(cat, pos, f.num, metIdx);
      if(b.gt85==null && b.r6084==null && b.lt60==null) return null;
      return `<tr><td class="cat-cell">F${f.num}${f.opp?` <span style="color:var(--muted);font-size:11px">vs ${esc(f.opp)}</span>`:''}</td>
        <td style="text-align:center">${gpsPFVal(b.gt85)}</td>
        <td style="text-align:center">${gpsPFVal(b.r6084)}</td>
        <td style="text-align:center">${gpsPFVal(b.lt60)}</td></tr>`;
    }).filter(Boolean);
    if(!filas.length){
      cont.innerHTML = `<div style="color:var(--muted);font-size:12px;padding:12px 0">Todavía no hay datos de ${esc(pos)} para esa métrica.</div>`;
      return;
    }
    cont.innerHTML = `<div class="gen-table-wrap"><table class="gen-table">
      <thead><tr><th>FECHA</th><th>+85'</th><th>60'-84'</th><th>-60'</th></tr></thead>
      <tbody>${filas.join('')}</tbody></table></div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);margin-top:4px">${met.label} (${met.unit}) · mejor marca de ${esc(pos)} en cada banda de minutos</div>`;
    return;
  }

  // Una fecha puntual: tarjeta de % vs histórico + barras por banda + grilla
  // con la mejor marca de esa posición ese día, para las 17 métricas.
  const b = gpsBandasDePosFecha(cat, pos, gpsPFFecha, metIdx);
  const valoresDelDia = [b.gt85,b.r6084,b.lt60].filter(v=>v!=null);
  const mejorDelDia = valoresDelDia.length ? Math.max(...valoresDelDia) : null;
  const pct = (hist && hist.max && mejorDelDia!=null) ? Math.round(mejorDelDia/hist.max*100) : null;

  const bandaBarraHTML = (label, val) => {
    const pctBanda = (hist && hist.prom && val!=null) ? Math.round(val/hist.prom*100) : null;
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;margin-bottom:3px">
        <span>${label}</span><span>${gpsPFVal(val)}${pctBanda!=null?` · ${pctBanda}% vs prom.`:''}</span>
      </div>
      <div style="height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${pctBanda!=null?Math.min(100,pctBanda):0}%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s"></div>
      </div>
    </div>`;
  };

  const metricasGrid = gpsVisibleMetrics().map(m=>{
    const bm = gpsBandasDePosFecha(cat, pos, gpsPFFecha, m.i);
    const mejores = [bm.gt85,bm.r6084,bm.lt60].filter(v=>v!=null);
    if(!mejores.length) return '';
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px">
      <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif">${esc(m.label)}</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:17px;color:${m.i===metIdx?'var(--gold2)':'var(--text)'}">${fmtGps(Math.max(...mejores))}</div>
    </div>`;
  }).join('');

  cont.innerHTML = `
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px">
      <div style="background:var(--surface);border:1px solid var(--gold);border-radius:10px;padding:14px 18px;min-width:170px">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif">% del máx. histórico</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--gold2)">${pct!=null?pct+'%':'—'}</div>
        <div style="font-size:10px;color:var(--muted)">${hist?`Ref.: ${fmtGps(hist.max)} máx · ${fmtGps(hist.prom)} prom. (${hist.fechas} fecha${hist.fechas===1?'':'s'})`:'Sin referencia histórica todavía'}</div>
      </div>
      <div style="flex:1;min-width:220px">
        ${bandaBarraHTML("+85'", b.gt85)}
        ${bandaBarraHTML("60'-84'", b.r6084)}
        ${bandaBarraHTML("-60'", b.lt60)}
      </div>
    </div>
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-family:'Barlow Condensed',sans-serif">Mejor marca de ${esc(pos)} ese día, por métrica</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px">${metricasGrid}</div>`;
}

let gpsPerfilPinned = [0, 1, 5, 6];
function gpsPerfilTogglePin(i){
  const idx = gpsPerfilPinned.indexOf(i);
  if(idx>-1) gpsPerfilPinned.splice(idx,1);
  else {
    gpsPerfilPinned.push(i);
    if(gpsPerfilPinned.length>4) gpsPerfilPinned.shift();
  }
  renderGpsPerfil();
}
function gpsPerfilMetricaMax(p, i){
  let best = null;
  (p.match||[]).forEach(r=>{
    const v = r.metrics ? r.metrics[i] : null;
    if(v==null) return;
    if(best==null || Number(v) > best.v) best = {v:Number(v), fecha: blFechaNum(r.fecha), opp: r.opp||''};
  });
  return best;
}
// Todos los partidos con 60'+ de los jugadores de `pos` (o solo de `nombre`,
// si se pasa) -- pool crudo para calcular prom./máx. "de competencia".
function gpsPerfilRegistros(cat, pos, nombre){
  const out = [];
  Object.entries(catapultPlayersDeCategoria(cat)).forEach(([n,p])=>{
    if(p.pos!==pos) return;
    if(nombre && n!==nombre) return;
    (p.match||[]).forEach(r=>{ if(r.min>=60) out.push(r); });
  });
  return out;
}
function gpsPerfilPromMax(regs, idx){
  const nums = regs.map(r=>r.metrics[idx]).filter(v=>v!=null).map(Number);
  if(!nums.length) return null;
  return {prom: nums.reduce((a,b)=>a+b,0)/nums.length, max: Math.max(...nums)};
}
// Serie cronológica para el sparkline: valor propio del jugador (todos sus
// partidos, sin filtro de minutos -- interesa su trayectoria real) o, sin
// jugador elegido, el promedio de la posición esa fecha (solo 60'+, mismo
// criterio "de competencia" que el resto de este módulo).
function gpsEvolucionSerie(cat, pos, nombre, idx){
  const porFecha = {};
  Object.entries(catapultPlayersDeCategoria(cat)).forEach(([n,p])=>{
    if(p.pos!==pos) return;
    if(nombre && n!==nombre) return;
    (p.match||[]).forEach(r=>{
      if(!nombre && r.min<60) return;
      const v = r.metrics[idx];
      if(v==null) return;
      const f = blFechaNum(r.fecha);
      if(f==null) return;
      if(!porFecha[f]) porFecha[f] = {sum:0, n:0, opp:r.opp||''};
      porFecha[f].sum += Number(v); porFecha[f].n++;
    });
  });
  return Object.entries(porFecha).map(([f,d])=>({fecha:+f, opp:d.opp, valor:d.sum/d.n}))
    .sort((a,b)=>a.fecha-b.fecha);
}
// Mini-gráfico SVG propio (sin librerías): área + línea + promedio punteado
// + puntos con tooltip nativo (<title>) al pasar el mouse.
function gpsSparklineSVG(serie, unit){
  const w=220, h=54, pad=6;
  const vals = serie.map(s=>s.valor);
  const min = Math.min(...vals), max = Math.max(...vals);
  const rango = (max-min)||1;
  const x = i => pad + i*(w-2*pad)/(serie.length-1);
  const y = v => h-pad - (v-min)/rango*(h-2*pad);
  const prom = vals.reduce((a,b)=>a+b,0)/vals.length;
  const pts = serie.map((s,i)=>`${x(i)},${y(s.valor)}`).join(' ');
  const area = `${pad},${h-pad} ${pts} ${x(serie.length-1)},${h-pad}`;
  const puntos = serie.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.valor)}" r="2.6" fill="var(--gold2)"><title>F${s.fecha}${s.opp?' vs '+esc(s.opp):''}: ${fmtGps(s.valor)}${unit&&unit!=='#'?' '+esc(unit):''}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;overflow:visible">
    <polygon points="${area}" fill="rgba(240,192,64,.12)" stroke="none"/>
    <line x1="${pad}" y1="${y(prom)}" x2="${w-pad}" y2="${y(prom)}" stroke="var(--muted)" stroke-dasharray="3,3" stroke-width="1"/>
    <polyline points="${pts}" fill="none" stroke="var(--gold2)" stroke-width="1.6"/>
    ${puntos}
  </svg>`;
}

function renderGpsPerfil(){
  const sel = document.getElementById('gps-perfil-jugador');
  const cont = document.getElementById('gps-perfil-content');
  if(!sel || !cont) return;
  const cat = gpsCruceCat, pos = gpsPerfilPos, nombre = sel.value || null;
  const p = nombre ? catapultPlayersDeCategoria(cat)[nombre] : null;

  let headerHTML = '';
  if(nombre && p){
    const iniciales = nombre.split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const registros = (p.match||[]).length;
    const metricas = gpsVisibleMetrics().map(m=>({...m, best: gpsPerfilMetricaMax(p, m.i)}));

    const cardHTML = (m, pinned) => !m.best ? '' : `
      <div onclick="gpsPerfilTogglePin(${m.i})" style="cursor:pointer;background:${pinned?'var(--surface2)':'var(--surface)'};border:1px solid ${pinned?'var(--gold)':'var(--border)'};border-radius:8px;padding:${pinned?'12px':'10px'};position:relative;${pinned?'text-align:center':''}">
        ${pinned?'<div style="position:absolute;top:6px;right:8px;font-size:11px;color:var(--gold)">📌</div>':(gpsPerfilPinned.includes(m.i)?'<div style="position:absolute;top:6px;right:8px;font-size:10px;color:var(--gold)">📌</div>':'')}
        ${pinned?'':`<div style="font-size:10px;color:var(--muted);font-family:'Barlow Condensed',sans-serif">${esc(m.label.toUpperCase())}${m.unit!=='#'?` (${esc(m.unit)})`:''}</div>`}
        <div style="font-family:'Bebas Neue',sans-serif;font-size:${pinned?'26px':'18px'};color:${(pinned||gpsPerfilPinned.includes(m.i))?'var(--gold2)':'var(--text)'}">${fmtGps(m.best.v)}</div>
        ${pinned?`<div style="font-size:10px;color:var(--muted);letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;margin-top:2px">${esc(m.label.toUpperCase())}${m.unit!=='#'?` (${esc(m.unit)})`:''}</div>`:`<div style="font-size:9px;color:var(--muted)">F${m.best.fecha}${m.best.opp?` · vs ${esc(m.best.opp)}`:''}</div>`}
      </div>`;

    const pinnedCards = gpsPerfilPinned.map(i=>metricas.find(m=>m.i===i)).filter(Boolean).map(m=>cardHTML(m,true)).join('');
    const gridCards = metricas.map(m=>cardHTML(m,false)).join('');

    headerHTML = `
      <div style="display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px">
        <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:17px;color:#1a1206;flex-shrink:0">${esc(iniciales)}</div>
        <div style="flex:1">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:#fff">${esc(nombre.toUpperCase())}</div>
          <div style="font-size:12px;color:var(--text2);font-family:'Barlow Condensed',sans-serif">${p.pos?esc(p.pos)+' · ':''}${cat} · ${registros} registro${registros===1?'':'s'}</div>
        </div>
      </div>
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-family:'Barlow Condensed',sans-serif">📌 Tocá cualquier métrica de abajo para fijarla acá arriba (máx. 4)</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px">${pinnedCards}</div>
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-family:'Barlow Condensed',sans-serif">Dato máximo registrado por métrica</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px">${gridCards}</div>`;
  }

  // 🧬 Jugador vs. perfil de su posición -- prom./máx. de la posición
  // siempre, y del jugador elegido al lado, comparando prom-con-prom y
  // máx-con-máx (nunca cruzado), con el mejor valor de cada par en dorado.
  const apellido = nombre ? nombre.split(' ').slice(-1)[0] : '';
  const regsPos = gpsPerfilRegistros(cat, pos, null);
  const filasComparacion = gpsVisibleMetrics().map(m=>{
    const pp = gpsPerfilPromMax(regsPos, m.i);
    const pj = nombre ? gpsPerfilPromMax(gpsPerfilRegistros(cat, pos, nombre), m.i) : null;
    if(!pp && !pj) return '';
    const bestProm = (pj && pp) ? (pj.prom>=pp.prom?'jug':'pos') : null;
    const bestMax  = (pj && pp) ? (pj.max >=pp.max ?'jug':'pos') : null;
    return `<tr>
      <td class="cat-cell">${esc(m.label)} <span style="color:var(--muted);font-size:10px">(${esc(m.unit)})</span></td>
      <td style="text-align:center${bestProm==='pos'?';color:var(--gold2);font-weight:700':''}">${pp?fmtGps(pp.prom):'—'}</td>
      <td style="text-align:center${bestMax==='pos'?';color:var(--gold2);font-weight:700':''}">${pp?fmtGps(pp.max):'—'}</td>
      ${nombre?`<td style="text-align:center${bestProm==='jug'?';color:var(--gold2);font-weight:700':''}">${pj?fmtGps(pj.prom):'—'}</td>
      <td style="text-align:center${bestMax==='jug'?';color:var(--gold2);font-weight:700':''}">${pj?fmtGps(pj.max):'—'}</td>`:''}
    </tr>`;
  }).filter(Boolean).join('');

  const comparacionHTML = !filasComparacion
    ? `<div style="color:var(--muted);font-size:12px;padding:12px 0">Todavía no hay datos de ${esc(pos)} para comparar (hacen falta partidos con 60' o más).</div>`
    : `<div class="gen-table-wrap"><table class="gen-table">
        <thead><tr><th>MÉTRICA</th><th>PROM. ${esc(pos)}</th><th>MÁX. ${esc(pos)}</th>${nombre?`<th>PROM. ${esc(apellido)}</th><th>MÁX. ${esc(apellido)}</th>`:''}</tr></thead>
        <tbody>${filasComparacion}</tbody></table></div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);margin-top:4px">Solo partidos con 60' o más.</div>`;

  // 📈 Evolución por fecha -- sparkline por métrica (propio del jugador si
  // hay uno elegido, si no, promedio de la posición fecha a fecha).
  const evolucionHTML = gpsVisibleMetrics().map(m=>{
    const serie = gpsEvolucionSerie(cat, pos, nombre, m.i);
    if(serie.length<2) return '';
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;margin-bottom:4px">${esc(m.label)}${m.unit!=='#'?` (${esc(m.unit)})`:''}</div>
      ${gpsSparklineSVG(serie, m.unit)}
    </div>`;
  }).filter(Boolean).join('');

  cont.innerHTML = `
    ${headerHTML}
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:${headerHTML?'18px':'0'} 0 8px;font-family:'Barlow Condensed',sans-serif">🧬 ${nombre?esc(apellido).toUpperCase()+' vs. ':''}PERFIL DE ${esc(pos.toUpperCase())}</div>
    ${comparacionHTML}
    <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:22px 0 10px;font-family:'Barlow Condensed',sans-serif">📈 EVOLUCIÓN POR FECHA</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px">${evolucionHTML || `<div style="color:var(--muted);font-size:12px">Hacen falta 2 o más fechas con datos para graficar la evolución.</div>`}</div>`;
}
