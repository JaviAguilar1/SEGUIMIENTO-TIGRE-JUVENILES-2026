<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tigre Juveniles">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tigre Juveniles — Plataforma de Análisis</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
/* ══════════════════════════════════════════════════════════
   TIGRE JUVENILES — Design System
══════════════════════════════════════════════════════════ */
:root {
  --bg:        #05080f;
  --surface:   #0a0f1e;
  --surface2:  #0d1528;
  --surface3:  #111e38;
  --border:    #1a2d5a;
  --border2:   #243f7a;
  --red:       #c0152a;
  --red2:      #e01830;
  --red-glow:  rgba(192,21,42,0.35);
  --blue:      #1a3a8f;
  --blue2:     #2450c0;
  --gold:      #c9a227;
  --gold2:     #f0c040;
  --win:       #22c55e;
  --draw:      #f59e0b;
  --loss:      #ef4444;
  --text:      #d8e4ff;
  --text2:     #a8c0e8;
  --muted:     #5a7099;
  --white:     #ffffff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Barlow',sans-serif;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 70% 35% at 20% 0%,rgba(26,58,143,0.2) 0%,transparent 65%),
    radial-gradient(ellipse 50% 25% at 80% 0%,rgba(192,21,42,0.12) 0%,transparent 60%);
}
/* While login wall is present, blur all underlying content */
body:has(#login-wall) header,
body:has(#login-wall) .nav-modules,
body:has(#login-wall) .module-panel,
body:has(#login-wall) #save-toast,
body:has(#login-wall) .scroll-top {
  visibility:hidden;
}

/* ── HEADER ─────────────────────────────────────────── */
header {
  background:linear-gradient(180deg,#0d1528 0%,#08111f 100%);
  border-bottom:3px solid var(--red);
  padding:0 20px;
  display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:300;
  min-height:66px;
  box-shadow:0 4px 40px rgba(0,0,0,0.7);
}
header::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;
  height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.crest-img{width:48px;height:48px;object-fit:contain;
  filter:drop-shadow(0 0 10px rgba(192,21,42,0.55));}
.header-titles h1{
  font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:5px;
  color:var(--white);line-height:1;
  text-shadow:0 0 30px rgba(192,21,42,0.4);
}
.header-titles p{color:var(--muted);font-size:10px;margin-top:2px;
  letter-spacing:2px;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;}
.header-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.season-pill{background:var(--red);color:white;font-family:'Bebas Neue',sans-serif;
  font-size:11px;letter-spacing:2px;padding:2px 10px;border-radius:20px;}
#admin-badge{display:none;align-items:center;gap:6px;}
.admin-tag{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);
  border-radius:4px;padding:2px 8px;font-family:'Barlow Condensed',sans-serif;
  font-size:10px;letter-spacing:1px;color:#22c55e;}
.role-tag{background:rgba(240,192,64,0.15);border:1px solid rgba(240,192,64,0.3);
  border-radius:4px;padding:2px 8px;font-family:'Barlow Condensed',sans-serif;
  font-size:10px;letter-spacing:1px;color:var(--gold2);}
#btn-logout{display:none;align-items:center;gap:5px;
  background:rgba(192,21,42,0.2);border:1px solid rgba(192,21,42,0.4);
  border-radius:4px;color:#fca5a5;font-size:10px;padding:3px 8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}

/* ── NAV TABS (módulos) ─────────────────────────────── */
.nav-modules{
  background:linear-gradient(180deg,#09122a,#05080f);
  border-bottom:2px solid var(--border);
  display:flex;overflow-x:auto;scrollbar-width:none;
  position:sticky;top:66px;z-index:200;
}
.nav-modules::-webkit-scrollbar{display:none;}
.mod-tab{
  padding:14px 28px;
  font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;
  color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;
  transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:8px;
}
.mod-tab:hover{color:var(--text);background:rgba(26,58,143,0.1);}
.mod-tab.active{color:var(--gold2);border-bottom-color:var(--red);background:rgba(26,58,143,0.15);}
.mod-tab .mod-icon{font-size:16px;}

/* ── CAT SUBTABS ────────────────────────────────────── */
.cat-subtabs{
  background:rgba(8,17,31,0.8);
  border-bottom:1px solid var(--border);
  display:flex;overflow-x:auto;scrollbar-width:none;padding:0 16px;
}
.cat-subtabs::-webkit-scrollbar{display:none;}
.cat-tab{
  padding:9px 16px;
  font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
  transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.cat-tab:hover{color:var(--text);}
.cat-tab.active{border-bottom-color:currentColor;}
.cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* ── MAIN CONTENT ───────────────────────────────────── */
.main{padding:20px;max-width:1500px;margin:0 auto;}
.module-panel{display:none;}
.module-panel.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── SECTION TITLE ──────────────────────────────────── */
.st{
  font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;
  color:var(--gold2);margin:20px 0 14px;display:flex;align-items:center;gap:10px;
}
.st .stbar{width:4px;height:16px;background:linear-gradient(180deg,var(--red2),var(--blue2));
  border-radius:2px;flex-shrink:0;}
.st::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}

/* ── STAT CARDS ─────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin-bottom:20px;}
.stat-card{
  background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center;
  transition:all .2s;position:relative;overflow:hidden;
}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:10px 10px 0 0;}
.stat-card.pts::before{background:var(--gold);}
.stat-card.win::before{background:var(--win);}
.stat-card.draw::before{background:var(--draw);}
.stat-card.loss::before{background:var(--loss);}
.stat-card.gf::before{background:var(--blue2);}
.stat-card.gc::before{background:var(--red2);}
.stat-card.dg::before{background:#a78bfa;}
.stat-card.pj::before{background:var(--muted);}
.stat-card:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:0 6px 20px rgba(0,0,0,0.4);}
.stat-card .val{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;margin-bottom:4px;}
.stat-card .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;}
.stat-card.pts .val{color:var(--gold2);}
.stat-card.win .val{color:var(--win);}
.stat-card.draw .val{color:var(--draw);}
.stat-card.loss .val{color:var(--loss);}
.stat-card.gf .val{color:#60a5fa;}
.stat-card.gc .val{color:#f87171;}
.stat-card.dg .val{color:#c4b5fd;}
.stat-card.pj .val{color:var(--text);}

/* ── PERIOD TABS ────────────────────────────────────── */
.periodo-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.ptab{
  padding:5px 13px;background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
  transition:all .2s;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;
}
.ptab:hover{color:var(--text);border-color:var(--red);}
.ptab.active{background:var(--red);color:white;border-color:var(--red);box-shadow:0 2px 10px var(--red-glow);}

/* ── CHARTS ─────────────────────────────────────────── */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.chart-card{background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:12px;padding:18px;}
.chart-card h3{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;
  color:var(--gold);margin-bottom:14px;}
.pies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:24px;}
.pie-card{background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;}
.pie-card h4{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1.5px;
  color:var(--gold);margin-bottom:10px;}
.pie-stat-row{display:flex;justify-content:center;gap:8px;margin-top:8px;
  font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:600;}

/* ── RESULTS TABLE ──────────────────────────────────── */
.table-wrap{overflow-x:auto;margin-bottom:24px;border-radius:10px;
  border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,0.4);}
table{width:100%;border-collapse:collapse;font-size:12px;}
table thead tr.thead-top th{
  background:linear-gradient(180deg,var(--red) 0%,#8a0f1e 100%);
  color:white;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;
  padding:8px 10px;text-align:center;white-space:nowrap;
  border-right:1px solid rgba(255,255,255,0.1);}
table thead tr.thead-sub th{
  background:linear-gradient(180deg,#0d1a3a,#08111f);color:var(--gold);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;
  text-transform:uppercase;letter-spacing:1px;padding:6px 8px;
  border-bottom:1px solid var(--border2);border-right:1px solid var(--border);
  white-space:nowrap;text-align:center;}
table td{padding:5px 7px;border-bottom:1px solid rgba(26,45,90,0.4);
  border-right:1px solid rgba(26,45,90,0.25);text-align:center;vertical-align:middle;}
table td:last-child,table th:last-child{border-right:none;}
table tr:nth-child(even) td{background:rgba(10,15,30,0.4);}
table tr:hover td{background:rgba(26,58,143,0.15);}
.divider-row td{
  background:linear-gradient(90deg,rgba(192,21,42,0.12),transparent)!important;
  font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:11px;
  color:var(--red2)!important;text-align:left!important;padding:5px 14px!important;
  border-left:3px solid var(--red)!important;}
.fecha-num{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--muted);width:30px;}
.rival-name{text-align:left!important;font-family:'Barlow Condensed',sans-serif;
  font-weight:600;font-size:13px;min-width:140px;}
.cond-badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1px;}
.cond-L{background:rgba(26,58,143,0.4);color:#93c5fd;border:1px solid rgba(36,80,192,0.4);}
.cond-V{background:rgba(192,21,42,0.3);color:#fca5a5;border:1px solid rgba(192,21,42,0.4);}
.score-cell{display:flex;align-items:center;justify-content:center;gap:4px;}
.score-input{width:32px;background:rgba(5,8,15,0.9);border:1px solid var(--border2);
  border-radius:4px;color:white;font-size:14px;font-weight:700;text-align:center;
  padding:3px 2px;transition:all .2s;font-family:'Barlow Condensed',sans-serif;}
.score-input:focus{outline:none;border-color:var(--gold);background:rgba(26,58,143,0.3);}
.score-input:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none;}
.score-sep{color:var(--muted);font-weight:900;font-size:13px;}
.result-badge{display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:21px;border-radius:4px;font-weight:800;font-size:10px;
  font-family:'Barlow Condensed',sans-serif;}
.result-W{background:rgba(34,197,94,.2);color:var(--win);border:1px solid rgba(34,197,94,.35);}
.result-D{background:rgba(245,158,11,.2);color:var(--draw);border:1px solid rgba(245,158,11,.35);}
.result-L{background:rgba(239,68,68,.2);color:var(--loss);border:1px solid rgba(239,68,68,.35);}

/* ── MATCH DETAIL PANEL ─────────────────────────────── */
.match-detail-row td{padding:0!important;border-top:none!important;}
.match-detail-panel{
  background:rgba(5,8,15,0.7);border:1px solid rgba(26,45,90,0.6);
  border-top:2px solid var(--gold2);border-radius:0 0 8px 8px;
  padding:14px 16px;margin:-1px 0 4px;animation:fadeIn .2s;
}
.mdp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:700px){.mdp-grid{grid-template-columns:1fr 1fr;}}
.mdp-section h4{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;
  color:var(--gold2);margin-bottom:6px;border-bottom:1px solid rgba(201,162,39,0.2);padding-bottom:3px;}
.mdp-player{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;
  font-family:'Barlow Condensed',sans-serif;color:var(--text2);border-bottom:1px solid rgba(26,45,90,0.2);}
.mdp-num{background:rgba(26,45,90,0.5);border-radius:3px;padding:1px 5px;
  font-size:10px;color:var(--blue2);font-weight:700;min-width:20px;text-align:center;}
.mdp-mins{margin-left:auto;font-size:10px;color:var(--muted);white-space:nowrap;}
.mdp-mins.ok{color:var(--win);}
.mdp-mins.diff{color:var(--gold);}
.mdp-cambio{display:flex;align-items:center;gap:6px;font-size:11px;
  font-family:'Barlow Condensed',sans-serif;padding:3px 0;color:var(--text2);}
.mdp-cambio-min{background:rgba(192,21,42,0.2);color:var(--loss);border-radius:3px;
  padding:1px 5px;font-size:10px;font-weight:700;min-width:28px;text-align:center;}
.mdp-del{background:none;border:none;color:rgba(239,68,68,0.5);cursor:pointer;font-size:12px;margin-left:auto;}
.mdp-del:hover{color:#ef4444;}
.mdp-add-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.mdp-sel{background:rgba(5,8,15,0.8);border:1px solid var(--border2);border-radius:5px;
  color:var(--text);font-size:11px;padding:5px 7px;font-family:'Barlow Condensed',sans-serif;flex:1;min-width:110px;}
.mdp-min-input{background:rgba(5,8,15,0.8);border:1px solid var(--border2);border-radius:5px;
  color:var(--text);font-size:11px;padding:5px 7px;font-family:'Barlow Condensed',sans-serif;width:56px;}
.mdp-add-btn{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);border-radius:5px;
  color:#22c55e;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px;
  padding:5px 10px;cursor:pointer;}
.mdp-add-btn:hover{background:rgba(34,197,94,0.25);}
.mdp-upload-btn{background:rgba(201,162,39,0.1);border:1px solid rgba(201,162,39,0.3);
  border-radius:5px;color:var(--gold2);font-family:'Bebas Neue',sans-serif;
  font-size:11px;letter-spacing:1px;padding:5px 10px;cursor:pointer;white-space:nowrap;}
.mdp-upload-btn:hover{background:rgba(201,162,39,0.2);}
.btn-equipo{background:rgba(201,162,39,0.08);border:1px solid rgba(201,162,39,0.25);
  border-radius:4px;color:var(--gold2);font-size:10px;font-family:'Bebas Neue',sans-serif;
  letter-spacing:1px;padding:2px 7px;cursor:pointer;white-space:nowrap;}
.btn-equipo:hover,.btn-equipo.active{background:rgba(201,162,39,0.2);border-color:var(--gold2);}
.mdp-dur-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;
  font-family:'Barlow Condensed',sans-serif;color:var(--muted);}
.mdp-dur-input{background:rgba(5,8,15,0.8);border:1px solid var(--border2);border-radius:4px;
  color:var(--text);font-size:11px;padding:3px 6px;width:48px;text-align:center;}
.link-cell{min-width:76px;max-width:110px;}
.link-wrap{display:flex;gap:3px;align-items:center;}
.link-input{flex:1;min-width:0;background:rgba(5,8,15,0.6);border:1px solid rgba(26,45,90,0.5);
  border-radius:4px;color:#93c5fd;font-size:9px;padding:3px 5px;transition:all .2s;
  font-family:'Barlow',sans-serif;}
.link-input:focus{outline:none;border-color:var(--gold);}
.link-input::placeholder{color:rgba(90,112,153,0.4);font-style:italic;}
.link-input:disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;}
.link-btn{display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;flex-shrink:0;background:rgba(26,58,143,0.3);
  border:1px solid var(--border2);border-radius:4px;color:#93c5fd;font-size:10px;
  cursor:pointer;text-decoration:none;transition:all .2s;}
.link-btn:hover{background:var(--red);border-color:var(--red);color:white;}
.link-btn.empty{opacity:0.2;pointer-events:none;}

/* ── GOLEADORES ─────────────────────────────────────── */
.goleadores-grid{display:grid;grid-template-columns:1fr;margin-bottom:24px;}
.goleadores-card{background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.goleadores-card .gc-header{
  background:linear-gradient(135deg,var(--red),#8a0f1e);
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.goleadores-card .gc-header h3{font-family:'Bebas Neue',sans-serif;font-size:15px;
  letter-spacing:2px;color:white;}
.goleadores-card .gc-body{padding:0;}
.gol-item{border-bottom:1px solid rgba(26,45,90,0.4);}
.gol-item:last-child{border-bottom:none;}
.gol-row{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;transition:background .15s;}
.gol-row:hover{background:rgba(26,58,143,0.15);}
.gol-rank{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--muted);
  width:26px;text-align:center;flex-shrink:0;}
.gol-rank.gold{color:var(--gold2);}
.gol-rank.silver{color:#94a3b8;}
.gol-rank.bronze{color:#b45309;}
.gol-name{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px;}
.gol-count{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold2);}
.gol-toggle{font-size:12px;color:var(--muted);transition:transform .15s;flex-shrink:0;}
.gol-item.expanded .gol-toggle{transform:rotate(180deg);}
.gol-detail{display:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:8px;padding:2px 16px 14px 56px;}
.gol-item.expanded .gol-detail{display:grid;}
.gol-detail-item{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--text2);
  background:rgba(255,255,255,0.04);border-radius:6px;padding:7px 10px;text-align:center;}
.gol-detail-item.penal{color:#f0a0a8;background:rgba(192,21,42,0.15);}
.gol-add-row{padding:8px 14px;display:flex;gap:6px;align-items:center;
  border-top:1px solid var(--border);}
.gol-input{flex:1;background:rgba(5,8,15,0.7);border:1px solid var(--border2);
  border-radius:5px;color:var(--text);font-size:12px;padding:5px 8px;
  font-family:'Barlow',sans-serif;}
.gol-input:focus{outline:none;border-color:var(--gold);}
.gol-fecha-input{width:50px;background:rgba(5,8,15,0.7);border:1px solid var(--border2);

.gol-fecha-input:focus{outline:none;border-color:var(--gold);}

.btn-add-gol:hover{background:var(--blue);}

/* ── RENDIMIENTO GPS — gráficos de Informe de partido (Chart.js) ──────
   En notebook/desktop se ven muy chicos si se dejan a una altura fija
   pensada para celular -- more alto a partir de 900px de ancho, y de
   nuevo un poco más en pantallas grandes (1400px+). El ancho ya lo toma
   Chart.js solo del contenedor (100%), acá solo se define el alto. */
.gic-chart-box{position:relative;width:100%;height:220px;box-sizing:border-box;}
@media(min-width:900px){.gic-chart-box{height:340px;}}
@media(min-width:1400px){.gic-chart-box{height:420px;}}

/* ── GENERAL COMPARISON TABLE ───────────────────────── */
.gen-table-wrap{overflow-x:auto;margin-bottom:24px;border-radius:10px;border:1px solid var(--border);}
table.gen-table thead tr th{
  background:linear-gradient(180deg,var(--red),#8a0f1e);color:white;
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1.5px;
  padding:10px 12px;text-align:center;border-right:1px solid rgba(255,255,255,0.1);}
table.gen-table tbody td{padding:8px 12px;border-bottom:1px solid var(--border);
  border-right:1px solid rgba(26,45,90,0.3);text-align:center;}
table.gen-table tbody tr:nth-child(even) td{background:rgba(10,15,30,0.4);}
table.gen-table tbody tr:hover td{background:rgba(26,58,143,0.12);}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}

/* ── MISC UI ────────────────────────────────────────── */
.scroll-top{position:fixed;bottom:20px;right:20px;width:40px;height:40px;

  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:white;font-size:17px;font-weight:800;
  box-shadow:0 4px 20px rgba(192,21,42,0.5);z-index:99;transition:transform .2s;}
.scroll-top:hover{transform:scale(1.1);}

/* ── LOGIN MODAL ────────────────────────────────────── */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,15,0.92);
  display:flex;align-items:center;justify-content:center;z-index:10000;}
.modal-box{background:linear-gradient(135deg,#0d1528,#08111f);
  border:1px solid var(--border);border-top:3px solid var(--red);

  box-shadow:0 20px 60px rgba(0,0,0,0.8);}
.modal-box .m-crest{width:60px;margin-bottom:16px;
  filter:drop-shadow(0 0 10px rgba(192,21,42,0.5));}
.modal-box h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px;
  color:var(--gold2);margin-bottom:4px;}
.modal-box p{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);
  margin-bottom:24px;letter-spacing:1px;}
.m-input{width:100%;background:rgba(5,8,15,0.8);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:14px;padding:10px 14px;
  margin-bottom:10px;outline:none;font-family:'Barlow',sans-serif;transition:border-color .2s;}
.m-input:focus{border-color:var(--gold);}
.m-btn{width:100%;background:linear-gradient(135deg,var(--red),#8a0f1e);border:none;
  border-radius:8px;color:white;font-family:'Bebas Neue',sans-serif;font-size:18px;
  letter-spacing:3px;padding:12px;cursor:pointer;margin-bottom:10px;
  box-shadow:0 4px 16px var(--red-glow);transition:opacity .2s;}
.m-btn:hover{opacity:.85;}
.m-cancel{background:none;border:none;color:var(--muted);font-family:'Barlow Condensed',sans-serif;
  font-size:12px;cursor:pointer;letter-spacing:1px;}
.m-error{color:var(--loss);font-size:12px;margin-top:8px;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;display:none;}

/* ── TOASTS ─────────────────────────────────────────── */
#save-toast{position:fixed;bottom:68px;right:20px;
  background:linear-gradient(135deg,#1a3a8f,#0d1528);
  border:1px solid var(--win);border-radius:8px;padding:7px 14px;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;
  color:var(--win);z-index:999;box-shadow:0 4px 16px rgba(0,0,0,0.5);

/* ── ALERT PILLS ─────────────────────────────────── */
#alert-pills{ min-height: 14px; }

/* ── CARGA MODULE ─────────────────────────────────── */
#gym-overlay input:focus { border-color: var(--gold2) !important; outline:none; }

/* ── RESPONSIVE ─────────────────────────────────────── */
@media(max-width:750px){
  .charts-row{grid-template-columns:1fr;}
  .pies-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}

  .stat-card .val{font-size:26px;}
  .main{padding:10px;}

  .crest-img{width:38px;height:38px;}

  .link-cell{min-width:64px;max-width:88px;}
  .link-input{font-size:9px;padding:3px 4px;}
  .rival-name{min-width:100px;font-size:11px;}

}

const FECHA_CALENDARIO = {

function formatFechaCalendario(fecha){
  const f = FECHA_CALENDARIO[fecha];
  if(!f) return '';

  return `${dia.charAt(0).toUpperCase()+dia.slice(1)} ${f.dia}/${f.mes+1}`;
}

// ── ID único de jugador ──────────────────────────────────────
// Determinístico a partir del nombre (slug) — no hace falta guardar nada
// nuevo en Firebase, se recalcula solo cada vez que se carga el plantel y
// da siempre el mismo id mientras el nombre no cambie. El id NO incluye la
// categoría a propósito: un jugador conserva su identidad al subir de
// categoría de una temporada a la otra.
function slugNombre(nombre){
  return (nombre||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9\s]/g,'').trim().replace(/\s+/g,'-') || 'jugador';
}
// Recorre las 7 categorías y le asigna un id a cada jugador de
// plantelFutdetail. Si dos jugadores (en cualquier categoría) tienen el
// nombre exactamente igual, el segundo suma un sufijo -2, -3… en vez de
// fusionarse con el primero — se llama de nuevo cada vez que se recarga el
// plantel desde Firebase, así que es barato de recalcular.
function assignPlayerIds(){
  const seen = {};
  CATEGORIES.forEach(cat=>{
    (plantelFutdetail[cat]||[]).forEach(p=>{
      const base = slugNombre(p.nombre);
      const n = (seen[base] = (seen[base]||0) + 1);
      p.id = n===1 ? base : `${base}-${n}`;
      if(n>1) console.warn(`[ID] "${p.nombre}" (${cat}) tiene el mismo nombre que otro jugador — se le asignó id "${p.id}", revisar a mano si son personas distintas.`);
    });
  });
}

function getResult(gf,gc){ if(gf===null||gc===null)return null; return gf>gc?'W':gf===gc?'D':'L'; }
function calcStats(cat,from,to){
  let pj=0,pg=0,pe=0,pp=0,gf=0,gc=0;
  for(let f=from;f<=to;f++){
    const r=results[cat][f];
    if(r){pj++;gf+=r[0];gc+=r[1];const x=getResult(r[0],r[1]);if(x==='W')pg++;else if(x==='D')pe++;else pp++;}
  }
  return{pj,pg,pe,pp,gf,gc,dg:gf-gc,pts:pg*3+pe};
}
function calcStatsAll(from,to){
  let pj=0,pg=0,pe=0,pp=0,gf=0,gc=0;
  GENERAL_CATS.forEach(cat=>{const s=calcStats(cat,from,to);pj+=s.pj;pg+=s.pg;pe+=s.pe;pp+=s.pp;gf+=s.gf;gc+=s.gc;});
  return{pj,pg,pe,pp,gf,gc,dg:gf-gc,pts:pg*3+pe};
}
function getPeriodos(cat){
  if(cat==='RESERVA'||cat==='RESERVA_S2'){
    // Dynamically find last N played matches
    const played = [];
    for(let f=1; f<=18; f++){ if(results[cat]?.[f]) played.push(f); }
    const periods = [{label:'TOTAL', from:1, to:18}];
    if(played.length > 0){
      const last3 = played.slice(-3);
      periods.push({
        label: `ÚLT. ${last3.length}`,
        from: last3[0], to: last3[last3.length-1],
        exactFechas: last3   // used by calcStats if needed
      });
      if(played.length > 3){
        const prev3 = played.slice(-6, -3);
        if(prev3.length) periods.push({
          label: `ANT. ${prev3.length}`,
          from: prev3[0], to: prev3[prev3.length-1],
          exactFechas: prev3
        });
      }
    }
    return periods;
  }
  const p=[{label:'TOTAL',from:1,to:35}];
  for(let s=1;s<=35;s+=bloqueSize)p.push({label:`F${s}–F${Math.min(s+bloqueSize-1,35)}`,from:s,to:Math.min(s+bloqueSize-1,35)});
  return p;
}
function getBlocks(cat){
  if(cat==='RESERVA'||cat==='RESERVA_S2'){
    // Each individual played match = its own bar in the chart
    const played = [];
    for(let f=1; f<=18; f++){ if(results[cat]?.[f]) played.push(f); }
    if(!played.length) return [{label:'F1–F18', from:1, to:18}];
    return played.map(f=>({label:`F${f}`, from:f, to:f}));
  }
  const b=[];
  for(let s=1;s<=35;s+=bloqueSize)b.push({label:`F${s}–F${Math.min(s+bloqueSize-1,35)}`,from:s,to:Math.min(s+bloqueSize-1,35)});
  return b;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Sufijo "N'" de un minuto de gol/tarjeta -- vacío si no hay minuto cargado
// (en vez de imprimir "undefined'" como pasaba antes).
function minSuf(m){ return m!=null ? m+"'" : ''; }
// Redondeo fijo a 2 decimales para métricas de GPS -- enteros quedan
// enteros, solo lo que tiene fracción se recorta a 2 decimales (ej.
// 30.14665 -> "30.15"), a diferencia del criterio viejo (1 decimal fijo).
function fmtGps(v){
  if(v==null) return '—';
  const n = Number(v);
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}

function initFirebase(){
  return new Promise((resolve,reject)=>{
    if(typeof firebase==='undefined'){reject('no sdk');return;}
    try{
      if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
      db=firebase.database();
      fbReady=true;
      firebase.auth().onAuthStateChanged(user=>{
        if(user){
          // Remove login wall if still present (returning user with active session)
          const wall = document.getElementById('login-wall');
          if(wall){ wall.style.transition='opacity .3s'; wall.style.opacity='0'; setTimeout(()=>wall.remove(),300); }
          // Cambio de contraseña obligatorio (una sola vez): si al crear la
          // cuenta a mano en Firebase Console se dejó `mustChangePassword:
          // true` en users/{uid}, se bloquea la app con una pantalla propia
          // hasta que la cambie -- así se le puede dar una clave provisoria
          // (ej. "Tigre123") sin que quede como clave definitiva.
          db.ref('users/'+user.uid+'/mustChangePassword').once('value').then(snap=>{
            if(snap.val()) mostrarCambioPasswordObligatorio(user);
          });
          // Real-time role listener
          db.ref('users/'+user.uid+'/role').on('value', snap=>{
            currentRole = snap.val() || 'viewer';
            isAdmin     = currentRole==='admin';
            canEdit     = canEditCat(currentCategoria); // recalculado por categoria en cada render (ver renderStatsCat)
            catRole     = currentRole; // store for cat filtering
            applyViewMode();
            updateAuthUI();
            // Re-render active module with correct permissions
            refreshActiveModule();
            sincronizarJugadoresDesdeFutdetail();
            sincronizarPlantelDesdeFutdetail();
          });
          // Real-time data sync — listen for remote changes
          db.ref('stats').on('value', snap=>{
            const p=snap.val();
            if(!p) return;
            CATEGORIES.forEach(cat=>{
              const fl=cat==='RESERVA'?RIVALS_RESERVA:RIVALS;
              if(p.results?.[cat]) fl.forEach(r=>{ if(p.results[cat][r.f]) results[cat][r.f]=p.results[cat][r.f]; });
              if(p.links?.[cat])   fl.forEach(r=>{ if(p.links[cat][r.f]) links[cat][r.f]=p.links[cat][r.f]; });
              if(p.goleadores?.[cat]) goleadores[cat]=p.goleadores[cat];
              if(p.matchData?.[cat]) Object.assign(matchData[cat], p.matchData[cat]);
              if(p.partidos?.[cat]) Object.assign(partidos[cat], p.partidos[cat]);
              if(p.gymData?.[cat])   gymData[cat] = p.gymData[cat];
              if(p.jugadores?.[cat]) jugadoresStats[cat] = p.jugadores[cat];
              if(p.plantel?.[cat]) plantelFutdetail[cat] = p.plantel[cat];
              if(cat==='RESERVA'&&p.rivalData?.['RESERVA']) Object.assign(rivalData['RESERVA'], p.rivalData['RESERVA']);
              if(p.jugadoresArchivados) jugadoresArchivados = p.jugadoresArchivados;
            });
            assignPlayerIds();
            // RESERVA_S2 (2do semestre)
            const c2='RESERVA_S2';
            if(p.results?.[c2]) RIVALS_RESERVA_S2.forEach(r=>{ if(p.results[c2][r.f]) results[c2][r.f]=p.results[c2][r.f]; });
            if(p.links?.[c2])   RIVALS_RESERVA_S2.forEach(r=>{ if(p.links[c2][r.f]) links[c2][r.f]=p.links[c2][r.f]; });
            if(p.goleadores?.[c2]) goleadores[c2]=p.goleadores[c2];
            if(p.matchData?.[c2]) Object.assign(matchData[c2], p.matchData[c2]);
            if(p.rivalData?.[c2]) Object.assign(rivalData[c2], p.rivalData[c2]);
            if(p.chequeoSemanal) chequeoSemanal = p.chequeoSemanal;
            if(p.aliasJugadores) aliasJugadores = p.aliasJugadores;
            if(p.aliasJugadoresComet) aliasJugadoresComet = p.aliasJugadoresComet;
            if(p.recordatoriosOmitidos) recordatoriosOmitidos = p.recordatoriosOmitidos;
            if(p.golesMismatchOmitidos) golesMismatchOmitidos = p.golesMismatchOmitidos;
            if(p.gpsMetricCfg) gpsMetricCfg = p.gpsMetricCfg;
            if(p.gpsPosOverride) gpsPosOverride = p.gpsPosOverride;
            refreshActiveModule();
            setTimeout(refreshAlerts, 200);
          });
        } else {
          isAdmin=false; canEdit=false; currentRole='viewer'; catRole='viewer';
          applyViewMode(); updateAuthUI();
        }
      });
      resolve();
    }catch(e){reject(e);}
  });
}

function applyViewMode(){
  document.querySelectorAll('.score-input,.link-input,.gol-input,.gol-fecha-input').forEach(el=>{
    el.disabled=!canEdit;
    el.style.opacity=canEdit?'1':'0.6';
  });
  document.querySelectorAll('.btn-add-gol,.btn-del-gol').forEach(el=>{
    el.style.display=canEdit?'':'none';
  });
  const resetBtn=document.getElementById('btn-reset');
  if(resetBtn) resetBtn.style.display=isAdmin?'':'none';
  const cerrarTempBtn=document.getElementById('btn-cerrar-temporada');
  if(cerrarTempBtn) cerrarTempBtn.style.display=isAdmin?'':'none';

  // Filter categories for category-specific roles.
  // 'cat_4TA' -> su categoria + GENERAL (GENERAL le muestra una version
  // acotada, ver renderStatsGeneral) -- roles de DT, de solo vista.
  // videoanalista_reserva/videoanalista_menores NO restringen la vista (ven
  // todo) -- solo su EDICION queda acotada, ver EDIT_SCOPES y canEditCat,
  // recalculado por categoria en cada render.
  let allowedCats = null, dtCatPropia = null;
  if(currentRole && currentRole.startsWith('cat_')){
    dtCatPropia = currentRole.replace('cat_','').toUpperCase();
    allowedCats = ['GENERAL', dtCatPropia];
  }
  const sel=document.getElementById('stats-cat-select');
  if(sel){
    if(allowedCats){
      [...sel.options].forEach(o=>{ o.hidden = !allowedCats.includes(o.value); });
      const first = dtCatPropia; // arranca en su propia categoria, no en GENERAL
      sel.value=first;
      currentCategoria=first;
      renderStatsCat(first);
    } else {
      // Sin restriccion de categoria (admin/coordinador/director/etc) --
      // deshacer cualquier ocultamiento que haya quedado de un rol anterior
      // (el listener de rol es en vivo, el usuario puede cambiar de cuenta
      // sin recargar la pagina).
      [...sel.options].forEach(o=>{ o.hidden = false; });
    }
  }
}

function updateAuthUI(){
  const logoutBtn =document.getElementById('btn-logout');
  const badge     =document.getElementById('admin-badge');
  const roleTagEl =document.getElementById('role-tag-txt');
  // Cualquier rol logueado (no solo los que editan) muestra SALIR + badge --
  // antes esto miraba canEdit||isAdmin, asi que un coordinador/director/DT
  // (que solo miran, canEdit=false) quedaban con la UI como si no hubiese
  // sesion iniciada.
  if(currentRole && currentRole!=='viewer'){
    if(logoutBtn) logoutBtn.style.display='flex';
    if(badge)     badge.style.display='flex';
    const roleLabels={'admin':'ADMIN',
      'videoanalista_reserva':'VIDEO RESERVA','videoanalista_menores':'VIDEO 7-8-9',
      'director':'DIR. DEPORTIVO','coordinador':'COORDINADOR'};
    let label = roleLabels[currentRole];
    if(!label && currentRole.startsWith('cat_')) label = 'DT · '+currentRole.replace('cat_','');
    if(roleTagEl) roleTagEl.textContent = label || currentRole.toUpperCase();
  } else {
    if(logoutBtn) logoutBtn.style.display='none';
    if(badge)     badge.style.display='none';
  }
}

// ── Save ─────────────────────────────────────────────────────
function saveData(){
  if(!fbReady||!db||!canEdit) return;
  clearTimeout(saveTimeout);
  saveTimeout=setTimeout(()=>{
    // partidos (Fase 4, COMET) va acá igual que rivalData/matchData/gymData:
    // como referencia directa al objeto en memoria, que ya está sincronizado
    // con Firebase por el listener en vivo — si faltara acá, cualquier
    // guardado normal (cargar un resultado, un link, un gol) BORRARÍA todo
    // lo subido de COMET, porque saveData() hace un .set() del nodo entero,
    // no un merge parcial. Mismo motivo para aliasJugadoresComet.
    const payload={results:{},links:{},goleadores:{},rivalData:rivalData,matchData:matchData,gymData:gymData,jugadores:{},plantel:{},chequeoSemanal:chequeoSemanal,aliasJugadores:aliasJugadores,aliasJugadoresComet:aliasJugadoresComet,recordatoriosOmitidos:recordatoriosOmitidos,golesMismatchOmitidos:golesMismatchOmitidos,partidos:partidos,jugadoresArchivados:jugadoresArchivados,gpsMetricCfg:gpsMetricCfg,gpsPosOverride:gpsPosOverride};
    CATEGORIES.forEach(cat=>{
      payload.results[cat]={};
      payload.links[cat]={};
      payload.goleadores[cat]=goleadores[cat]||[];
      payload.jugadores[cat]=jugadoresStats[cat]||[];
      payload.plantel[cat]=plantelFutdetail[cat]||[];
      const fl=cat==='RESERVA'?RIVALS_RESERVA:RIVALS;
      fl.forEach(r=>{
        payload.results[cat][r.f]=results[cat][r.f]||null;
        payload.links[cat][r.f]=links[cat][r.f]||{};
      });
    });
    // RESERVA_S2 (2do semestre) — no forma parte de CATEGORIES, se guarda aparte
    payload.results['RESERVA_S2']={};
    payload.links['RESERVA_S2']={};
    payload.goleadores['RESERVA_S2']=goleadores['RESERVA_S2']||[];
    RIVALS_RESERVA_S2.forEach(r=>{
      payload.results['RESERVA_S2'][r.f]=results['RESERVA_S2'][r.f]||null;
      payload.links['RESERVA_S2'][r.f]=links['RESERVA_S2'][r.f]||{};
    });
    db.ref('stats').set(payload)
      .then(()=>showToast('☁ GUARDADO'))
      .catch(e=>console.warn('save error:',e));
  },800);
}

// ── Load ALL data (stats + plantel + rendimiento) in one go ──
function loadData(){
  return new Promise(resolve=>{
    if(!fbReady||!db){resolve();return;}
    showLoading(true);
    Promise.all([
      db.ref('stats').once('value'),
      db.ref('gps').once('value'),
      db.ref('temporadaActiva').once('value')
    ]).then(([statsSnap, gpsSnap, temporadaSnap])=>{
      if(temporadaSnap.val()) TEMPORADA_ACTIVA = temporadaSnap.val();
      // Load GPS sessions (Object.values funciona con array viejo u objeto nuevo)
      if(gpsSnap.val()&&gpsSnap.val().sessions) gpsSessions = Object.values(gpsSnap.val().sessions);
      // Continue with stats (reuse snap variable)
      const snap = statsSnap;
      return snap;
    }).then(snap=>{
      const p=snap.val();
      if(p){
        CATEGORIES.forEach(cat=>{
          const fl=cat==='RESERVA'?RIVALS_RESERVA:RIVALS;
          if(p.results?.[cat]) fl.forEach(r=>{ if(p.results[cat][r.f]) results[cat][r.f]=p.results[cat][r.f]; });
          if(p.links?.[cat])   fl.forEach(r=>{ if(p.links[cat][r.f]) links[cat][r.f]=p.links[cat][r.f]; });
          if(p.goleadores?.[cat]) goleadores[cat]=p.goleadores[cat];
          // Load matchData (lineup + cambios)
          if(p.matchData?.[cat]) Object.assign(matchData[cat], p.matchData[cat]);
          if(p.partidos?.[cat]) Object.assign(partidos[cat], p.partidos[cat]);
          if(p.gymData?.[cat])   gymData[cat] = p.gymData[cat];
          if(p.jugadores?.[cat]) jugadoresStats[cat] = p.jugadores[cat];
          if(p.plantel?.[cat]) plantelFutdetail[cat] = p.plantel[cat];
          // Load RESERVA fixture
          if(cat==='RESERVA'&&p.rivalData?.['RESERVA']){
            Object.assign(rivalData['RESERVA'], p.rivalData['RESERVA']);
          }
        });
        if(p.jugadoresArchivados) jugadoresArchivados = p.jugadoresArchivados;
        assignPlayerIds();
        // Load RESERVA_S2 (2do semestre) — clave separada, no forma parte de CATEGORIES
        const c2='RESERVA_S2';
        if(p.results?.[c2]) RIVALS_RESERVA_S2.forEach(r=>{ if(p.results[c2][r.f]) results[c2][r.f]=p.results[c2][r.f]; });
        if(p.links?.[c2])   RIVALS_RESERVA_S2.forEach(r=>{ if(p.links[c2][r.f]) links[c2][r.f]=p.links[c2][r.f]; });
        if(p.goleadores?.[c2]) goleadores[c2]=p.goleadores[c2];
        if(p.matchData?.[c2]) Object.assign(matchData[c2], p.matchData[c2]);
        if(p.rivalData?.[c2]) Object.assign(rivalData[c2], p.rivalData[c2]);
        if(p.chequeoSemanal) chequeoSemanal = p.chequeoSemanal;
        if(p.aliasJugadores) aliasJugadores = p.aliasJugadores;
        if(p.aliasJugadoresComet) aliasJugadoresComet = p.aliasJugadoresComet;
        if(p.recordatoriosOmitidos) recordatoriosOmitidos = p.recordatoriosOmitidos;
        if(p.golesMismatchOmitidos) golesMismatchOmitidos = p.golesMismatchOmitidos;
        if(p.gpsMetricCfg) gpsMetricCfg = p.gpsMetricCfg;
        if(p.gpsPosOverride) gpsPosOverride = p.gpsPosOverride;
      }
      showLoading(false); resolve();
    }).catch(e=>{console.warn('load error:',e);showLoading(false);resolve();});
  });
}

// ── Cerrar temporada (Fase 3+5 del rediseño de datos) ─────────────────
// TEMPORADA_ACTIVA es solo una etiqueta — no cambia cómo se leen/escriben
// results/links/goleadores/matchData en el día a día (siguen en su forma
// plana de siempre). Sirve únicamente acá: al cerrar una temporada, todo
// lo de la temporada activa se archiva completo bajo
// temporadas_cerradas/{TEMPORADA_ACTIVA} en Firebase (accesible después
// desde la consola si hace falta, nunca se borra) y los nodos en vivo
// quedan en cero para arrancar la temporada nueva. El plantel (identidad
// de jugadores) NO se toca.
let TEMPORADA_ACTIVA = '2026';

function cerrarTemporada(){
  if(!isAdmin) return;
  const sugerido = String((parseInt(TEMPORADA_ACTIVA)||new Date().getFullYear())+1);
  const nuevoPeriodo = (prompt('¿Qué temporada arranca ahora?', sugerido)||'').trim();
  if(!nuevoPeriodo) return;
  confirmAction(
    `⚠️ Esto archiva TODOS los resultados, links, goleadores y estadísticas de la temporada ${TEMPORADA_ACTIVA} (queda guardado en Firebase, no se borra) y deja todo en cero para arrancar ${nuevoPeriodo}. El plantel no se toca. ¿Confirmás?`,
    ()=>{
      showToast('☁ ARCHIVANDO TEMPORADA…');
      db.ref('stats').once('value').then(snap=>{
        const p = snap.val() || {};
        const archivo = {
          results: p.results||{}, links: p.links||{}, goleadores: p.goleadores||{},
          matchData: p.matchData||{}, jugadores: p.jugadores||{}, rivalData: p.rivalData||{},
          cerradaEl: new Date().toISOString()
        };
        return db.ref('temporadas_cerradas/'+TEMPORADA_ACTIVA).set(archivo);
      }).then(()=>{
        const payload = { results:{}, links:{}, goleadores:{}, jugadores:{}, matchData:{}, rivalData:{RESERVA:{},RESERVA_S2:{}} };
        CATEGORIES.forEach(cat=>{
          payload.results[cat]={}; payload.links[cat]={}; payload.goleadores[cat]=[]; payload.jugadores[cat]=[]; payload.matchData[cat]={};
          const fl = cat==='RESERVA' ? RIVALS_RESERVA : RIVALS;
          fl.forEach(r=>{
            payload.results[cat][r.f]=null;
            payload.links[cat][r.f]={};
            LINK_TYPES.forEach(lt=>{ payload.links[cat][r.f][lt.key]=''; });
          });
          if(cat==='RESERVA'){
            payload.results['RESERVA_S2']={}; payload.links['RESERVA_S2']={};
            payload.goleadores['RESERVA_S2']=[]; payload.matchData['RESERVA_S2']={};
            RIVALS_RESERVA_S2.forEach(r=>{
              payload.results['RESERVA_S2'][r.f]=null;
              payload.links['RESERVA_S2'][r.f]={};
              LINK_TYPES.forEach(lt=>{ payload.links['RESERVA_S2'][r.f][lt.key]=''; });
            });
          }
        });
        return db.ref('stats').update(payload);
      }).then(()=>db.ref('temporadaActiva').set(nuevoPeriodo))
      .then(()=>{
        showToast('✓ TEMPORADA CERRADA — arrancando '+nuevoPeriodo);
        setTimeout(()=>location.reload(), 1200);
      }).catch(e=>{
        console.error('cerrarTemporada error:', e);
        showToast('⚠ ERROR AL CERRAR TEMPORADA — revisá la consola');
      });
    },
    '📦 CERRAR TEMPORADA'
  );
}

// ── Auth actions ─────────────────────────────────────────────
// Roles de DT por categoria: login/alta "sin email" -- el DT solo elige su
// categoria y una contraseña. El email que pide Firebase Auth por dentro se
// arma solo (dtEmailFor), nunca lo ve ni lo escribe nadie. La exclusividad
// (un solo DT por categoria) la garantiza Firebase Auth mismo -- el email
// es unico por definicion, asi que un segundo alta con el mismo rol falla
// solo con "email-already-in-use". roles_taken es nada mas para que el
// desplegable de alta ya no muestre una categoria ocupada, no es la unica
// traba real.
const DT_ROLES = [
  {role:'cat_4TA',     label:'DT · 4TA'},
  {role:'cat_5TA',     label:'DT · 5TA'},
  {role:'cat_6TA',     label:'DT · 6TA'},
  {role:'cat_7MA',     label:'DT · 7MA'},
  {role:'cat_8VA',     label:'DT · 8VA'},
  {role:'cat_9NA',     label:'DT · 9NA'},
  {role:'cat_RESERVA', label:'DT · Reserva'},
];
function dtEmailFor(role){
  return 'dt.' + role.replace('cat_','').toLowerCase() + '@tigrejuveniles.internal';
}
let dtMode = 'login';
// El panel de DT (rol + nombre + contraseña, sin email) vive dentro del
// muro de login (buildLoginWall, más abajo) -- es el único punto de acceso
// ahora que no hay nada visible sin loguearse. toggleDtPanel/dtSetMode
// trabajan sobre los ids del muro (login-normal/dt-panel/etc), reusados
// tal cual estaban en el modal viejo.
function toggleDtPanel(){
  const normal=document.getElementById('login-normal');

  normal.style.display = showingDt ? 'none' : '';
  panel.style.display  = showingDt ? '' : 'none';
  link.textContent = showingDt ? '¿No sos DT? Volver' : '¿Sos DT de una categoría? Entrá acá';
  if(showingDt) dtSetMode('login');
}
function dtSetMode(mode){
  dtMode = mode;
  const errEl=document.getElementById('dt-err'); errEl.style.display='none'; errEl.textContent='';
  document.getElementById('dt-nombre').style.display = mode==='signup' ? '' : 'none';
  document.getElementById('dt-submit-btn').textContent = mode==='signup' ? 'CREAR CUENTA' : 'INGRESAR';
  ['login','signup'].forEach(m=>{
    const btn=document.getElementById('dt-tab-'+m); const on=m===mode;
    btn.style.borderColor = on?'var(--gold)':'var(--border2)';
    btn.style.color       = on?'var(--gold)':'var(--muted)';
    btn.style.background  = on?'linear-gradient(135deg,#3a2a08,#1a1206)':'rgba(5,8,15,0.5)';
  });

function populateDtRoleSelect(filtrarOcupados){
  const sel=document.getElementById('dt-role');
  const build=(ocupados)=>{
    const opts = DT_ROLES.filter(r=>!filtrarOcupados || !ocupados.includes(r.role));
    sel.innerHTML = opts.length
      ? opts.map(r=>`<option value="${r.role}">${r.label}</option>`).join('')
      : `<option value="">Ya están todos los roles creados</option>`;
  };
  if(filtrarOcupados && fbReady && db){
    db.ref('roles_taken').once('value').then(snap=>build(snap.val()?Object.keys(snap.val()):[])).catch(()=>build([]));
  } else {
    build([]);
  }
}
function doDtSubmit(){
  const role=document.getElementById('dt-role').value;
  const pass=document.getElementById('dt-pass').value;
  const errEl=document.getElementById('dt-err');
  errEl.style.display='none';
  if(!role){ errEl.textContent='Elegí un rol.'; errEl.style.display='block'; return; }
  if(!pass){ errEl.textContent='Ingresá la contraseña.'; errEl.style.display='block'; return; }
  const email=dtEmailFor(role);
  if(dtMode==='signup'){
    const nombre=document.getElementById('dt-nombre').value.trim();
    if(!nombre){ errEl.textContent='Ingresá tu nombre.'; errEl.style.display='block'; return; }
    firebase.auth().createUserWithEmailAndPassword(email, pass)
      .then(cred=>{
        const uid=cred.user.uid;
        const updates={};
        updates['users/'+uid+'/role']=role;
        updates['users/'+uid+'/nombre']=nombre;
        updates['roles_taken/'+role]=uid;
        return db.ref().update(updates);
      })
      .then(()=>{ cerrarLoginWall(); })
      .catch(e=>{
        errEl.textContent = e.code==='auth/email-already-in-use' ? 'Ese rol ya tiene una cuenta creada.'
          : e.code==='auth/weak-password' ? 'La contraseña necesita al menos 6 caracteres.' : e.message;
        errEl.style.display='block';
      });
  } else {
    firebase.auth().signInWithEmailAndPassword(email, pass)
      .then(()=>{ cerrarLoginWall(); })
      .catch(()=>{ errEl.textContent='Rol o contraseña incorrectos.'; errEl.style.display='block'; });
  }
}
function cerrarLoginWall(){
  const wall=document.getElementById('login-wall');
  if(wall){ wall.style.opacity='0'; setTimeout(()=>wall.remove(),300); }
}
function doLogout(){
  firebase.auth().signOut().then(()=>{
    // Reset state y volver a tapar todo con el muro -- sin sesion no se ve nada
    isAdmin=false; canEdit=false; currentRole='viewer'; catRole='viewer';
    updateAuthUI();
    applyViewMode();
    refreshActiveModule();
    if(!document.getElementById('login-wall')) buildLoginWall();
  });
}

// Buscador global de jugador — busca en el plantel (futdetail) de todas las
// categorías a la vez, así se puede llegar a la ficha de cualquiera sin
// tener que primero elegir su categoría a mano.
function wireBuscadorGlobalJugador(){
  const input=document.getElementById('buscador-global-jugador');
  const resWrap=document.getElementById('buscador-global-resultados');
  if(!input || !resWrap) return;
  input.addEventListener('input',()=>{
    const q=input.value.trim().toLowerCase();
    if(q.length<2){ resWrap.style.display='none'; resWrap.innerHTML=''; return; }
    const matches=[];
    CATEGORIES.forEach(cat=>{
      (plantelFutdetail[cat]||[]).forEach(p=>{
        if((p.nombre||'').toLowerCase().includes(q)) matches.push({cat, nombre:p.nombre, posicion:p.posicion});
      });
    });
    if(!matches.length){
      resWrap.innerHTML=`<div style="padding:10px 12px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px">Sin resultados</div>`;
      resWrap.style.display='';
      return;
    }
    resWrap.innerHTML=matches.slice(0,8).map(m=>`<div class="buscador-global-item" data-cat="${m.cat}" data-nombre="${esc(m.nombre)}"
      style="padding:8px 12px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text);
      border-bottom:1px solid var(--border2)">${esc(m.nombre)} <span style="color:var(--muted);font-size:11px">· ${m.cat}${m.posicion?' · '+esc(m.posicion):''}</span></div>`).join('');
    resWrap.style.display='';
    resWrap.querySelectorAll('.buscador-global-item').forEach(item=>{
      item.addEventListener('click',()=>{
        irAJugadorGlobal(item.dataset.cat, item.dataset.nombre);
        input.value=''; resWrap.style.display='none'; resWrap.innerHTML='';
      });
    });
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('#buscador-global-jugador') && !e.target.closest('#buscador-global-resultados')){
      resWrap.style.display='none';
    }
  });
}

// ── SECCIONES DESPLEGABLES (dentro de la vista de categoría) ──────
// Título clickeable con flechita; el contenido de abajo se muestra/oculta.
// Si el título tiene controles propios (ej. el slider de bloque), un click
// ahí no tiene que colapsar la sección — por eso toggleSeccion ignora los
// clicks que vienen de un control interactivo.
// Estado de colapsado por sección, compartido entre categorías (clave =
// idSeccion, que ya incluye la categoría, ej. "resultados-4TA") — colapsada
// por defecto (true) salvo que el usuario la haya abierto a mano, y eso se
// mantiene aunque la sección se vuelva a renderizar (slider de bloque,
// cambio de semestre, etc.), no se resetea con cada render.
let seccionColapsada = {};
function estaColapsada(idSeccion){ return seccionColapsada[idSeccion]!==false; }
// Atributo listo para pegar en el <div id="sec-...">: si está colapsada
// arranca oculta, si no, visible.
function seccionEstiloInicial(idSeccion){ return estaColapsada(idSeccion) ? ' style="display:none"' : ''; }

function seccionTitulo(idSeccion, tituloHTML, extraHTML=''){
  const colapsada=estaColapsada(idSeccion);
  return `<div class="st" style="cursor:pointer;justify-content:space-between" onclick="toggleSeccion('${idSeccion}',event)">
    <span style="display:flex;align-items:center;gap:10px"><div class="stbar"></div>${tituloHTML}</span>
    <span style="display:flex;align-items:center;gap:10px">
      ${extraHTML}
      <span id="chev-${idSeccion}" style="font-size:11px;color:var(--muted);display:inline-block;transition:transform .2s${colapsada?';transform:rotate(-90deg)':''}">▼</span>
    </span>
  </div>`;
}
function toggleSeccion(idSeccion, event){
  if(event && event.target.closest('input,select,button,a,textarea')) return;
  const cont=document.getElementById('sec-'+idSeccion);
  const chev=document.getElementById('chev-'+idSeccion);
  if(!cont) return;
  const seOculta=cont.style.display!=='none';
  cont.style.display=seOculta?'none':'';
  if(chev) chev.style.transform=seOculta?'rotate(-90deg)':'none';
  seccionColapsada[idSeccion]=seOculta;
  // Los gráficos Chart.js de "Informe de partido" (RENDIMIENTO GPS) quedan
  // mal medidos si se dibujan con la sección todavía colapsada (canvas a
  // alto 0) -- al recién abrirla, si ese es el modo activo, se redibujan ya
  // con el alto real.
  if(idSeccion==='gps-cruce' && seOculta===false && typeof gpsMode!=='undefined' && gpsMode==='informe' && typeof renderGpsInforme==='function'){
    renderGpsInforme();
  }
}

// Suma la tabla de posiciones LPF de 4TA a 9NA por equipo, en una sola tabla combinada.
function getTablaGeneralCombinada(){
  return loadTablaData().then(()=>{
    const sumas={};
    GENERAL_CATS.forEach(cat=>{
      const filas=(TABLA_DATA&&TABLA_DATA.categorias&&TABLA_DATA.categorias[cat])||[];
      filas.forEach(f=>{
        if(!sumas[f.equipo]) sumas[f.equipo]={equipo:f.equipo,pts:0,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0};
        const s=sumas[f.equipo];
        s.pts+=f.pts; s.pj+=f.pj; s.pg+=f.pg; s.pe+=f.pe; s.pp+=f.pp; s.gf+=f.gf; s.gc+=f.gc;
      });
    });
    const combinadas=Object.values(sumas).map(s=>({...s, dif:s.gf-s.gc}));
    combinadas.sort((a,b)=> b.pts-a.pts || b.dif-a.dif || b.gf-a.gf);
    combinadas.forEach((f,i)=>f.pos=i+1);
    return combinadas;
  });
}

// Tarjeta chica con la posición combinada de Tigre (para RESUMEN GENERAL)
// ============================================================
//  CONFIABILIDAD (Fase 3): cruza mi planilla vs LPF oficial y
//  vs futdetail, solo en lo que existe en las dos fuentes.
//  Catapult (físico) no entra acá, no tiene resultados que cruzar.
// ============================================================
// 7MA, 8VA y 9NA quedan afuera de la confiabilidad a pedido de Javi
// (ver CATEGORIAS_CONFIG, campo enConfiabilidad).

// futdetail linkea en formato corto (youtu.be/ID) y la carga manual suele
// ser el formato largo (youtube.com/watch?v=ID) — mismo video, texto
// distinto. Se extrae el ID para comparar contra eso, no contra el link
// completo.
function youtubeId(url){
  const m = (url||'').match(/(?:youtu\.be\/|[?&]v=|\/embed\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function calcConfiabilidad(){
  // Partido por partido: mi carga (results) vs la "verdad" según prioridad
  // COMET > LIGA oficial (fixture scrapeado de ligaprofesional.ar) >
  // futdetail (panel privado del club) — el primero que tenga dato para esa
  // fecha gana. statfutbol se muestra aparte, solo como referencia externa
  // (no participa de la prioridad, no dispara el aviso por sí solo).
  const partidoMismatches=[]; // {cat, fecha, mio, verdad, fuenteVerdad, sf, rival}
  CONFIABILIDAD_CATS.forEach(cat=>{
    const fixtureLiga=(TABLA_DATA&&TABLA_DATA.fixture&&TABLA_DATA.fixture[cat])||{};
    const fixtureFut=(TABLA_DATA&&TABLA_DATA.fixture_futdetail&&TABLA_DATA.fixture_futdetail[cat])||{};
    const sfResultados=(TABLA_DATA&&TABLA_DATA.statfutbol_resultados&&TABLA_DATA.statfutbol_resultados[cat])||{};
    const fechas=new Set([...Object.keys(fixtureLiga), ...Object.keys(fixtureFut), ...Object.keys(sfResultados)]);
    fechas.forEach(fechaStr=>{
      const fecha=parseInt(fechaStr);
      const comet=partidos[cat]?.[fecha]||null;
      const liga=fixtureLiga[fechaStr]||null;
      const fut=fixtureFut[fechaStr]||null;
      const sf=sfResultados[fechaStr]||null;
      const mio=results[cat]?.[fecha]||null;
      const mioStr=mio?`${mio[0]}-${mio[1]}`:null;
      // comet puede existir con el resto del informe cargado (goles, amarillas...)
      // pero sin resultado final (golesTigre/golesRival vacíos) -- sin este chequeo
      // se mostraba "COMET: undefined-undefined" en vez de caer a LIGA/futdetail.
      const cometStr=(comet && comet.golesTigre!=null && comet.golesRival!=null)?`${comet.golesTigre}-${comet.golesRival}`:null;
      const ligaStr=liga?`${liga.gf}-${liga.gc}`:null;
      const futStr=fut?`${fut.gf}-${fut.gc}`:null;
      const sfStr=sf?`${sf.gf}-${sf.gc}`:null;
      const [verdad, fuenteVerdad]=cometStr?[cometStr,'COMET']:ligaStr?[ligaStr,'LIGA']:futStr?[futStr,'futdetail']:[null,null];
      if(mioStr && verdad && mioStr!==verdad){
        partidoMismatches.push({cat, fecha, mio:mioStr, verdad, fuenteVerdad, sf:sfStr||'—', rival:(comet||liga||fut||sf||{}).rival||''});
      }
    });
  });

  // Equipo: mi planilla vs LPF oficial (prioridad 2, después de COMET —
  // pero COMET es partido a partido, no da un acumulado de temporada, así
  // que acá no participa). Se sacó "parenlapelota" (fuente vieja, ver nota
  // en el LEEME del scraper) y se sumó statfutbol, calculado sumando
  // resultado por resultado desde statfutbol_resultados — es la fuente de
  // menor prioridad de las 4, solo referencia.
  const equipoMismatches=[]; // {cat, campo, mio, valor, fuente}
  CONFIABILIDAD_CATS.forEach(cat=>{
    const mio=calcStats(cat,1,35);
    const filas=(TABLA_DATA&&TABLA_DATA.categorias&&TABLA_DATA.categorias[cat])||[];
    const lpf=filas.find(f=>/tigre/i.test(f.equipo));
    const sfResultados=(TABLA_DATA&&TABLA_DATA.statfutbol_resultados&&TABLA_DATA.statfutbol_resultados[cat])||{};
    const sfPartidos=Object.values(sfResultados);
    const sf=sfPartidos.length ? {
      pj: sfPartidos.length,
      pg: sfPartidos.filter(p=>p.gf>p.gc).length,
      gf: sfPartidos.reduce((a,p)=>a+p.gf,0),
    } : null;
    [['LPF oficial',lpf],['statfutbol',sf]].forEach(([fuente,fila])=>{
      if(!fila) return; // todavía sin datos de esa fuente para esta categoría
      if(mio.pj!==fila.pj) equipoMismatches.push({cat, campo:'PJ', mio:mio.pj, valor:fila.pj, fuente});
      if(mio.pg!==fila.pg) equipoMismatches.push({cat, campo:'PG', mio:mio.pg, valor:fila.pg, fuente});
      if(mio.gf!==fila.gf) equipoMismatches.push({cat, campo:'GF', mio:mio.gf, valor:fila.gf, fuente});
    });
  });

  const golesMismatches=[]; // {cat, jugador, mio, fut, key, soloEn}
  CONFIABILIDAD_CATS.forEach(cat=>{
    const misGoles={}, nombreOriginal={};
    // goleadores guarda "Apellido, Nombre" y futdetail "Apellido Nombre" (sin
    // coma), y no siempre coinciden en tildes — hay que normalizar sacando
    // coma y acentos para que crucen bien.
    const normComparable=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/,/g,' ').replace(/\s+/g,' ').trim();
    // Si el nombre matchea a alguien del plantel (por subconjunto de
    // palabras, mismo criterio que cometResolvePlayer), la clave es su id
    // -- así "Cortes Adrian maximiliano" y "CORTES, MAXIMILIANO" se suman
    // como un solo jugador en vez de aparecer como dos filas separadas.
    // Si no matchea a nadie, cae al string normalizado de siempre.
    const keyDe=nombre=>{
      const p=matchPlantel(cat, nombre);
      return p ? 'id:'+p.id : normComparable(nombre);
    };
    // Usa golesEfectivos (carga manual + COMET, COMET gana por fecha) en vez
    // de la carga manual sola — así compara lo que de verdad se ve en
    // pantalla contra futdetail, no un número viejo que COMET ya reemplazó.
    // Sin excluir fechas acá (a diferencia de golesCometMismatches): esto
    // suma el TOTAL de temporada, la Fecha 3 (Hacoaj) ya viene bien resuelta
    // en golesEfectivos y excluirla solo restaba goles reales (caso real:
    // González Santino, 2026-09-01 -- su gol de F3 desaparecía de "mi carga"
    // acá y la alerta contra futdetail nunca podía cerrar).
    golesEfectivos(cat).forEach(g=>{
      const key=keyDe(g.name);
      misGoles[key]=(misGoles[key]||0)+g.goals;
      nombreOriginal[key]=nombreOriginal[key]||g.name;
    });
    // Tabla de equivalencias: si un nombre de futdetail está vinculado a un
    // nombre de "mi carga", se suma bajo esa misma clave en vez de aparecer
    // como una persona aparte.
    const alias=aliasJugadores[cat]||{};
    const futGoles={};
    (jugadoresStats[cat]||[]).forEach(j=>{
      const keyOriginal=normComparable(j.jugador);
      const key=alias[keyOriginal]||keyDe(j.jugador);
      futGoles[key]=(futGoles[key]||0)+(parseInt(j.goles)||0);
      nombreOriginal[key]=nombreOriginal[key]||j.jugador;
    });
    // statfutbol como referencia externa (no participa de la prioridad,
    // solo se muestra al lado) — match por subconjunto de palabras porque
    // statfutbol trae "APELLIDO, Nombre" con acentos/orden propio.
    const sfJugadores=(TABLA_DATA&&TABLA_DATA.statfutbol_jugadores&&TABLA_DATA.statfutbol_jugadores[cat])||[];
    const sfGolesDe=nombre=>{
      const w=cometNameWords(nombre);
      const cand=sfJugadores.filter(j=>{
        const jw=cometNameWords(j.nombre);
        return jw.length>0 && w.length>0 && (jw.every(x=>w.includes(x)) || w.every(x=>jw.includes(x)));
      });
      return cand.length===1 ? cand[0].gol : null;
    };
    new Set([...Object.keys(misGoles), ...Object.keys(futGoles)]).forEach(key=>{
      const mio=misGoles[key]||0, fut=futGoles[key]||0;
      if(mio!==fut){
        const soloEn = !(key in misGoles) ? 'futdetail' : !(key in futGoles) ? 'mia' : 'ambas';
        const sf=sfGolesDe(nombreOriginal[key]);
        golesMismatches.push({cat, jugador:nombreOriginal[key], mio, fut, sf, key, soloEn});
      }
    });
  });

  // Caso conocido y permanente: futdetail tiene mal contado el gol de
  // Gonzalez Santino (4TA) de la Fecha 3 (el partido cortado en dos
  // canchas, Hacoaj) y no hay forma de arreglarlo desde acá -- el número
  // real y correcto es 7, coincide con COMET, statfutbol y la ficha del
  // jugador. Sin este filtro la alerta nunca podía cerrar porque compara
  // contra un dato de futdetail que va a seguir mal. Confirmado 2026-09-01.
  const esGolesMismatchConocido = m => m.cat==='4TA' && /gonzalez santino/i.test(m.jugador||'');
  for(let i=golesMismatches.length-1; i>=0; i--){
    const m=golesMismatches[i];
    if(esGolesMismatchConocido(m) || golesMismatchOmitidos[m.cat]?.[m.key]) golesMismatches.splice(i,1);
  }

  // Links: mi carga (links) vs futdetail, para los 4 tipos que cruzan
  // (Partido, Resumen Goles, Análisis Propio, Próximo Rival ← Análisis
  // Rival de futdetail). Si los dos tienen algo cargado pero distinto, es
  // una diferencia real. Si a un partido ya jugado (con otra fecha posterior
  // también jugada, o sea que ya pasó al menos una semana) no le cargaste
  // NINGÚN link de ese tipo en ningún lado, es un recordatorio — se puede
  // omitir para siempre porque a veces es a propósito.
  const linkMismatches=[]; // {cat, fecha, key, label, mio, fut}
  const recordatorios=[]; // {cat, fecha, key, label, dismissKey}
  CONFIABILIDAD_CATS.forEach(cat=>{
    const fixtureLiga=(TABLA_DATA&&TABLA_DATA.fixture&&TABLA_DATA.fixture[cat])||{};
    const fixtureFut=(TABLA_DATA&&TABLA_DATA.fixture_futdetail&&TABLA_DATA.fixture_futdetail[cat])||{};
    const fechasJugadas=new Set([
      ...Object.keys(results[cat]||{}).filter(f=>results[cat][f]).map(Number),
      ...Object.keys(fixtureLiga).map(Number),
      ...Object.keys(fixtureFut).map(Number),
    ]);
    fechasJugadas.forEach(fecha=>{
      const hayFechaPosteriorJugada=[...fechasJugadas].some(f=>f>fecha);
      Object.entries(LINK_KEYS_DESDE_FUTDETAIL).forEach(([key,campo])=>{
        const label=LINK_TYPES.find(lt=>lt.key===key)?.label||key;
        const mio=(links[cat]?.[fecha]?.[key]||'').trim();
        const fut=((fixtureFut[fecha]||{})[campo]||'').trim();
        const idMio=youtubeId(mio), idFut=youtubeId(fut);
        const distinto = (idMio && idFut) ? idMio!==idFut : mio!==fut;
        if(mio && fut && distinto){
          linkMismatches.push({cat, fecha, key, label, mio, fut});
        }else if(!mio && !fut && hayFechaPosteriorJugada){
          const dismissKey=`${cat}_${fecha}_${key}`;
          if(!recordatoriosOmitidos[dismissKey]) recordatorios.push({cat, fecha, key, label, dismissKey});
        }
      });
      // Partido ya jugado sin informe de COMET cargado (mismo criterio de
      // "ya pasó al menos una fecha más" que los links de arriba, para no
      // avisar apenas se termina de jugar).
      if(hayFechaPosteriorJugada && !partidos[cat]?.[fecha]){
        const dismissKey=`${cat}_${fecha}_comet`;
        if(!recordatoriosOmitidos[dismissKey]) recordatorios.push({cat, fecha, key:'comet', label:'Informe de COMET', dismissKey});
      }
      // Partido ya jugado sin planilla de citación cargada -- mismo
      // criterio que ya usa la columna "CITACIONES" de RESULTADOS
      // (matchData[cat][fecha].titulares) para decidir si hay algo cargado.
      if(hayFechaPosteriorJugada && !(matchData[cat]?.[fecha]?.titulares?.length)){
        const dismissKey=`${cat}_${fecha}_cit`;
        if(!recordatoriosOmitidos[dismissKey]) recordatorios.push({cat, fecha, key:'cit', label:'Planilla de citación', dismissKey});
      }
    });
  });

  // Goles: carga manual vs COMET (Fase 4) — solo tiene sentido para una
  // fecha que YA tiene informe de COMET cargado (si no hay PDF, la carga
  // manual es la única fuente, no hay con qué comparar) y donde además se
  // cargó algo a mano para esa misma fecha (si nadie tipeó nada, no es un
  // desacuerdo, es simplemente que ya no hace falta cargarlo a mano).
  // Comparación por total de la fecha, no jugador por jugador — alcanza
  // para el aviso, y evita otro sistema de "vincular" nombre por nombre.
  const golesCometMismatches=[]; // {cat, fecha, manual, comet}
  CONFIABILIDAD_CATS.forEach(cat=>{
    const excluidas=fechasExcluidasGoles(cat);
    Object.keys(partidos[cat]||{}).map(Number).forEach(fecha=>{
      if(excluidas.has(fecha)) return;
      const partido=partidos[cat][fecha];
      const manualDeFecha=(goleadores[cat]||[]).filter(g=>g.fecha===fecha);
      if(!partido || !manualDeFecha.length) return;
      const manual=manualDeFecha.reduce((a,g)=>a+g.goals,0);
      const comet=(partido.goles||[]).length;
      if(manual!==comet) golesCometMismatches.push({cat, fecha, manual, comet});
    });
  });

  // Nombres de citación que no coincidieron con nadie del plantel al leer el
  // PDF (p.warn, ver parseCitacionPdf) — hoy solo se ven abriendo el modal de
  // cada fecha una por una; acá se juntan todos para poder revisarlos de un
  // saque.
  const citacionWarnings=[]; // {cat, fecha, nombre}
  CONFIABILIDAD_CATS.forEach(cat=>{
    Object.entries(matchData[cat]||{}).forEach(([fechaStr,d])=>{
      const fecha=parseInt(fechaStr,10);
      [...(d.titulares||[]), ...(d.suplentes||[])].filter(p=>p.warn).forEach(p=>{
        citacionWarnings.push({cat, fecha, nombre:p.nombre});
      });
      if(d.segundoTiempo){
        [...(d.segundoTiempo.titulares||[]), ...(d.segundoTiempo.suplentes||[])].filter(p=>p.warn).forEach(p=>{
          citacionWarnings.push({cat, fecha, nombre:p.nombre});
        });
      }
    });
  });

  return {partidoMismatches, equipoMismatches, golesMismatches, golesCometMismatches, linkMismatches, recordatorios, citacionWarnings};
}

// Botón "REVISAR" único para toda la sección: fuerza traer la tabla LPF de

// Tabla de equivalencias de jugadores: vincula un nombre "huérfano" (que
// solo aparece en una fuente) con el que elegiste del lado opuesto, para
// que de ahora en más se sumen como la misma persona.
function vincularJugador(cat, keyEstaFila, soloEnEstaFila, keyElegida){
  if(!canEdit || !keyElegida) return;
  const keyFut = soloEnEstaFila==='futdetail' ? keyEstaFila : keyElegida;
  const keyMia = soloEnEstaFila==='mia' ? keyEstaFila : keyElegida;
  aliasJugadores[cat]=aliasJugadores[cat]||{};
  aliasJugadores[cat][keyFut]=keyMia;
  guardarAliasJugadores();
  showToast('🔗 VINCULADO');
  renderConfiabilidad('gen-confiabilidad');
}
function guardarAliasJugadores(){
  if(!fbReady||!db||!canEdit) return;
  db.ref('stats/aliasJugadores').set(aliasJugadores)
    .catch(e=>console.warn('guardarAliasJugadores error:',e));
}
function guardarAliasJugadoresComet(){
  if(!fbReady||!db||!canEdit) return;
  db.ref('stats/aliasJugadoresComet').set(aliasJugadoresComet)
    .catch(e=>console.warn('guardarAliasJugadoresComet error:',e));
}

// Descarta para siempre un recordatorio de "link sin cargar" puntual
// (a veces es a propósito no cargar todos).
function omitirRecordatorio(dismissKey){
  if(!canEdit) return;
  recordatoriosOmitidos[dismissKey]=true;
  if(fbReady && db) db.ref('stats/recordatoriosOmitidos').set(recordatoriosOmitidos)
    .catch(e=>console.warn('omitirRecordatorio error:',e));
  showToast('👍 OMITIDO');
  renderConfiabilidad('gen-confiabilidad');
}

// Igual que omitirRecordatorio, pero para una diferencia de "GOLES POR
// JUGADOR" que ya se revisó a mano y no es un error nuestro (ej. futdetail
// suma un gol de un amistoso que acá no se cuenta) -- queda guardado para
// siempre en Firebase, por categoría + jugador, sin tocar el número real.
function omitirGolesMismatch(cat, key){
  if(!canEdit) return;
  golesMismatchOmitidos[cat]=golesMismatchOmitidos[cat]||{};
  golesMismatchOmitidos[cat][key]=true;
  if(fbReady && db) db.ref('stats/golesMismatchOmitidos').set(golesMismatchOmitidos)
    .catch(e=>console.warn('omitirGolesMismatch error:',e));
  showToast('👍 OMITIDO');
  renderConfiabilidad('gen-confiabilidad');
}

  loadTablaData().then(()=>{

    const total=partidoMismatches.length+equipoMismatches.length+golesMismatches.length+golesCometMismatches.length+linkMismatches.length+citacionWarnings.length;

    const revisarBtn=`<button onclick="revisarConfiabilidad()"
      style="background:rgba(255,255,255,0.08);border:1px solid var(--border2);color:var(--text);
      border-radius:6px;padding:4px 10px;font-family:Barlow Condensed,sans-serif;font-size:11px;
      letter-spacing:1px;cursor:pointer;white-space:nowrap">🔄 REVISAR</button>`;

    if(total===0 && recordatorios.length===0){
      el.innerHTML=`<div style="text-align:center;padding:20px;color:var(--win);

        ✓ Todo coincide entre tu planilla, COMET, LIGA oficial y futdetail

    }

    const irGoleadoresBtn=cat=>`<button onclick="irAGoleadores('${cat}')"
      style="background:rgba(26,58,143,0.25);border:1px solid var(--border2);color:var(--gold2);

      letter-spacing:1px;cursor:pointer;white-space:nowrap">→ VER EN GOLEADORES</button>`;
    // Para "carga manual vs COMET": COMET ya gana en pantalla, así que la
    // carga manual de esa fecha puntual quedó redundante — borrarla SOLO esa
    // fecha (no todo el jugador, no otras fechas) hace desaparecer el aviso
    // sin perder nada real (los goles siguen estando, vía COMET).
    const borrarManualFechaBtn=(cat,fecha)=>canEdit?`<button onclick="borrarCargaManualFecha('${cat}',${fecha})"
      style="background:rgba(192,21,42,0.15);border:1px solid var(--border2);color:#f87171;
      border-radius:6px;padding:4px 10px;font-family:Barlow Condensed,sans-serif;font-size:11px;

// Tabla comparativa: una fila por bloque de fechas (según bloqueSize), con el
// acumulado de todas las categorías (4TA a 9NA), más una fila de total temporada.
// calcFn(from,to) da las stats de ese rango — calcStatsAll para GENERAL, o
// calcStats(dataCat,from,to) para una categoría puntual. periodsCat define de
// qué categoría se sacan los bloques (da igual el valor salvo para RESERVA).
// Calcula las filas de "rendimiento por bloque de fechas" (dato puro, sin
// HTML) — la usan tanto la tabla en pantalla (bloqueComparativaHTML) como
// la del PDF exportado (pdfSectionBloque), así una corrección al cálculo
// de períodos, al filtro de "todavía no jugó", o a cuál bloque marcar como
// el más reciente, llega a los dos lugares a la vez en vez de a uno solo.
function calcBloqueFilas(calcFn, periodsCat){
  const isReserva = periodsCat==='RESERVA'||periodsCat==='RESERVA_S2';
  const totMax = isReserva ? 18 : 35;
  const periods=getPeriodos(periodsCat).filter(p=>p.label!=='TOTAL');
  const filas=periods.map(p=>({label:p.label, from:p.from, to:p.to, s:calcFn(p.from,p.to)})).filter(f=>f.s.pj>0);
  const ultimoLabel=filas.length?filas[filas.length-1].label:null;
  filas.forEach(f=>{ f.destacado = f.label===ultimoLabel; });
  return { filas, tot: calcFn(1,totMax) };
}

function bloqueComparativaHTML(calcFn, periodsCat){
  const { filas, tot } = calcBloqueFilas(calcFn, periodsCat);

  if(!filas.length){
    return `<div style="text-align:center;padding:20px;color:var(--muted);
      font-family:'Barlow Condensed',sans-serif;font-size:13px">Todavía no se jugaron partidos</div>`;
  }

  const rowsHTML=filas.map(f=>{
    const dgC=f.s.dg>0?'var(--win)':f.s.dg<0?'var(--loss)':'var(--muted)';
    return `<tr${f.destacado?' style="outline:2px solid var(--gold);outline-offset:-2px"':''}>
      <td class="cat-cell">${f.label}</td>
      <td style="color:var(--gold2);font-weight:700">${f.s.pts}</td><td>${f.s.pj}</td>
      <td style="color:var(--win)">${f.s.pg}</td><td style="color:var(--draw)">${f.s.pe}</td>
      <td style="color:var(--loss)">${f.s.pp}</td><td style="color:#60a5fa">${f.s.gf}</td>
      <td style="color:#f87171">${f.s.gc}</td>
      <td style="color:${dgC};font-weight:700">${f.s.dg>0?'+':''}${f.s.dg}</td></tr>`;
  }).join('');

  const tDgC=tot.dg>0?'var(--win)':tot.dg<0?'var(--loss)':'var(--muted)';
  const totRow=`<tr style="background:rgba(192,21,42,0.1);font-weight:700;">
    <td class="cat-cell" style="color:var(--gold2)">TOTAL TEMPORADA</td>
    <td style="color:var(--gold2)">${tot.pts}</td><td>${tot.pj}</td>
    <td style="color:var(--win)">${tot.pg}</td><td style="color:var(--draw)">${tot.pe}</td>
    <td style="color:var(--loss)">${tot.pp}</td><td style="color:#60a5fa">${tot.gf}</td>
    <td style="color:#f87171">${tot.gc}</td>
    <td style="color:${tDgC}">${tot.dg>0?'+':''}${tot.dg}</td></tr>`;

  return `<div class="gen-table-wrap"><table class="gen-table">
    <thead><tr>
      <th>BLOQUE</th><th>PTS</th><th>PJ</th><th>PG</th><th>PE</th>
      <th>PP</th><th>GF</th><th>GC</th><th>DG</th>
    </tr></thead><tbody>${rowsHTML}${totRow}</tbody></table></div>`;
}


function renderTopGoleadores(wrap){

  const all = {};
  GENERAL_CATS.forEach(cat=>{
    golesEfectivos(cat).forEach(g=>{
      const key = cat + '||' + g.name.trim().toLowerCase();
      if(!all[key]) all[key] = {name:g.name, goals:0, cats:{}};
      all[key].goals += g.goals;
      all[key].cats[cat] = (all[key].cats[cat]||0) + g.goals;
    });

  const sorted = Object.values(all).sort((a,b)=>b.goals-a.goals).slice(0,5);

  if(sorted.length===0){

  const medals=['🥇','🥈','🥉','4°','5°'];

      const catTags=Object.entries(g.cats).map(([cat,n])=>
