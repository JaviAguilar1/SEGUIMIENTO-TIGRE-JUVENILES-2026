function gpsMetCfgGuardarYRedibujar(){
  if(typeof saveData==='function') saveData();
  gpsAbrirConfigMetricas();
  if(gpsCruceCat) gpsSetMode(gpsMode);
}
function gpsMetCfgMover(idx, dir){
  const orden = gpsMetCfgOrdenActual();
  const j = idx+dir;
  if(j<0||j>=orden.length) return;
  [orden[idx],orden[j]] = [orden[j],orden[idx]];
  gpsMetricCfg.order = orden;
  gpsMetCfgGuardarYRedibujar();
}
function gpsMetCfgToggle(i){
  const ocultas = new Set(gpsMetricCfg.hidden||[]);
  if(ocultas.has(i)) ocultas.delete(i); else ocultas.add(i);
  gpsMetricCfg.hidden = [...ocultas];
  gpsMetCfgGuardarYRedibujar();
}
function gpsMetCfgRenombrar(i, val){
  gpsMetricCfg.labels = gpsMetricCfg.labels || {};
  const v = (val||'').trim();
  if(v && v!==BL_METRICAS[i].label) gpsMetricCfg.labels['m'+i]=v; else delete gpsMetricCfg.labels['m'+i];
  if(typeof saveData==='function') saveData();
  if(gpsCruceCat) gpsSetMode(gpsMode);
}

function gpsFechasSeleccionadas(){
  const raw = (document.getElementById('gps-fechas').value||'').trim();
  if(!raw) return null;
  return new Set(raw.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>!isNaN(n)));
}

function runGpsCruce(){
  const metIdx = parseInt(document.getElementById('gps-metrica').value,10);
  const met = gpsMetricByIdx(metIdx);
  const fechasSel = gpsFechasSeleccionadas();
  const out = document.getElementById('gps-cruce-result');

  const catCat = catapultPlayers[gpsCruceCat] || {};
  if(gpsMode==='cmp'){
    const jugSel = [...document.getElementById('gps-jugadores').selectedOptions].map(o=>o.value);
    if(!jugSel.length){ out.innerHTML = `<div style="color:var(--muted);font-size:12px;padding:12px 0">Elegí al menos un jugador.</div>`; return; }
    const fechasSet = new Set();
    jugSel.forEach(n=>(catCat[n]?.match||[]).forEach(r=>{
      const f = blFechaNum(r.fecha);
      if(f!=null && (!fechasSel || fechasSel.has(f))) fechasSet.add(f);
    }));
    const fechas = [...fechasSet].sort((a,b)=>a-b);
    if(!fechas.length){ out.innerHTML = `<div style="color:var(--muted);font-size:12px;padding:12px 0">No hay datos para esa combinación.</div>`; return; }
    const rows = jugSel.map(n=>{
      const byFecha={};
      (catCat[n]?.match||[]).forEach(r=>{ const f=blFechaNum(r.fecha); if(f!=null) byFecha[f]=r; });
      const vals = fechas.map(f=>{
        const r = byFecha[f];
        const v = r && r.metrics ? r.metrics[met.i] : null;
        return `<td style="text-align:center">${v!=null?fmtGps(v):'—'}</td>`;
      });
      const nums = fechas.map(f=>byFecha[f]?.metrics?.[met.i]).filter(v=>v!=null).map(Number);
      const prom = nums.length ? fmtGps(nums.reduce((a,b)=>a+b,0)/nums.length) : '—';
      return `<tr><td class="cat-cell">${esc(n)}</td>${vals.join('')}<td style="text-align:center;color:var(--gold2);font-weight:700">${prom}</td></tr>`;
    }).join('');
    out.innerHTML = `<div class="gen-table-wrap"><table class="gen-table">
      <thead><tr><th>JUGADOR</th>${fechas.map(f=>`<th>F${f}</th>`).join('')}<th>PROM.</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);margin-top:4px">${met.label} (${met.unit})</div>`;
    return;
  }

  const filas = [];
  Object.entries(catapultPlayersDeCategoria(gpsCruceCat)).forEach(([nombre, p])=>{
    (p.match||[]).forEach(r=>{
      const f = blFechaNum(r.fecha);
      if(f==null || (fechasSel && !fechasSel.has(f))) return;
      const v = r.metrics ? r.metrics[met.i] : null;
      if(v==null) return;
      filas.push({nombre, fecha:f, opp:r.opp||'', v:Number(v)});
    });
  });
  filas.sort((a,b)=>b.v-a.v);
  if(!filas.length){ out.innerHTML = `<div style="color:var(--muted);font-size:12px;padding:12px 0">No hay datos para esa combinación.</div>`; return; }
  const rows = filas.slice(0,50).map((r,idx)=>`<tr>
      <td style="text-align:center;color:var(--muted)">${idx+1}</td>
      <td class="cat-cell">${esc(r.nombre)}</td>
      <td style="text-align:center">F${r.fecha}${r.opp?` <span style="color:var(--muted);font-size:11px">vs ${esc(r.opp)}</span>`:''}</td>
      <td style="text-align:center;color:var(--gold2);font-weight:700">${r.v.toFixed(r.v%1?1:0)}</td>
    </tr>`).join('');
  out.innerHTML = `<div class="gen-table-wrap"><table class="gen-table">
    <thead><tr><th>#</th><th>JUGADOR</th><th>FECHA</th><th>${met.label}</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);margin-top:4px">${met.label} (${met.unit}) · top 50${filas.length>50?` de ${filas.length}`:''}</div>`;
}

// ── PDF Citation Parser ───────────────────────────────────────
// CAT_DIV_MAP ahora sale de CATEGORIAS_CONFIG (campo nombresPdf), definido
// más arriba junto con el resto de la config de categorías.

function normEquipoCitacion(s){
  return (s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^A-Z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
// Adivina la fecha a partir del rival extraído del PDF, cruzando contra el
// fixture ya conocido — así no hace falta tipearla a mano. Es un "mejor
// intento": el input queda editable por si el nombre no matchea bien o el
// partido se pospuso.
// Palabras genéricas que no cambian de qué equipo se trata ("Racing Club"
// == "Racing"), a diferencia de una palabra real como "Rivadavia"
// ("Independiente" != "Independiente Rivadavia", son clubes distintos).
const EQUIPO_STOPWORDS = new Set(['CLUB','C','A','F','DE','LOS','ATLETICO']);
function coreWordsEquipo(s){
  return normEquipoCitacion(s).split(' ').filter(w=>w && !EQUIPO_STOPWORDS.has(w)).sort();
}
function matchFechaPorRival(rival, cat){
  const words = coreWordsEquipo(rival);
  if(!words.length) return null;
  const key = words.join(' ');
  const lista = cat==='RESERVA' ? (typeof RIVALS_RESERVA!=='undefined'?RIVALS_RESERVA:[]) : RIVALS;
  // A propósito exige el mismo CONJUNTO de palabras (sin las genéricas), no
  // que una contenga a la otra como texto — nombres parecidos pero DISTINTOS
  // son comunes en la liga ("Independiente" vs "Independiente Rivadavia",
  // ambos clubes reales) y un simple .includes() los confundía en la prueba.
  // Si no matchea exacto así, mejor dejarlo en blanco para tipear a mano que
  // arriesgar una fecha equivocada.
  const exacto = lista.find(x=>coreWordsEquipo(x.r).join(' ')===key);
  return exacto ? exacto.f : null;
}
// Fechas ya jugadas (con resultado cargado) a las que todavía les falta la
// citación — para avisar en el modal de subida qué queda pendiente.
function fechasCitacionFaltantes(cat){
  return Object.keys(results[cat]||{})
    .filter(f=>results[cat][f])
    .map(Number)
    .filter(f=>!(matchData[cat]?.[f]?.titulares?.length))
    .sort((a,b)=>a-b);
}

// Parseo puro (sin fecha/guardado) -- reusado tanto por la carga de un
// solo PDF (parseCitacionPdf) como por la carga en lote de varios juntos
// (subirCitacionesLote), para no duplicar toda esta lógica de extracción.
async function parseCitacionRaw(file, catHint) {
  const titleCase = s => String(s).toLowerCase().replace(/(^|\s|')([a-záéíóúñ])/g, (m,p,c)=>p+c.toUpperCase());
  const pdfjsLib = await getPdfjsLib();
  const arrayBuf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuf}).promise;
  const results_parsed = {};
  const pageImages = {};

  for (let pg = 1; pg <= pdf.numPages; pg++) {
      const page   = await pdf.getPage(pg);
      const tc     = await page.getTextContent();
      // tokens con coordenadas
      const toks = tc.items
        .filter(it => it.str && it.str.trim())
        .map(it => ({ s: it.str.trim(), x: it.transform[4], y: it.transform[5] }));
      // agrupar en líneas por y
      const lns = [];
      toks.forEach(t => {
        const e = lns.find(l => Math.abs(l.y - t.y) < 3);
        if (e) e.toks.push(t); else lns.push({ y: t.y, toks: [t] });
      });
      lns.sort((a,b)=>b.y-a.y);            // arriba → abajo
      lns.forEach(l=>l.toks.sort((a,b)=>a.x-b.x));
      const pageText = lns.map(l=>l.toks.map(t=>t.s).join(' ')).join('\n');

      // Categoría desde la división
      let detectedCat = catHint;
      for (const [key, val] of Object.entries(CAT_DIV_MAP)) {
        if (pageText.toLowerCase().includes(key)) { detectedCat = val; break; }
      }
      if (!detectedCat) continue;

      // Imagen de la planilla original (Fase citaciones con imagen): se
      // renderiza la página tal cual, comprimida a JPEG, y se guarda aparte
      // de matchData (nodo 'citacionesImg', ver más abajo) — así no pesa en
      // la carga general de la app, solo se pide al abrir esa citación.
      try {
        const viewport = page.getViewport({scale: 1.3});
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
        pageImages[detectedCat] = canvas.toDataURL('image/jpeg', 0.75);
      } catch(e) { console.warn('[CITACION PDF] no se pudo renderizar imagen', e); }

      // Rival
      const rivalMatch =
        pageText.match(/RIVAL[:\s]*\n?\s*([A-Za-záéíóúÁÉÍÓÚÑñ][A-Za-záéíóúÁÉÍÓÚÑñ .'´’]+?)(?:\s*(?:Local|Visitante|CONDICIÓN))/i) ||
        pageText.match(/\b(River Plate|Boca Juniors|Racing Club|Independiente|San Lorenzo|Barracas Central|[A-Z][a-záéíóú]+\s+[A-Z][a-záéíóú]+)\b/);
      const rival = (rivalMatch?.[1] || rivalMatch?.[0] || '').trim();

      // ── SUPLENTES: "N - APELLIDO, Nombre" (12–18) ──
      const suplentes = [];
      const flat = pageText.replace(/\n/g,' ');
      const supRe = /\b(1[2-8])\s*-\s*([A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑáéíóúñ ]+?)\s*,\s*([A-Za-zÁÉÍÓÚÑáéíóúñ]+)/g;
      let sm;
      while ((sm = supRe.exec(flat))) {
        const num = parseInt(sm[1]);
        if (suplentes.find(p=>p.num===num)) continue;
        suplentes.push({ num, nombre: `${titleCase(sm[3].trim())} ${titleCase(sm[2].trim())}` });
      }

      // ── TITULARES por coordenadas: "N - APELLIDO" (1–11) + nombre justo debajo ──
      const HDR = ['Local','Visitante','River','Plate','Cuarta','Quinta','Sexta','Septima','Séptima','Octava','Novena'];
      const nameCands = [];
      lns.forEach(l => l.toks.forEach(t => {
        if (/^[A-ZÁÉÍÓÚÑ][a-zà-ÿáéíóúñ]+$/.test(t.s) && !HDR.includes(t.s))
          nameCands.push({ s: t.s, x: t.x, y: t.y });
      }));
      const anchorRe = /\b([1-9]|1[01])\s*-\s*([A-ZÁÉÍÓÚÑ]{2,}(?:\s+[A-ZÁÉÍÓÚÑ]{2,})*)/g;
      const titMap = {};
      lns.forEach(l => {
        const txt = l.toks.map(t=>t.s).join(' ');
        for (const m of txt.matchAll(anchorRe)) {
          const num = parseInt(m[1]);
          if (num < 1 || num > 11 || titMap[num]) continue;
          const ape   = m[2].trim();
          const first = ape.split(' ')[0];
          // pdf.js a veces junta "N - APELLIDO" de dos jugadores de la misma
          // fila en un solo token de texto — ese token entero empieza con el
          // número de camiseta, no con el apellido, así que buscar con
          // startsWith() fallaba y todos caían al primer token de la línea
          // (pisando la posición del segundo jugador con la del primero).
          // includes() encuentra el token correcto tanto si viene junto como
          // si viene separado.
          const anchTok = l.toks.find(t => t.s.toUpperCase().includes(first.slice(0,3).toUpperCase())) || l.toks[0];
          const ax = anchTok.x;
          let best=null, bestd=1e9;
          nameCands.forEach(c => {
            const dy = l.y - c.y;                 // debajo del ancla
            if (dy > 0 && dy < 30 && Math.abs(c.x-ax) < 60 && Math.abs(c.x-ax) < bestd){
              bestd = Math.abs(c.x-ax); best = c;
            }
          });
          // x/y del ancla (dorsal+apellido) — de acá sale a qué línea táctica
          // pertenece cada titular (ver agruparLineasCitacion, usado en
          // abrirCitacionView para armar la cancha con el sistema detectado).
          titMap[num] = { num, nombre: best ? `${best.s} ${titleCase(ape)}` : titleCase(ape), x: ax, y: l.y };
        }
      });
      const titulares = Object.keys(titMap).map(Number).sort((a,b)=>a-b).map(n=>titMap[n]);

      // El texto de un PDF real puede salir incompleto o cruzado con otro
      // jugador (nombre justo debajo del dorsal, por posición, no siempre da
      // con el correcto) — se marca con warn:true todo lo que no matchea con
      // nadie del plantel real, en vez de mostrarlo como si fuera seguro.
      const rosterPorNombre = {};
      const roster = plantelFutdetail[detectedCat]||[];
      roster.forEach(p=>{ rosterPorNombre[normNombreOrdenIndependiente(p.nombre)]=p; });
      // id del plantel (Fase 1) para cada titular/suplente que sí matcheó —
      // así la vista de citación puede cruzar goles/tarjetas/cambios de
      // COMET (que también vienen con id) sin comparar nombres de nuevo.
      // Si no matchea exacto, se prueba por subconjunto de palabras (mismo
      // criterio que cometResolvePlayer): el PDF puede traer el nombre sin
      // segundos nombres que el plantel sí tiene, o al revés.
      const tagWarn = arr => arr.map(p=>{
        let match = rosterPorNombre[normNombreOrdenIndependiente(p.nombre)];
        if(!match){
          const pw = cometNameWords(p.nombre);
          const candidatos = roster.filter(r=>{
            const rw = cometNameWords(r.nombre);
            return rw.length>0 && pw.length>0 && (rw.every(w=>pw.includes(w)) || pw.every(w=>rw.includes(w)));
          });
          if(candidatos.length===1) match = candidatos[0];
          // Jugador de otra categoría citado para completar el plantel de
          // este partido (ej. un arquero de 5ta subiendo a 4ta) -- si no
          // aparece nadie en la categoría de la fecha, se busca en el resto
          // del club antes de rendirse. Mismo criterio que cometResolvePlayer.
          if(!match){
            for(const otraCat of CATEGORIES){
              if(otraCat===detectedCat || match) continue;
              const otroRoster = plantelFutdetail[otraCat]||[];
              const cand2 = otroRoster.filter(r=>{
                const rw = cometNameWords(r.nombre);
                return rw.length>0 && pw.length>0 && (rw.every(w=>pw.includes(w)) || pw.every(w=>rw.includes(w)));
              });
              if(cand2.length===1) match = cand2[0];
            }
          }
        }
        return {...p, warn: roster.length>0 && !match, id: match?match.id:null};
      });

      results_parsed[detectedCat] = {titulares: tagWarn(titulares), suplentes: tagWarn(suplentes), rival};
    }
  return {results_parsed, pageImages};
}

async function parseCitacionPdf(file, catHint, fechaHint, inputEl, segundoTiempoDe) {
  if (!file) return;
  if (inputEl) inputEl.value = '';
  showToast('📄 Procesando citaciones…');
  try {
    const {results_parsed, pageImages} = await parseCitacionRaw(file, catHint);

    // Ask user to confirm fecha if not provided
    const catsFound = Object.keys(results_parsed);
    if (!catsFound.length) { showToast('⚠ No se encontraron datos de citación'); return; }

    // (Validación contra plantel retirada: el módulo Plantel ya no existe.)

    // If fechaHint provided, save directly; otherwise prompt
    if (fechaHint) {
      catsFound.forEach(cat => {
        if (!matchData[cat]) matchData[cat] = {};
        const existing = matchData[cat][fechaHint] || {};
        // Caso excepcional: un partido se jugó en dos canchas distintas (se
        // cortó a mitad y siguió en otro predio) — hay dos planillas reales
        // para la misma fecha. En vez de pisar la primera, la segunda se
        // guarda aparte con su cancha, y el modal de citación muestra ambas.
        if (segundoTiempoDe) {
          matchData[cat][fechaHint] = {
            ...existing,
            segundoTiempo: {
              venue: segundoTiempoDe,
              titulares: results_parsed[cat].titulares,
              suplentes: results_parsed[cat].suplentes,
            },
          };
          if (pageImages[cat]) db.ref(`citacionesImg/${cat}/${fechaHint}_2`).set(pageImages[cat]).catch(e=>console.warn('[CITACION IMG] no se guardó — revisar reglas de Firebase para citacionesImg', e));
        } else {
          guardarCitacionParaFecha(cat, fechaHint, results_parsed[cat], pageImages[cat]);
        }
      });
      saveData();
      showToast(`✓ ${catsFound.length} categorías cargadas: ${catsFound.join(', ')}`);
    } else {
      // Show a non-blocking modal to ask for the fecha number — se intenta
      // adivinar sola cruzando el rival extraído contra el fixture (mismo
      // criterio para todas las categorías del PDF; si difieren, gana la
      // primera que matcheó). Sigue editable por si está mal.
      const fechasAdivinadas = catsFound
        .map(c=>matchFechaPorRival(results_parsed[c].rival, c))
        .filter(Boolean);
      const fechaAdivinada = fechasAdivinadas[0] || null;
      const faltantesHTML = catsFound.map(c=>{
        const falt = fechasCitacionFaltantes(c);
        return falt.length ? `${c}: falta F${falt.join(', F')}` : '';
      }).filter(Boolean).join(' · ');
      const yaCargada = fechaAdivinada && catsFound.some(c=>matchData[c]?.[fechaAdivinada]?.titulares?.length);
      const overlay = document.createElement('div');
      overlay.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(5,8,15,0.85);display:flex;align-items:center;justify-content:center';
      const summaryLine = catsFound.map(c=>`${c} vs ${esc(results_parsed[c].rival||'?')}: ${results_parsed[c].titulares.length}T + ${results_parsed[c].suplentes.length}S`).join(' · ');
      overlay.innerHTML=`<div style="background:#0a0f1e;border:1px solid #1a2d5a;border-radius:12px;padding:24px;max-width:360px;width:90%;font-family:'Barlow Condensed',sans-serif">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;color:#c9a227;margin-bottom:8px">ASIGNAR FECHA</div>
        <div style="font-size:11px;color:#5a7099;margin-bottom:12px">${summaryLine}</div>
        <div style="font-size:12px;color:var(--text2,#d8e4ff);margin-bottom:8px">${fechaAdivinada?`Detectada por el rival — revisá que esté bien:`:'No se pudo adivinar la fecha por el rival — ¿para qué número de FECHA son estos datos?'}</div>
        <input id="cit-fecha-inp" type="number" min="1" max="35" placeholder="Ej: 13" value="${fechaAdivinada||''}"
          style="width:100%;background:rgba(5,8,15,0.8);border:1px solid #1a2d5a;border-radius:6px;color:#d8e4ff;font-size:16px;padding:10px 12px;box-sizing:border-box;margin-bottom:12px;outline:none">
        ${yaCargada?`<div style="font-size:11px;color:var(--draw,#f5c542);margin-bottom:12px">⚠️ Ya había una citación cargada para esa fecha — se va a reemplazar.</div>`:''}
        ${faltantesHTML?`<div style="font-size:11px;color:#5a7099;margin-bottom:12px">Todavía sin citación: ${esc(faltantesHTML)}</div>`:''}
        <div style="display:flex;gap:8px">
          <button onclick="this.closest('div[style*=inset]').remove()"
            style="flex:1;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:6px;color:#f87171;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;padding:8px;cursor:pointer">CANCELAR</button>
          <button id="cit-fecha-ok"
            style="flex:2;background:linear-gradient(135deg,#1a4a1a,#2a6a2a);border:1px solid #4a8a4a;border-radius:6px;color:#86efac;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;padding:8px;cursor:pointer">✓ CONFIRMAR</button>
        </div>
      </div>`;
      document.body.appendChild(overlay);
      const inp = overlay.querySelector('#cit-fecha-inp');
      inp.focus();
      if(fechaAdivinada) inp.select();
      const confirmFecha = () => {
        const f = parseInt(inp.value);
        if(!f || f < 1 || f > 35){ inp.style.borderColor='#ef4444'; return; }
        overlay.remove();
        catsFound.forEach(cat => guardarCitacionParaFecha(cat, f, results_parsed[cat], pageImages[cat]));
        saveData();
        showToast(`✓ F${f}: ${catsFound.length} categorías cargadas`);
      };
      overlay.querySelector('#cit-fecha-ok').addEventListener('click', confirmFecha);
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') confirmFecha(); });
    }
  } catch(e) {
    console.error('[CITACION PDF]', e);
    showToast('⚠ Error al procesar el PDF: ' + e.message);
  }
}

// ── Un solo botón para subir cualquier planilla ─────────────────────────
// El usuario ya no elige el tipo: cada PDF se prueba primero como citación
// (parseCitacionRaw detecta la categoría por el texto de "división" en cada
// página, sin tirar error si no encuentra ninguna — results_parsed queda
// vacío) y, si no matcheó nada, se prueba como informe de COMET
// (parseCometPdf detecta 4ta/5ta/6ta por el encabezado y sí tira error si
// no reconoce la estructura — ahí se lo descarta como "no reconocido").
async function sniffPlanillaPdf(file){
  try{
    const cit = await parseCitacionRaw(file, null);
    if(Object.keys(cit.results_parsed).length) return {tipo:'citacion', file, ...cit};
  }catch(e){ /* no era citación, probamos COMET */ }
  try{
    const data = await parseCometPdf(file, null);
    return {tipo:'comet', file, data};
  }catch(e){
    return {tipo:null, file, error: 'No se reconoció como planilla de citación ni informe de COMET.'};
  }
}

// Cada PDF de citación trae UNA fecha con UN rival (varias categorías juntas
// en el mismo archivo) -- a diferencia de COMET, acá no hay riesgo real de
// que dos PDF del lote caigan en la misma fecha (el único caso conocido, el
// partido de Lanús F3 cortado a mitad, ya está resuelto aparte con el
// mecanismo de "segundo tiempo"), así que no hace falta un selector de
// conflictos ahí: solo una fila editable por archivo con la fecha adivinada
// (o vacía si no se pudo) para confirmar o corregir antes de guardar.
// Si en la misma tanda hay PDF de citación Y de COMET, se muestra primero
// el modal de COMET y, al cerrarlo (guardando o cancelando), se abre el de
// citación -- los dos modales comparten estilo pero son overlays de pantalla
// completa, así que no pueden mostrarse a la vez.
async function subirPlanillasLote(fileList, inputEl){
  const files = Array.from(fileList||[]);
  if(inputEl) inputEl.value='';
  if(!files.length) return;
  showToast(`☁ LEYENDO ${files.length} PDF…`);
  const citParsed = [], cometParsed = [], noReconocido = [];
  for(const file of files){
    const r = await sniffPlanillaPdf(file);
    if(r.tipo==='citacion'){
      const catsFound = Object.keys(r.results_parsed);
      const fechasAdivinadas = catsFound.map(c=>matchFechaPorRival(r.results_parsed[c].rival, c)).filter(Boolean);
      citParsed.push({file, error:null, catsFound, results_parsed:r.results_parsed, pageImages:r.pageImages, fechaAdivinada: fechasAdivinadas[0]||null});
    } else if(r.tipo==='comet'){
      cometParsed.push({file, data:r.data, error:null});
    } else {
      noReconocido.push(r);
    }
  }
  if(noReconocido.length) showToast(`⚠ ${noReconocido.length} PDF no reconocido(s): ${noReconocido.map(r=>r.file.name).join(', ')}`);
  const abrirCitacion = () => { if(citParsed.length) abrirConfirmCitacionLote(citParsed); };
  if(cometParsed.length) abrirConfirmCometLote(cometParsed, abrirCitacion);
  else abrirCitacion();
}

}

function guardarCitacionParaFecha(cat, fecha, parsedForCat, pageImg){
  if(!matchData[cat]) matchData[cat] = {};
  const existing = matchData[cat][fecha] || {};
  matchData[cat][fecha] = { ...existing,
    titulares: parsedForCat.titulares,
    suplentes: parsedForCat.suplentes,
    rival:     parsedForCat.rival || existing.rival,
    cambios:   existing.cambios  || [],
    duracion:  existing.duracion || 90,
  };
  if (pageImg) db.ref(`citacionesImg/${cat}/${fecha}`).set(pageImg).catch(e=>console.warn('[CITACION IMG] no se guardó — revisar reglas de Firebase para citacionesImg', e));
}

function confirmarCitacionLote(){
  const m=document.getElementById('citacion-confirm-modal');
  const parsed = m && m._citLote;
  if(!parsed) return;
  let huboError=false;
  const aGuardar=[];
  m.querySelectorAll('.cit-lote-row').forEach(row=>{
    const check = row.querySelector('.cit-lote-check');
    if(!check.checked) return;
    const item = parsed[Number(row.dataset.idx)];
    const f = parseInt(row.querySelector('.cit-lote-fecha').value);
    if(!f || f<1 || f>35){
      row.querySelector('.cit-lote-err').textContent = '⚠ Falta indicar la fecha';
      huboError=true;
      return;
    }
    aGuardar.push({item, fecha:f});
  });
  if(huboError) return;
  if(!aGuardar.length){ m.remove(); return; }
  m.remove();
  let catsTotal=0;
  aGuardar.forEach(({item, fecha})=>{
    item.catsFound.forEach(cat=>{
      guardarCitacionParaFecha(cat, fecha, item.results_parsed[cat], item.pageImages[cat]);
      catsTotal++;
    });
  });
  saveData();
  showToast(`✓ ${aGuardar.length} fecha(s), ${catsTotal} categoría(s) cargadas`);
}

// ============================================================
//  COMET / AFA — Informe de partido (Fase 4)
//  Solo 4TA/5TA/6TA tienen este PDF. Reemplaza la carga manual de
//  goleadores para esas categorías y agrega tarjetas + minutos jugados,
//  que antes no se registraban en ningún lado. Carga 100% manual (subís
//  el PDF vos, no hay forma de bajarlo solo) pero el PARSEO es automático.
//  Se guarda en stats/partidos/{cat}/{fecha}, aparte del payload general
//  de saveData() — es un nodo grande y nuevo, mejor con su propio guardado
//  targeted (mismo criterio que ya usaban las sesiones de GPS).
// ============================================================

// Agrupa items de texto de pdf.js en filas por Y — mismo patrón que ya usa
// parseCitacionPdf, con más tolerancia (6px) porque en el informe de COMET
// el minuto ("35'") viene en una fuente más chica y su línea de base queda
// un poco más abajo que el resto de la fila (medido contra PDF reales).
function cometGroupRows(items, yTol){
  const rows = [];
  items.forEach(t=>{
    const r = rows.find(r=>Math.abs(r.y-t.y)<yTol);
    if(r){ r.items.push(t); r.y=(r.y*r.items.length+t.y)/(r.items.length+1); }
    else rows.push({y:t.y, items:[t]});
  });
  rows.forEach(r=>r.items.sort((a,b)=>a.x-b.x));
  rows.sort((a,b)=>a.y-b.y); // "y" ya viene ajustada en parseCometPdf para que ascendente = orden de lectura
  return rows;
}

// Los íconos (flecha de entrada/salida) NO llegan como string vacío real:
// pdf.js los deja como UN carácter de la zona Unicode "Private Use Area"
// (U+E000–U+F8FF, típico de fuentes de íconos tipo Material Symbols) que no
// tiene glifo imprimible — se ve "vacío" en consola pero str.length===1 y
// no es realmente ''. Por eso este chequeo, en vez de comparar con ''.
function cometIsIcon(s){
  return !!s && [...s].every(c => { const n=c.codePointAt(0); return n>=0xE000 && n<=0xF8FF; });
}

// Minuto con o sin descuento ("71'" o "90+1'") — el descuento se ignora al
// convertir a número (parseInt("90+1'") ya da 90 solo, no hace falta
// partirlo aparte) pero el regex tiene que aceptar el "+N" para reconocer
// el token como minuto en primer lugar; si no, un evento en descuento
// (común, sobre todo tarjetas y goles) no se reconocía y se perdía o
// contaminaba el nombre del jugador de al lado.
const cometMinRe = /^\d+(?:\+\d+)?'$/;
// Misma idea, pero para una lista de minutos pegados con coma en un solo
// token ("30', 40'" — dos goles del mismo jugador mostrados juntos).
const cometMinListRe = /^\d+(?:\+\d+)?'(,\s*\d+(?:\+\d+)?')*$/;

function cometNorm(s){
  // pdf.js separa las letras acentuadas/Ñ en su propio item de texto (otro
  // programa de glifo), así que quedan sueltas con espacios alrededor
  // ("I Ñ AKI" en vez de "IÑAKI") cuando se las vuelve a unir con join(' ').
  // Se les saca el espacio de los costados para pegarlas de nuevo.
  return (s||'').replace(/\s*([ÁÉÍÓÚÑáéíóúñ])\s*/g,'$1').replace(/\s+/g,' ').trim();
}

// Palabras del nombre, sin acentos/puntuación, en minúscula — para el
// matcheo por subconjunto contra el plantel (ver cometResolvePlayer).
function cometNameWords(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean);
}
// Busca a qué jugador del plantel de esa categoría corresponde un nombre
// que puede venir en otro formato (con/sin segundos nombres, con/sin coma)
// -- por subconjunto de palabras, mismo criterio que cometResolvePlayer.
// Devuelve null si no hay ningún candidato único.
function matchPlantel(cat, nombre){
  const w = cometNameWords(nombre);
  if(!w.length) return null;
  const cand = (plantelFutdetail[cat]||[]).filter(p=>{
    const pw = cometNameWords(p.nombre);
    return pw.length>0 && (pw.every(x=>w.includes(x)) || w.every(x=>pw.includes(x)));
  });
  return cand.length===1 ? cand[0] : null;
}

// COMET da el nombre completo, con segundos nombres que el plantel muchas
// veces no tiene ("RUIZ, SANTIAGO AGUSTIN" en COMET vs "Ruiz Santiago" en
// el plantel) — machear por igualdad exacta de palabras fallaría siempre.
// En cambio, si TODAS las palabras del plantel están entre las palabras de
// COMET, es un match confiable (y si hay más de un jugador que cumple eso,
// o ninguno, se marca ambiguo en vez de adivinar).
function cometResolvePlayer(cat, nombreComet){
  // Si ya se vinculó a mano antes (mismo mecanismo que aliasJugadores),
  // vale eso directo — no hace falta que el matcheo automático vuelva a
  // adivinar cada vez que se sube un informe nuevo con el mismo jugador.
  const aliasKey = normNombreOrdenIndependiente(nombreComet);
  const aliasId = (aliasJugadoresComet[cat]||{})[aliasKey];
  if(aliasId){
    const p = (plantelFutdetail[cat]||[]).find(x=>x.id===aliasId);
    if(p) return {id:p.id, nombre:p.nombre, ambiguo:false};
  }
  const cometWords = new Set(cometNameWords(nombreComet));
  const buscar = roster => roster.filter(p=>{
    const pw = cometNameWords(p.nombre);
    return pw.length>0 && pw.every(w=>cometWords.has(w));
  });
  let candidatos = buscar(plantelFutdetail[cat]||[]);
  // Jugadores que suben o bajan de categoría para completar un partido
  // (ej. un arquero de 5ta que va de suplente a 4ta) no están en el plantel
  // de la categoría del informe -- si no aparece nadie ahí, se busca en el
  // resto del club. El id es el mismo en todas las categorías (no incluye
  // la categoría a propósito, ver assignPlayerIds), así que sus goles/
  // tarjetas de ese partido igual quedan bien identificados como suyos.
  if(candidatos.length===0){
    CATEGORIES.forEach(otraCat=>{
      if(otraCat===cat || candidatos.length) return;
      candidatos = buscar(plantelFutdetail[otraCat]||[]);
    });
  }
  if(candidatos.length===1) return {id:candidatos[0].id, nombre:candidatos[0].nombre, ambiguo:false};
  return {id:null, nombre:null, ambiguo:true, candidatos:candidatos.map(c=>c.nombre)};
}

async function parseCometPdf(file, cat){
  if(!file) return null;
  showToast('📄 Procesando informe de COMET…');
  const pdfjsLib = await getPdfjsLib();
  const arrayBuf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: arrayBuf}).promise;

  // Todas las páginas juntas, en orden, con un offset grande en Y por
  // página para que sigan ordenadas globalmente sin mezclarse entre sí
  // (el informe tiene 2 páginas: alineaciones/goles en la 1, disciplinario
  // en la 2 casi siempre, pero no es fijo — depende de cuánto texto entre).
  let all = [];
  for(let pg=1; pg<=pdf.numPages; pg++){
    const page = await pdf.getPage(pg);
    const tc = await page.getTextContent();
    const offset = (pg-1)*100000;
    tc.items.filter(it=>it.str && it.str.trim()).forEach(it=>{
      all.push({s: it.str.trim(), x: it.transform[4], y: offset - it.transform[5]});
    });
  }
  // Con el offset restado, y creciente = más abajo en la página y más
  // adelante en el documento — mismo sentido que "arriba a la izquierda,
  // abajo a la derecha" al recorrer todo el informe de punta a punta.
  all.sort((a,b)=>a.y-b.y);

  const idxWord = (word, start=0) => { for(let i=Math.max(0,start);i<all.length;i++){ if(all[i].s===word) return i; } return -1; };
  const idxMatch = (re, start=0) => { for(let i=Math.max(0,start);i<all.length;i++){ if(re.test(all[i].s)) return i; } return -1; };

  const iCalMonth = idxWord('calendar_month');
  const headerWords = all.slice(0, iCalMonth<0?all.length:iCalMonth);
  const iScore = idxMatch(/^\d+:\d+$/);
  if(iScore<0) throw new Error('No se encontró el resultado en el encabezado — ¿es un informe de partido de COMET?');
  const score = all[iScore];
  const [golA, golB] = score.s.split(':').map(Number);
  const leftWords = headerWords.filter(w=>Math.abs(w.y-score.y)<15 && w.x<score.x && !['N/A','J','AR'].includes(w.s));
  const rightWords = headerWords.filter(w=>Math.abs(w.y-score.y)<15 && w.x>score.x && !['N/A','J','AR'].includes(w.s));
  const teamA = cometNorm(leftWords.map(w=>w.s).join(' '));
  const teamB = cometNorm(rightWords.map(w=>w.s).join(' '));
  const tigreEsA = /TIGRE/i.test(teamA);
  const rival = tigreEsA ? teamB : teamA;
  const golesTigre = tigreEsA ? golA : golB;
  const golesRival = tigreEsA ? golB : golA;
  const condicion = tigreEsA ? 'L' : 'V';

  const iFecha = idxWord('Fecha:');
  if(iFecha<0 || !all[iFecha+1]) throw new Error('No se encontró el número de fecha en el informe.');
  const fecha = parseInt(all[iFecha+1].s);

  // "Juveniles L.P.F. 2026 - 4ta" viene como un solo string (pdf.js agrupa
  // texto por línea, no por palabra como pymupdf) — buscar el patrón DENTRO
  // del texto, no como palabra exacta.
  let categoria = cat || null;
  for(const w of headerWords){
    const m = w.s.match(/\b(\d)ta\b/i);
    if(m) categoria = m[1]+'TA';
  }
  if(!categoria) throw new Error('No se pudo detectar la categoría (4ta/5ta/6ta) en el informe.');

  const iAline = idxWord('ALINEACIONES');
  const iSubst = idxWord('SUBSTITUCIONES', iAline);
  // "CUERPO TÉCNICO" sale partido en 2-3 tokens por el acento ("CUERPO T"+"É"+"CNICO") — buscar por prefijo.
  const iCuerpo = idxMatch(/^CUERPO/, iSubst);
  // GOLES es la única sección que COMET puede omitir del todo (partido 0-0,
  // sin ningún gol de ningún equipo) -- no exigirla como las demás, el
  // array de goles queda vacío en ese caso en vez de tirar error.
  const iGoles = idxWord('GOLES', iCuerpo);
  if([iAline,iSubst,iCuerpo].some(i=>i<0)) throw new Error('No se reconoció la estructura del informe (ALINEACIONES/SUBSTITUCIONES) — revisá que sea el PDF correcto.');

  const alineWords = all.slice(iAline+1, iSubst);
  const substWords = all.slice(iSubst+1, iCuerpo);
  const rowsAl = cometGroupRows(alineWords, 6);
  const headerRow = rowsAl[0];

  // Referencia global de cada columna de dorsales (ver comentario más abajo
  // en parsePlayerRows) — corte grueso en x=200: los dorsales están siempre
  // cerca del borde izquierdo o cerca de la mitad, nunca ahí en el medio.
  const dorsalXsLeft=[], dorsalXsRight=[];
  rowsAl.slice(1).forEach(r=>r.items.forEach(w=>{
    if(/^\d{1,2}$/.test(w.s)) (w.x<200?dorsalXsLeft:dorsalXsRight).push(w.x);
  }));
  const leftRefX = dorsalXsLeft.length ? dorsalXsLeft.reduce((a,b)=>a+b,0)/dorsalXsLeft.length : 30;
  const rightRefX = dorsalXsRight.length ? dorsalXsRight.reduce((a,b)=>a+b,0)/dorsalXsRight.length : 300;

  let tigreLeft = false;
  headerRow.items.forEach(w=>{ if(w.s.toUpperCase()==='TIGRE') tigreLeft = w.x<200; });
  const side = tigreLeft ? 'left' : 'right';

  // Cada fila trae el dorsal de LOS DOS equipos — el del otro equipo marca
  // dónde empieza su bloque, así que todo lo que esté antes es nuestro,
  // incluidas las flechas de entrada/salida (que a veces caen más a la
  // derecha que el propio dorsal rival). Si la fila no tiene dorsal del
  // otro equipo (bancos de tamaño distinto entre los dos planteles), se usa
  // la referencia global de esa columna.
  // Ojo con esta parte: pdf.js no decodifica el ícono de flecha (entrada/
  // salida) como texto — llega como un item con string VACÍO, seguido del
  // minuto como item aparte ("71'"). Un jugador puede además tener otros
  // minutos sueltos en la fila sin ícono (ej. el minuto de un gol o tarjeta
  // que COMET repite al lado del nombre) — esos NO son de entrada/salida.
  // Se distingue por posición: el minuto real es el que viene INMEDIATAMENTE
  // después (poca distancia en x) de un item vacío; cualquier otro minuto
  // suelto se ignora (ya sale, con más contexto, de GOLES/TARJETAS).
  // Como un titular solo puede salir (nunca entrar) y un suplente solo
  // puede entrar (nunca salir en esta primera versión del parser), la
  // dirección de la flecha no hace falta leerla del ícono — la da si la
  // fila es de titulares o de suplentes.
  function parsePlayerRows(rows, esTitular){
    const players = [];
    rows.forEach(r=>{
      let items = r.items;
      const dorsalTokens = items.filter(w=>/^\d{1,2}$/.test(w.s));
      if(side==='left'){
        const other = dorsalTokens.filter(w=>w.x>=200);
        const otherX = other.length ? Math.min(...other.map(w=>w.x)) : rightRefX;
        items = items.filter(w=>w.x < otherX-12);
      } else {
        const mine = dorsalTokens.filter(w=>w.x>=200);
        const mineX = mine.length ? Math.min(...mine.map(w=>w.x)) : rightRefX;
        items = items.filter(w=>w.x >= mineX-5);
      }
      if(!items.length || !/^\d{1,2}$/.test(items[0].s)) return;
      const dorsal = parseInt(items[0].s);
      const rest = items.slice(1);
      const nameTokens = [];
      let arrowMinuto=null, ar=false, cp=false;
      for(let i=0;i<rest.length;i++){
        const w = rest[i];
        const t = w.s;
        if(t==='AR'){ ar=true; continue; }
        if(t==='CP'){ cp=true; continue; }
        if(cometIsIcon(t)){
          const nxt = rest[i+1];
          if(nxt && cometMinRe.test(nxt.s) && (nxt.x-w.x)<15){ arrowMinuto = parseInt(nxt.s); i++; }
          continue;
        }
        // Minutos sueltos sin ícono adelante (gol/tarjeta repetidos acá al
        // lado del nombre) — se ignoran, GOLES/TARJETAS son la fuente real.
        if(cometMinListRe.test(t)) continue;
        nameTokens.push(t);
      }
      players.push({dorsal, nombre:cometNorm(nameTokens.join(' ')), ar, cp,
        minutoSalida: esTitular ? arrowMinuto : null,
        minutoEntrada: esTitular ? null : arrowMinuto});
    });
    return players;
  }

  const titularesRaw = parsePlayerRows(rowsAl.slice(1), true);
  const rowsSub = cometGroupRows(substWords, 6);
  const suplentesRaw = parsePlayerRows(rowsSub, false);

  // GOLES y TARJETAS son, como ALINEACIONES, dos listas lado a lado (una
  // por equipo), pero sin el gutter de flechas que complicaba ALINEACIONES
  // — alcanza con el corte grueso x<200/x>=200.
  function sideWords(words){ return words.filter(w=>(w.x<200)===(side==='left')); }

  // GOLES/TARJETAS: pdf.js junta "dorsal nombre" en un solo string por fila
  // (a diferencia de ALINEACIONES, donde vienen separados) — hay que
  // partirlo con regex en vez de tomar items separados.
  const dorsalNombreRe = /^(\d{1,2})\s+(.+)$/;
  function splitDorsalNombre(items){
    // El dorsal+nombre puede venir todo junto ("4 RODRIGUEZ, BENJAMIN") o,
    // más raro, en dos items separados — probar ambos casos.
    if(items.length===1){
      const m = items[0].s.match(dorsalNombreRe);
      return m ? {dorsal:parseInt(m[1]), nombre:cometNorm(m[2])} : {dorsal:null, nombre:cometNorm(items[0].s)};
    }
    if(/^\d{1,2}$/.test(items[0].s)){
      return {dorsal:parseInt(items[0].s), nombre:cometNorm(items.slice(1).map(w=>w.s).join(' '))};
    }
    const m = items[0].s.match(dorsalNombreRe);
    return {dorsal: m?parseInt(m[1]):null, nombre:cometNorm((m?m[2]:items[0].s)+' '+items.slice(1).map(w=>w.s).join(' '))};
  }

  const golesRaw = [];
  if(iGoles>=0){
    const iDisc = idxWord('DISCIPLINARIO', iGoles);
    // Si el partido no tuvo tarjetas, COMET no imprime "DISCIPLINARIO" en la
    // página 1 -- el corte de emergencia (+300 palabras) se pasaba de largo
    // y agarraba también la tabla de "SUSTITUCIONES" de la página 2 (el
    // detalle jugador-que-sale → jugador-que-entra por minuto), leyéndola
    // como si fueran más filas de goles y armando un nombre basura con los
    // dos jugadores pegados. Frenar también ahí si aparece antes que el
    // límite de emergencia. Caso real que lo destapó: Fernandez Jerónimo,
    // 6TA F3 vs Lanús, sin tarjetas ese partido (Javi, 2026-09-03).
    const iSustDetalle = idxWord('SUSTITUCIONES', iGoles);
    let iFinGoles = iGoles+300;
    if(iDisc>=0) iFinGoles = Math.min(iFinGoles, iDisc);
    if(iSustDetalle>=0) iFinGoles = Math.min(iFinGoles, iSustDetalle);
    const golesWords = sideWords(all.slice(iGoles+1, iFinGoles));
    const rowsG = cometGroupRows(golesWords, 6);
    for(let i=0;i<rowsG.length;i++){
      const items = rowsG[i].items;
      if(!items.length || !cometMinRe.test(items[0].s)) continue;
      const minuto = parseInt(items[0].s);
      // "Gol de penal" es OTRO item de texto, en la misma fila que el dorsal+
      // nombre pero más a la derecha (no una fila propia debajo, como el
      // motivo de una tarjeta) — hay que sacarlo antes de armar el nombre, si
      // no queda pegado ("BENITEZ, CRISTIAN ALEJANDRO Gol de penal").
      const penal = items.slice(1).some(w=>/penal/i.test(w.s));
      const nameItems = items.slice(1).filter(w=>!/penal/i.test(w.s));
      const {dorsal, nombre} = splitDorsalNombre(nameItems);
      // "Autogol" -- igual que el motivo de una tarjeta (parseTarjetas, más
      // abajo), COMET lo pone en una fila propia debajo del nombre, no
      // pegado en la misma fila. Es un gol EN CONTRA del equipo del que lo
      // marca -- no cuenta como gol a favor en su ficha de goleador (aunque
      // el dato de COMET nunca se borra, solo se excluye de esa cuenta).
      // Caso real que destapó esto: Fernandez Jerónimo, 6TA, F3 vs Lanús,
      // 70' -- Confiabilidad lo tenía sumado de más (Javi, 2026-09-03).
      let autogol = /autogol/i.test(items.slice(1).map(w=>w.s).join(' '));
      if(!autogol && i+1<rowsG.length){
        const nxt = rowsG[i+1];
        if(!(nxt.items[0] && cometMinRe.test(nxt.items[0].s)) && /autogol/i.test(nxt.items.map(w=>w.s).join(' '))){
          autogol = true;
          i++;
        }
      }
      golesRaw.push({minuto, dorsal, nombre, penal, autogol});
    }
  }

  function parseTarjetas(labelRe){
    const iLab = idxMatch(labelRe);
    if(iLab<0) return [];
    let iNext = idxWord('SUSTITUCIONES', iLab);
    if(iNext<0) iNext = all.length;
    const rowsT = cometGroupRows(sideWords(all.slice(iLab+1, iNext)), 6);
    const cards = [];
    for(let i=0;i<rowsT.length;i++){
      const items = rowsT[i].items;
      if(!items.length || !cometMinRe.test(items[0].s)) continue;
      const minuto = parseInt(items[0].s);
      const {dorsal, nombre} = splitDorsalNombre(items.slice(1));
      let motivo='';
      if(i+1<rowsT.length){
        const nxt = rowsT[i+1];
        if(!(nxt.items[0] && cometMinRe.test(nxt.items[0].s))){
          motivo = cometNorm(nxt.items.map(w=>w.s).join(' '));
          i++;
        }
      }
      cards.push({minuto, dorsal, nombre, motivo});
    }
    return cards;
  }
  const amarillasRaw = parseTarjetas(/TARJETAS\s+AMARILLAS/);
  const rojasRaw = parseTarjetas(/TARJETAS\s+ROJAS/);

  // ── Resolver nombres contra el plantel actual (id de la Fase 1) ──
  const warnings = [];
  const resolvePlayers = arr => arr.map(p=>{
    const r = cometResolvePlayer(categoria, p.nombre);
    if(!r.id) warnings.push(`"${p.nombre}" (dorsal ${p.dorsal}) no matchea con un único jugador del plantel de ${categoria}${r.candidatos&&r.candidatos.length?' (candidatos: '+r.candidatos.join(', ')+')':''}.`);
    return {...p, id:r.id};
  });
  let titulares = resolvePlayers(titularesRaw);
  const suplentes = resolvePlayers(suplentesRaw);

  // Si COMET trajo menos de 11 titulares (informe oficial incompleto, ej.
  // dorsales sin cargar), completar con la planilla de citación de esta
  // misma fecha -- pero SOLO si todos los que COMET sí encontró coinciden
  // con alguien de esa citación (confirma que es el mismo partido real, no
  // una fecha mal detectada). A pedido de Javi, 2026-09-01.
  if(titulares.length < 11){
    const citTit = (matchData[categoria]?.[fecha]?.titulares)||[];
    const citResueltos = citTit.map(c=>({...c, id: cometResolvePlayer(categoria, c.nombre).id}));
    const todosCoinciden = titulares.length>0 && titulares.every(p=>p.id!=null && citResueltos.some(c=>c.id===p.id));
    if(todosCoinciden){
      const idsTenemos = new Set(titulares.map(p=>p.id));
      const faltantes = citResueltos.filter(c=>c.id!=null && !idsTenemos.has(c.id));
      if(faltantes.length){
        faltantes.forEach(f=>titulares.push({dorsal:f.num??null, nombre:f.nombre, id:f.id, ar:false, cp:false, minutoSalida:null, minutoEntrada:null}));
        warnings.push(`COMET traía ${titularesRaw.length} titulares -- se completaron ${faltantes.length} más (${faltantes.map(f=>f.nombre).join(', ')}) desde la planilla de citación de esta fecha.`);
      }
    }
  }
  if(titulares.length!==11) warnings.push(`Se esperaban 11 titulares, se encontraron ${titulares.length}.`);

  const porNombre = {};
  titulares.concat(suplentes).forEach(p=>{ porNombre[normNombreOrdenIndependiente(p.nombre)] = p; });
  const resolveEvento = ev => {
    const p = porNombre[normNombreOrdenIndependiente(ev.nombre)];
    if(!p) warnings.push(`Evento de "${ev.nombre}" (dorsal ${ev.dorsal}, minuto ${ev.minuto}') no matchea con nadie de la alineación extraída — se descarta.`);
    return p ? {...ev, id:p.id} : null;
  };
  const goles = golesRaw.map(resolveEvento).filter(Boolean);
  const amarillas = amarillasRaw.map(resolveEvento).filter(Boolean);
  const rojas = rojasRaw.map(resolveEvento).filter(Boolean);

  // Minutos jugados: titular que no salió = 90; titular que salió = minuto
  // de salida; suplente que entró y no salió después = 90 - minuto de
  // entrada; suplente que nunca entró = 0. Duración fija en 90 (no la trae
  // el informe, y en las categorías con COMET los partidos son de 90').
  const DURACION = 90;
  titulares.forEach(p=>{ p.minutosJugados = p.minutoSalida!=null ? p.minutoSalida : DURACION; });
  suplentes.forEach(p=>{
    p.minutosJugados = p.minutoEntrada==null ? 0 : (p.minutoSalida!=null ? p.minutoSalida-p.minutoEntrada : DURACION-p.minutoEntrada);
  });

  return { categoria, fecha, rival, condicion, golesTigre, golesRival, titulares, suplentes, goles, amarillas, rojas, warnings };
}

function savePartidoComet(cat, fecha, data){
  if(!fbReady||!db||!canEdit) return Promise.reject(new Error('no-edit'));
  return db.ref(`stats/partidos/${cat}/${fecha}`).set({
    fuente:'comet', cargadoEl: new Date().toISOString(),
    rival:data.rival, condicion:data.condicion, golesTigre:data.golesTigre, golesRival:data.golesRival,
    titulares:data.titulares, suplentes:data.suplentes, goles:data.goles, amarillas:data.amarillas, rojas:data.rojas,
  });
}

// ── Panel de confirmación (subís el PDF, revisás lo que se extrajo, recién
//    ahí se guarda — mismo criterio que ya usaba la carga de GPS) ────────
async function subirInformeComet(file, cat, inputEl){
  if(inputEl) inputEl.value='';
  try{
    const data = await parseCometPdf(file, cat);
    abrirConfirmComet(cat, data);
  }catch(e){
    console.error('[COMET PDF]', e);
    showToast('⚠ ' + e.message);
  }
}

// ── Carga de varios informes de COMET a la vez ──────────────────────────
// Cada PDF ya trae su propia fecha detectada (parseCometPdf), así que no
// hay riesgo de que un partido pise a otro -- cada uno se guarda en su
// propia fecha (stats/partidos/{cat}/{fecha}). El único caso real donde dos
// PDF del lote apuntan a la MISMA fecha es un partido cortado y re-jugado
// en otra cancha (pasó con Lanús F3 en 4ta) -- ahí no adivinamos cuál vale,
// se lo mostramos aparte para que la persona elija.
// Agrupa por categoría+fecha (no por fecha sola) porque ahora un mismo lote
// puede traer informes de más de una categoría juntos -- cada PDF ya trae su
// propia categoría detectada (parseCometPdf), no hace falta que quien sube
// el archivo la elija de antemano.
function abrirConfirmCometLote(parsed, onClose){
  let m=document.getElementById('comet-confirm-modal');
  if(m) m.remove();
  m=document.createElement('div');
  m.id='comet-confirm-modal'; m.className='modal-bg';

  const porClave = {}; // "CAT|fecha" -> [{file,data,error}]
  parsed.forEach(p=>{ if(p.data) (porClave[`${p.data.categoria}|${p.data.fecha}`]=porClave[`${p.data.categoria}|${p.data.fecha}`]||[]).push(p); });
  const errores = parsed.filter(p=>p.error);
  const claves = Object.keys(porClave).sort((a,b)=>{
    const [catA,fA]=a.split('|'), [catB,fB]=b.split('|');
    return catA===catB ? Number(fA)-Number(fB) : catA.localeCompare(catB);
  });

  const marcador = d => d.condicion==='L' ? `${d.golesTigre}-${d.golesRival}` : `${d.golesRival}-${d.golesTigre}`;

  const rowsHTML = claves.map(clave=>{
    const [cat, fStr] = clave.split('|'); const f = Number(fStr);
    const grupo = porClave[clave];
    if(grupo.length>1){
      return `<div class="comet-lote-row conflict" data-clave="${clave}"
        style="background:rgba(192,21,42,0.1);border:1px solid rgba(192,21,42,0.4);border-radius:6px;padding:8px 10px;margin-bottom:6px">
        <div style="font-size:12px;color:#f0a0a8;margin-bottom:6px">⚠ ${esc(cat)} · Fecha ${f}: ${grupo.length} PDF distintos apuntan a la misma fecha — elegí cuál usar</div>
        ${grupo.map((p,i)=>`<label style="display:flex;gap:6px;align-items:center;font-size:12px;margin:4px 0">
          <input type="radio" name="comet-lote-pick-${clave}" value="${i}" ${i===0?'checked':''}>
          <span>${esc(p.file.name)} — ${esc(p.data.rival)} · Tigre ${marcador(p.data)} · ${p.data.goles.length} goles</span>
        </label>`).join('')}
      </div>`;
    }
    const p = grupo[0], yaExiste = partidos[cat] && partidos[cat][f];
    return `<div class="comet-lote-row" data-clave="${clave}" style="padding:6px 0;border-bottom:1px solid rgba(26,45,90,0.4)">
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;cursor:pointer">
        <input type="checkbox" class="comet-lote-check" checked style="margin-top:2px">
        <span style="flex:1"><b style="color:var(--gold2)">${esc(cat)}</b> · Fecha ${f} · ${esc(p.data.rival)} · Tigre ${marcador(p.data)} · ${p.data.goles.length} goles${yaExiste?' <span style="color:var(--muted)">(ya cargada, se actualiza)</span>':''}</span>
      </label>
      ${p.data.warnings.length?`<div style="font-size:11px;color:var(--gold2);margin:2px 0 0 24px">${p.data.warnings.map(w=>'⚠ '+esc(w)).join('<br>')}</div>`:''}
    </div>`;
  }).join('');

  const erroresHTML = errores.length?`<div style="font-size:11px;color:#ef4444;margin-top:10px">
    ${errores.map(e=>`✕ ${esc(e.file.name)}: ${esc(e.error)}`).join('<br>')}
  </div>`:'';

  m.innerHTML = `<div class="modal-box" style="width:440px;text-align:left;max-height:80vh;overflow:auto">
    <h2 style="text-align:center">INFORMES DE COMET</h2>
    <p style="text-align:center;font-size:12px;color:var(--muted)">${claves.length} fecha(s) detectada(s) de ${parsed.length} PDF</p>
    <div id="comet-lote-rows">${rowsHTML || '<p style="text-align:center;color:var(--muted)">No se pudo leer ninguna fecha.</p>'}</div>
    ${erroresHTML}
    <button class="m-btn" onclick="confirmarCometLote()">✓ GUARDAR TODO</button>
    <button class="m-cancel" onclick="cerrarCometLoteModal()">Cancelar</button>
  </div>`;
  document.body.appendChild(m);
  m._cometLote = porClave;
  m._onClose = onClose;
}

function cerrarCometLoteModal(){
  const m=document.getElementById('comet-confirm-modal');
  const cb = m && m._onClose;
  if(m) m.remove();
  if(cb) cb();
}

async function confirmarCometLote(){
  const m=document.getElementById('comet-confirm-modal');
  const porClave = m && m._cometLote;
  const onClose = m && m._onClose;
  if(!porClave) return;
  const aGuardar = [];
  m.querySelectorAll('.comet-lote-row').forEach(row=>{
    const clave = row.dataset.clave;
    const [cat, fStr] = clave.split('|'); const fecha = Number(fStr);
    const grupo = porClave[clave];
    if(row.classList.contains('conflict')){
      const picked = row.querySelector(`input[name="comet-lote-pick-${clave}"]:checked`);
      if(picked) aGuardar.push({cat, fecha, data: grupo[Number(picked.value)].data});
    } else {
      const check = row.querySelector('.comet-lote-check');
      if(check && check.checked) aGuardar.push({cat, fecha, data: grupo[0].data});
    }
  });
  m.remove();
  if(!aGuardar.length){ onClose && onClose(); return; }
  showToast(`☁ GUARDANDO ${aGuardar.length} FECHA(S)…`);
  let ok=0;
  const catsAfectadas = new Set();
  for(const {cat, fecha, data} of aGuardar){
    try{
      await savePartidoComet(cat, fecha, data);
      if(!partidos[cat]) partidos[cat]={};
      partidos[cat][fecha] = {
        fuente:'comet', rival:data.rival, condicion:data.condicion,
        golesTigre:data.golesTigre, golesRival:data.golesRival,
        titulares:data.titulares, suplentes:data.suplentes,
        goles:data.goles, amarillas:data.amarillas, rojas:data.rojas,
      };
      catsAfectadas.add(cat);
      ok++;
    }catch(e){ console.error('[COMET lote]', cat, fecha, e); }
  }
  showToast(ok===aGuardar.length ? `✓ ${ok} INFORME(S) GUARDADO(S)` : `⚠ ${ok}/${aGuardar.length} guardados — revisá la consola`);
  catsAfectadas.forEach(cat=>{ if(document.getElementById(`goleadores-${cat}`)) renderGoleadores(cat); });
  renderConfiabilidad('gen-confiabilidad');
  refreshAlerts();
  onClose && onClose();
}

function abrirConfirmComet(cat, data){
  let m=document.getElementById('comet-confirm-modal');
  if(m) m.remove();
  m=document.createElement('div');
  m.id='comet-confirm-modal'; m.className='modal-bg';

  // Jugadores de la alineación que no matchearon solos con el plantel —
  // acá se ofrece vincularlos a mano (queda guardado para siempre, no hay
  // que repetirlo la próxima vez que aparezca el mismo jugador).
  const sinVincular = data.titulares.concat(data.suplentes).filter(p=>!p.id);
  const roster = (plantelFutdetail[cat]||[]).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const vincularHTML = sinVincular.length
    ? `<div style="background:rgba(240,192,64,0.08);border:1px solid rgba(240,192,64,0.35);border-radius:6px;padding:8px 10px;margin:10px 0">
        <div style="font-size:11px;color:var(--gold2);margin-bottom:6px">⚠ ${sinVincular.length} jugador(es) sin vincular con el plantel:</div>
        ${sinVincular.map(p=>{
          const selId=('vinc-comet-'+p.dorsal+'-'+cat).replace(/[^a-zA-Z0-9-]/g,'_');
          const opts=roster.map(c=>`<option value="${esc(c.id)}">${esc(c.nombre)}</option>`).join('');
          return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px">
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.nombre)}">#${p.dorsal} ${esc(p.nombre)}</span>
            <select id="${selId}" style="background:var(--surface2,#0d1528);border:1px solid var(--border2,#243f7a);color:var(--text,#d8e4ff);font-size:11px;padding:2px 4px;border-radius:4px;max-width:130px">
              <option value="">— elegir —</option>${opts}
            </select>
            <button onclick='vincularJugadorComet(${JSON.stringify(cat)}, ${JSON.stringify(p.nombre)}, document.getElementById("${selId}").value)'
              style="background:rgba(26,58,143,0.25);border:1px solid var(--border2,#243f7a);color:var(--gold2,#f0c040);
              border-radius:4px;padding:3px 7px;font-size:10px;cursor:pointer;white-space:nowrap">🔗</button>
          </div>`;
        }).join('')}
      </div>` : '';

  const warnHTML = data.warnings.length
    ? `<div style="background:rgba(240,192,64,0.1);border:1px solid rgba(240,192,64,0.4);border-radius:6px;padding:8px 10px;margin:10px 0;font-size:11px;color:var(--gold2)">
        ${data.warnings.map(w=>`⚠ ${esc(w)}`).join('<br>')}
      </div>` : '';
  m.innerHTML = `<div class="modal-box" style="width:380px;text-align:left">
    <h2 style="text-align:center">INFORME DE PARTIDO · COMET</h2>
    <p style="text-align:center">${esc(cat)} · Fecha ${data.fecha} · ${esc(data.rival)} (${data.condicion==='L'?'Local':'Visitante'})</p>
    <p style="text-align:center;font-weight:700">Tigre ${data.condicion==='L'?data.golesTigre+' - '+data.golesRival:data.golesRival+' - '+data.golesTigre}</p>
    <div style="font-size:12px;color:var(--muted,#5a7099);text-align:center;margin-bottom:6px">
      ${data.titulares.length} titulares · ${data.suplentes.length} suplentes · ${data.goles.length} goles · ${data.amarillas.length} amarillas · ${data.rojas.length} rojas
    </div>
    ${vincularHTML}
    ${warnHTML}
    <button class="m-btn" onclick='confirmarComet(${JSON.stringify(cat)}, ${data.fecha})'>✓ GUARDAR</button>
    <button class="m-cancel" onclick="document.getElementById('comet-confirm-modal').remove()">Cancelar</button>
  </div>`;
  document.body.appendChild(m);
  m._cometData = data;
}

function vincularJugadorComet(cat, nombreComet, idElegido){
  if(!canEdit || !idElegido) return;
  const m=document.getElementById('comet-confirm-modal');
  const data = m && m._cometData;
  if(!data) return;
  const p = (plantelFutdetail[cat]||[]).find(x=>x.id===idElegido);
  if(!p) return;
  aliasJugadoresComet[cat]=aliasJugadoresComet[cat]||{};
  aliasJugadoresComet[cat][normNombreOrdenIndependiente(nombreComet)]=idElegido;
  guardarAliasJugadoresComet();
  // Resuelve YA MISMO esta carga (jugador + cualquier gol/tarjeta suyo) con
  // el vínculo recién guardado, sin esperar ningún viaje de ida y vuelta.
  data.titulares.concat(data.suplentes).forEach(pl=>{
    if(!pl.id && normNombreOrdenIndependiente(pl.nombre)===normNombreOrdenIndependiente(nombreComet)) pl.id=p.id;
  });
  data.goles.concat(data.amarillas, data.rojas).forEach(ev=>{
    if(!ev.id && normNombreOrdenIndependiente(ev.nombre)===normNombreOrdenIndependiente(nombreComet)) ev.id=p.id;
  });
  data.warnings = data.warnings.filter(w=>!w.includes(`"${nombreComet}"`));
  showToast('🔗 VINCULADO');
  abrirConfirmComet(cat, data);
}

function confirmarComet(cat, fecha){
  const m=document.getElementById('comet-confirm-modal');
  const data = m && m._cometData;
  if(!data) return;
  m.remove();
  showToast('☁ GUARDANDO…');
  savePartidoComet(cat, fecha, data)
    .then(()=>{
      showToast(`✓ Informe de F${fecha} guardado`);
      // Actualiza en memoria ya mismo (no hace falta esperar el viaje de
      // ida y vuelta del listener en vivo) y refresca todo lo que depende
      // de stats/partidos: goleadores de esta categoría, Confiabilidad (si
      // está a la vista, en GENERAL) y la alerta de amarillas del header.
      if(!partidos[cat]) partidos[cat]={};
      partidos[cat][fecha] = {
        fuente:'comet', rival:data.rival, condicion:data.condicion,
        golesTigre:data.golesTigre, golesRival:data.golesRival,
        titulares:data.titulares, suplentes:data.suplentes,
        goles:data.goles, amarillas:data.amarillas, rojas:data.rojas,
      };
      renderGoleadores(cat);
      renderConfiabilidad('gen-confiabilidad');
      refreshAlerts();
    })
    .catch(e=>{ console.error('savePartidoComet error:',e); showToast('⚠ No se pudo guardar — revisá la consola'); });
}

// ── VISTA DE CITACIÓN (solo lectura) ───────────────────────────
// Reemplaza al viejo campo "pegar un link a mano": si esa fecha ya se
// procesó (matchData[cat][fecha] tiene titulares), el ícono 📋 de la tabla
// abre esta ficha en vez de un link. condicionCat ya contempla que las
// categorías menores (7ma/8va/9na) juegan al revés que las mayores.
function abrirCitacionView(cat, fecha){
  const d = matchData[cat]?.[fecha];
  if(!d || !d.titulares?.length) return;
  const cond = condicionCat(cat, fecha);
  const condTxt = cond==='L' ? 'LOCAL' : cond==='V' ? 'VISITANTE' : '';
  const hayWarn = d.titulares.some(p=>p.warn) || d.suplentes.some(p=>p.warn);

  // Informe de COMET de esta misma fecha (Fase 4), si ya se subió — cruza
  // por id de plantel, no por nombre (evita comparar "Nombre Apellido" de
  // citación contra "APELLIDO, Nombre" de COMET). Citaciones cargadas antes
  // de que existiera el campo `id` (cualquiera de las 19 ya procesadas) lo
  // resuelven acá mismo al vuelo, no hace falta volver a subir el PDF.
  const partido = (partidos[cat]||{})[fecha];
  const idDeJugador = p => p.id!=null ? p.id
    : (plantelFutdetail[cat]||[]).find(x=>normNombreOrdenIndependiente(x.nombre)===normNombreOrdenIndependiente(p.nombre))?.id || null;

  const chipsList = (p, esTitular) => {
    if(!partido) return [];
    const id = idDeJugador(p);
    if(!id) return [];
    const chips=[];
    (partido.goles||[]).filter(g=>g.id===id).forEach(g=>chips.push(
      `<span title="Gol${g.penal?' de penal':''} · ${minSuf(g.minuto)}" style="color:var(--gold2)">⚽${minSuf(g.minuto)}${g.penal?' (P)':''}</span>`));
    (partido.amarillas||[]).filter(a=>a.id===id).forEach(a=>chips.push(
      `<span title="Amarilla · ${minSuf(a.minuto)}">🟨${minSuf(a.minuto)}</span>`));
    (partido.rojas||[]).filter(a=>a.id===id).forEach(a=>chips.push(
      `<span title="Roja · ${minSuf(a.minuto)}">🟥${minSuf(a.minuto)}</span>`));
    if(esTitular){
      const t=(partido.titulares||[]).find(x=>x.id===id);
      if(t?.minutoSalida!=null) chips.push(`<span title="Salió · ${t.minutoSalida}'" style="color:var(--muted)">↓${t.minutoSalida}'</span>`);
    } else {
      const s=(partido.suplentes||[]).find(x=>x.id===id);
      if(s?.minutoEntrada!=null) chips.push(`<span title="Entró · ${s.minutoEntrada}'" style="color:var(--win)">↑${s.minutoEntrada}'</span>`);
    }
    return chips;
  };
  const chipsDe = (p, esTitular) => {
    const chips=chipsList(p, esTitular);
    if(!chips.length) return '';
    return `<span style="display:flex;gap:6px;font-size:10px;font-family:'Barlow Condensed',sans-serif;margin-left:8px">${chips.join('')}</span>`;
  };

  const playerRow = (p, esTitular) => `<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--surface2);border-radius:6px;margin-bottom:4px">
    <span style="font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--gold2);min-width:22px;text-align:center">${p.num||'—'}</span>
    <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text);cursor:pointer" title="Ver perfil"
      onclick="document.getElementById('cit-view-overlay')?.remove();abrirPerfilJugador('${cat}','${esc(p.nombre).replace(/'/g,"\\'")}')">${esc(p.nombre)}</span>
    ${chipsDe(p, esTitular)}
    ${p.warn?'<span title="No coincide con nadie del plantel — revisar contra el PDF original" style="margin-left:auto;font-size:13px">⚠️</span>':''}
  </div>`;

  // Gol/tarjeta van por jugador (chipsList sin la parte de salió/entró).
  // Los cambios se muestran aparte, agrupados por minuto — así el que sale
  // y el que entra en la misma sustitución quedan en la misma fila, en vez
  // de dos filas sueltas sin relación visible entre sí.
  const chipsGolTarjeta = p => {
    if(!partido) return [];
    const id = idDeJugador(p);
    if(!id) return [];
    const chips=[];
    (partido.goles||[]).filter(g=>g.id===id).forEach(g=>chips.push(
      `<span title="Gol${g.penal?' de penal':''} · ${minSuf(g.minuto)}" style="color:var(--gold2)">⚽${minSuf(g.minuto)}${g.penal?' (P)':''}</span>`));
    (partido.amarillas||[]).filter(a=>a.id===id).forEach(a=>chips.push(
      `<span title="Amarilla · ${minSuf(a.minuto)}">🟨${minSuf(a.minuto)}</span>`));
    (partido.rojas||[]).filter(a=>a.id===id).forEach(a=>chips.push(
      `<span title="Roja · ${minSuf(a.minuto)}">🟥${minSuf(a.minuto)}</span>`));
    return chips;
  };
  const cambiosAgrupadosHTML = (titulares, suplentes) => {
    if(!partido) return '';
    const porMinuto = {};
    titulares.forEach(p=>{
      const id=idDeJugador(p); if(!id) return;
      const t=(partido.titulares||[]).find(x=>x.id===id);
      if(t?.minutoSalida!=null){
        if(!porMinuto[t.minutoSalida]) porMinuto[t.minutoSalida]={sale:[],entra:[]};
        porMinuto[t.minutoSalida].sale.push(p.nombre);
      }
    });
    suplentes.forEach(p=>{
      const id=idDeJugador(p); if(!id) return;
      const s=(partido.suplentes||[]).find(x=>x.id===id);
      if(s?.minutoEntrada!=null){
        if(!porMinuto[s.minutoEntrada]) porMinuto[s.minutoEntrada]={sale:[],entra:[]};
        porMinuto[s.minutoEntrada].entra.push(p.nombre);
      }
    });
    const minutos = Object.keys(porMinuto).map(Number).sort((a,b)=>a-b);
    return minutos.map(min=>{
      const {sale,entra} = porMinuto[min];
      return `<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--surface2);border-radius:6px;margin-bottom:4px;font-family:'Barlow Condensed',sans-serif;font-size:12px">
        <span style="font-family:'Bebas Neue',sans-serif;color:var(--gold2);min-width:28px">${min}'</span>
        <span style="flex:1">${sale.length?`<span style="color:var(--muted)">↓ ${sale.map(esc).join(', ')}</span>`:''}${sale.length&&entra.length?' <span style="color:var(--muted)">→</span> ':''}${entra.length?`<span style="color:var(--win)">↑ ${entra.map(esc).join(', ')}</span>`:''}</span>
      </div>`;
    }).join('');
  };
  // Resumen de eventos de un lado (titulares+suplentes) — solo jugadores
  // con gol/tarjeta, más los cambios agrupados por minuto. Reemplaza a la
  // lista completa cuando ya tenemos la imagen real de la planilla (no
  // tiene sentido repetir a todo el plantel si ya se lo ve en la foto).
  const eventosHTML = (titulares, suplentes) => {
    const filas = [...titulares, ...suplentes]
      .map(p=>({p, chips: chipsGolTarjeta(p)}))
      .filter(x=>x.chips.length);
    const filasHTML = filas.map(({p,chips})=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--surface2);border-radius:6px;margin-bottom:4px">
      <span style="font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--gold2);min-width:22px;text-align:center">${p.num||'—'}</span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text);flex:1">${esc(p.nombre)}</span>
      <span style="display:flex;gap:6px;font-size:10px;font-family:'Barlow Condensed',sans-serif">${chips.join('')}</span>
    </div>`).join('');
    const cambios = cambiosAgrupadosHTML(titulares, suplentes);
    if(!filas.length && !cambios) return '<div style="color:var(--muted);font-size:11px;font-family:Barlow Condensed,sans-serif;margin-bottom:6px">Sin goles, tarjetas ni cambios cargados para este partido.</div>';
    return filasHTML + cambios;
  };
  const listaCompletaHTML = (titulares, suplentes) => `
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;color:var(--muted);margin:14px 0 6px">TITULARES (${titulares.length})</div>
    ${titulares.map(p=>playerRow(p,true)).join('')}
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;color:var(--muted);margin:14px 0 6px">SUPLENTES (${suplentes.length})</div>
    ${suplentes.map(p=>playerRow(p,false)).join('')}`;
  // Bloque de una "mitad" (primer/segundo tiempo): imagen (si existe, se
  // pide aparte a Firebase — ver más abajo) + lista completa como placeholder
  // hasta que resuelva. Si la imagen aparece, se cambia la lista completa
  // por el resumen de eventos nada más (la foto ya muestra a todo el plantel).
  const mitadHTML = (imgKey, titulares, suplentes) => `
    <div id="cit-img-${imgKey}"></div>
    <div id="cit-body-${imgKey}">${listaCompletaHTML(titulares, suplentes)}</div>`;
  const cargarMitad = (imgKey, titulares, suplentes) => {
    db.ref(`citacionesImg/${imgKey}`).once('value').then(snap=>{
      const b64 = snap.val();
      if(!b64) return;
      const imgBox = document.getElementById(`cit-img-${imgKey}`);
      const bodyBox = document.getElementById(`cit-body-${imgKey}`);
      if(imgBox) imgBox.innerHTML = `<img src="${b64}" style="width:100%;display:block;border-radius:8px;margin-bottom:10px">`;
      if(bodyBox) bodyBox.innerHTML = eventosHTML(titulares, suplentes);
    }).catch(e=>console.warn('[CITACION IMG] no se pudo leer — revisar reglas de Firebase para citacionesImg', e));
  };
  const ov=document.createElement('div');
  ov.id='cit-view-overlay';
  ov.style.cssText='position:fixed;inset:0;z-index:10001;background:rgba(5,8,15,0.88);display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML=`<div style="background:#0a0f1e;border:1px solid #1a2d5a;border-radius:12px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;padding:20px 22px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
      <div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--gold2)">📋 CITACIÓN · F${fecha}</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text2)">${esc(d.rival||'—')}${condTxt?` · <span class="cond-badge cond-${cond}">${condTxt}</span>`:''}</div>
      </div>
      <button id="cit-view-close" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1">✕</button>
    </div>
    ${hayWarn?`<div style="font-size:11px;color:var(--draw);font-family:'Barlow Condensed',sans-serif;margin:8px 0">⚠️ Los nombres marcados no coinciden con el plantel — puede haber salido incompleto o cruzado al leer el PDF, revisá contra el original si hace falta.</div>`:''}
    ${d.segundoTiempo?`<div style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:var(--gold2);margin-top:10px">⏱️ PRIMER TIEMPO · NITO SAN ANDRÉS</div>`:''}
    ${mitadHTML(`${cat}/${fecha}`, d.titulares, d.suplentes)}
    ${d.segundoTiempo?`
    <div style="border-top:1px solid #1a2d5a;margin:16px 0"></div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;color:var(--gold2)">⏱️ SEGUNDO TIEMPO · ${esc(d.segundoTiempo.venue)}</div>
    <div style="font-size:11px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;margin-bottom:6px">El partido se cortó y siguió en otra cancha — esta es la planilla que se volvió a presentar ahí.</div>
    ${mitadHTML(`${cat}/${fecha}_2`, d.segundoTiempo.titulares, d.segundoTiempo.suplentes)}
    `:''}
  </div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
  ov.querySelector('#cit-view-close').addEventListener('click',()=>ov.remove());
  cargarMitad(`${cat}/${fecha}`, d.titulares, d.suplentes);
  if(d.segundoTiempo) cargarMitad(`${cat}/${fecha}_2`, d.segundoTiempo.titulares, d.segundoTiempo.suplentes);
}

// ── TABLE EVENTS ──────────────────────────────────────────────
function attachTableEvents(cat, tbodyId){
  const tbody=document.getElementById(tbodyId || `tbody-${cat}`);
  if(!tbody)return;
  tbody.addEventListener('change',e=>{
    if(e.target.classList.contains('score-input')){
      const f=parseInt(e.target.dataset.fecha),s=parseInt(e.target.dataset.side);
      const v=e.target.value===''?null:parseInt(e.target.value);
      if(!results[cat][f])results[cat][f]=[null,null];
      results[cat][f][s]=v;
      if(results[cat][f][0]===null&&results[cat][f][1]===null)results[cat][f]=null;
      rebuildRow(cat,f);
      const bloqueEl=document.getElementById(`bloque-cat-${cat}`);
      if(bloqueEl){
        const isReservaCat=cat==='RESERVA'||cat==='RESERVA_S2';
        bloqueEl.innerHTML = isReservaCat
          ? bloqueComparativaHTML((from,to)=>calcStats(cat,from,to), cat)
          : buildRendimientoGeneralHTML((from,to)=>calcStats(cat,from,to), cat, [cat]);
      }
      saveData();
    }
    if(e.target.classList.contains('link-input')){
      const f=parseInt(e.target.dataset.fecha),key=e.target.dataset.lkey,val=e.target.value.trim();
      links[cat][f][key]=val;
      const btn=e.target.nextElementSibling;
      if(btn){btn.href=val||'#';btn.classList.toggle('empty',!val);}
      saveData();
    }
    // RESERVA/RESERVA_S2 editable rival/cond
    if(e.target.classList.contains('rival-edit-input')||e.target.classList.contains('cond-edit-select')){
      const f=parseInt(e.target.dataset.fecha),field=e.target.dataset.field;
      if(!rivalData[cat][f]) rivalData[cat][f]={rival:'',cond:'L'};
      rivalData[cat][f][field]=e.target.value;
      saveData();
    }
  });
}

function rebuildRow(cat,fecha){
  const tbody=document.getElementById(`tbody-${cat}`);
  if(!tbody)return;
  tbody.querySelectorAll('tr').forEach(tr=>{
    const inp=tr.querySelectorAll('.score-input');
    if(!inp.length||parseInt(inp[0].dataset.fecha)!==fecha)return;
    const r=results[cat][fecha],res=r?getResult(r[0],r[1]):null;
    const scoreCell=inp[0].closest('.score-cell');
    let span=scoreCell.querySelector('.result-inline');
    if(res){
      const letraEs=res==='W'?'G':res==='D'?'E':'P';
      const pts=res==='W'?3:res==='D'?1:0;
      const color=res==='W'?'var(--win)':res==='D'?'var(--draw)':'var(--loss)';
      if(!span){
        span=document.createElement('span');
        span.className='result-inline';
        span.style.marginLeft='8px';
        span.style.fontWeight='700';
        scoreCell.appendChild(span);
      }
      span.style.color=color;
      span.textContent=`${letraEs} (${pts})`;
    } else if(span){
      span.remove();
    }
  });
}

// ── GOLEADORES ────────────────────────────────────────────────
// Nombre de plantel para un id (Fase 1) — para mostrar los goles que salen
// de COMET (que vienen con id, no con nombre) con el mismo nombre de
// siempre en la tabla de goleadores.
function plantelNombreDeId(cat, id){
  return (plantelFutdetail[cat]||[]).find(p=>p.id===id)?.nombre || null;
}

// Goles combinando COMET (Fase 4) y la carga manual: por cada fecha, gana
// COMET si esa fecha ya tiene un informe cargado; si no, vale la carga
// manual. Para categorías sin COMET (7MA/8VA/9NA/RESERVA) partidos[cat]
// siempre está vacío, así que esto se reduce exactamente a la carga manual
// de siempre — no hace falta una rama aparte por categoría.
// Fecha 3 de 4TA se jugó en dos canchas distintas (se cortó y se completó
// en otro predio, ver Citaciones/segundoTiempo) — los goles de esa fecha
// quedan repartidos de forma rara entre el informe de COMET y la carga
// manual, así que las comparaciones de Confiabilidad la saltean a propósito
// (a pedido explícito del usuario) en vez de mostrar un falso desacuerdo.
const FECHAS_GOLES_EXCLUIDAS = {'4TA': new Set([3])};
function fechasExcluidasGoles(cat){
  return FECHAS_GOLES_EXCLUIDAS[cat] || new Set();
}
function golesEfectivos(cat, excluirFechas){
  const excluir = excluirFechas || new Set();
  // La carga manual a veces se tipea distinto entre fechas ("Gonzalez
  // Santino" vs "GONZALEZ, SANTINO") — sin esto, el mismo jugador termina
  // partido en dos filas separadas de Goleadores. Se empareja contra el
  // plantel de ESTA categoría solamente (nunca cruza a otra categoría, así
  // que un mismo nombre en 4ta y 7ma nunca se mezcla).
  const rosterPorNombre={};
  (plantelFutdetail[cat]||[]).forEach(p=>{ rosterPorNombre[normNombreOrdenIndependiente(p.nombre)]=p.nombre; });
  const manualPorFecha = {};
  (goleadores[cat]||[]).forEach(g=>{ (manualPorFecha[g.fecha]=manualPorFecha[g.fecha]||[]).push(g); });
  const fechas = new Set([
    ...Object.keys(manualPorFecha).map(Number),
    ...Object.keys(partidos[cat]||{}).map(Number),
  ]);
  const map={};
  fechas.forEach(fecha=>{
    if(excluir.has(fecha)) return;
    const partido = (partidos[cat]||{})[fecha];
    if(partido){
      (partido.goles||[]).forEach(g=>{
        const name = plantelNombreDeId(cat, g.id) || g.nombre;
        if(!map[name]) map[name]={name, goals:0, fechas:[]};
        // Autogol: no suma al conteo de goles A FAVOR del jugador (es un gol
        // en contra) -- el dato de COMET nunca se borra, sigue en el detalle
        // de abajo, solo se excluye de esta cuenta (ver comentario en
        // parseCometPdf, donde se detecta el flag).
        if(!g.autogol) map[name].goals+=1;
        // COMET trae minuto y si fue de penal por gol -- antes se guardaba
        // pero se perdía acá, mostrando solo "F6" (sin poder ver en qué
        // minuto ni si fue penal, aunque el dato ya estaba cargado).
        const detalle = g.autogol ? 'autogol' : (g.minuto!=null ? `${g.minuto}'${g.penal?' P':''}` : '');
        map[name].fechas.push(detalle ? `F${fecha} (${detalle})` : `F${fecha}`);
      });
    } else {
      (manualPorFecha[fecha]||[]).forEach(g=>{
        const name = rosterPorNombre[normNombreOrdenIndependiente(g.name)] || g.name;
        if(!map[name]) map[name]={name, goals:0, fechas:[]};
        map[name].goals+=g.goals;
        map[name].fechas.push(`F${g.fecha}`);
      });
    }
  });
  return Object.values(map);
}

function renderGoleadores(cat){
  const wrap=document.getElementById(`goleadores-${cat}`);
  if(!wrap)return;
  const sorted=golesEfectivos(cat).sort((a,b)=>b.goals-a.goals);

  let rowsHTML='';
  if(sorted.length===0){
    rowsHTML=`<div class="gol-empty">Sin goleadores registrados</div>`;
  } else {
    sorted.forEach((g,i)=>{
      const rankClass=i===0?'gold':i===1?'silver':i===2?'bronze':'';
      const detalleHTML=g.fechas.map(f=>{
        const penal=/ P\)$/.test(f);
        return `<div class="gol-detail-item${penal?' penal':''}">${esc(f)}</div>`;
      }).join('');
      rowsHTML+=`<div class="gol-item">
        <div class="gol-row" onclick="this.closest('.gol-item').classList.toggle('expanded')">
          <div class="gol-rank ${rankClass}">${i+1}</div>
          <div class="gol-name" style="cursor:pointer" title="Ver perfil"
            onclick="event.stopPropagation();abrirPerfilJugador('${cat}','${esc(g.name).replace(/'/g,"\\'")}')">${esc(g.name)}</div>
          <div class="gol-count">${g.goals}</div>
          <div class="gol-toggle">▾</div>
          ${canEdit?`<button class="btn-del-gol" onclick="event.stopPropagation();delGoleador('${cat}','${esc(g.name)}')"
            style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;"
            title="Eliminar">✕</button>`:''}
        </div>
        <div class="gol-detail">${detalleHTML}</div>
      </div>`;
    });
  }

  wrap.innerHTML=`<div class="goleadores-grid">
    <div class="goleadores-card">
      <div class="gc-header">
        <h3>⚽ GOLEADORES ${cat}</h3>
        <span style="font-family:Bebas Neue,sans-serif;font-size:20px;color:rgba(255,255,255,0.7)">${sorted.length}</span>
      </div>
      <div class="gc-body">${rowsHTML}</div>
      ${canEdit?`<div class="gol-add-row">
        <input class="gol-input" id="gol-name-${cat}" placeholder="Nombre del jugador…" autocomplete="off">
        <input class="gol-fecha-input" id="gol-fecha-${cat}" type="number" min="1" max="35" placeholder="F#">
        <input class="gol-fecha-input" id="gol-count-${cat}" type="number" min="1" max="9" value="1" style="width:40px">
        <button class="btn-add-gol" onclick="addGoleador('${cat}')">+ GOL</button>
      </div>`:''}
    </div>
  </div>`;
}

      border-radius:6px;padding:8px 12px;font-family:'Barlow Condensed',sans-serif;font-size:14px;outline:none;margin-bottom:10px">
    <div id="roster-table-${cat}"></div>`;
