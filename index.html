      `<div style="text-align:center;padding:24px;color:var(--muted);font-family:Barlow Condensed,sans-serif;letter-spacing:1px;font-size:13px">Sin plantel cargado aún</div>`;
    return;
  }

  const merged=roster.map(p=>({...p, stats:statsPorNombre[normNombre(p.nombre)]||{}}));
  if(!rosterSortState[cat]) rosterSortState[cat]={key:'minutos_jugados', dir:-1};
  renderRosterTable(cat, merged);

  content.insertAdjacentHTML('beforeend', buildTarjetasJugadoresHTML(cat, merged));
  content.insertAdjacentHTML('beforeend', buildComparativaJugadoresHTML(cat, merged));
  document.querySelectorAll(`#comp-jug-selects-${cat} .comp-jug-select`).forEach(sel=>{
    sel.addEventListener('change',()=>renderComparativaJugadores(cat, merged));
  });
  renderComparativaJugadores(cat, merged);
}

// Mejor vel. máx (BL GPS) de un jugador y en qué fecha, para destacarla en
// su tarjeta -- mismo criterio de emparejamiento por nombre "orden
// independiente" que ya usa el resto de la app entre fuentes distintas.
function blTopSpeedInfo(cat, nombre){
  const nn = normNombreOrdenIndependiente(nombre);
  const entry = Object.entries(blPlayers).find(([n])=>normNombreOrdenIndependiente(n)===nn);
  if(!entry) return null;
  const matches = (entry[1].match||[]).filter(m=>m.metrics && m.metrics[6]!=null);
  if(!matches.length) return null;
  const best = matches.reduce((a,b)=> b.metrics[6]>a.metrics[6] ? b : a);
  return {velmax: best.metrics[6], fecha: blFechaNum(best.fecha)};
}
// Mismo cálculo que blTopSpeedInfo pero sobre catapultPlayers (ya viene
// separado por categoría, no hace falta cruzar contra todas). Se prefiere
// por sobre BL en la tarjeta -- Catapult directo es la fuente que se va a
// mantener activa de acá en adelante (Javi, 2026-09-02).
function catapultTopSpeedInfo(cat, nombre){
  const entry = catapultResolverJugador(cat, nombre);
  if(!entry) return null;
  const matches = (entry[1].match||[]).filter(m=>m.metrics && m.metrics[6]!=null);
  if(!matches.length) return null;
  const best = matches.reduce((a,b)=> b.metrics[6]>a.metrics[6] ? b : a);
  return {velmax: best.metrics[6], fecha: blFechaNum(best.fecha)};
}
function topSpeedInfo(cat, nombre){
  return catapultTopSpeedInfo(cat, nombre) || blTopSpeedInfo(cat, nombre);
}

// Dibuja la tarjeta de un jugador como imagen (canvas), mismo patrón que
// dibujarTarjetaRival (fuentes/colores fijos porque canvas no lee
// var(--...), SCALE=3 para que no salga pixelado, toBlob al final).
async function dibujarTarjetaJugador(cat, nombre){
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  const roster = plantelFutdetail[cat]||[];
  const jugador = roster.find(p=>p.nombre===nombre);
  const statsPorNombre={};
  (jugadoresStats[cat]||[]).forEach(j=>{ statsPorNombre[normNombre(j.jugador)]=j; });
  const s = statsPorNombre[normNombre(nombre)]||{};
  const golData = golesEfectivos(cat).find(g=>g.name===nombre
    || normNombreOrdenIndependiente(g.name)===normNombreOrdenIndependiente(nombre));
  const golesFilas = (golData?.fechas||[]).slice(0,4);
  const top = topSpeedInfo(cat, nombre);

  const BG='#111e38', GOLD='#f0c040', GOLD2='#e0bc4a', TXT='#e8edf7', TXT2='#a8c0e8', MUTED='#8aa0cc', BORDER='#3a5090';
  const W=900, H=700, pad=48, SCALE=3;
  const canvas=document.createElement('canvas');
  canvas.width=W*SCALE; canvas.height=H*SCALE;
  const ctx=canvas.getContext('2d');
  ctx.scale(SCALE,SCALE);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  ctx.textBaseline='top';

  const escudoTigre = await cargarImagen(document.getElementById('escudoImg')?.src);
  if(escudoTigre) ctx.drawImage(escudoTigre, pad, pad, 60, 60);

  ctx.font="15px 'Barlow', sans-serif"; ctx.fillStyle=TXT2; ctx.textAlign='right';
  const catLabel = CATEGORIAS_CONFIG[cat]?.label ? CATEGORIAS_CONFIG[cat].label.toUpperCase()+' DIVISIÓN' : cat;
  ctx.fillText(catLabel, W-pad, pad+22);
  ctx.textAlign='left';

  let y = pad+100;
  const iniciales = nombre.split(/[\s,]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
  const cx=pad+55, cy=y+55, r=55;
  const grad = ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  grad.addColorStop(0,'#c9a227'); grad.addColorStop(1,'#8a6a10');
  ctx.fillStyle=grad;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1206'; ctx.font="700 40px 'Bebas Neue', sans-serif"; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(iniciales, cx, cy+2);
  ctx.textAlign='left'; ctx.textBaseline='top';

  ctx.font="700 44px 'Bebas Neue', sans-serif"; ctx.fillStyle=TXT;
  ctx.fillText(nombre.toUpperCase(), pad+130, y+18);
  ctx.font="18px 'Barlow Condensed', sans-serif"; ctx.fillStyle=MUTED;
  ctx.fillText(`${jugador?.posicion||'—'} · ${cat}`, pad+130, y+68);

  y += 160;
  const stats=[['CONV.',s.convocatorias],['TITULAR',s.partidos_titular],['MINUTOS',s.minutos_jugados],['GOLES',s.goles]];
  const boxW=(W-pad*2-3*16)/4, boxH=100;
  stats.forEach(([label,val],i)=>{
    const bx=pad+i*(boxW+16);
    ctx.strokeStyle=BORDER; ctx.lineWidth=1;
    ctxRoundRect(ctx,bx,y,boxW,boxH,10); ctx.stroke();
    ctx.font="700 38px 'Bebas Neue', sans-serif"; ctx.fillStyle=GOLD2; ctx.textAlign='center';
    ctx.fillText(String(val||0), bx+boxW/2, y+22);
    ctx.font="13px 'Barlow Condensed', sans-serif"; ctx.fillStyle=MUTED;
    ctx.fillText(label, bx+boxW/2, y+70);
    ctx.textAlign='left';
  });

  y += boxH+50;
  if(golesFilas.length){
    ctx.font="700 20px 'Barlow Condensed', sans-serif"; ctx.fillStyle=GOLD;
    ctx.fillText('⚽ GOLES', pad, y);
    y+=36;
    ctx.font="20px 'Barlow Condensed', sans-serif"; ctx.fillStyle=TXT2;
    golesFilas.forEach(f=>{ ctx.fillText(f, pad, y); y+=32; });
    y+=20;
  }
  if(top){
    ctx.font="700 20px 'Barlow Condensed', sans-serif"; ctx.fillStyle=GOLD;
    ctx.fillText('⚡ RENDIMIENTO FÍSICO', pad, y);
    y+=36;
    ctx.font="20px 'Barlow Condensed', sans-serif"; ctx.fillStyle=TXT2;
    ctx.fillText(`Vel. máx ${top.velmax} km/h${top.fecha?` · F${top.fecha}`:''}`, pad, y);
    y+=32;
  }

  return new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
}

function renderRosterTable(cat, merged){
  const {key, dir}=rosterSortState[cat];
  const col=ROSTER_COLS.find(c=>c.key===key);
  // Comparador siempre en orden ascendente; dir=1 ascendente, dir=-1 descendente.
  const sorted=[...merged].sort((a,b)=>{
    const va=rosterColValue(a,key), vb=rosterColValue(b,key);
    const asc = col.type==='num'
      ? (parseFloat(va)||0)-(parseFloat(vb)||0)
      : String(va||'').localeCompare(String(vb||''));
    return asc*dir;
  });

  const headHTML=ROSTER_COLS.map(c=>{
    const active=c.key===key;
    const arrow=active?(dir===1?' ▲':' ▼'):'';
    return `<th data-key="${c.key}" style="cursor:pointer;user-select:none;white-space:nowrap">${c.label}${arrow}</th>`;
  }).join('');

  const rows=sorted.map(p=>{
    const foto=p.foto
      ? `<img src="${esc(p.foto)}" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px" onerror="this.style.display='none'">`
      : `<span style="display:inline-block;width:32px;height:32px;border-radius:50%;background:var(--surface2);vertical-align:middle;margin-right:8px"></span>`;
    const s=p.stats||{};
    return `<tr data-nombre="${esc((p.nombre||'').toLowerCase())}">
      <td class="rival-name" style="cursor:pointer" onclick="abrirPerfilJugador('${cat}','${esc(p.nombre||'').replace(/'/g,"\\'")}')"
        title="Ver perfil">${foto}${esc(p.nombre||'—')}</td>
      <td>${esc(p.posicion||'—')}</td>
      <td>${p.edad||'—'}</td>
      <td>${s.convocatorias||0}</td>
      <td>${s.partidos_titular||0}</td>
      <td>${s.minutos_jugados||0}</td>
      <td style="color:#60a5fa;font-weight:700">${s.goles||0}</td>
      <td>${s.asistencias||0}</td>
      <td style="color:var(--draw)">${s.tarjeta_amarilla||0}</td>
      <td style="color:var(--loss)">${s.tarjeta_roja||0}</td>
      <td style="white-space:nowrap">
        <button class="btn-ficha-jugador" data-nombre="${esc(p.nombre||'')}" title="Exportar ficha en PDF"
        style="background:none;border:1px solid var(--border2);border-radius:5px;color:var(--gold2);
        font-size:13px;padding:3px 9px;cursor:pointer">📄</button>
        ${canEdit?`<button class="btn-archivar-jugador" data-nombre="${esc(p.nombre||'')}" title="Archivar (ya no está en el club)"
        style="background:none;border:1px solid var(--border2);border-radius:5px;color:var(--muted);
        font-size:13px;padding:3px 9px;cursor:pointer;margin-left:4px">📦</button>`:''}
      </td>
    </tr>`;
  }).join('');

  const archivados = jugadoresArchivados[cat]||[];
  const archivadosHTML = (canEdit && archivados.length) ? `
    <div style="margin-top:10px;font-size:11px;color:var(--muted);font-family:'Barlow Condensed',sans-serif">
      Archivados: ${archivados.map(n=>`${esc(n)} <a href="#" class="link-desarchivar" data-nombre="${esc(n)}" style="color:var(--gold2)">↩ restaurar</a>`).join(' &nbsp;·&nbsp; ')}
    </div>` : '';

  const wrap=document.getElementById(`roster-table-${cat}`);
  wrap.innerHTML=`<div class="table-wrap"><table>
      <thead><tr>${headHTML}<th>PDF</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>${archivadosHTML}`;

  wrap.querySelectorAll('th[data-key]').forEach(th=>{
    th.addEventListener('click',()=>{
      const k=th.dataset.key;
      const st=rosterSortState[cat];
      st.dir = (st.key===k) ? -st.dir : -1;
      st.key = k;
      renderRosterTable(cat, merged);
    });
  });
  wrap.querySelectorAll('.btn-ficha-jugador').forEach(btn=>{
    btn.addEventListener('click',()=>exportFichaJugador(cat, btn.dataset.nombre));
  });
  wrap.querySelectorAll('.btn-archivar-jugador').forEach(btn=>{
    btn.addEventListener('click',()=>archivarJugador(cat, btn.dataset.nombre));
  });
  wrap.querySelectorAll('.link-desarchivar').forEach(a=>{
    a.addEventListener('click',(ev)=>{ ev.preventDefault(); desarchivarJugador(cat, a.dataset.nombre); });
  });
}

function addGoleador(cat){
  const nameEl=document.getElementById(`gol-name-${cat}`);
  const fechaEl=document.getElementById(`gol-fecha-${cat}`);
  const countEl=document.getElementById(`gol-count-${cat}`);
  const name=nameEl.value.trim();
  const fecha=parseInt(fechaEl.value);
  const count=parseInt(countEl.value)||1;
  if(!name||!fecha||fecha<1||fecha>35){
    nameEl.style.borderColor='var(--red)';
    setTimeout(()=>nameEl.style.borderColor='',1500);
    return;
  }
  if(!goleadores[cat])goleadores[cat]=[];
  goleadores[cat].push({name,goals:count,fecha});
  nameEl.value=''; fechaEl.value=''; countEl.value='1';
  saveData();
  renderGoleadores(cat);
}

// Borra SOLO la carga manual de goleadores de una fecha puntual (no toca
// otras fechas ni otros jugadores) — para cuando ya hay informe de COMET

// Etiquetas de los torneos de Reserva (se muestran dos, apilados)
const TABLA_LABELS = { 'RESERVA_APE':'PROYECCIÓN APERTURA', 'RESERVA_CLA':'PROYECCIÓN CLAUSURA' };
// Color de cada torneo de reserva (las juveniles ya tienen color en CAT_COLORS)

// Correcciones manuales a la tabla de posiciones de la LPF: casos puntuales
// donde confirmamos (contra otra fuente) que la LPF tiene mal su propio
// dato y es muy improbable que lo corrijan. Se aplica SOLO sobre el espejo
// crudo de la LPF (TABLA_DATA.categorias) — no toca "results"/calcStats,
// que ya está bien porque sale de tu propia planilla.
const CORRECCIONES_TABLA_LPF = [
  {cat:'6TA', gf:1, dif:1, fecha:13, gfFecha:1, gcFecha:2,
   motivo:'LPF omitió un gol de Tigre vs River (F13); sabadogol y statfutbol sí lo tienen (1-2). Confirmado 2026-08-15, re-confirmado con statfutbol 2026-09-01.'},
];
function aplicarCorreccionesTablaLPF(data){
  if(!data || !data.categorias) return data;
  CORRECCIONES_TABLA_LPF.forEach(c=>{
    const fila=(data.categorias[c.cat]||[]).find(f=>/tigre/i.test(f.equipo));
    if(fila){
      if(c.gf)  fila.gf  += c.gf;
      if(c.gc)  fila.gc  += c.gc;
      if(c.dif) fila.dif += c.dif;
      if(c.pts) fila.pts += c.pts;
    }
    // Mismo error también en el fixture partido a partido (usado por
    // Confiabilidad para "resultado por partido") -- corregir ahí también,
    // si no la alerta de esa fecha puntual sigue apareciendo aunque la
    // tabla de posiciones ya esté bien.
    if(c.fecha!=null && data.fixture && data.fixture[c.cat] && data.fixture[c.cat][c.fecha]){
      data.fixture[c.cat][c.fecha].gf = c.gfFecha;
      data.fixture[c.cat][c.fecha].gc = c.gcFecha;
    }
  });
  return data;
}

// Si un link (Partido / Resumen Goles / Análisis Propio) está vacío en tu
// carga manual, se completa solo con lo que ya haya en futdetail. Si vos ya
// cargaste algo, no se toca.
const LINK_KEYS_DESDE_FUTDETAIL = {par:'partido_url', res:'momentos_destacados_url', ana:'analisis_url', prx:'rival_url'};
function completarLinksDesdeFutdetail(data){
  const fixtureFut=data && data.fixture_futdetail;
  if(!fixtureFut) return;
  Object.keys(fixtureFut).forEach(cat=>{
    Object.keys(fixtureFut[cat]).forEach(fechaStr=>{
      const fecha=parseInt(fechaStr);
      const partido=fixtureFut[cat][fechaStr];
      if(!links[cat] || !links[cat][fecha]) return;
      Object.entries(LINK_KEYS_DESDE_FUTDETAIL).forEach(([key, campo])=>{
        const actual=(links[cat][fecha][key]||'').trim();
        const desdeFutdetail=(partido[campo]||'').trim();
        if(!actual && desdeFutdetail) links[cat][fecha][key]=desdeFutdetail;
      });
    });
  });
}
// Los "minutos jugados"/goles/etc. de PLANTEL quedaban estaticos en Firebase
// (a diferencia de la tabla LPF, que se refresca sola cada 30 min) porque
// nunca hubo nada que los volviera a pedir. Ahora el scraper los trae
// frescos en data/tablas.json (jugadores_futdetail) y, cuando abre un
// editor, esto los compara contra lo ya guardado y sube solo lo que cambió
// -- mismo criterio que completarLinksDesdeFutdetail, pero esto sí escribe
// directo (no espera a que otra cosa dispare un saveData()).
// Jugadores duplicados en futdetail (misma persona con dos fichas propias,
// confirmado con el club, que todavía no lo unificó de su lado): se
// fusionan solos cada vez que llega data fresca, tanto si futdetail manda
// las dos fichas juntas (se suman los números) como si por ahora solo
// carga en una de las dos (se renombra directo a la canónica). Sacar esta
// entrada de la lista el día que el club confirme que ya lo unificó.
const FUSIONES_JUGADORES_DUPLICADOS = {
  '8VA': [
    {alias:'Fino Amadeo Benjamin', canonico:'Fino Amadeo'},
    {alias:'Arias Bonilla  Nicolás Geremias ', canonico:'Arias Nicolas'},
  ],
};
function aplicarFusionesDuplicados(cat, lista, campoNombre){
  const fusiones = FUSIONES_JUGADORES_DUPLICADOS[cat];
  if(!fusiones || !lista) return lista;
  fusiones.forEach(({alias, canonico})=>{
    const idxAlias = lista.findIndex(x=>x[campoNombre]===alias);
    if(idxAlias<0) return;
    const idxCanon = lista.findIndex(x=>x[campoNombre]===canonico);
    if(idxCanon<0){ lista[idxAlias][campoNombre]=canonico; return; }
    const a=lista[idxAlias], c=lista[idxCanon];
    ['convocatorias','partidos_titular','minutos_jugados','goles','asistencias','tarjeta_amarilla','tarjeta_roja'].forEach(campo=>{
      if(typeof a[campo]==='number') c[campo]=(c[campo]||0)+a[campo];
    });
    lista.splice(idxAlias,1);
  });
  return lista;
}
function sincronizarJugadoresDesdeFutdetail(){
  if(!canEdit || !fbReady) return;
  const fresh=TABLA_DATA && TABLA_DATA.jugadores_futdetail;
  if(!fresh) return;
  Object.keys(fresh).forEach(cat=>{
    const nuevo=aplicarFusionesDuplicados(cat, fresh[cat], 'jugador');
    if(!nuevo || !nuevo.length) return;
    if(JSON.stringify(nuevo)===JSON.stringify(jugadoresStats[cat])) return;
    jugadoresStats[cat]=nuevo;
    db.ref('stats/jugadores/'+cat).set(nuevo).catch(e=>console.warn('sincronizarJugadoresDesdeFutdetail:',e));
  });
  refreshActiveModule();
}
// El plantel (roster con posición/edad/altura/peso/pie/foto) también queda
// estático en Firebase salvo que esto lo pise -- mismo criterio que
// sincronizarJugadoresDesdeFutdetail, pero para TABLA_DATA.plantel_futdetail
// (scripts/scrape_tablas.py, agregado 2026-08-29). Un jugador nuevo dado de
// alta en futdetail, o un dato corregido ahí, llega solo la próxima vez que
// alguien con permiso de edición abre la app.
function sincronizarPlantelDesdeFutdetail(){
  if(!canEdit || !fbReady) return;
  const fresh=TABLA_DATA && TABLA_DATA.plantel_futdetail;
  if(!fresh) return;
  Object.keys(fresh).forEach(cat=>{
    const nuevo=aplicarFusionesDuplicados(cat, fresh[cat], 'nombre');
    if(!nuevo || !nuevo.length) return;
    if(JSON.stringify(nuevo)===JSON.stringify(plantelFutdetail[cat])) return;
    plantelFutdetail[cat]=nuevo;
    db.ref('stats/plantel/'+cat).set(nuevo).catch(e=>console.warn('sincronizarPlantelDesdeFutdetail:',e));
  });
  assignPlayerIds();
  refreshActiveModule();
}
// La tabla de resultados puede haberse dibujado antes de que esto termine
// de cargar (es una llamada async aparte) — sincroniza los inputs que
// hayan quedado vacíos en pantalla con lo que se acaba de completar.
function sincronizarLinksVaciosEnPantalla(){
  document.querySelectorAll('.link-input').forEach(inp=>{
    if(inp.value.trim()) return;
    const dataCat=inp.dataset.cat, fecha=parseInt(inp.dataset.fecha), key=inp.dataset.lkey;
    const val=(links[dataCat]?.[fecha]?.[key]||'').trim();
    if(!val) return;
    inp.value=val;
    const btn=inp.parentElement.querySelector('.link-btn');
    if(btn){ btn.href=val; btn.classList.remove('empty'); }
  });
}

function loadTablaData(){
  if(TABLA_DATA) return Promise.resolve(TABLA_DATA);
  // cache-buster para que el navegador no sirva un JSON viejo tras un update
  return fetch('data/tablas.json?v='+Date.now())
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(j=>{
      TABLA_DATA=aplicarCorreccionesTablaLPF(j);
      completarLinksDesdeFutdetail(TABLA_DATA);
      sincronizarLinksVaciosEnPantalla();
      sincronizarJugadoresDesdeFutdetail();
      sincronizarPlantelDesdeFutdetail();
      blPlayers = (TABLA_DATA.bl_gps && TABLA_DATA.bl_gps.players) || {};
      catapultPlayers = (TABLA_DATA.catapult_gps && TABLA_DATA.catapult_gps.players) || {};
      return TABLA_DATA;
    })
    .catch(e=>{ console.warn('tablas.json:',e); TABLA_DATA={categorias:{}}; return TABLA_DATA; });
}

// Genera las <tr> de una tabla a partir de un array de filas (reutilizable).
// Enriquece cada fila de la tabla de posiciones con los datos derivados que
// necesita cualquier render (pantalla o PDF) — separado del maquillaje
// visual de cada uno, así un cambio al criterio ("qué cuenta como Tigre",
// el signo de la diferencia de gol) llega a los dos lugares a la vez.
function enriquecerFilasTabla(filas){
  return filas.map(f=>({
    ...f,
    esTigre: /tigre/i.test(f.equipo),
    difTono: f.dif>0?'win':f.dif<0?'loss':'muted'
  }));
}

function _filasTabla(filas){
  const TONO={win:'var(--win)', loss:'var(--loss)', muted:'var(--muted)'};
  return enriquecerFilasTabla(filas).map(f=>{
    const esTigre=f.esTigre;
    const dgC=TONO[f.difTono];
    return `<tr${esTigre?' style="background:rgba(192,21,42,0.42);font-weight:700;box-shadow:inset 4px 0 0 #e0202a"':''}>
      <td style="color:${esTigre?'#fff':'var(--muted)'};font-weight:700${esTigre?';padding-left:12px':''}">${f.pos}°</td>
      <td class="rival-name"${esTigre?' style="color:#fff;text-align:left"':''}>${f.equipo}</td>
      <td style="color:var(--gold2);font-weight:700">${f.pts}</td>
      <td${esTigre?' style="color:#fff"':''}>${f.pj}</td>
      <td style="color:${esTigre?'#fff':'var(--win)'}">${f.pg}</td>
      <td style="color:${esTigre?'#fff':'var(--draw)'}">${f.pe}</td>
      <td style="color:${esTigre?'#fff':'var(--loss)'}">${f.pp}</td>
      <td style="color:${esTigre?'#fff':'#60a5fa'}">${f.gf}</td>
      <td style="color:${esTigre?'#fff':'#f87171'}">${f.gc}</td>
      <td style="color:${esTigre?'#fff':dgC};font-weight:700">${f.dif>0?'+':''}${f.dif}</td>
    </tr>`;
  }).join('');
}
function _tablaHTML(filas){
  return `<table>
    <thead><tr class="thead-sub">
      <th>Pos</th><th style="text-align:left">Equipo</th><th>Pts</th><th>J</th>
      <th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DIF</th>
    </tr></thead>
    <tbody>${_filasTabla(filas)}</tbody>
  </table>`;
}

// Tabla LPF de una categoría (4TA-9NA), incrustada al final de su panel
// en ESTADÍSTICAS (ver renderStatsSingle). containerId es el <div> destino.
function renderTablaLPF(cat, containerId){
  const el=document.getElementById(containerId);

// ============================================================
// State
// ── RENDIMIENTO (tabla por bloque de goles + resumen por bloque) ──────────
// La condición LOCAL/VISITANTE de RIVALS es la de 4ta/5ta/6ta. Las menores
// (7ma/8va/9na) juegan siempre al revés (el fixture oficial las pone en la
// columna espejo: cuando las mayores son local, las menores son visitante).
// Por eso el LVV combinado hay que calcularlo con la condición correcta POR
// categoría, no la cruda de RIVALS (si no, las 3 menores se cuentan como
// local y da, ej. en F21, 8-0 en vez de 6-2).
// CATS_MENORES ahora sale de CATEGORIAS_CONFIG (campo esMenor).
function condicionCat(cat, fecha){
  const base = RIVALS.find(x=>x.f===fecha)?.c;
  if(!base) return null;
  return CATS_MENORES.has(cat) ? (base==='L'?'V':'L') : base;
}
// Reparte los partidos de varias categorías (un rango de fechas) en local /
// visitante con la condición correcta por categoría. Devuelve pts + G/E/P +
// goles de cada lado.
function lvvSplit(cats, from, to){
  const L={pg:0,pe:0,pp:0,gf:0,gc:0}, V={pg:0,pe:0,pp:0,gf:0,gc:0};
  cats.forEach(cat=>{
    for(let f=from; f<=to; f++){
      const res=results[cat]?.[f];
      if(!res) continue;
      const cond=condicionCat(cat,f);
      if(!cond) continue;
      const x=getResult(res[0],res[1]);
      const b = cond==='L'?L:V;
      if(x==='W')b.pg++; else if(x==='D')b.pe++; else b.pp++;
      b.gf+=res[0]; b.gc+=res[1];
    }
  });
  const pts=b=>b.pg*3+b.pe, pj=b=>b.pg+b.pe+b.pp;
  return { L:{...L, pts:pts(L), pj:pj(L)}, V:{...V, pts:pts(V), pj:pj(V)} };
}

// Tabla "RESUMEN POR BLOQUE": una fila por bloque (+ total) con Pts/PJ,
// % victorias, GF/PJ, GC/PJ y los puntos de local y de visitante. Reemplaza
// al viejo "Local vs Visitante" (solo último bloque) + "Índice de
// rendimiento" (índice compuesto 0-100, sacado a pedido).
// Una fila por bloque (+ TOTAL): PTS/PJ/PG/PE/PP/GF/GC/DG (como una tabla de
// posiciones normal, "el cuadro") y, separado por una línea dorada más
// gruesa después de DG, Local/Visitante (puntos + G-E-P de cada condición)
// y % de partidos ganados.
function buildResumenPorBloqueHTML(calcFn, periodsCat, cats){
  const { filas, tot } = calcBloqueFilas(calcFn, periodsCat);
  if(!filas.length){
    return `<div style="text-align:center;padding:20px;color:var(--muted);
      font-family:'Barlow Condensed',sans-serif;font-size:13px">Todavía no se jugaron partidos</div>`;
  }
  const isReserva = periodsCat==='RESERVA'||periodsCat==='RESERVA_S2';
  const DIV='border-right:3px solid rgba(240,192,64,0.4)';
  const cell=(v,col)=>`<td style="text-align:center;color:${col}">${v}</td>`;
  const lvvCell=(s)=>`<td style="text-align:center"><div style="font-weight:700;color:var(--gold2)">${s.pts}</div><div style="font-size:9px;color:var(--muted)">${s.pg}-${s.pe}-${s.pp}</div></td>`;
  const buildRow=(label, s, from, to, extraStyle)=>{
    if(s.pj===0) return '';
    const dgC=s.dg>0?'var(--win)':s.dg<0?'var(--loss)':'var(--muted)';
    const pctW=Math.round(s.pg/s.pj*100)+'%';
    const lvv=lvvSplit(cats, from, to);
    return `<tr${extraStyle||''}>
      <td class="cat-cell">${label}</td>
      ${cell(s.pts,'var(--gold2)')}
      <td style="text-align:center">${s.pj}</td>
      ${cell(s.pg,'var(--win)')}${cell(s.pe,'var(--draw)')}${cell(s.pp,'var(--loss)')}
      ${cell(s.gf,'#60a5fa')}
      ${cell(s.gc,'#f87171')}
      <td style="text-align:center;color:${dgC};font-weight:700;${DIV}">${s.dg>0?'+':''}${s.dg}</td>
      ${cell(pctW,'var(--win)')}
      ${lvvCell(lvv.L)}${lvvCell(lvv.V)}
    </tr>`;
  };
  const rowsHTML=filas.map(f=>buildRow(f.label, f.s, f.from, f.to,
    f.destacado?' style="outline:2px solid var(--gold);outline-offset:-2px"':'')).join('');
  const totRow=buildRow('TOTAL', tot, 1, isReserva?18:35, ' style="background:rgba(192,21,42,0.1);font-weight:700"');
  return `<div class="gen-table-wrap"><table class="gen-table">
      <thead><tr>
        <th>BLOQUE</th><th>PTS</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th>
        <th style="${DIV}">DG</th>
        <th>%</th><th>🏠 LOCAL</th><th>✈ VISIT</th>
      </tr></thead>
      <tbody>${rowsHTML}${totRow}</tbody>
    </table></div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);margin-top:4px">
      Local / Visitante: puntos y G-E-P de cada condición${cats.length>1?' (las categorías menores 7ma/8va/9na juegan al revés que las mayores, ya contemplado)':''}. % = partidos ganados.
    </div>`;
}

function buildRendimientoGeneralHTML(calcFn, periodsCat, cats){

// Detecta el sistema táctico ("1-4-3-3") a partir de las coordenadas x/y de
// los titulares que ya guarda la citación (parseCitacionRaw ya las guarda
// por jugador, se usaban antes solo para saber a qué línea de texto
// pertenece cada uno). Agrupa los 10 jugadores de campo en líneas por
// cercanía en Y (el arquero, dorsal 1, no cuenta como línea -- va aparte
// como el "1" fijo al principio) y arma las líneas de defensa a ataque
// según cuál queda más cerca del arquero.
// OJO -- a diferencia del resto de los parsers de PDF de este proyecto
// (GPS, COMET, citación en sí), este agrupamiento todavía NO se probó
// contra citaciones reales -- si el sistema que muestra no coincide con lo
// que se ve en la planilla real de una fecha, hace falta calibrarlo con
// ese PDF como referencia (mismo criterio que se usó para los demás).
function detectarSistemaCitacion(titulares){
  if(!titulares || titulares.length<11) return null;
  const conCoords = titulares.filter(p=>p.x!=null && p.y!=null);
  if(conCoords.length<11) return null;
  let gk = conCoords.find(p=>p.num===1);
  let outfield = gk ? conCoords.filter(p=>p!==gk) : conCoords.slice();
  if(!gk){
    // Sin dorsal 1 -- el arquero es el que queda más lejos del centroide del resto.
    const avgY = outfield.reduce((a,p)=>a+p.y,0)/outfield.length;
    outfield = outfield.slice().sort((a,b)=>Math.abs(b.y-avgY)-Math.abs(a.y-avgY));
    gk = outfield.shift();
  }
  if(outfield.length!==10) return null;
  const sorted = outfield.slice().sort((a,b)=>a.y-b.y);
  const gaps = [];
  for(let i=1;i<sorted.length;i++) gaps.push(sorted[i].y-sorted[i-1].y);
  if(!gaps.length || gaps.every(g=>g<=0)) return null;
  // En vez de un umbral fijo (fallaba: la variación normal DENTRO de una
  // línea a veces es más grande que el "típico" global y se cortaba de
  // más) -- prueba usar los k gaps más grandes como bordes entre líneas
  // (k=1 -> 2 líneas, k=3 -> 4 líneas) y se queda con el k que separa
  // mejor "gap de borde" de "gap dentro de la línea": el salto relativo
  // entre el último gap usado y el primero que quedó afuera.
  const porIndice = gaps.map((g,i)=>({g,i}));
  const ordenDesc = porIndice.slice().sort((a,b)=>b.g-a.g);
  let bestK=1, bestRatio=-1;
  for(let k=1; k<=Math.min(3, ordenDesc.length-1); k++){
    const usedMin=ordenDesc[k-1].g, nextMax=ordenDesc[k].g;
    if(usedMin<=0) continue;
    const ratio = nextMax>0 ? usedMin/nextMax : Infinity;
    if(ratio>bestRatio){ bestRatio=ratio; bestK=k; }
  }
  if(bestRatio < 2) return null; // sin un salto claro entre líneas, mejor no adivinar
  const cortesIdx = [...new Set(ordenDesc.slice(0,bestK).map(o=>o.i+1))].sort((a,b)=>a-b);
  const lineas=[]; let start=0;
  cortesIdx.forEach(c=>{ lineas.push(sorted.slice(start,c)); start=c; });
  lineas.push(sorted.slice(start));
  if(lineas.length<2 || lineas.length>4) return null; // agrupamiento poco confiable, mejor no mostrar nada
  // Orden defensa -> ataque: la línea más cercana al arquero va primero.
  if(Math.abs(lineas[0][0].y-gk.y) > Math.abs(lineas[lineas.length-1][0].y-gk.y)) lineas.reverse();
  return '1-'+lineas.map(l=>l.length).join('-');
}

// Tabla "RENDIMIENTO POR SISTEMA TÁCTICO": agrupa los partidos jugados por
// el sistema táctico detectado en la citación de esa fecha
// (detectarSistemaCitacion, arriba) y, si esa fecha no tiene citación
// cargada o el agrupamiento no fue confiable, cae al sistema que trae
// futdetail (fixture_futdetail[cat][fecha].sistema_tactico) -- así no se
// pierde cobertura en las fechas viejas que no tienen PDF de citación
// subido. Solo cuenta fechas que tienen resultado propio Y sistema (de
// cualquiera de las dos fuentes) a la vez.
function buildSistemaTacticoHTML(cat){
  const fixtureFut=(TABLA_DATA&&TABLA_DATA.fixture_futdetail&&TABLA_DATA.fixture_futdetail[cat])||{};
  const porSistema={};
  for(let f=1; f<=35; f++){
    const res=results[cat]?.[f];
    const sis = detectarSistemaCitacion(matchData[cat]?.[f]?.titulares) || fixtureFut[f]?.sistema_tactico;
    if(!res || !sis) continue;
    if(!porSistema[sis]) porSistema[sis]={pg:0,pe:0,pp:0,gf:0,gc:0,L:{pg:0,pe:0,pp:0},V:{pg:0,pe:0,pp:0}};
    const s=porSistema[sis];
    const x=getResult(res[0],res[1]);
    if(x==='W')s.pg++; else if(x==='D')s.pe++; else s.pp++;
    s.gf+=res[0]; s.gc+=res[1];
    const cond=condicionCat(cat,f);
    if(cond){
      const b=cond==='L'?s.L:s.V;
      if(x==='W')b.pg++; else if(x==='D')b.pe++; else b.pp++;
    }
  }
  const sistemas=Object.keys(porSistema);
  if(!sistemas.length){
    return `<div style="text-align:center;padding:20px;color:var(--muted);
      font-family:'Barlow Condensed',sans-serif;font-size:13px">Todavía no hay partidos con sistema táctico detectado (citación o futdetail)</div>`;
  }
  const pj=s=>s.pg+s.pe+s.pp, pts=s=>s.pg*3+s.pe;
  sistemas.sort((a,b)=>pts(porSistema[b])/pj(porSistema[b]) - pts(porSistema[a])/pj(porSistema[a]));
  const DIV='border-right:3px solid rgba(240,192,64,0.4)';
  const cell=(v,col)=>`<td style="text-align:center;color:${col}">${v}</td>`;
  const lvvCell=(b)=>`<td style="text-align:center;font-size:11px">${b.pg}-${b.pe}-${b.pp}</td>`;
  const rows=sistemas.map(sis=>{
    const s=porSistema[sis], j=pj(s), dg=s.gf-s.gc;
    const dgC=dg>0?'var(--win)':dg<0?'var(--loss)':'var(--muted)';
    return `<tr>
      <td class="cat-cell">${sis}</td>
      <td style="text-align:center">${j}</td>
      ${cell(pts(s),'var(--gold2)')}
      ${cell(s.pg,'var(--win)')}${cell(s.pe,'var(--draw)')}${cell(s.pp,'var(--loss)')}
      ${cell(s.gf,'#60a5fa')}${cell(s.gc,'#f87171')}
      <td style="text-align:center;color:${dgC};font-weight:700;${DIV}">${dg>0?'+':''}${dg}</td>
      ${lvvCell(s.L)}${lvvCell(s.V)}
    </tr>`;
  }).join('');
  return `<div style="display:flex;justify-content:flex-end;margin-bottom:6px">
      <button onclick="imprimirSistemaTactico('${cat}')" style="background:rgba(240,192,64,0.15);border:1px solid var(--border2);
        color:var(--gold2);border-radius:6px;padding:6px 12px;font-family:'Barlow Condensed',sans-serif;font-size:12px;
        letter-spacing:1px;font-weight:700;cursor:pointer">🖨 IMPRIMIR</button>
    </div>
    <div class="gen-table-wrap"><table class="gen-table">
      <thead><tr>
        <th>SISTEMA</th><th>PJ</th><th>PTS</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th>
        <th style="${DIV}">DG</th>
        <th>🏠 LOCAL (G-E-P)</th><th>✈ VISIT (G-E-P)</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);margin-top:4px">
      Ordenado por rendimiento (PTS/PJ). Sistema detectado en la citación de cada fecha (o futdetail si esa fecha no tiene citación cargada); solo se cuentan fechas con resultado propio y sistema detectado a la vez.
    </div>`;
}

// ============================================================
//  ESTADÍSTICAS PRÓXIMO RIVAL (export a PNG) -- solo 4TA/5TA/6TA
// ============================================================
// Se dibuja a mano sobre <canvas> (sin SVG ni librerías externas): los
// escudos son archivos propios en escudos/, del mismo origen que la app,
// así el canvas nunca queda "contaminado" por una imagen de otro sitio
// (pasaría si se enlazaran directo escudos de un sitio externo sin header
// CORS -- por eso siempre son estos archivos locales, nunca una URL).

// Próxima fecha sin resultado cargado en `results[cat]`, con la condición
// de Tigre esa fecha (reusa condicionCat, ya contempla las menores -- acá
// no aplica porque el alcance es solo 4TA/5TA/6TA, pero es la misma fuente
// de verdad que usa el resto de la app).
function proximoRivalInfo(cat){
  const entry = RIVALS.find(e => !(results[cat] && results[cat][e.f]));
  if(!entry) return null;
  const condTigre = condicionCat(cat, entry.f);
  return {fecha:entry.f, rival:entry.r, condTigre, condRival: condTigre==='L'?'V':'L'};
}

function fixtureCompletoCat(cat){
  return (TABLA_DATA && TABLA_DATA.fixture_completo && TABLA_DATA.fixture_completo[cat]) || {};
}

// Últimos `cant` partidos del rival jugando en `condicion` (la del RIVAL,
// no la de Tigre), de más reciente a más viejo. `condicion=null` trae los
// últimos partidos SIN filtrar por local/visitante (corridos, mezclados) --
// cada resultado igual trae su `cond` ('L'/'V') para poder etiquetarlo.
function ultimosPartidosRival(cat, rivalNombre, condicion, cant){
  const info = RIVAL_INFO[rivalNombre];
  if(!info) return [];
  const fc = fixtureCompletoCat(cat);
  const fechas = Object.keys(fc).map(Number).sort((a,b)=>b-a);
  const out=[];
  for(const f of fechas){
    for(const p of fc[f]){
      if((condicion===null||condicion==='L') && p.local===info.lpf) out.push({fecha:f, rivalDe:p.visitante, gf:p.gl, gc:p.gv, cond:'L'});
      else if((condicion===null||condicion==='V') && p.visitante===info.lpf) out.push({fecha:f, rivalDe:p.local, gf:p.gv, gc:p.gl, cond:'V'});
      if(out.length>=cant) return out.reverse(); // más viejo primero al mostrarlos
    }
  }
  out.reverse();
  return out;
}

// Partido más reciente del rival, en cualquier condición.
function partidoMasRecienteRival(cat, rivalNombre){
  const info = RIVAL_INFO[rivalNombre];
  if(!info) return null;
  const fc = fixtureCompletoCat(cat);
  const fechas = Object.keys(fc).map(Number).sort((a,b)=>b-a);
  for(const f of fechas){
    for(const p of fc[f]){
      if(p.local===info.lpf) return {fecha:f, cond:'L', rivalDe:p.visitante, gf:p.gl, gc:p.gv};
      if(p.visitante===info.lpf) return {fecha:f, cond:'V', rivalDe:p.local, gf:p.gv, gc:p.gl};
    }
  }
  return null;
}

function slugArchivo(s){

// Cacheada por src -- la vista previa en vivo de la placa post partido
// (ver actualizarPlacaPostPreview) llama a esto en cada movimiento de
// slider, no tiene sentido volver a bajar/decodificar la misma imagen
// cada vez.
const cargarImagenCache = {};
function cargarImagen(src){
  if(!src) return Promise.resolve(null);
  if(cargarImagenCache[src]) return cargarImagenCache[src];
  const p = new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    // Si falla, se saca del caché en vez de dejar clavado un "no existe"
    // para siempre en esta sesión -- con 5 placas pidiendo el mismo logo
    // en paralelo, un solo hipo de red no debería dejarlo roto el resto
    // del rato, la próxima llamada tiene que poder reintentar.
    img.onerror=()=>{ delete cargarImagenCache[src]; resolve(null); };
    img.src=src;
  });
  cargarImagenCache[src] = p;
  return p;
}

function ctxRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// Rectángulo real del dibujo dentro de un escudo (sin el margen transparente
// del archivo) -- distintos escudos vienen con distinto margen alrededor,
// así que centrar por el tamaño del archivo entero no alinea los centros
// visuales de dos escudos uno al lado del otro. Se usa para eso (ver
// dibujarPlacaPostPartido).
// Cacheada por src -- escanear millones de píxeles en cada movimiento de
// slider de la vista previa en vivo lo hacía sentir colgado (con el escudo
// de Tigre, 2322x2567px, tardaba más de un segundo por llamada).
const bordesVisiblesCache = {};
function bordesVisibles(img){
  if(bordesVisiblesCache[img.src]) return bordesVisiblesCache[img.src];
  const r = _calcularBordesVisibles(img);
  bordesVisiblesCache[img.src] = r;
  return r;
}
function _calcularBordesVisibles(img){
  const c=document.createElement('canvas');
  c.width=img.naturalWidth; c.height=img.naturalHeight;
  const cctx=c.getContext('2d');
  cctx.drawImage(img,0,0);
  const data=cctx.getImageData(0,0,c.width,c.height).data;
  let minX=c.width, minY=c.height, maxX=0, maxY=0, found=false;
  for(let y=0;y<c.height;y++){
    for(let x=0;x<c.width;x++){
      if(data[(y*c.width+x)*4+3]>10){
        found=true;
        if(x<minX)minX=x; if(x>maxX)maxX=x;
        if(y<minY)minY=y; if(y>maxY)maxY=y;
      }
    }
  }
  return found ? {x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1} : {x:0,y:0,w:img.naturalWidth,h:img.naturalHeight};
}

// Punto de entrada del botón: junta los datos y dispara la descarga del PNG.
// incluirGoleador/incluirAmarillas: checkboxes al lado de los sliders (ver
// renderVideoanalisisTab) -- por defecto tildados, así que si no existen
// todavía en el DOM (primer render, antes de pintar el panel) se asume true.
function chk(id, def=true){ const e=document.getElementById(id); return e ? e.checked : def; }

async function construirParamsPlacaStats(cat){
  await loadTablaData();
  const prox = proximoRivalInfo(cat);
  if(!prox) return null;
  const info = RIVAL_INFO[prox.rival];
  if(!info) return null;
  const filaRival = filaTablaLPF(cat, info.lpf);
  const filaTigre = filaTablaLPF(cat, 'Tigre');
  if(!filaRival || !filaTigre) return null;
  const modoInfo = leerModoUltimosPlaca(cat, prox.condRival);
  const ultimos = ultimosPartidosRival(cat, prox.rival, modoInfo.condicion, modoInfo.cant);
  const reciente = partidoMasRecienteRival(cat, prox.rival);
  const num = (id, def) => parseInt(document.getElementById(id+cat)?.value ?? def) || def;
  const alerta = TABLA_DATA.rival_alertas && TABLA_DATA.rival_alertas[cat];
  return {cat, prox, info, ultimos, ultimosLabel: modoInfo.label, reciente, filaRival, filaTigre, alerta,
    incluirGoleador: chk('placa-stats-incluir-goleador-'+cat),
    incluirAmarillas: chk('placa-stats-incluir-amarillas-'+cat),
    escalaLiga: num('placa-stats-escala-liga-', 100)/100,
    offsetXLiga: num('placa-stats-x-liga-', 0),
    offsetYLiga: num('placa-stats-y-liga-', 0)};
}
function actualizarPlacaStatsPreview(cat){
  actualizarPlacaPreviewGenerica('stats-'+cat, `placa-stats-preview-${cat}`, ()=>construirParamsPlacaStats(cat), dibujarTarjetaRival);
}
// Descarga un blob como archivo (como siempre) o, si compartir=true y el
// dispositivo lo soporta (celular), abre el menu nativo de compartir
// (WhatsApp, etc) directo con la imagen -- sin pasar por la carpeta de
// descargas. En desktop (o si el navegador no soporta Web Share con
// archivos) cae solo a la descarga de siempre.
async function descargarOCompartirPlaca(blob, filename, compartir){
  if(compartir && navigator.canShare){
    try{
      const file = new File([blob], filename, {type: blob.type || 'image/png'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: filename});
        return;
      }
    }catch(e){
      if(e.name==='AbortError') return; // el usuario cerro el menu de compartir sin elegir nada
    }
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
}
function botonCompartirPlacaHTML(fnCall){
  return `<button onclick="${fnCall}" title="Compartir (en celular abre WhatsApp/etc. directo; en PC descarga)"
    style="background:rgba(26,58,143,0.2);border:1px solid var(--border2);color:var(--muted);
    border-radius:6px;padding:9px 12px;font-family:'Barlow Condensed',sans-serif;font-size:13px;
    letter-spacing:1px;font-weight:700;cursor:pointer">📤</button>`;
}

async function generarEstadisticasRival(cat, compartir){
  const btn=document.getElementById('btn-rival-stats');
  if(btn) btn.disabled=true;
  try{
    await loadTablaData();
    const prox = proximoRivalInfo(cat);
    if(!prox){ alert('No encontré ningún partido pendiente en el fixture de '+cat+'.'); return; }
    const info = RIVAL_INFO[prox.rival];
    if(!info){ alert('Todavía no tengo cargado el escudo/equivalencia de "'+prox.rival+'".'); return; }
    const filaRival = filaTablaLPF(cat, info.lpf);
    const filaTigre = filaTablaLPF(cat, 'Tigre');
    if(!filaRival || !filaTigre){ alert('Todavía no tengo la tabla de posiciones de '+cat+' descargada. Probá "🔄 Actualizar datos".'); return; }
    const modoInfo = leerModoUltimosPlaca(cat, prox.condRival);
    const ultimos = ultimosPartidosRival(cat, prox.rival, modoInfo.condicion, modoInfo.cant);
    const reciente = partidoMasRecienteRival(cat, prox.rival);
    const num = (id, def) => parseInt(document.getElementById(id+cat)?.value ?? def) || def;
    const escalaLiga = num('placa-stats-escala-liga-', 100)/100;
    const offsetXLiga = num('placa-stats-x-liga-', 0);
    const offsetYLiga = num('placa-stats-y-liga-', 0);
    const alerta = TABLA_DATA.rival_alertas && TABLA_DATA.rival_alertas[cat];
    const incluirGoleador = chk('placa-stats-incluir-goleador-'+cat);
    const incluirAmarillas = chk('placa-stats-incluir-amarillas-'+cat);
    const blob = await dibujarTarjetaRival({cat, prox, info, ultimos, ultimosLabel: modoInfo.label, reciente, filaRival, filaTigre, alerta, incluirGoleador, incluirAmarillas, escalaLiga, offsetXLiga, offsetYLiga});
    await descargarOCompartirPlaca(blob, `proximo-rival-${cat}-F${prox.fecha}-${slugArchivo(prox.rival)}.png`, compartir);
  } finally {
    if(btn) btn.disabled=false;
  }
}

async function dibujarTarjetaRival({cat, prox, info, ultimos, ultimosLabel, reciente, filaRival, filaTigre, alerta, incluirGoleador, incluirAmarillas, escalaLiga, offsetXLiga, offsetYLiga, scale}){
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  escalaLiga = escalaLiga || 1; offsetXLiga = offsetXLiga || 0; offsetYLiga = offsetYLiga || 0;
  // Los checkboxes de "incluir goleador"/"incluir amarillas" solo se leen
  // si de verdad hay algo que mostrar con esa info (alerta cargada) -- si
  // no hay alerta, no tiene sentido agregar una tarjeta que solo diga "sin
  // datos" dentro del PNG exportado.
  const mostrarGoleador = !!(incluirGoleador && alerta);
  const mostrarAmarillas = !!(incluirAmarillas && alerta);
  const mostrarExtra = mostrarGoleador || mostrarAmarillas;
  // Goleador/5ta amarilla van DENTRO de la tarjeta "partido más reciente"
  // (a la derecha del resultado, con su propio espacio libre) en vez de
  // agregar alto nuevo a la placa -- así el límite inferior (alineado con
  // "últimos resultados") nunca se mueve, tenga o no tenga esta info
  // (Javi, 2026-09-02).

  // Fondo más azulado (var(--surface3) de la app) en vez de var(--bg) --
  // a pedido de Javi, se veía "demasiado negro" comparado con la
  // referencia original.
  const BG='#111e38', SURF='#0d1528', SURF2='#0a0f1e', RED='#c0152a', GOLD='#f0c040',
        TXT='#d8e4ff', TXT2='#a8c0e8', MUTED='#8aa0cc', WIN='#22c55e', DRAW='#f59e0b',
        LOSS='#ef4444', BORDER='#3a5090', WHITE='#ffffff';

  const [escudoRival, escudoTigre, escudoLiga, ...escudosResultados] = await Promise.all([
    cargarImagen('escudos/'+info.escudo),
    cargarImagen(document.getElementById('escudoImg')?.src),
    cargarImagen('escudos/LIGA.png'),
    ...ultimos.map(p=>cargarImagen(ESCUDO_POR_LPF[p.rivalDe] ? 'escudos/'+ESCUDO_POR_LPF[p.rivalDe] : null)),
  ]);
  const escudoReciente = reciente ? await cargarImagen(ESCUDO_POR_LPF[reciente.rivalDe] ? 'escudos/'+ESCUDO_POR_LPF[reciente.rivalDe] : null) : null;

  // 16:9 (1280x720) a pedido de Javi, para que ocupe mejor la pantalla en
  // presentaciones. El contenido (tabla + hasta 4 resultados) casi siempre
  // entra dentro de 720 con margen de sobra -- si por algún motivo no
  // entrara (no debería, "últimos" está topeado a 4 filas), el alto crece
  // solo para no cortar nada, en vez de forzar 720 igual.
  const W=1280, pad=40, rowH=48, rowH2=58;
  const rowsN=Math.max(ultimos.length,1);
  const MARGEN_MINIMO=50;
  const cardH=180; // alto de la tarjeta "partido más reciente"
  // La columna izquierda (últimos resultados) y la derecha (partido más
  // reciente + goleador/5ta amarilla apilados) crecen por separado -- el
  // alto de la placa lo define la que quede más alta de las dos.
  const colIzqH = rowsN*rowH2;
  const colDerH = cardH;
  const contenidoHastaDivisor = pad + 56 + 76 + 36 + rowH + rowH*2 + 32 + 38 + Math.max(colIzqH, colDerH) + 42;
  const H = Math.max(720, contenidoHastaDivisor + MARGEN_MINIMO);

  // Se dibuja al triple de resolución (SCALE=3) y se escala el contexto --
  // si no, el PNG sale a 1280px de ancho real y se ve borroso/pixelado en
  // pantallas de alta densidad. Todo el resto del código sigue usando
  // coordenadas "lógicas" (W, H) sin tocar nada.
  const SCALE=scale||3;
  const canvas=document.createElement('canvas');
  canvas.width=W*SCALE; canvas.height=H*SCALE;
  const ctx=canvas.getContext('2d');
  ctx.scale(SCALE,SCALE);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  ctx.textBaseline='top';

  if(escudoLiga){
    const wLiga=75*escalaLiga, hLiga=75*escalaLiga;
    ctx.drawImage(escudoLiga, W-pad-wLiga+offsetXLiga, pad-12+offsetYLiga, wLiga, hLiga);
  }

  const catLabel = CATEGORIAS_CONFIG[cat]?.label ? CATEGORIAS_CONFIG[cat].label.toUpperCase()+' DIVISIÓN' : cat;
  let y=pad;
  // Separador con más aire (antes " · ") y sin el cartel "PRÓXIMO RIVAL"
  // -- quedaba redundante, el botón que genera esto ya se llama así.
  ctx.font="15px 'Barlow', sans-serif"; ctx.fillStyle=TXT2;
  ctx.fillText(`ANÁLISIS DE RIVAL   ·   ${prox.rival}   ·   ${catLabel}`, pad, y+5);
  y+=56;

  ctx.font="700 46px 'Barlow Condensed', sans-serif"; ctx.fillStyle=WHITE;
  ctx.fillText('Estadísticas', pad, y);
  y+=76;

  ctx.fillStyle=RED; ctx.fillRect(pad,y,4,20);
  ctx.font="700 14px 'Barlow Condensed', sans-serif"; ctx.fillStyle=GOLD;
  ctx.fillText('UBICACIONES EN LA TABLA', pad+16, y+2);
  y+=36;

  // Columnas repartidas en todo el ancho (1280) -- antes quedaban apretadas
  // contra el borde derecho y "DG" se veía cortado.
  const equipoColW=300, colGap=100;
  const colX=[pad]; for(let i=0;i<9;i++) colX.push(pad+equipoColW+colGap*i);
  const headers=['EQUIPO','POS','PTS','PJ','PG','PE','PP','GF','GC','DG'];
  const headerX=colX.map((x,i)=>i===0?x+16:x); // "EQUIPO" pegado al borde se veía desprolijo
  ctx.fillStyle=RED; ctx.fillRect(pad,y,W-2*pad,rowH);
  ctx.font="700 13px 'Barlow', sans-serif"; ctx.fillStyle=WHITE;
  headers.forEach((h,i)=>ctx.fillText(h, headerX[i], y+17));
  y+=rowH;

  function filaTabla(nombreMostrar, escudoImg, fila, bg){
    ctx.fillStyle=bg; ctx.fillRect(pad,y,W-2*pad,rowH);
    let tx=pad+8;
    if(escudoImg){ ctx.drawImage(escudoImg, pad+8, y+9, 30, 30); tx=pad+8+40; }
    ctx.font="700 15px 'Barlow', sans-serif"; ctx.fillStyle=TXT;
    ctx.fillText(nombreMostrar, tx, y+16);
    ctx.font="15px 'Barlow', sans-serif";
    const vals=[fila.pos+'°',fila.pts,fila.pj,fila.pg,fila.pe,fila.pp,fila.gf,fila.gc];
    vals.forEach((v,i)=>ctx.fillText(String(v), colX[i+1], y+16));
    ctx.font="700 15px 'Barlow', sans-serif"; ctx.fillStyle=fila.dif>=0?WIN:LOSS;
    ctx.fillText((fila.dif>=0?'+':'')+fila.dif, colX[9], y+16);
    y+=rowH;
  }
  // Orden por posición real en la tabla (el mejor ubicado arriba), no
  // siempre "rival primero, Tigre segundo".
  [{label:info.lpf, escudo:escudoRival, fila:filaRival},
   {label:'Tigre', escudo:escudoTigre, fila:filaTigre}]
    .sort((a,b)=>a.fila.pos-b.fila.pos)
    .forEach((f,i)=>filaTabla(f.label, f.escudo, f.fila, i===0?SURF:SURF2));
  y+=32;

  ctx.fillStyle=RED; ctx.fillRect(pad,y,4,20);
  ctx.font="700 14px 'Barlow Condensed', sans-serif"; ctx.fillStyle=GOLD;
  ctx.fillText('ÚLTIMOS RESULTADOS', pad+16, y+2);
  y+=38;

  const colW=(W-2*pad-24)/2, leftX=pad, rightX=pad+colW+24;
  ctx.font="700 12px 'Barlow', sans-serif"; ctx.fillStyle=MUTED;
  ctx.fillText(ultimosLabel || ('COMO '+(prox.condRival==='L'?'LOCAL':'VISITANTE')), leftX, y);
  let ry=y+28;
  const cardTop=ry; // la tarjeta de la derecha arranca a la altura de la primera fila, no del título
  const rowH2visual=rowH2-10;
  if(ultimos.length===0){
    ctx.font="14px 'Barlow', sans-serif"; ctx.fillStyle=MUTED;
    ctx.fillText('Sin partidos registrados todavía en esta condición.', leftX, ry+16);
  }
  ultimos.forEach((p,i)=>{
    const r=resultadoLabel(p.gf,p.gc);
    ctx.fillStyle=SURF; ctx.fillRect(leftX,ry,colW,rowH2visual);
    ctx.fillStyle=r.color; ctx.fillRect(leftX,ry,4,rowH2visual);
    let tx=leftX+16;
    const escImg=escudosResultados[i];
    if(escImg){ ctx.drawImage(escImg, tx, ry+(rowH2visual-28)/2, 28, 28); tx+=36; }
    ctx.font="14px 'Barlow', sans-serif"; ctx.fillStyle=TXT2;
    ctx.fillText(`Fecha ${p.fecha} vs ${NOMBRE_POR_LPF[p.rivalDe]||p.rivalDe} · ${p.cond==='L'?'LOCAL':'VISIT.'}`, tx, ry+rowH2visual/2-7);
    ctx.font="700 17px 'Barlow', sans-serif"; ctx.fillStyle=TXT;
    ctx.fillText(`${p.gf}-${p.gc}`, leftX+colW-170, ry+rowH2visual/2-8);
    const bw=80;
    ctxRoundRect(ctx, leftX+colW-bw-14, ry+(rowH2visual-26)/2, bw, 26, 5); ctx.fillStyle=r.color; ctx.fill();
    ctx.font="700 12px 'Barlow', sans-serif"; ctx.fillStyle='#0a0a0a'; ctx.textAlign='center';
    ctx.fillText(r.texto, leftX+colW-bw/2-14, ry+rowH2visual/2-6); ctx.textAlign='left';
    ry+=rowH2;
  });

  // Achicada y alineada con la primera fila de "últimos resultados" (antes
  // arrancaba a la altura del título "ÚLTIMOS RESULTADOS" y quedaba enorme
  // comparada con lo que muestra adentro).
  ctxRoundRect(ctx, rightX, cardTop, colW, cardH, 12);
  ctx.fillStyle=SURF; ctx.fill(); ctx.strokeStyle=BORDER; ctx.lineWidth=1; ctx.stroke();
  let cy=cardTop+18;
  ctx.font="700 13px 'Barlow', sans-serif"; ctx.fillStyle=GOLD;
  ctx.fillText(reciente ? `PARTIDO MÁS RECIENTE · FECHA ${reciente.fecha}` : 'PARTIDO MÁS RECIENTE', rightX+18, cy);
  cy+=28;
  if(reciente){
    let tx=rightX+18;
    if(escudoReciente){ ctx.drawImage(escudoReciente, tx, cy-2, 26, 26); tx+=34; }
    ctx.font="15px 'Barlow', sans-serif"; ctx.fillStyle=TXT2;
    ctx.fillText('vs '+(NOMBRE_POR_LPF[reciente.rivalDe]||reciente.rivalDe), tx, cy+5);
    cy+=42;
    ctx.font="700 36px 'Barlow Condensed', sans-serif"; ctx.fillStyle=WHITE;
    ctx.fillText(`${reciente.gf} - ${reciente.gc}`, rightX+18, cy);
    cy+=48;
    const r=resultadoLabel(reciente.gf,reciente.gc);
    const label=`${r.texto} · DE ${reciente.cond==='L'?'LOCAL':'VISITANTE'}`;
    ctx.font="700 12px 'Barlow', sans-serif";
    const bw2=ctx.measureText(label).width+20;
    ctxRoundRect(ctx, rightX+18, cy, bw2, 26, 5); ctx.fillStyle=r.color; ctx.fill();
    ctx.fillStyle='#0a0a0a'; ctx.fillText(label, rightX+28, cy+8);
  } else {
    ctx.font="14px 'Barlow', sans-serif"; ctx.fillStyle=MUTED;
    ctx.fillText('Sin partidos registrados todavía.', rightX+18, cy);
  }

  // Goleador del rival + alerta de 5ta amarilla (statfutbol.com.ar, ver
  // calcular_alerta_rival en scrape_tablas.py) -- opcional, según los
  // checkboxes "incluir goleador"/"incluir amarillas" del panel. Se
  // dibujan DENTRO de la misma tarjeta "partido más reciente", a la
  // derecha de su contenido (línea vertical separadora), usando el
  // espacio libre que ya tenía la tarjeta -- así nunca crece el alto de
  // la placa (Javi, 2026-09-02: "no se puede pasar hacia abajo de la
  // línea", el límite ya establecido por últimos resultados/la tarjeta
  // se mantiene siempre igual).
  if(mostrarExtra){
    // Arranca debajo del título "PARTIDO MÁS RECIENTE · FECHA N" (cardTop+46,
    // misma altura donde ya arranca "vs EST") -- si el separador empezaba
    // desde arriba de todo, el título (ancho variable, con el número de
    // fecha) se superponía con "GOLEADOR" (Javi, 2026-09-02).
    const topY = cardTop + 46, botY = cardTop + cardH - 16;
    const divX = rightX + 230;
    const padInterno = 16;
    ctx.strokeStyle=BORDER; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(divX, topY); ctx.lineTo(divX, botY); ctx.stroke();

    const ex = divX + padInterno;
    const mid = (topY + botY) / 2;

    const drawGoleador = (y0) => {
      let cy=y0+padInterno;
      ctx.font="700 10px 'Barlow', sans-serif"; ctx.fillStyle=GOLD;
      ctx.fillText('GOLEADOR', ex, cy); cy+=17;
      if(alerta.goleador){
        ctx.font="700 14px 'Barlow Condensed', sans-serif"; ctx.fillStyle=TXT;
        ctx.fillText(alerta.goleador.nombre.split(',')[0], ex, cy); cy+=18;
        ctx.font="11px 'Barlow', sans-serif"; ctx.fillStyle=MUTED;
        ctx.fillText(alerta.goleador.goles+' goles', ex, cy);
      } else {
        ctx.font="11px 'Barlow', sans-serif"; ctx.fillStyle=MUTED;
        ctx.fillText('Sin datos.', ex, cy);
      }
    };
    const drawAmarillas = (y0) => {
      let cy=y0+padInterno;
      ctx.font="700 10px 'Barlow', sans-serif"; ctx.fillStyle=GOLD;
      ctx.fillText('5TA AMARILLA', ex, cy); cy+=17;
      const lista = alerta.amarillas_riesgo||[];
      if(lista.length){
        lista.slice(0,3).forEach(a=>{
          ctx.font="11px 'Barlow', sans-serif"; ctx.fillStyle=DRAW;
          ctx.fillText(a.nombre.split(',')[0]+' ('+a.amarillas+')', ex, cy);
          cy+=16;
        });
      } else {
        ctx.font="11px 'Barlow', sans-serif"; ctx.fillStyle=WIN;
        ctx.fillText('Sin jugadores con 5 amarillas.', ex, cy);
      }
    };

    if(mostrarGoleador && mostrarAmarillas){
      drawGoleador(topY - padInterno);
      ctx.beginPath(); ctx.moveTo(divX+padInterno, mid); ctx.lineTo(rightX+colW-padInterno, mid); ctx.stroke();
      drawAmarillas(mid - padInterno + 10);
    } else if(mostrarGoleador){
      drawGoleador((topY+botY)/2 - 40);
    } else {
      drawAmarillas((topY+botY)/2 - 40);
    }
  }

  // El divisor final va debajo de lo que quede más abajo entre las dos
  // columnas (últimos resultados a la izquierda, partido reciente a la
  // derecha) -- el mismo límite de siempre, sin importar si se muestra
  // goleador/disciplina o no.
  y = Math.max(ry+10, cardTop+cardH+22);

  ctx.strokeStyle=BORDER; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke(); ctx.setLineDash([]);

  return new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
}

// ============================================================
//  PLACAS (para armar videos) -- pestaña dentro de cada categoría
// ============================================================
// Dos generadores, mismo fondo/paleta que "Estadísticas próximo rival":
// 1) Placa de fase: título + subtítulo libres, para separar momentos del
//    partido en el video (a pedido de Javi, la nomenclatura la elige cada
//    técnico, no hay nada fijo que mostrar).
// 2) Placa de portada: fija, solo en 4TA/5TA/6TA (mismo alcance que
//    "Estadísticas próximo rival" -- usa los mismos datos). La fecha de
//    calendario sale de FECHA_CALENDARIO, no hace falta tipearla.
// Fila de slider chica (tamaño %/horizontal px/vertical px) reusada por los
// controles de ajuste de logos de las 4 placas -- onSlide es opcional
// (Portada la usa para refrescar su vista previa en vivo; las demás placas
// no tienen vista previa, así que el slider solo actualiza el numerito).
function sliderRowPlacas(id, label, val, min, max, unit, onSlide=''){
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <span style="font-size:11px;color:var(--muted);letter-spacing:1px;width:110px">${label}</span>
    <input type="range" id="${id}" min="${min}" max="${max}" value="${val}"
      oninput="document.getElementById('${id}-val').textContent=this.value+'${unit}';${onSlide}" style="width:160px">
    <span id="${id}-val" style="font-size:12px;color:var(--gold2);width:36px">${val}${unit}</span>
  </div>`;
}
// Bloque "VISTA PREVIA" reusado por las 5 placas (mismo layout que ya
// probamos en Portada · post partido): columna de controles a la izquierda,
// imagen de vista previa a la derecha.
function bloquePlacaConPreview(controlesHTML, imgId){
  return `<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">
    <div style="min-width:280px">${controlesHTML}</div>
    <div style="flex:1;min-width:320px;max-width:640px">
      <div style="font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:6px">VISTA PREVIA</div>
      <img id="${imgId}" style="width:100%;border-radius:8px;border:1px solid var(--border2);display:block;background:#111e38">
    </div>
  </div>`;
}
// Debounce + ciclo de vida del blob URL, compartido por las 5 placas -- se
// dibuja a scale:1 (más rápido, se ve chico en pantalla igual) en vez del
// scale:3 que usa la descarga final.
const placaPreviewTimers = {};
function actualizarPlacaPreviewGenerica(key, imgId, buildParamsFn, drawFn){
  clearTimeout(placaPreviewTimers[key]);
  placaPreviewTimers[key] = setTimeout(async ()=>{
    const img = document.getElementById(imgId);
    if(!img) return;
    const params = await buildParamsFn();
    if(!params) return;
    const blob = await drawFn({...params, scale:1});
    if(img.dataset.prevUrl) URL.revokeObjectURL(img.dataset.prevUrl);
    const url = URL.createObjectURL(blob);
    img.src = url;
    img.dataset.prevUrl = url;
  }, 200);
}
// Estilo compartido de los botones "⬇" de las 5 placas.
const PLACA_BTN_STYLE = `background:rgba(240,192,64,0.15);border:1px solid var(--border2);color:var(--gold2);
  border-radius:6px;padding:9px 16px;font-family:'Barlow Condensed',sans-serif;font-size:13px;
  letter-spacing:1px;font-weight:700;cursor:pointer`;
// Rótulo simple (no colapsable, no clickeable) para distinguir cada placa
// dentro de una sección "PLACAS" que ya es colapsable de por sí -- evita el
// bug de anidar un segundo toggle adentro del primero (Javi reportó que con
// dos togglés anidados, cerrar el de afuera no alcanzaba para ocultar todo,
// y el de adentro quedaba cerrado por default escondiendo contenido).
function placaRotuloHTML(texto){
  return `<div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1.5px;

}

// va a jugar la próxima fecha -- local o visitante, según corresponda; es
// el comportamiento que ya tenía esto antes de agregar el selector, Javi
// pidió que esto se calcule solo, no que quede fijo en "de local").
const placaStatsModoUltimos = {}; // cat -> 'x' | 'cond' (default 'cond')
function setPlacaStatsModo(cat, modo){
  placaStatsModoUltimos[cat] = modo;
  renderPlacaStatsControlesBlock(cat);
}
function leerModoUltimosPlaca(cat, condRival){
  const modo = placaStatsModoUltimos[cat] || 'cond';
  if(modo==='x'){
    const cant = parseInt(document.getElementById('placa-stats-cant-'+cat)?.value) || 4;
    return {modo, cant, condicion:null, label:`ÚLTIMOS ${cant} PARTIDOS`};
  }
  return {modo, cant:4, condicion:condRival, label:'ÚLTIMOS 4 · '+(condRival==='L'?'COMO LOCAL':'COMO VISITANTE')};
}

// Lee fecha+sliders del panel "post partido" de una categoría. Se usa tanto
// para generar el PNG final como para la vista previa en vivo (mismo dato,
// un solo lugar que lo arma).
function leerControlesPlacaPost(cat){
  const sel = document.getElementById(`placa-post-fecha-${cat}`);
  if(!sel) return null;
  const fecha = parseInt(sel.value);
  const entry = RIVALS.find(r=>r.f===fecha);
  const info = entry && RIVAL_INFO[entry.r];
  if(!info) return null;
  const num = (id, def) => parseInt(document.getElementById(id+cat)?.value ?? def) || def;
  return {
    fecha, info, entry,
    escalaTigre: num('placa-post-escala-tigre-', 100)/100,
    escalaRival: num('placa-post-escala-rival-', 100)/100,
    escalaLiga: num('placa-post-escala-liga-', 100)/100,
    offsetXTigre: num('placa-post-x-tigre-', 0),
    offsetYTigre: num('placa-post-y-tigre-', 0),
    offsetXRival: num('placa-post-x-rival-', 0),
    offsetYRival: num('placa-post-y-rival-', 0),
    offsetXLiga: num('placa-post-x-liga-', 0),
    offsetYLiga: num('placa-post-y-liga-', 0),
  };
}

// Debounced -- se dispara en cada movimiento de slider, no hace falta
// redibujar en cada pixel mientras se arrastra.
const placaPostPreviewTimers = {};
function actualizarPlacaPostPreview(cat){
  clearTimeout(placaPostPreviewTimers[cat]);
  placaPostPreviewTimers[cat] = setTimeout(async ()=>{
    const params = leerControlesPlacaPost(cat);
    const img = document.getElementById(`placa-post-preview-${cat}`);
    if(!params || !img) return;
    const blob = await dibujarPlacaPostPartido({...params, scale:1});
    if(img.dataset.prevUrl) URL.revokeObjectURL(img.dataset.prevUrl);
    const url = URL.createObjectURL(blob);
    img.src = url;
    img.dataset.prevUrl = url;
  }, 200);
}

async function generarPlacaPostPartido(cat, compartir){
  const params = leerControlesPlacaPost(cat);
  if(!params){ alert('Todavía no tengo cargado el escudo/equivalencia de ese rival.'); return; }
  const btn = document.getElementById('btn-placa-post');
  if(btn) btn.disabled = true;
  try{
    const blob = await dibujarPlacaPostPartido(params);
    await descargarOCompartirPlaca(blob, `placa-post-partido-${cat}-F${params.fecha}-${slugArchivo(params.entry.r)}.png`, compartir);
  } finally {
    if(btn) btn.disabled = false;
  }
}

// Placa "análisis post partido": logo LPF arriba a la izquierda, escudos de
// Tigre y del rival de esa fecha arriba a la derecha ("TIGRE vs RIVAL"), y
// título + subtítulo centrados con el mismo criterio que la placa de fase.
async function dibujarPlacaPostPartido({fecha, info, escalaTigre, escalaRival, escalaLiga,
  offsetXTigre, offsetYTigre, offsetXRival, offsetYRival, offsetXLiga, offsetYLiga, scale}){
  escalaTigre = escalaTigre || 1;
  escalaRival = escalaRival || 1;
  escalaLiga = escalaLiga || 1;
  offsetXTigre = offsetXTigre || 0; offsetYTigre = offsetYTigre || 0;
  offsetXRival = offsetXRival || 0; offsetYRival = offsetYRival || 0;
  offsetXLiga = offsetXLiga || 0; offsetYLiga = offsetYLiga || 0;
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  const BG='#111e38', RED='#c0152a', WHITE='#ffffff', TXT2='#a8c0e8';
  // La vista previa en vivo pide scale más bajo (se ve chica en pantalla
  // igual) -- codificar el PNG final a 3840x2160 tarda como un segundo,
  // sea cual sea el contenido, y en la vista previa eso se nota en cada
  // movimiento de slider. La descarga final sigue pidiendo la calidad
  // completa (scale=3, el default).
  const W=1280, H=720, pad=60, SCALE=scale||3;
  const [escudoTigre, escudoRival, escudoLiga] = await Promise.all([
    cargarImagen(document.getElementById('escudoImg')?.src),
    cargarImagen('escudos/'+info.escudo),
    cargarImagen('escudos/LIGA.png'),
  ]);
  const canvas = document.createElement('canvas');
  canvas.width = W*SCALE; canvas.height = H*SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = RED; ctx.fillRect(0, 0, 24, H);
  ctx.textBaseline = 'top';

  if(escudoLiga){
    const wLiga = 75*escalaLiga, hLiga = 75*escalaLiga;
    ctx.drawImage(escudoLiga, pad+offsetXLiga, pad-12+offsetYLiga, wLiga, hLiga);
  }

  // Cada escudo llena el mismo cuadro (crestBox x crestBox) por su cuenta,
  // según el tamaño real de SU DIBUJO (sin el margen transparente del
  // archivo, ver bordesVisibles) -- da un tamaño comparable entre los dos
  // sin depender de la resolución de cada archivo. Arriba de esa base, Javi
  // puede agrandar/achicar cada escudo a mano con los sliders (escalaTigre/
  // escalaRival, 50%-180%) en vez de perseguir un algoritmo automático que
  // "adivine" el tamaño relativo correcto para cualquier combinación de
  // escudos.
  const crestBox = 76;
  const bTigre = escudoTigre ? bordesVisibles(escudoTigre) : null;
  const bRival = escudoRival ? bordesVisibles(escudoRival) : null;
  const fitCrest = (b, escala) => {
    if(!b) return {w:0,h:0};
    const s = Math.min(crestBox/b.w, crestBox/b.h)*escala;
    return {w: b.w*s, h: b.h*s};
  };
  const dimTigre = fitCrest(bTigre, escalaTigre), dimRival = fitCrest(bRival, escalaRival);
  const gap = 8; // mismo espacio a cada lado del "VS", para que quede centrado de verdad
  ctx.font = "700 16px 'Barlow', sans-serif";
  const vsW = ctx.measureText('VS').width;

  // rx marca el flujo "de referencia" (sin mover nada); los offsetX/Y de
  // cada escudo son un empujón final solo sobre dónde se dibuja, no afectan
  // el espaciado entre los demás elementos.
  let rx = W-pad;
  if(escudoRival){
    rx-=dimRival.w;
    ctx.drawImage(escudoRival, bRival.x, bRival.y, bRival.w, bRival.h,
      rx+offsetXRival, pad+(crestBox-dimRival.h)/2+offsetYRival, dimRival.w, dimRival.h);
  }
  rx -= gap;
  ctx.fillStyle=TXT2; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('VS', rx-vsW/2, pad+crestBox/2);
  ctx.textAlign='left'; ctx.textBaseline='top';
  rx -= vsW+gap;
  if(escudoTigre){
    rx-=dimTigre.w;
    ctx.drawImage(escudoTigre, bTigre.x, bTigre.y, bTigre.w, bTigre.h,
      rx+offsetXTigre, pad+(crestBox-dimTigre.h)/2+offsetYTigre, dimTigre.w, dimTigre.h);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = "700 84px 'Barlow Condensed', sans-serif"; ctx.fillStyle = WHITE;
  ctx.fillText('Análisis post partido', W/2, H/2-28);
  ctx.font = "700 38px 'Barlow', sans-serif";
  ctx.fillText(`Fecha ${fecha}: ${info.lpf}`, W/2, H/2+48);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';

  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

// Devuelve null (sin dibujar nada) si todavía no hay título -- mismo
// criterio que el resto de las placas: la vista previa no valida con un
// alert, simplemente no se actualiza hasta que haya algo que mostrar.
// `ns` (namespace) distingue instancias -- Fase vive duplicada entera en
// Análisis Propios (ns='') Y en Análisis de Rival (ns='-riv'), cada una con
// sus propios campos/sliders/vista previa, sin compartir estado entre sí.
function construirParamsPlacaFase(cat, ns=''){
  const titulo = document.getElementById('placa-fase-titulo'+ns)?.value.trim();
  if(!titulo) return null;
  const subtitulo = document.getElementById('placa-fase-subtitulo'+ns)?.value.trim() || '';
  const num = (id, def) => parseInt(document.getElementById(id+cat+ns)?.value ?? def) || def;
  return {
    titulo, subtitulo,
    escalaLiga: num('placa-fase-escala-liga-', 100)/100,
    offsetXLiga: num('placa-fase-x-liga-', 0),
    offsetYLiga: num('placa-fase-y-liga-', 0),
    escalaTigre: num('placa-fase-escala-tigre-', 100)/100,
    offsetXTigre: num('placa-fase-x-tigre-', 0),
    offsetYTigre: num('placa-fase-y-tigre-', 0),
  };
}
function actualizarPlacaFasePreview(cat, ns=''){
  actualizarPlacaPreviewGenerica('fase-'+cat+ns, `placa-fase-preview-${cat}${ns}`, ()=>construirParamsPlacaFase(cat, ns), dibujarPlacaFase);
}

async function generarPlacaFase(cat, compartir, ns=''){
  const params = construirParamsPlacaFase(cat, ns);
  if(!params){ alert('Escribí un título primero.'); return; }

  }
}

async function dibujarPlacaFase({titulo, subtitulo, escalaLiga, offsetXLiga, offsetYLiga, escalaTigre, offsetXTigre, offsetYTigre, scale}){
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  escalaLiga = escalaLiga || 1; offsetXLiga = offsetXLiga || 0; offsetYLiga = offsetYLiga || 0;
  escalaTigre = escalaTigre || 1; offsetXTigre = offsetXTigre || 0; offsetYTigre = offsetYTigre || 0;
  const BG='#111e38', RED='#c0152a', WHITE='#ffffff', TXT2='#a8c0e8';
  const W=1280, H=720, pad=60, SCALE=scale||3;
  const [escudoLiga, escudoTigre] = await Promise.all([
    cargarImagen('escudos/LIGA.png'),
    cargarImagen(document.getElementById('escudoImg')?.src),
  ]);
  const canvas = document.createElement('canvas');
  canvas.width = W*SCALE; canvas.height = H*SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = RED; ctx.fillRect(0, 0, 24, H);

  if(escudoLiga){
    const wLiga=75*escalaLiga, hLiga=75*escalaLiga;
    ctx.drawImage(escudoLiga, pad+offsetXLiga, pad-12+offsetYLiga, wLiga, hLiga);
  }
  if(escudoTigre){
    const bTigre = bordesVisibles(escudoTigre);
    const base = 75*escalaTigre;
    const s = base/Math.max(bTigre.w, bTigre.h);
    const wTigre = bTigre.w*s, hTigre = bTigre.h*s;
    ctx.drawImage(escudoTigre, bTigre.x, bTigre.y, bTigre.w, bTigre.h,
      W-pad-wTigre+offsetXTigre, pad-12+offsetYTigre, wTigre, hTigre);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = "700 84px 'Barlow Condensed', sans-serif"; ctx.fillStyle = WHITE;
  ctx.fillText(titulo, W/2, subtitulo ? H/2 - 28 : H/2);
  if(subtitulo){
    ctx.font = "italic 38px 'Barlow', sans-serif"; ctx.fillStyle = TXT2;
    ctx.fillText(subtitulo, W/2, H/2 + 48);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';

  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

async function dibujarPlacaPortada({cat, prox, info, scale}){
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  const BG='#111e38', RED='#c0152a', GOLD='#f0c040', WHITE='#ffffff', TXT2='#a8c0e8';
  const W=1280, H=720, pad=60, SCALE=scale||3;

  const [escudoRival, escudoLiga] = await Promise.all([
    cargarImagen('escudos/'+info.escudo),
    cargarImagen('escudos/LIGA.png'),
  ]);

  const canvas = document.createElement('canvas');
  canvas.width = W*SCALE; canvas.height = H*SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = RED; ctx.fillRect(0, 0, 24, H);
  ctx.textBaseline = 'top';

  // LPF + temporada, arriba a la derecha
  let rx = W-pad;
  ctx.font = "700 15px 'Barlow', sans-serif";
  const pillTxt = 'TEMPORADA 2026', pillW = ctx.measureText(pillTxt).width+34;
  rx -= pillW;
  ctxRoundRect(ctx, rx, pad, pillW, 36, 18); ctx.fillStyle = RED; ctx.fill();
  ctx.fillStyle = WHITE; ctx.textAlign = 'center';
  ctx.fillText(pillTxt, rx+pillW/2, pad+11); ctx.textAlign = 'left';
  if(escudoLiga){ rx -= 58; ctx.drawImage(escudoLiga, rx, pad-8, 50, 50); }

  // Breadcrumb club + categoría (con un poco de letter-spacing, si el
  // navegador lo soporta -- si no, cae en el espaciado normal, sin romper)
  const catLabel = CATEGORIAS_CONFIG[cat]?.label ? CATEGORIAS_CONFIG[cat].label.toUpperCase()+' DIVISIÓN' : cat;
  let y = pad+14;
  ctx.font = "20px 'Barlow', sans-serif"; ctx.fillStyle = TXT2;
  try{ ctx.letterSpacing = '1.5px'; }catch(e){}
  ctx.fillText(`CLUB ATLÉTICO TIGRE   ·   ${catLabel}`, pad+24, y);
  try{ ctx.letterSpacing = '0px'; }catch(e){}
  y += 58;

  // Título + línea de acento
  ctx.font = "700 72px 'Barlow Condensed', sans-serif"; ctx.fillStyle = WHITE;
  ctx.fillText('Análisis Próximo Rival', pad+24, y);
  y += 96;
  ctx.fillStyle = RED; ctx.fillRect(pad+24, y, 170, 5);
  y += 46;

  // Fecha + día de calendario
  ctx.font = "700 26px 'Barlow', sans-serif"; ctx.fillStyle = WHITE;
  ctx.fillText(`Fecha ${prox.fecha}`, pad+24, y);
  const anchoFecha = ctx.measureText(`Fecha ${prox.fecha}`).width;
  ctx.font = "26px 'Barlow', sans-serif"; ctx.fillStyle = TXT2;
  ctx.fillText(`   ·   ${formatFechaCalendario(prox.fecha)}`, pad+24+anchoFecha, y);
  y += 46;

  // Condición de Tigre esa fecha ("LOCAL vs"/"VISITANTE vs"), a pedido de Javi.
  ctx.font = "700 22px 'Barlow Condensed', sans-serif"; ctx.fillStyle = GOLD;
  try{ ctx.letterSpacing = '1px'; }catch(e){}
  ctx.fillText(prox.condTigre==='L' ? 'LOCAL vs' : 'VISITANTE vs', pad+24, y);
  try{ ctx.letterSpacing = '0px'; }catch(e){}
  y += 40;

  // Rival: escudo grande + nombre apenas más grande que el título "Análisis
  // Próximo Rival" (72px) -- ajustado a pedido de Javi tras varias pruebas.
  const crestSize = 224;
  const crestY = y-10;
  let tx = pad+24;
  if(escudoRival){ ctx.drawImage(escudoRival, tx, crestY, crestSize, crestSize); tx += crestSize+30; }
  // Si el nombre del rival es largo (ej. "Defensa y Justicia"), el tamaño
  // base no entraría en el ancho disponible -- se achica hasta que entre.
  let fontSize = 80;
  ctx.font = `700 ${fontSize}px 'Barlow Condensed', sans-serif`;
  while(ctx.measureText(info.lpf).width > (W-pad)-tx && fontSize > 40){
    fontSize -= 4;
    ctx.font = `700 ${fontSize}px 'Barlow Condensed', sans-serif`;
  }
  ctx.fillStyle = WHITE;
  ctx.fillText(info.lpf, tx, crestY+crestSize/2-fontSize*0.38);

  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}
