/** Calculate minutes played for each player in a match */
function calcMinutosJugados(cat, fecha) {
  const m = matchData[cat]?.[fecha];
  if (!m || !m.titulares?.length) return {};
  const dur = m.duracion || 90;
  const mins = {};
  (m.titulares || []).forEach(p => { mins[p.nombre] = dur; });
  (m.cambios || []).forEach(c => {
    if (c.sale && mins[c.sale] !== undefined) mins[c.sale] = c.min;
    if (c.entra) mins[c.entra] = (mins[c.entra] || 0) + (dur - c.min);
  });
  return mins;
}

/** Get GPS minutes for a player in a given match session */
function getGpsMinutos(cat, fecha, playerName) {
  const rName = (matchData[cat]?.[fecha]?.rival || '').toUpperCase();
  const session = gpsSessions.find(s =>
    s.cat === cat &&
    (s.match?.includes('F'+fecha) || s.name?.includes('F'+fecha) ||
     (rName && s.match?.toUpperCase().includes(rName.split(' ')[0])))
  );
  if (!session) return null;
  const pl = (session.players || []).find(p =>
    p.name?.toLowerCase() === playerName.toLowerCase() ||
    p.name?.toLowerCase().includes(playerName.split(' ').slice(-1)[0].toLowerCase())
  );
  return pl ? pl.min : null;
}

/** Render the match detail panel for a given cat/fecha */
function renderMatchPanel(cat, fecha) {
  const panel = document.getElementById(`mdp-${cat}-${fecha}`);
  if (!panel) return;
  const m = matchData[cat]?.[fecha] || {};
  const titulares = m.titulares || [];
  const suplentes = m.suplentes || [];
  const cambios   = m.cambios   || [];
  const dur       = m.duracion  || 90;
  const minutos   = calcMinutosJugados(cat, fecha);
  const hasData   = titulares.length > 0;

  // All players available for selects
  const allPlayers = [...titulares, ...suplentes].map(p => p.nombre);

  // Build minutes section
  function playerMinRow(p) {
    const calc = minutos[p.nombre];
    const gps  = getGpsMinutos(cat, fecha, p.nombre);
    let minsHtml = '';
    if (calc !== undefined) {
      if (gps !== null) {
        const diff = Math.abs(calc - gps);
        const cls  = diff <= 3 ? 'ok' : 'diff';
        minsHtml = `<span class="mdp-mins ${cls}">${calc}' calc | ${gps}' GPS${diff>3?' ⚠':'  ✓'}</span>`;
      } else {
        minsHtml = `<span class="mdp-mins">${calc}'</span>`;
      }
    }
    return `<div class="mdp-player">
      <span class="mdp-num">${p.num}</span>
      <span>${esc(p.nombre)}</span>${minsHtml}
    </div>`;
  }

  const titHTML = titulares.map(playerMinRow).join('') ||
    '<div style="color:var(--muted);font-size:11px;font-family:Barlow Condensed,sans-serif">Sin datos</div>';

  const supHTML = suplentes.map(p => {
    const calc = minutos[p.nombre];
    const gps  = getGpsMinutos(cat, fecha, p.nombre);
    let minsHtml = '';
    if (calc !== undefined && calc > 0) {
      if (gps !== null) {
        const diff = Math.abs(calc - gps);
        const cls  = diff <= 3 ? 'ok' : 'diff';
        minsHtml = `<span class="mdp-mins ${cls}">${calc}' calc | ${gps}' GPS${diff>3?' ⚠':'  ✓'}</span>`;
      } else {
        minsHtml = `<span class="mdp-mins">${calc}'</span>`;
      }
    }
    return `<div class="mdp-player">
      <span class="mdp-num">${p.num}</span>
      <span style="${calc?'':'color:var(--muted)'}">${esc(p.nombre)}</span>${minsHtml}
    </div>`;
  }).join('') || '<div style="color:var(--muted);font-size:11px;font-family:Barlow Condensed,sans-serif">Sin datos</div>';

  const cambiosHTML = cambios.map((c, idx) =>
    `<div class="mdp-cambio">
      <span class="mdp-cambio-min">${c.min}'</span>
      <span style="color:var(--loss)">▼ ${esc(c.sale)}</span>
      <span style="color:var(--muted)">→</span>
      <span style="color:var(--win)">▲ ${esc(c.entra)}</span>
      ${canEdit ? `<button class="mdp-del" onclick="delCambio('${cat}',${fecha},${idx})">✕</button>` : ''}
    </div>`
  ).join('') || '<div style="color:var(--muted);font-size:11px;font-family:Barlow Condensed,sans-serif">Sin cambios</div>';

  const optsSale  = allPlayers.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  const optsEntra = allPlayers.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');

  const addCambioForm = canEdit ? `
    <div class="mdp-add-form" style="margin-top:8px">
      <select class="mdp-sel" id="mdp-sale-${cat}-${fecha}"><option value="">Sale…</option>${optsSale}</select>
      <select class="mdp-sel" id="mdp-entra-${cat}-${fecha}"><option value="">Entra…</option>${optsEntra}</select>
      <input class="mdp-min-input" type="number" min="1" max="120" placeholder="Min"
        id="mdp-min-${cat}-${fecha}">
      <button class="mdp-add-btn" onclick="addCambio('${cat}',${fecha})">+ CAMBIO</button>
    </div>` : '';

  const durEdit = canEdit
    ? `<div class="mdp-dur-row">⏱ Duración:
        <input class="mdp-dur-input" type="number" min="40" max="120" value="${dur}"
          onchange="setDuracion('${cat}',${fecha},this.value)"> min</div>`
    : `<div style="color:var(--muted);font-size:11px;font-family:Barlow Condensed,sans-serif;margin-bottom:6px">⏱ ${dur} min</div>`;

  const uploadSection = canEdit ? `
    <div style="margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button class="mdp-upload-btn" onclick="document.getElementById('cit-pdf-${cat}-${fecha}').click()">
        📄 CARGAR PDF CITACIONES
      </button>
      <input type="file" id="cit-pdf-${cat}-${fecha}" accept=".pdf" style="display:none"
        onchange="parseCitacionPdf(this.files[0],'${cat}',${fecha},this)">
      <span style="font-size:10px;color:var(--muted);font-family:Barlow Condensed,sans-serif">
        ${hasData ? '✓ Datos cargados' : 'O cargá manualmente abajo'}
      </span>
    </div>` : '';

  // Manual add players section (when no PDF)
  const manualSection = canEdit && !hasData ? `
    <div style="margin-bottom:8px">
      <div style="font-size:10px;color:var(--muted);font-family:Barlow Condensed,sans-serif;margin-bottom:4px">
        TITULARES (separados por coma, formato: "Num Apellido Nombre"):
      </div>
      <textarea id="mdp-manual-tit-${cat}-${fecha}" style="width:100%;background:rgba(5,8,15,0.8);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-size:11px;padding:6px;font-family:Barlow Condensed,sans-serif;resize:vertical;min-height:50px;" placeholder="1 Ruiz Santiago, 2 Luongo Alan, 3 Benitez Lautaro…"></textarea>
      <textarea id="mdp-manual-sup-${cat}-${fecha}" style="width:100%;background:rgba(5,8,15,0.8);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-size:11px;padding:6px;font-family:Barlow Condensed,sans-serif;resize:vertical;min-height:40px;margin-top:4px;" placeholder="12 Petry Uriel, 13 Rojas Josue…"></textarea>
      <button class="mdp-add-btn" style="margin-top:4px" onclick="saveManualLineup('${cat}',${fecha})">💾 GUARDAR ALINEACIÓN</button>
    </div>` : '';

  panel.innerHTML = `
    ${uploadSection}
    ${manualSection}
    ${durEdit}
    <div class="mdp-grid">
      <div class="mdp-section">
        <h4>👕 TITULARES (${titulares.length}/11)</h4>
        ${titHTML}
      </div>
      <div class="mdp-section">
        <h4>🪑 SUPLENTES (${suplentes.length})</h4>
        ${supHTML}
      </div>
      <div class="mdp-section">
        <h4>🔄 CAMBIOS (${cambios.length})</h4>
        ${cambiosHTML}
        ${addCambioForm}
      </div>
    </div>`;
}

function addCambio(cat, fecha) {
  const sale  = document.getElementById(`mdp-sale-${cat}-${fecha}`)?.value;
  const entra = document.getElementById(`mdp-entra-${cat}-${fecha}`)?.value;
  const min   = parseInt(document.getElementById(`mdp-min-${cat}-${fecha}`)?.value);
  if (!sale || !entra || !min || sale === entra) { showToast('⚠ Completá todos los campos'); return; }
  if (!matchData[cat]) matchData[cat] = {};
  if (!matchData[cat][fecha]) matchData[cat][fecha] = {titulares:[],suplentes:[],cambios:[],duracion:90};
  if (!matchData[cat][fecha].cambios) matchData[cat][fecha].cambios = [];
  matchData[cat][fecha].cambios.push({min, sale, entra});
  matchData[cat][fecha].cambios.sort((a,b)=>a.min-b.min);
  renderMatchPanel(cat, fecha);
  saveData();
}

function delCambio(cat, fecha, idx) {
  if (!matchData[cat]?.[fecha]?.cambios) return;
  matchData[cat][fecha].cambios.splice(idx, 1);
  renderMatchPanel(cat, fecha);
  saveData();
}

function setDuracion(cat, fecha, val) {
  if (!matchData[cat]) matchData[cat] = {};
  if (!matchData[cat][fecha]) matchData[cat][fecha] = {titulares:[],suplentes:[],cambios:[],duracion:90};
  matchData[cat][fecha].duracion = parseInt(val) || 90;
  renderMatchPanel(cat, fecha);
  saveData();
}

function saveManualLineup(cat, fecha) {
  const titRaw = document.getElementById(`mdp-manual-tit-${cat}-${fecha}`)?.value || '';
  const supRaw = document.getElementById(`mdp-manual-sup-${cat}-${fecha}`)?.value || '';
  function parsePlayers(raw) {
    return raw.split(',').map(s => s.trim()).filter(Boolean).map(s => {
      const m = s.match(/^(\d+)\s+(.+)$/);
      if (m) return {num: parseInt(m[1]), nombre: m[2].trim()};
      return {num: 0, nombre: s};
    });
  }
  if (!matchData[cat]) matchData[cat] = {};
  if (!matchData[cat][fecha]) matchData[cat][fecha] = {cambios:[], duracion:90};
  matchData[cat][fecha].titulares = parsePlayers(titRaw);
  matchData[cat][fecha].suplentes = parsePlayers(supRaw);
  renderMatchPanel(cat, fecha);
  saveData();
  showToast('✓ Alineación guardada');
}

function toggleMatchDetail(cat, fecha) {
  const row = document.getElementById(`mdr-${cat}-${fecha}`);
  const btn = document.querySelector(`button.btn-equipo[data-cat="${cat}"][data-fecha="${fecha}"]`);
  if (!row) return;
  const open = row.style.display !== 'none';
  row.style.display = open ? 'none' : '';
  if (btn) btn.classList.toggle('active', !open);
  if (!open) renderMatchPanel(cat, fecha);
}

// ── PDF Citation Parser ───────────────────────────────────────
const CAT_DIV_MAP = {
  'cuarta':'4TA','quinta':'5TA','sexta':'6TA',
  'septima':'7MA','séptima':'7MA','septima':'7MA',
  'octava':'8VA','novena':'9NA'
};

async function parseCitacionPdf(file, catHint, fechaHint, inputEl) {
  if (!file) return;
  if (inputEl) inputEl.value = '';
  showToast('📄 Procesando citaciones…');
  try {
    const arrayBuf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuf}).promise;
    const results_parsed = {};

    for (let pg = 1; pg <= pdf.numPages; pg++) {
      const page   = await pdf.getPage(pg);
      const tc     = await page.getTextContent();
      const lines  = [];
      tc.items.forEach(it => {
        const existing = lines.find(l => Math.abs(l.y - it.transform[5]) < 3);
        if (existing) existing.tokens.push(it.str);
        else lines.push({y: it.transform[5], tokens:[it.str]});
      });
      lines.sort((a,b)=>b.y-a.y); // top to bottom
      const pageText = lines.map(l=>l.tokens.join(' ')).join('\n');

      // Detect category from division name
      let detectedCat = catHint;
      for (const [key, val] of Object.entries(CAT_DIV_MAP)) {
        if (pageText.toLowerCase().includes(key)) { detectedCat = val; break; }
      }
      if (!detectedCat) continue;

      // Detect fecha from filename or existing hint
      let fecha = fechaHint;

      // Extract players: look for "N - APELLIDO, Nombre" or "N - APELLIDO\nNombre"
      const playerRegex = /(\d{1,2})\s*[-–]\s*([A-ZÁÉÍÓÚÑÜ][A-ZÁÉÍÓÚÑÜA-Za-záéíóúñü\s,\.]+?)(?=\s*\d{1,2}\s*[-–]|\s*SUPLENTES|\s*CUERPO|\s*PLANILLA|$)/g;
      const allText = pageText.replace(/\n/g,' ');
      const players = [];
      let match;
      // Better: scan line by line for player patterns
      const playerLineRe = /^(\d{1,2})\s*[-–]\s*([A-ZÁÉÍÓÚÑÜ][A-Za-záéíóúÁÉÍÓÚÑÜñü]+)(?:[,\s]+([A-Za-záéíóúÁÉÍÓÚÑÜñü]+))?/;
      lines.forEach(l => {
        const txt = l.tokens.join(' ').trim();
        const m = txt.match(playerLineRe);
        if (m) {
          const num    = parseInt(m[1]);
          const ape    = m[2]?.trim() || '';
          const nom    = m[3]?.trim() || '';
          // Also check next-line name (common in PDF field diagrams)
          const nombre = nom ? `${nom} ${ape}` : ape;
          if (num >= 1 && num <= 18 && ape.length > 1) {
            players.push({num, nombre: nombre.trim()});
          }
        }
      });

      // Also scan for "APELLIDO, Nombre" pattern in suplentes section
      lines.forEach(l => {
        const txt = l.tokens.join(' ').trim();
        const m = txt.match(/^(\d{1,2})\s*[-–]\s*([A-ZÁÉÍÓÚÑÜ][A-Za-záéíóúÁÉÍÓÚÑÜñü]+),\s*([A-Za-záéíóúÁÉÍÓÚÑÜñü]+)/);
        if (m) {
          const num    = parseInt(m[1]);
          const ape    = m[2]?.trim() || '';
          const nom    = m[3]?.trim() || '';
          const nombre = `${nom} ${ape}`;
          if (num >= 1 && num <= 18 && !players.find(p=>p.num===num)) {
            players.push({num, nombre: nombre.trim()});
          }
        }
      });

      // Deduplicate and sort by num
      const seen = new Set();
      const unique = players.filter(p => {
        if (seen.has(p.num)) return false;
        seen.add(p.num); return true;
      }).sort((a,b)=>a.num-b.num);

      const titulares = unique.filter(p => p.num >= 1 && p.num <= 11);
      const suplentes = unique.filter(p => p.num >= 12 && p.num <= 18);

      // Detect rival
      const rivalMatch = pageText.match(/RIVAL:\s*([A-Za-záéíóúÁÉÍÓÚÑÜñü\s]+?)(?:\s+CONDICIÓN|$)/m);
      const rival = rivalMatch?.[1]?.trim() || '';

      results_parsed[detectedCat] = {titulares, suplentes, rival};
    }

    // Ask user to confirm fecha if not provided
    const catsFound = Object.keys(results_parsed);
    if (!catsFound.length) { showToast('⚠ No se encontraron datos de citación'); return; }

    // ── Plantel validation: flag players not in roster ──
    const plantelWarnings = [];
    catsFound.forEach(cat => {
      const rosterNames = Object.values(players_db||{})
        .filter(p=>p.cat===cat||p.categoria===cat)
        .map(p=>(p.nombre||p.name||'').toLowerCase());
      if(!rosterNames.length) return; // no roster for this cat, skip
      const allCited = [...(results_parsed[cat].titulares||[]), ...(results_parsed[cat].suplentes||[])];
      allCited.forEach(p=>{
        const name = (p.nombre||'').toLowerCase();
        const found = rosterNames.some(r=>r.includes(name.split(' ').slice(-1)[0]) || name.includes(r.split(' ').slice(-1)[0]));
        if(!found && name.length > 2) plantelWarnings.push(`${cat}: ${p.nombre} (no está en plantel)`);
      });
    });
    if(plantelWarnings.length){
      showToast(`⚠ ${plantelWarnings.length} jugador${plantelWarnings.length>1?'es':''} no encontrado${plantelWarnings.length>1?'s':''} en plantel`);
      console.warn('[CITACION] Jugadores no en plantel:', plantelWarnings);
    }

    // If fechaHint provided, save directly; otherwise prompt
    if (fechaHint) {
      catsFound.forEach(cat => {
        if (!matchData[cat]) matchData[cat] = {};
        const existing = matchData[cat][fechaHint] || {};
        matchData[cat][fechaHint] = {
          ...existing,
          titulares: results_parsed[cat].titulares,
          suplentes: results_parsed[cat].suplentes,
          rival: results_parsed[cat].rival || existing.rival,
          cambios: existing.cambios || [],
          duracion: existing.duracion || 90,
        };
        const panel = document.getElementById(`mdp-${cat}-${fechaHint}`);
        if (panel) renderMatchPanel(cat, fechaHint);
        // Update button state
        const btn = document.querySelector(`button.btn-equipo[data-cat="${cat}"][data-fecha="${fechaHint}"]`);
        if (btn) { btn.textContent = '👥 ✓'; btn.classList.add('active'); }
      });
      saveData();
      showToast(`✓ ${catsFound.length} categorías cargadas: ${catsFound.join(', ')}`);
    } else {
      // Show a non-blocking modal to ask for the fecha number
      const overlay = document.createElement('div');
      overlay.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(5,8,15,0.85);display:flex;align-items:center;justify-content:center';
      const summaryLine = catsFound.map(c=>`${c}: ${results_parsed[c].titulares.length}T + ${results_parsed[c].suplentes.length}S`).join(' · ');
      overlay.innerHTML=`<div style="background:#0a0f1e;border:1px solid #1a2d5a;border-radius:12px;padding:24px;max-width:360px;width:90%;font-family:'Barlow Condensed',sans-serif">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;color:#c9a227;margin-bottom:8px">ASIGNAR FECHA</div>
        <div style="font-size:11px;color:#5a7099;margin-bottom:12px">${summaryLine}</div>
        <div style="font-size:12px;color:var(--text2,#d8e4ff);margin-bottom:8px">¿Para qué número de FECHA son estos datos?</div>
        <input id="cit-fecha-inp" type="number" min="1" max="35" placeholder="Ej: 13"
          style="width:100%;background:rgba(5,8,15,0.8);border:1px solid #1a2d5a;border-radius:6px;color:#d8e4ff;font-size:16px;padding:10px 12px;box-sizing:border-box;margin-bottom:12px;outline:none">
        <div style="display:flex;gap:8px">
          <button onclick="this.closest('div[style*=inset]').remove()"
            style="flex:1;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:6px;color:#f87171;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;padding:8px;cursor:pointer">CANCELAR</button>
          <button id="cit-fecha-ok"
            style="flex:2;background:linear-gradient(135deg,#1a4a1a,#2a6a2a);border:1px solid #4a8a4a;border-radius:6px;color:#86efac;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;padding:8px;cursor:pointer">✓ CONFIRMAR</button>
        </div>
      </div>`;
      document.body.appendChild(overlay);
      const inp = overlay.querySelector('#cit-fecha-inp');
      inp.focus();
      const confirmFecha = () => {
        const f = parseInt(inp.value);
        if(!f || f < 1 || f > 35){ inp.style.borderColor='#ef4444'; return; }
        overlay.remove();
        catsFound.forEach(cat => {
          if(!matchData[cat]) matchData[cat] = {};
          const existing = matchData[cat][f] || {};
          matchData[cat][f] = { ...existing,
            titulares: results_parsed[cat].titulares,
            suplentes: results_parsed[cat].suplentes,
            rival:     results_parsed[cat].rival || existing.rival,
            cambios:   existing.cambios  || [],
            duracion:  existing.duracion || 90,
          };
          const panel = document.getElementById(`mdp-${cat}-${f}`);
          if(panel) renderMatchPanel(cat, f);
          const btn = document.querySelector(`button.btn-equipo[data-cat="${cat}"][data-fecha="${f}"]`);
          if(btn){ btn.textContent='👥 ✓'; btn.classList.add('active'); }
        });
        saveData();
        showToast(`✓ F${f}: ${catsFound.length} categorías cargadas`);
      };
      overlay.querySelector('#cit-fecha-ok').addEventListener('click', confirmFecha);
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') confirmFecha(); });
    }
  } catch(e) {
    console.error('[CITACION PDF]', e);
    showToast('⚠ Error al procesar el PDF: ' + e.message);
  }
}

  tbody.addEventListener('change',e=>{
    if(e.target.classList.contains('score-input')){
      const f=parseInt(e.target.dataset.fecha),s=parseInt(e.target.dataset.side);
      const v=e.target.value===''?null:parseInt(e.target.value);
      if(!results[cat][f])results[cat][f]=[null,null];
      results[cat][f][s]=v;
      if(results[cat][f][0]===null&&results[cat][f][1]===null)results[cat][f]=null;
      rebuildRow(cat,f);
      document.getElementById(`stats-area-${cat}`).innerHTML=statsHTML(calcStats(cat,1,cat==='RESERVA'?18:35));
      renderCatCharts(cat);
      saveData();
    }
    if(e.target.classList.contains('link-input')){
      const f=parseInt(e.target.dataset.fecha),key=e.target.dataset.lkey,val=e.target.value.trim();
      links[cat][f][key]=val;
      const btn=e.target.nextElementSibling;
      if(btn){btn.href=val||'#';btn.classList.toggle('empty',!val);}
      saveData();
    }
    // RESERVA editable rival/cond
    if(e.target.classList.contains('rival-edit-input')||e.target.classList.contains('cond-edit-select')){
      const f=parseInt(e.target.dataset.fecha),field=e.target.dataset.field;
      if(!rivalData['RESERVA'][f]) rivalData['RESERVA'][f]={rival:'',cond:'L'};
      rivalData['RESERVA'][f][field]=e.target.value;
      saveData();
    }
  });
}

function rebuildRow(cat,fecha){
  const tbody=document.getElementById(`tbody-${cat}`);
  if(!tbody)return;
  tbody.querySelectorAll('tr').forEach(tr=>{
    const inp=tr.querySelectorAll('.score-input');
    if(!inp.length||parseInt(inp[0].dataset.fecha)!==fecha)return;
    const r=results[cat][fecha],res=r?getResult(r[0],r[1]):null;
    tr.children[4].innerHTML=res?`<span class="result-badge result-${res}">${res}</span>`:'—';
    const pts=res==='W'?3:res==='D'?1:res==='L'?0:'—';
    tr.children[5].textContent=pts;
    tr.children[5].style.color=res==='W'?'var(--win)':res==='D'?'var(--draw)':res==='L'?'var(--loss)':'var(--muted)';
    tr.children[5].style.fontWeight='700';
  });
}

// ── CAT CHARTS ────────────────────────────────────────────────
function renderCatCharts(cat){
  const blocks=getBlocks(cat),labels=blocks.map(b=>b.label),col=CAT_COLORS[cat],def=chartDef();
  const fixtureList = cat==='RESERVA' ? RIVALS_RESERVA : RIVALS;
  const totMax = cat==='RESERVA' ? 18 : 35;

  killChart(`cpts-${cat}`);
  new Chart(document.getElementById(`cpts-${cat}`).getContext('2d'),{type:'bar',
    data:{labels,datasets:[{label:'Puntos',
      data:blocks.map(b=>calcStats(cat,b.from,b.to).pts),
      backgroundColor:blocks.map(b=>{const v=calcStats(cat,b.from,b.to).pts;return v>=9?'rgba(34,197,94,.75)':v>=5?'rgba(201,162,39,.75)':'rgba(192,21,42,.65)';}),
      borderRadius:5,borderSkipped:false}]},options:def});

  killChart(`cgls-${cat}`);
  new Chart(document.getElementById(`cgls-${cat}`).getContext('2d'),{type:'bar',
    data:{labels,datasets:[
      {label:'GF',data:blocks.map(b=>calcStats(cat,b.from,b.to).gf),backgroundColor:'rgba(36,80,192,.7)',borderRadius:4},
      {label:'GC',data:blocks.map(b=>calcStats(cat,b.from,b.to).gc),backgroundColor:'rgba(192,21,42,.55)',borderRadius:4}
    ]},options:def});

  let dgAcc=[],acc=0,dgL=[];
  fixtureList.forEach(r=>{const x=results[cat][r.f];if(x){acc+=(x[0]-x[1]);dgAcc.push(acc);dgL.push('F'+r.f);}});
  killChart(`cdg-${cat}`);
  new Chart(document.getElementById(`cdg-${cat}`).getContext('2d'),{type:'line',
    data:{labels:dgL,datasets:[{label:'DG Acum.',data:dgAcc,borderColor:col,
      backgroundColor:col+'22',fill:true,tension:.3,pointRadius:3,
      pointBackgroundColor:dgAcc.map(v=>v>=0?'#22c55e':'#ef4444')}]},
    options:{...def,scales:{...def.scales,y:{...def.scales.y,grid:{color:ctx=>ctx.tick.value===0?'#5a7099':'rgba(26,45,90,0.4)'}}}}});

  const tot=calcStats(cat,1,totMax);
  killChart(`cpie-${cat}`);
  new Chart(document.getElementById(`cpie-${cat}`).getContext('2d'),{type:'doughnut',
    data:{labels:['Ganados','Empates','Perdidos'],datasets:[{data:[tot.pg,tot.pe,tot.pp],
      backgroundColor:['rgba(34,197,94,.82)','rgba(245,158,11,.82)','rgba(192,21,42,.75)'],
      borderColor:['#22c55e','#f59e0b','#c0152a'],borderWidth:2}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#5a7099',font:{family:'Barlow Condensed'}}}}}});

  // Block pies
  const grid=document.getElementById(`piesgrid-${cat}`);
  if(!grid)return;
  grid.innerHTML='';
  blocks.forEach(b=>{
    const s=calcStats(cat,b.from,b.to),id=`pb-${cat}-${b.from}`;
    grid.insertAdjacentHTML('beforeend',pieMini(id,s,b.label));
    setTimeout(()=>drawPie(id,s),0);
  });
}

// ── GOLEADORES ────────────────────────────────────────────────
function renderGoleadores(cat){
  const wrap=document.getElementById(`goleadores-${cat}`);
  if(!wrap)return;
  const list=goleadores[cat]||[];
  // Group by player name
  const map={};
  list.forEach(g=>{
    if(!map[g.name])map[g.name]={name:g.name,goals:0,fechas:[]};
    map[g.name].goals+=g.goals;
    map[g.name].fechas.push(`F${g.fecha}`);
  });
  const sorted=Object.values(map).sort((a,b)=>b.goals-a.goals);

  let rowsHTML='';
  if(sorted.length===0){
    rowsHTML=`<div class="gol-empty">Sin goleadores registrados</div>`;
  } else {
    sorted.forEach((g,i)=>{
      const rankClass=i===0?'gold':i===1?'silver':i===2?'bronze':'';
      rowsHTML+=`<div class="gol-row">
        <div class="gol-rank ${rankClass}">${i+1}</div>
        <div class="gol-name">${esc(g.name)}<br><span style="font-size:10px;color:var(--muted);font-weight:400">${g.fechas.join(', ')}</span></div>
        <div class="gol-count">${g.goals}</div>
        ${canEdit?`<button class="btn-del-gol" onclick="delGoleador('${cat}','${esc(g.name)}')"
          style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;"
          title="Eliminar">✕</button>`:''}
      </div>`;
    });
  }

  wrap.innerHTML=`<div class="goleadores-grid">
    <div class="goleadores-card">
      <div class="gc-header">
        <h3>⚽ GOLEADORES ${cat}</h3>
        <span style="font-family:Bebas Neue,sans-serif;font-size:20px;color:rgba(255,255,255,0.7)">${sorted.length}</span>
      </div>
      <div class="gc-body">${rowsHTML}</div>
      ${canEdit?`<div class="gol-add-row">
        <input class="gol-input" id="gol-name-${cat}" placeholder="Nombre del jugador…" autocomplete="off">
        <input class="gol-fecha-input" id="gol-fecha-${cat}" type="number" min="1" max="35" placeholder="F#">
        <input class="gol-fecha-input" id="gol-count-${cat}" type="number" min="1" max="9" value="1" style="width:40px">
        <button class="btn-add-gol" onclick="addGoleador('${cat}')">+ GOL</button>
      </div>`:''}
    </div>
  </div>`;
}

function addGoleador(cat){
  const nameEl=document.getElementById(`gol-name-${cat}`);
  const fechaEl=document.getElementById(`gol-fecha-${cat}`);
  const countEl=document.getElementById(`gol-count-${cat}`);
  const name=nameEl.value.trim();
  const fecha=parseInt(fechaEl.value);
  const count=parseInt(countEl.value)||1;
  if(!name||!fecha||fecha<1||fecha>35){
    nameEl.style.borderColor='var(--red)';
    setTimeout(()=>nameEl.style.borderColor='',1500);
    return;
  }
  if(!goleadores[cat])goleadores[cat]=[];
  goleadores[cat].push({name,goals:count,fecha});
  nameEl.value=''; fechaEl.value=''; countEl.value='1';
  saveData();
  renderGoleadores(cat);
}

function delGoleador(cat,name){
  confirmAction(`¿Eliminar todos los goles de ${name} en ${cat}?`, ()=>{
    goleadores[cat]=(goleadores[cat]||[]).filter(g=>g.name!==name);
    saveData();
    renderGoleadores(cat);
  }, 'ELIMINAR');
}

function renderPlantel() {
  const content = document.getElementById('plantel-content');
  if (!content) return;

  // Gather players for current cat
  const allPlayers = plantelCurrentCat === 'GENERAL'
    ? CATEGORIES.flatMap(cat => (players[cat]||[]).map(p => ({...p, _cat: cat})))
    : (players[plantelCurrentCat]||[]).map(p => ({...p, _cat: plantelCurrentCat}));

  // Filter
  const q = plantelSearch.toLowerCase();
  const filtered = allPlayers.filter(p => {
    const matchQ = !q || p.name.toLowerCase().includes(q) || (p.pos||'').toLowerCase().includes(q);
    const matchP = plantelPosFilter === 'TODOS' || p.pos === plantelPosFilter;
    return matchQ && matchP;
  });

  // Position filter pills
  const allPos = ['TODOS', ...POSITIONS];
  const posPills = allPos.map(pos =>
    `<div class="pos-pill${plantelPosFilter===pos?' active':''}" onclick="setPosFilter('${pos}')">${pos}</div>`
  ).join('');

  content.innerHTML = `
    <div class="st" style="margin-top:4px">
      <div class="stbar"></div>

function emptyStateHTML() {
  return `<div class="empty-state" style="grid-column:1/-1">
    <div class="es-icon">👤</div>
    <h3>SIN JUGADORES</h3>
    <p>${canEdit ? 'Hacé clic en "+ JUGADOR" para agregar el primero.' : 'No hay jugadores cargados en esta categoría.'}</p>
  </div>`;
}

function calcEdad(nacStr) {
  if (!nacStr) return '—';
  try {
    const [d,m,y] = nacStr.split('/').map(Number);
    const hoy = new Date();
    let edad = hoy.getFullYear() - y;
    if (hoy.getMonth()+1 < m || (hoy.getMonth()+1===m && hoy.getDate()<d)) edad--;
    return edad + ' años';
  } catch { return '—'; }
}

function closeFichaIfBg(e) {
  if (e.target.id === 'ficha-modal-bg') closeFichaModal();
}
function closeFichaModal() {
  const m = document.getElementById('ficha-modal-bg');
  if (m) m.remove();
  document.body.style.overflow = '';
  editingPlayer = null;
}

function updateFichaPreview() {
  const nameEl = document.getElementById('fi-name');
  const posEl  = document.getElementById('fi-pos');
  const catEl  = document.getElementById('fi-cat');
  if (!nameEl) return;
  const name = nameEl.value.trim() || 'NUEVO JUGADOR';
  const initials = name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const pn = document.getElementById('ficha-preview-name');
  const ps = document.getElementById('ficha-preview-sub');
  const ai = document.getElementById('ficha-avatar-initials');
  if (pn) pn.textContent = name;
  if (ps) ps.textContent = (posEl?.value||'') + (catEl?.value ? ' · '+catEl.value : '');
  if (ai) ai.textContent = initials;
}

function triggerPhotoUpload() {
  const el = document.getElementById('photo-upload');
  if (el) el.click();
}

function handlePhotoUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const src = ev.target.result;
    const preview = document.getElementById('ficha-avatar-preview');
    if (preview) {
      preview.innerHTML = `<img id="ficha-avatar-img" src="${src}">`;
    }
  };
  reader.readAsDataURL(file);
}

function saveFicha() {
  if (!canEdit) return;
  const name    = document.getElementById('fi-name')?.value.trim();
  const cat     = document.getElementById('fi-cat')?.value;
  if (!name) {
    document.getElementById('fi-name').style.borderColor = 'var(--red)';
    setTimeout(() => { const el=document.getElementById('fi-name'); if(el)el.style.borderColor=''; }, 1500);
    return;
  }
  const imgEl   = document.getElementById('ficha-avatar-img');
  const foto    = imgEl ? imgEl.src : '';
  const player  = {
    id:          editingPlayer?.id || ('p_' + Date.now()),
    name,
    pos:         document.getElementById('fi-pos')?.value     || '',
    pierna:      document.getElementById('fi-pierna')?.value  || '',
    altura:      document.getElementById('fi-altura')?.value  || '',
    peso:        document.getElementById('fi-peso')?.value    || '',
    nacimiento:  document.getElementById('fi-nac')?.value     || '',
    dni:         document.getElementById('fi-dni')?.value     || '',
    credencial:  document.getElementById('fi-cred')?.value    || '',
    domicilio:   document.getElementById('fi-dom')?.value     || '',
    contacto:    document.getElementById('fi-contacto')?.value|| '',
    foto: foto.startsWith('data:') ? foto : '',
  };

  // Handle cat change (move player between categories)
  const oldCat = editingPlayer?.cat;
  if (oldCat && oldCat !== cat && player.id) {
    players[oldCat] = (players[oldCat]||[]).filter(p => p.id !== player.id);
  }
  if (!players[cat]) players[cat] = [];
  const idx = (players[cat]||[]).findIndex(p => p.id === player.id);
  if (idx >= 0) players[cat][idx] = player;
  else players[cat].push(player);

  savePlayers();
  closeFichaModal();
  renderPlantel();
  showToast('✓ FICHA GUARDADA');
}

function deleteFicha() {
  if (!isAdmin) { showToast('Solo el admin puede eliminar fichas'); return; }
  const cat = editingPlayer?.cat;
  const id  = editingPlayer?.id;
  confirmAction('¿Eliminar esta ficha permanentemente? Esta acción no se puede deshacer.', ()=>{
    if (cat && id) {
      players[cat] = (players[cat]||[]).filter(p => p.id !== id);
      savePlayers();
    }
    closeFichaModal();
    renderPlantel();
    showToast('🗑 FICHA ELIMINADA');
  }, 'ELIMINAR');
}

// ── Save rendimiento ──────────────────────────────────────────
function saveRendimiento(){
  if(!fbReady||!db||!canEdit) return;
  clearTimeout(window._saveRendTimeout);
  window._saveRendTimeout = setTimeout(()=>{
    const payload={lesiones:{},tarjetas:{}};
    CATEGORIES.forEach(cat=>{
      payload.lesiones[cat] = lesiones[cat]||[];
      payload.tarjetas[cat] = tarjetas[cat]||[];
    });
    db.ref('rendimiento').set(payload)
      .then(()=>showToast('☁ GUARDADO'))
      .catch(e=>console.warn('save rend error:',e));
  },800);
}

function loadRendimiento(payload){
  if(!payload) return;
  CATEGORIES.forEach(cat=>{
    if(payload.lesiones?.[cat]) lesiones[cat]=payload.lesiones[cat];
    if(payload.tarjetas?.[cat]) tarjetas[cat]=payload.tarjetas[cat];
  });
}

// ── FORMA RECIENTE ────────────────────────────────────────────
function renderForma(){
  const wrap=document.getElementById('rend-forma');
  if(!wrap) return;
  const cats=rendCurrentCat==='GENERAL'?CATEGORIES:[rendCurrentCat];
  wrap.innerHTML=cats.map(cat=>{
    // Get last 5 played results
    const played=RIVALS.filter(r=>results[cat][r.f]).reverse().slice(0,5).reverse();
    const badges=Array(5).fill(null).map((_,i)=>{
      const r=played[played.length-5+i];
      if(!r) return `<div class="forma-badge empty">—</div>`;
      const res=getResult(results[cat][r.f][0],results[cat][r.f][1]);
      return `<div class="forma-badge ${res}" title="${r.r}">${res}</div>`;
    });
    const pts5=played.reduce((s,r)=>{const x=getResult(results[cat][r.f][0],results[cat][r.f][1]);return s+(x==='W'?3:x==='D'?1:0);},0);
    return `<div class="forma-card">
      <div class="fc-header">
        <h3 style="color:${CAT_COLORS[cat]}">${cat}</h3>
        <span style="font-family:Barlow Condensed,sans-serif;font-size:11px;color:var(--muted);letter-spacing:1px">ÚLTIMOS ${played.length}</span>
      </div>
      <div class="forma-badges">${badges.join('')}</div>
      <div class="forma-pts">Puntos obtenidos: <span>${pts5}</span> / ${played.length*3}</div>
    </div>`;
  }).join('');
}

// ── LOCAL VS VISITANTE ────────────────────────────────────────
function renderLVV(){
  const wrap=document.getElementById('rend-lvv');
  if(!wrap) return;
  const cats=rendCurrentCat==='GENERAL'?CATEGORIES:[rendCurrentCat];
  wrap.innerHTML=cats.map(cat=>{
    const local=RIVALS.filter(r=>r.c==='L'&&results[cat][r.f]);
    const visit=RIVALS.filter(r=>r.c==='V'&&results[cat][r.f]);
    const calcLVV=list=>{
      let pg=0,pe=0,pp=0,gf=0,gc=0;
      list.forEach(r=>{const x=getResult(results[cat][r.f][0],results[cat][r.f][1]);if(x==='W')pg++;else if(x==='D')pe++;else pp++;gf+=results[cat][r.f][0];gc+=results[cat][r.f][1];});
      const pj=list.length,pts=pg*3+pe;
      return{pj,pg,pe,pp,gf,gc,pts};
    };
    const l=calcLVV(local),v=calcLVV(visit);
    const half=(side,s)=>`<div class="lvv-half">
      <div class="lvv-label">${side}</div>
      <div class="lvv-pts-big">${s.pts}</div>
      <div class="lvv-sub">pts en ${s.pj} partidos</div>
      <div class="lvv-stats-mini" style="margin-top:8px">
        <span style="color:var(--win)">${s.pg}G</span>
        <span style="color:var(--draw)">${s.pe}E</span>
        <span style="color:var(--loss)">${s.pp}P</span>
      </div>
      <div style="font-family:Barlow Condensed,sans-serif;font-size:11px;color:var(--muted);margin-top:4px">${s.gf} GF · ${s.gc} GC</div>
    </div>`;
    return `<div class="lvv-card">
      <div class="lv-header"><span style="color:${CAT_COLORS[cat]}">${cat}</span><span style="font-size:12px;opacity:.7">LOCAL vs VISITANTE</span></div>
      <div class="lvv-row">${half('🏠 LOCAL',l)}${half('✈ VISITANTE',v)}</div>
    </div>`;
  }).join('');
}

// ── ÍNDICE DE RENDIMIENTO ─────────────────────────────────────
function renderIndice(){
  const tbody=document.getElementById('rend-indice');
  if(!tbody) return;
  const cats=rendCurrentCat==='GENERAL'?CATEGORIES:[rendCurrentCat];
  // Max pts/pj across cats for bar scaling
  const rows=cats.map(cat=>{
    const s=calcStats(cat,1,cat==='RESERVA'?18:35);
    if(s.pj===0) return{cat,ppp:0,gfpj:0,pctW:0,idx:0};
    const ppp=s.pts/s.pj;
    const gfpj=s.gf/s.pj;
    const pctW=Math.round(s.pg/s.pj*100);
    // Index 0-100: weighted combo
    const idx=Math.round(Math.min(100,(ppp/3*50)+(pctW/100*30)+(Math.min(gfpj,4)/4*20)));
    return{cat,ppp:ppp.toFixed(2),gfpj:gfpj.toFixed(2),pctW,idx};
  });
  const maxIdx=Math.max(...rows.map(r=>r.idx),1);
  tbody.innerHTML=rows.map(r=>`<tr>
    <td style="font-family:Bebas Neue,sans-serif;font-size:15px;letter-spacing:1px;color:${CAT_COLORS[r.cat]}">${r.cat}</td>
    <td class="indice-bar-wrap"><div class="indice-bar" style="width:${Math.round(r.idx/maxIdx*100)}%"></div></td>
    <td style="color:var(--gold2);font-family:Bebas Neue,sans-serif;font-size:15px">${r.ppp}</td>
    <td style="color:#60a5fa;font-family:Bebas Neue,sans-serif;font-size:15px">${r.gfpj}</td>
    <td style="color:var(--win);font-family:Bebas Neue,sans-serif;font-size:15px">${r.pctW}%</td>
    <td class="indice-score" style="color:${r.idx>=70?'var(--win)':r.idx>=45?'var(--draw)':'var(--loss)'}">${r.idx}</td>
  </tr>`).join('');
}

          onkeydown="if(event.key==='Enter')addTarjetaPlayer('${cat}')">

function addTarjetaPlayer(cat){
  const inp=document.getElementById(`tj-inp-${cat}`);
  if(!inp) return;
  const name=inp.value.trim();
  if(!name) return;
  if(!tarjetas[cat]) tarjetas[cat]=[];
  if(tarjetas[cat].find(p=>p.name.toLowerCase()===name.toLowerCase())){inp.value='';return;}
  tarjetas[cat].push({id:'t_'+Date.now(),name,amarillas:0,rojas:0});
  inp.value='';
  saveRendimiento();
  renderTarjetas();
}

function modTarjeta(cat,id,type,delta){
  const p=(tarjetas[cat]||[]).find(x=>x.id===id);
  if(!p) return;
  if(type==='am') p.amarillas=Math.max(0,p.amarillas+delta);
  else            p.rojas=Math.max(0,p.rojas+delta);
  saveRendimiento();
  renderTarjetas();
  // Re-render alertas
  const alertas=getAllAlertas();
  const banner=document.querySelector('.alertas-banner');
  if(banner){
    if(alertas.length===0) banner.remove();
    else banner.querySelector('h3').textContent=`⚠ ALERTAS DE TARJETAS (${AMARILLAS_ALERTA}+ amarillas)`;
  }
}

function getAllAlertas(){
  const out=[];
  CATEGORIES.forEach(cat=>{
    (tarjetas[cat]||[]).forEach(p=>{
      if(p.amarillas>=AMARILLAS_ALERTA) out.push({...p,cat});
    });
  });
  return out;
}

// ── LESIONES ──────────────────────────────────────────────────
function renderLesiones(){
  const wrap=document.getElementById('rend-lesiones');
  if(!wrap) return;
  const cats=rendCurrentCat==='GENERAL'?CATEGORIES:[rendCurrentCat];
  const all=cats.flatMap(cat=>(lesiones[cat]||[]).map(l=>({...l,_cat:cat})));
  if(all.length===0){
    wrap.innerHTML=`<div style="text-align:center;padding:30px;color:var(--muted);font-family:Barlow Condensed,sans-serif;font-size:13px;letter-spacing:1px">Sin lesiones registradas ✓</div>`;
    return;
  }
  // Sort: active first
  const sorted=[...all.filter(l=>l.estado==='activa'),...all.filter(l=>l.estado!=='activa')];
  wrap.innerHTML=sorted.map(l=>{
    const hist=(l.historial||[]);
    const histHTML=hist.length?'<br><small style="color:var(--muted)">📋 '+hist.map(h=>(h.inicio||'?')+' → '+(h.fin||'?')+(h.diasBaja?' ('+h.diasBaja+'d)':'')).join(' | ')+'</small>':'';
    const dias=l.estado==='activa'&&l.fecha?Math.max(0,Math.round((Date.now()-new Date(l.fecha))/86400000)):0;
    const diasHTML=dias>0?'<span style="font-size:10px;color:var(--gold2);font-family:Barlow Condensed,sans-serif;margin-left:6px">'+dias+'d</span>':'';
    return `<div class="lesion-item${l.estado==='recuperado'?' recovered':''}">`+
    `<div class="li-icon">${l.estado==='recuperado'?'✅':'🚨'}</div>`+
    `<div class="li-body">`+
      `<div class="li-name">${esc(l.name)} <span style="font-size:11px;color:${CAT_COLORS[l._cat]};font-family:Bebas Neue,sans-serif;letter-spacing:1px;margin-left:6px">${l._cat}</span>${diasHTML}</div>`+
      `<div class="li-detail">${l.tipo||'Lesión'} · ${l.fecha||'—'}${histHTML}</div>`+
    `</div>`+
    `<span class="lesion-badge ${l.estado==='recuperado'?'recovered':'active'}">${l.estado==='recuperado'?'RECUPERADO':'EN RECUPERACIÓN'}</span>`+
    `${canEdit?`<button class="btn-lesion-toggle" onclick="toggleLesion('${l._cat}','${l.id}')">${l.estado==='recuperado'?'↩ ACTIVA':'✓ RECUPERADO'}</button>`
    +`<button class="btn-del-lesion" onclick="delLesion('${l._cat}','${l.id}')" title="Eliminar">✕</button>`:''}`+
    `</div>`;
  }).join('');
}

function addLesion(){
  const name=document.getElementById('les-name')?.value.trim();
  const tipo=document.getElementById('les-tipo')?.value;
  const cat=document.getElementById('les-cat')?.value||'4TA';
  const fecha=document.getElementById('les-fecha')?.value.trim();
  if(!name){document.getElementById('les-name').style.borderColor='var(--red)';setTimeout(()=>{const e=document.getElementById('les-name');if(e)e.style.borderColor='';},1500);return;}
  if(!lesiones[cat])lesiones[cat]=[];
  lesiones[cat].push({id:'l_'+Date.now(),name,tipo,fecha,estado:'activa'});
  document.getElementById('les-name').value='';
  document.getElementById('les-fecha').value='';
  saveRendimiento(); renderLesiones();
}

function toggleLesion(cat,id){
  const l=(lesiones[cat]||[]).find(x=>x.id===id);
  if(!l) return;
  if(l.estado==='activa'){
    // Recovering → record history with end date
    resolveInjuryWithHistory(cat, id, new Date().toISOString().slice(0,10));
  } else {
    // Re-activate
    l.estado='activa';
    delete l.fechaFin;
    saveRendimiento();
  }
  refreshAlerts();
  renderLesiones();
}

function delLesion(cat,id){
  confirmAction('¿Eliminar este registro de lesión?', ()=>{
    lesiones[cat]=(lesiones[cat]||[]).filter(x=>x.id!==id);
    saveRendimiento(); renderLesiones();
  }, 'ELIMINAR');
}

// ── PDF.js loader (CDN, loaded once) ────────────────────────
let _pdfjsLib = null;
async function getPdfjsLib(){
  if(_pdfjsLib) return _pdfjsLib;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=res; s.onerror=()=>rej(new Error('No se pudo cargar PDF.js'));
    document.head.appendChild(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  _pdfjsLib = window.pdfjsLib;
  return _pdfjsLib;
}

// ── Extract all text from PDF pages ─────────────────────────
async function getPdfPages(file){
  const lib = await getPdfjsLib();
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await lib.getDocument({ data: arrayBuffer }).promise;
  const pages = [];
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    // items come with x,y coords — sort by y desc then x asc for reading order
    const items = content.items
      .filter(it=>it.str && it.str.trim())
      .map(it=>({ str: it.str.trim(), x: it.transform[4], y: it.transform[5] }));
    // Group into lines by y-coordinate (within 3px = same line)
    const lines = [];
    items.forEach(it=>{
      const existing = lines.find(l=>Math.abs(l.y - it.y)<4);
      if(existing){ existing.tokens.push(it); }
      else { lines.push({y: it.y, tokens:[it]}); }
    });
    lines.sort((a,b)=>b.y-a.y);
    lines.forEach(l=>l.tokens.sort((a,b)=>a.x-b.x));
    pages.push(lines);
  }
  return pages;
}

// ── Parse Catapult DATOS GENERALES table ─────────────────────
async function extractGpsDataFromPdf(file){
  console.log('[GPS] Leyendo PDF con PDF.js...');
  const pages = await getPdfPages(file);
  console.log('[GPS] Páginas leídas:', pages.length);

  // ── Extract session metadata from page 1 ──
  let match = '';
  let date  = '';
  let division = '';
  if(pages[0]){
    const p1lines = pages[0].map(l=>l.tokens.map(t=>t.str).join(' '));
    const p1text  = p1lines.join('\n');

    // 1) Date: DD/MM/YYYY
    const dateMatch = p1text.match(/(\d{1,2}\/\d{1,2}\/\d{4})/);
    if(dateMatch) date = dateMatch[1];

    // 2) Session/match name — try several patterns in order of specificity:
    //    a) Training session: "5ta MD-4", "4TA PF", "7ma FIS", etc.
    //    b) Match report:     "Tigre 1 - River Plate 0" style
    //    c) Fallback: biggest text line (usually the title)
    const trainingMatch = p1text.match(/\b(\d+[tT][aA](?:\s+|\-)(?:MD[\-–+]\d+|PF|FIS|FISI|GIM|RECUP|POTENCIA|TAE|AERO|ANT|PRE))\b/i);
    const versus        = p1text.match(/([A-Za-záéíóúÁÉÍÓÚñÑ\s\.]+\d+\s*[-–]\s*[A-Za-záéíóúÁÉÍÓÚñÑ\s\.]+\d+)/);
    if(trainingMatch){
      match = trainingMatch[0].trim().toUpperCase();
    } else if(versus){
      match = versus[0].trim();
    } else {
      // Take the first non-empty, non-date, non-"PAGE" line as title
      for(const ln of p1lines){
        const clean = ln.trim();
        if(clean && clean.length > 2 && !/^PAGE|^\d{1,2}\/|^CATAPULT/i.test(clean)){
          match = clean; break;
        }
      }
    }

    // 3) Division — "5ta", "4TA", etc. from page title or header
    const divMatch = p1text.match(/\b([4-9](?:TA|ta|TA|NA|na|MA|ma|VA|va|RA|ra))\b/);
    if(divMatch) division = divMatch[1].toUpperCase();
    // Also normalize "5ta" → "5TA"
    const divNum = p1text.match(/\b(cuart|quint|sext|septim|octav|noven)/i);
    if(!division && divNum){
      const m = {cuart:'4TA',quint:'5TA',sext:'6TA',septim:'7MA',octav:'8VA',noven:'9NA'};
      division = m[divNum[1].toLowerCase()] || '';
    }
  }
  console.log('[GPS] match:', match, '| date:', date, '| div:', division);

  // ── Find data table page — works for both match (10 pages) and training (4 pages) ──
  // Detection criteria for the table page:
  //   • Contains "DATOS GENERALES" (match format)
  //   • OR "REPORTE DETALLADO" (training/graph format)
  //   • OR has "Tot Dur" / "TotDur" (Catapult column header token)
  //   • OR has "Vel Max" AND ("Dist" OR "Mts") (general Catapult table indicator)
  let dataPage    = null;
  let dataPageIdx = -1;
  for(let i=0; i<pages.length; i++){
    const flat = pages[i].map(l=>l.tokens.map(t=>t.str).join(' ')).join(' ');
    const isDataPage =
      flat.includes('DATOS GENERALES')  ||
      flat.includes('REPORTE DETALLADO')||
      flat.includes('Tot Dur')          ||
      flat.includes('TotDur')           ||
      (flat.includes('Vel Max') && (flat.includes('Dist') || flat.includes('Mts')));
    if(isDataPage){
      dataPage    = pages[i];
      dataPageIdx = i;
      break;
    }
  }
  // fallback: last page (data is usually last, whether 4 or 10 pages)
  if(!dataPage){
    dataPage    = pages[pages.length - 1];
    dataPageIdx = pages.length - 1;
  }
  if(!dataPage) throw new Error('No se encontró la tabla de datos en el PDF.');
  console.log('[GPS] Tabla en página', dataPageIdx+1, 'de', pages.length);

  // ── Flatten page into token stream ──
  const allTokens = dataPage.flatMap(l=>l.tokens.map(t=>t.str));
  console.log('[GPS] Tokens de la página:', allTokens.slice(0,40));

  // ── Find start of data after header row ──
  // Look for known column header words to skip them
  const headerWords = [
    'Posit','Position','Tot','Dur','Dist','Mts','Metro','Metr',
    'km/h','m/h','s/s','Spri','Vel','Acc','Dcc','Max','RHIE','PL',
    'Min','Esfuerzo','Esf','Decel','Bout','Volum','Carga',
    'ncia','18-21','21-25','+25','m/min','m(18','m(21','m(+2',
    'DATOS','GENERALES','Promedio','Total','PAGE','Tiempo','Distancia',
    'Nombre','Jugador','Posición','División','Equipo'
  ];
  let startIdx = 0;
  // Skip past header rows: find first token that is a 2-4 digit number (minutes/distance start)
  // preceded by something that looks like a name or position, not a header word
  for(let si=5; si<allTokens.length; si++){
    const t = allTokens[si];
    if(/^\d{2,4}$/.test(t)){
      // Check the few tokens before are NOT all header words
      const prev3 = allTokens.slice(Math.max(0,si-3), si).join(' ');
      const isAfterHeader = headerWords.some(h=>prev3.includes(h));
      if(!isAfterHeader){
        // Look back to find potential name start
        let backIdx = si;
        while(backIdx > 0 && !NUM.test(allTokens[backIdx-1]) && backIdx > si-5) backIdx--;
        startIdx = Math.max(0, backIdx - 1);
        break;
      }
    }
  }

  // ── Parse player rows ──
  // Each row: Name Pos TotDur Dist m/min m18-21 m21-25 m25+ sprints velmax acc dcc maxAcc maxDec rhie totalPL
  // Strategy: collect all numbers, group by player name (non-numeric tokens between number groups)
  const players = [];
  const NUM = /^-?\d+\.?\d*$/;

  // Helper: a string that looks like a real player name (not a column header fragment)
  function looksLikePlayerName(n){
    if(!n || n.length < 3 || n.length > 45) return false;
    // Contains metric units or header patterns → NOT a name
    if(/m\/h|km\/h|s\/s|m\/min|Esf|Decel|RHIE|Bout|\d{4,}|18-21|21-25|\+25|Tot |Prom|PAGE|Volum|Esfuerzo|ncia por/.test(n)) return false;
    // Contains parentheses or slashes without letters → header fragment
    if(/[()\/]/.test(n) && !/[A-ZÁÉÍÓÚÑ]{2}/.test(n)) return false;
    // Must have at least one letter sequence of 2+ chars that looks like a name
    if(!/[A-Za-záéíóúÁÉÍÓÚñÑüÜ]{2}/.test(n)) return false;
    return true;
  }

  // Walk tokens building rows — start from startIdx to skip header rows
  let i = startIdx;
  while(i < allTokens.length){
    const tok = allTokens[i];
    // Skip header/label tokens — column headers from Catapult tables
    if(headerWords.some(h=>tok.includes(h)) || tok === 'DATOS GENERALES'
       || /^[()\/\-–]+$/.test(tok) || /^\d+$/.test(tok) && i < startIdx + 3){
      i++; continue;
    }
    // Check if we're at a player name start — it should be followed eventually by numbers
    // A name token is text that isn't a number and isn't a known position abbrev by itself
    if(!NUM.test(tok) && tok.length > 1 && !/^(PAGE|OF|\d)/.test(tok)){
      // Collect name (may span multiple tokens until we hit a position abbreviation or number)
      const POS_ABBREVS = ['LAT','DC','DFC','VOL','EXT','CI','CTR','VOL CTR','Central Izquierdo','Volante Central'];
      let name = tok;
      let j = i+1;
      // If next token is also non-numeric and not a position, it's part of the name
      while(j < allTokens.length && !NUM.test(allTokens[j])){
        const next = allTokens[j];
        if(POS_ABBREVS.includes(next) || /^(Total|Promedio|PAGE)/.test(next)) break;
        // If it looks like a position suffix attached to name (e.g. "LeszczukEXT")
        if(/[A-Z]{2,4}$/.test(next) && next.length <= 6){ break; }
        name += ' ' + next;
        j++;
      }
      // Extract position (next non-numeric token after name)
      let pos = '';
      if(j < allTokens.length && !NUM.test(allTokens[j])){
        pos = allTokens[j]; j++;
        // Multi-word positions
        if(j < allTokens.length && !NUM.test(allTokens[j]) && allTokens[j].length>1 && !/^\d/.test(allTokens[j])){
          pos += ' ' + allTokens[j]; j++;
        }
      }
      // Now collect up to 16 numbers
      const nums = [];
      while(j < allTokens.length && nums.length < 16){
        const n = allTokens[j];
        if(NUM.test(n)){ nums.push(parseFloat(n)); j++; }
        else if(n === '-' || n === '—'){ nums.push(0); j++; }
        else break;
      }
      if(nums.length >= 3 && name.length > 1 && looksLikePlayerName(name)){
        const [min=0,dist=0,mpm=0,m1821=0,m2125=0,m25=0,sprints=0,velmax=0,acc=0,dcc=0,maxAcc=0,maxDec=0,rhie=0,totalPL=0] = nums;
        // Fix: sometimes min and dist are swapped if dist is very large
        const actualMin  = min > 200 ? mpm : min;   // minutes never > 200
        const actualDist = min > 200 ? min : dist;
        const actualMpm  = min > 200 ? m1821 : mpm;
        players.push({
          name: name.replace(/\s+/g,' ').trim(),
          pos: pos.trim(),
          min: actualMin,
          dist: actualDist,
          mpm: parseFloat((actualMpm).toFixed(2)),
          m1821: m1821||0, m2125: m2125||0, m25: m25||0,
          sprints: sprints||0, velmax: velmax||0,
          acc: acc||0, dcc: dcc||0,
          maxAcc: maxAcc||0, maxDec: maxDec||0,
          rhie: rhie||0, totalPL: totalPL||0
        });
        console.log('[GPS] Jugador:', name, '| min:', actualMin, '| dist:', actualDist, '| mpm:', actualMpm);
      }
      i = j;
    } else {
      i++;
    }
  }

  // ── Separate Total / Promedio from players ──
  const totalRow  = players.find(p=>/^Total/i.test(p.name));
  const promRow   = players.find(p=>/^Promedio/i.test(p.name));
  const realPlayers = players.filter(p=>!/^Total|^Promedio/i.test(p.name));

  const teamTotals = totalRow ? {
    dist: totalRow.dist, mpm: totalRow.mpm,
    m1821: totalRow.m1821, m2125: totalRow.m2125, m25: totalRow.m25,
    sprints: totalRow.sprints, velmax: totalRow.velmax,
    acc: totalRow.acc, dcc: totalRow.dcc, rhie: totalRow.rhie
  } : null;

  if(realPlayers.length === 0) throw new Error('No se pudo extraer ningún jugador de la tabla. Revisá que el PDF sea de Catapult y tenga la página DATOS GENERALES.');

  console.log('[GPS] Total jugadores extraídos:', realPlayers.length);
  return { match, date, division, players: realPlayers, teamTotals, totalRow, promRow };
}

function renderGpsModule(){

}

function buildGpsHtml(){
  const subtabs = [
    {id:'sessions', label:'📋 SESIONES'},

function buildGpsSemanalView(){
  // Group entrenamiento sessions by week
  const sessions = [...gpsSessions].sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));
  if(sessions.length===0){
    return `<div class="gps-empty-state"><div class="es-icon">📊</div><h3>SIN DATOS SEMANALES</h3><p>Cargá sesiones de entrenamiento para ver la carga semanal</p></div>`;
  }

  // Build week groups by ISO week
  const byWeek = {};
  sessions.forEach(s=>{
    if(!s.date) return;
    const [d,m,y] = (s.date).split('/');
    const dt = new Date(`${y}-${m}-${d}`);
    const weekKey = getISOWeek(dt);
    if(!byWeek[weekKey]) byWeek[weekKey] = {sessions:[], label:weekKey};
    byWeek[weekKey].sessions.push(s);
  });

  const weeks = Object.values(byWeek).slice(-8); // last 8 weeks
  if(weeks.length===0) return `<div class="gps-empty-state"><div class="es-icon">📅</div><h3>SIN SEMANAS</h3><p>No hay suficientes datos para mostrar</p></div>`;

  let html = `<p class="gps-section-title">RESUMEN SEMANAL — ÚLTIMAS ${weeks.length} SEMANAS</p>
  <div class="gps-weekly-summary">`;

  weeks.forEach(w=>{
    const allP = w.sessions.flatMap(s=>(s.players||[]).filter(p=>p.name!=='Total'&&p.name!=='Promedio'));
    const nSes = w.sessions.length;
    const totalDist = allP.reduce((a,p)=>a+(p.dist||0),0);
    const avgMpm = allP.length>0?(allP.reduce((a,p)=>a+(p.mpm||0),0)/allP.length):0;
    const totalSprints = allP.reduce((a,p)=>a+(p.sprints||0),0);
    const tipos = [...new Set(w.sessions.map(s=>s.type))];
    html += `<div class="gps-week-card">
      <div class="wc-title">SEM. ${w.label}</div>
      <div class="wc-metric"><span class="wm-label">Sesiones</span><span class="wm-val">${nSes}</span></div>
      <div class="wc-metric"><span class="wm-label">Dist. Total Equipo</span><span class="wm-val" style="font-size:14px">${(totalDist/1000).toFixed(1)} km</span></div>
      <div class="wc-metric"><span class="wm-label">Prom. m/min</span><span class="wm-val">${avgMpm.toFixed(1)}</span></div>
      <div class="wc-metric"><span class="wm-label">Sprints totales</span><span class="wm-val">${totalSprints}</span></div>
      <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">${tipos.map(t=>`<span class="sc-badge type-${t==='partido'?'partido':'ent'}">${t==='partido'?'PARTIDO':'ENT.'}</span>`).join('')}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

  const partidos = sessions.filter(s=>s.type==='partido').sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));
  const entrenamientos = sessions.filter(s=>s.type==='entrenamiento').sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));

  const initials = playerName.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  // Get player's pos from last session
  const lastSes = [...sessions].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0))[0];
  const lastP = (lastSes.players||[]).find(p=>p.name===playerName);

  let html = `<div class="gps-player-profile">
    <div class="pp-header">
      <div class="pp-avatar">${initials}</div>
      <div>
        <div class="pp-name">${playerName}</div>

  // Summary stats across all sessions
  const allPlayerData = sessions.flatMap(s=>(s.players||[]).filter(p=>p.name===playerName));
  const avgDist = allPlayerData.reduce((a,p)=>a+(p.dist||0),0)/allPlayerData.length;

  html += `<div class="gps-metrics-grid">
    <div class="gps-metric-box"><div class="mb-val">${Math.round(avgDist).toLocaleString()}</div><div class="mb-unit">m</div><div class="mb-label">Dist. Promedio</div></div>
    <div class="gps-metric-box"><div class="mb-val">${avgMpm.toFixed(1)}</div><div class="mb-unit">m/min</div><div class="mb-label">Prom. Intensidad</div></div>

    <div class="gps-metric-box"><div class="mb-val">${totalSprints}</div><div class="mb-unit">sprints</div><div class="mb-label">Total Sprints</div></div>
    <div class="gps-metric-box"><div class="mb-val">${avgRhie.toFixed(0)}</div><div class="mb-unit">RHIE</div><div class="mb-label">Prom. RHIE</div></div>

  if(partidos.length>1){
    html += `<div class="gps-section-title" style="font-size:13px">EVOLUCIÓN DE DISTANCIA · PARTIDOS</div>

  <table class="gps-players-table">
    <thead><tr><th>Sesión</th><th>Tipo</th><th>Cat</th><th>Min</th><th>Dist</th><th>m/min</th><th>Sprints</th><th>Vel Max</th><th>Acc</th><th>Dcc</th><th>RHIE</th></tr></thead>
    <tbody>`;

  const sortedSessions = [...sessions].sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));
  sortedSessions.forEach(s=>{

function computeGpsAlerts(){
  const alerts = [];
  // Get last 2 weeks of sessions for each player
  const allNames = [...new Set(
    gpsSessions.flatMap(s=>(s.players||[]).map(p=>p.name).filter(n=>n&&n!=='Total'&&n!=='Promedio'))
  )];

  allNames.forEach(name=>{
    const playerSessions = gpsSessions
      .filter(s=>(s.players||[]).some(p=>p.name===name))
      .sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));

    if(playerSessions.length<2) return;

    const [last, prev] = playerSessions;
    const lastP = (last.players||[]).find(p=>p.name===name);
    const prevP = (prev.players||[]).find(p=>p.name===name);
    if(!lastP||!prevP) return;

    // Average across all sessions
    const allP = playerSessions.flatMap(s=>(s.players||[]).filter(p=>p.name===name));
    const avgMpm = allP.reduce((a,p)=>a+(p.mpm||0),0)/allP.length;

    // Check m/min drop
    if(lastP.mpm && prevP.mpm && lastP.min>60){
      const drop = (prevP.mpm - lastP.mpm) / prevP.mpm;
      if(drop > 0.15){
        alerts.push({
          type:'caida', icon:'📉',
          title:`${name} — Caída de intensidad`,
          desc:`m/min: ${prevP.mpm.toFixed(1)} → ${lastP.mpm.toFixed(1)} (−${(drop*100).toFixed(0)}%) entre ${prev.name||prev.date} y ${last.name||last.date}`
        });
      }
    }

    // Sobrecarga: last session mpm >20% above personal average
    if(lastP.mpm && avgMpm>0){
      const overshoot = (lastP.mpm - avgMpm) / avgMpm;
      if(overshoot > 0.20){
        alerts.push({
          type:'sobrecarga', icon:'🔴',
          title:`${name} — SOBRECARGA`,
          desc:`m/min en ${last.name||last.date}: ${lastP.mpm.toFixed(1)} vs promedio personal ${avgMpm.toFixed(1)} (+${(overshoot*100).toFixed(0)}%)`
        });
      }
    }

    // Subcarga: last session mpm >20% below average  
    if(lastP.mpm && avgMpm>0 && lastP.min>60){
      const undershoot = (avgMpm - lastP.mpm) / avgMpm;
      if(undershoot > 0.20){
        alerts.push({
          type:'subcarga', icon:'🟡',
          title:`${name} — Subcarga`,
          desc:`m/min en ${last.name||last.date}: ${lastP.mpm.toFixed(1)} vs promedio personal ${avgMpm.toFixed(1)} (−${(undershoot*100).toFixed(0)}%)`
        });
      }
    }
  });

  return alerts;
}

function getISOWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  const wn = Math.ceil((((d-yearStart)/86400000)+1)/7);
  return `${d.getUTCFullYear()}-W${String(wn).padStart(2,'0')}`;
}

    });

  if(!canEdit) return;
  const dropZone = document.getElementById('gpsDropZone');
  const fileInput = document.getElementById('gpsPdfInput');
  const btnProcess = document.getElementById('btnGpsProcess');

  if(!dropZone||!fileInput||!btnProcess) return;

  dropZone.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',()=>{
    if(fileInput.files.length>0){
      document.querySelector('.gps-upload-zone p').textContent = `✓ ${fileInput.files[0].name}`;
      dropZone.style.borderColor='var(--win)';
      btnProcess.disabled = false;
    }

  dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop',(e)=>{
    e.preventDefault(); dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if(f&&f.type==='application/pdf'){
      // Use DataTransfer to set files, then trigger change
      const dt = new DataTransfer();
      dt.items.add(f);
      fileInput.files = dt.files;
      fileInput.dispatchEvent(new Event('change'));
    }
  });

  btnProcess.addEventListener('click', processGpsPdf);

  // Auto-detect type and name from filename
  fileInput.addEventListener('change',()=>{
    if(!fileInput.files.length) return;
    const fname = fileInput.files[0].name.replace(/\.pdf$/i,'');
    document.querySelector('.gps-upload-zone p').textContent = `✓ ${fileInput.files[0].name}`;
    dropZone.style.borderColor='var(--win)';
    btnProcess.disabled = false;

    // Auto-fill session name if empty
    const nameInput = document.getElementById('gpsUploadName');
    if(nameInput && !nameInput.value.trim()) nameInput.value = fname;

    // Auto-set type: if filename contains MD-, PF, FIS, GIM, RECUP → Entrenamiento
    const typeSelect = document.getElementById('gpsUploadType');
    if(typeSelect){
      const isTraining = /MD[-–+]?\d|[\-_](PF|FIS|GIM|RECUP|POTENCIA|TAE|AERO|ANT|PRE|ENT)/i.test(fname);
      const isMatch    = /F\d+[\-_\s]|vs[\-_\s]|partido|match/i.test(fname);
      if(isTraining) typeSelect.value = 'entrenamiento';
      else if(isMatch) typeSelect.value = 'partido';
    }

    // Auto-set category from filename: 5ta, 4TA, etc.
    const catSelect = document.getElementById('gpsUploadCat');
    if(catSelect){
      const catMap = {'4ta':'4TA','4TA':'4TA','5ta':'5TA','5TA':'5TA',
                      '6ta':'6TA','6TA':'6TA','7ma':'7MA','7MA':'7MA',
                      '8va':'8VA','8VA':'8VA','9na':'9NA','9NA':'9NA','reserva':'RESERVA'};
      for(const [key,val] of Object.entries(catMap)){
        if(fname.toLowerCase().includes(key.toLowerCase())){
          catSelect.value = val; break;
        }
      }
    }
  });

  // Draw trend chart if present
  drawGpsTrendChart();
}

async function processGpsPdf(){
  const file = document.getElementById('gpsPdfInput').files[0];
  if(!file) return;
  const cat = document.getElementById('gpsUploadCat').value;
  const type = document.getElementById('gpsUploadType').value;
  const customName = document.getElementById('gpsUploadName').value.trim();

  const progress = document.getElementById('gpsProgress');
  const fill = document.getElementById('epBarFill');
  const status = document.getElementById('epStatus');
  const btn = document.getElementById('btnGpsProcess');

  progress.style.display='block';
  btn.disabled=true;
  status.style.color='';
  fill.style.width='10%';
  status.textContent='Cargando PDF.js...';

  try {
    fill.style.width='25%';
    status.textContent='Leyendo PDF...';

    const extracted = await extractGpsDataFromPdf(file);

    fill.style.width='80%';
    status.textContent='Procesando ' + (extracted.players||[]).length + ' jugadores...';

    const sessionId = 'gps_' + Date.now();
    const newSession = {
      id: sessionId,
      name: customName || extracted.match || file.name.replace(/\.pdf$/i,''),
      cat: cat,
      type: type,
      date: extracted.date || new Date().toLocaleDateString('es-AR'),
      division: extracted.division || '',
      players: [...(extracted.players||[])],
      teamTotals: extracted.teamTotals || {}
    };
    if(extracted.totalRow) newSession.players.push({...extracted.totalRow, name:'Total'});
    if(extracted.promRow)  newSession.players.push({...extracted.promRow,  name:'Promedio'});

    gpsSessions.push(newSession);
    fill.style.width='100%';
    status.textContent='\u00a1Listo! ' + (extracted.players||[]).length + ' jugadores.';

    await new Promise(r=>setTimeout(r,900));
    progress.style.display='none';

    saveGpsData();
    gpsView='sessions';
    gpsDetailId=sessionId;
    renderGpsModule();
    showToast('\u2713 SESI\u00d3N GPS CARGADA \u2014 ' + (extracted.players||[]).length + ' jugadores');

  } catch(err){
    console.error('[GPS] Error completo:', err);
    btn.disabled=false;
    const errMsg = err.message || String(err);
    showToast('\u26a0 Error: ' + errMsg.slice(0,120));
    const statusEl = document.getElementById('epStatus');
    if(statusEl){
      statusEl.textContent = '\u26a0 ' + errMsg;
      statusEl.style.color = '#ef4444';
    }
    fill.style.width='0%';
  }
}

function drawGpsTrendChart(){
  const canvas = document.getElementById('gpsTrendCanvas');
  if(!canvas||!gpsPlayerName) return;
  const partidos = gpsSessions
    .filter(s=>s.type==='partido'&&(s.players||[]).some(p=>p.name===gpsPlayerName))
    .sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));
  if(partidos.length<2) return;

  const labels = partidos.map(s=>s.name||s.date||'');
  const distData = partidos.map(s=>{
    const p = (s.players||[]).find(x=>x.name===gpsPlayerName);
    return p ? (p.dist||0) : 0;
  });
  const mpmData = partidos.map(s=>{
    const p = (s.players||[]).find(x=>x.name===gpsPlayerName);
    return p ? (p.mpm||0) : 0;
  });

  // Simple canvas chart
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth; const H = canvas.offsetHeight||180;
  canvas.width=W; canvas.height=H;

  const pad={top:20,right:20,bot:40,left:60};
  const cW=W-pad.left-pad.right;
  const cH=H-pad.top-pad.bot;
  const n=distData.length;
  const maxD=Math.max(...distData)*1.1;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(5,8,15,0.4)';
  ctx.fillRect(0,0,W,H);

  // Grid lines
  ctx.strokeStyle='rgba(26,45,90,0.5)';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.top+cH*(1-i/4);
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+cW,y);ctx.stroke();
    ctx.fillStyle='rgba(90,112,153,0.8)';ctx.font='9px Barlow Condensed';ctx.textAlign='right';
    ctx.fillText(Math.round(maxD*i/4).toLocaleString(),pad.left-4,y+3);
  }

  // Bars
  const bw=Math.min(30,cW/n-8);
  distData.forEach((d,i)=>{
    const x=pad.left+i*(cW/n)+cW/n/2-bw/2;
    const bh=d/maxD*cH;
    const y=pad.top+cH-bh;
    const avg=distData.reduce((a,v)=>a+v,0)/n;
    ctx.fillStyle=d>avg*1.1?'rgba(34,197,94,0.7)':d<avg*0.9?'rgba(239,68,68,0.7)':'rgba(240,192,64,0.7)';
    ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,bw,bh,3):ctx.rect(x,y,bw,bh);
    ctx.fill();
  });

  // Labels
  ctx.fillStyle='rgba(90,112,153,0.9)';ctx.font='9px Barlow Condensed';ctx.textAlign='center';
  distData.forEach((d,i)=>{
    const x=pad.left+i*(cW/n)+cW/n/2;
    const shortLabel=labels[i].length>12?labels[i].slice(0,12)+'…':labels[i];
    ctx.fillText(shortLabel,x,H-4);
  });
}

function renderCargaWeeklyChart(cat, containerId){
  const el = document.getElementById(containerId);
  if(!el) return;
  const sessions = (gymData[cat]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!sessions.length){ el.innerHTML='<div style="color:var(--muted);font-size:11px;font-family:Barlow Condensed,sans-serif;padding:8px">Sin datos de carga</div>'; return; }

  // Group by ISO week
  const getWeek = dateStr => {
    const d = new Date(dateStr);
    const jan1 = new Date(d.getFullYear(),0,1);
    return Math.ceil(((d-jan1)/86400000 + jan1.getDay()+1)/7);
  };
  const weekMap = {};
  sessions.forEach(s=>{
    const wk = d=>{ const d2=new Date(d); return d2.getFullYear()+'-W'+String(getWeek(d)).padStart(2,'0'); };
    const weekKey = wk(s.date);
    if(!weekMap[weekKey]) weekMap[weekKey]={week:weekKey,total:0,players:{}};
    (s.players||[]).forEach(p=>{
      weekMap[weekKey].total += (p.load||0);
      if(!weekMap[weekKey].players[p.name]) weekMap[weekKey].players[p.name]=0;
      weekMap[weekKey].players[p.name]+=(p.load||0);
    });
  });
  const weeks = Object.keys(weekMap).sort();
  const totalsByWeek = weeks.map(w=>weekMap[w].total);
  const avgLoad = totalsByWeek.length ? totalsByWeek.reduce((a,b)=>a+b,0)/totalsByWeek.length : 0;

  // Load:rest ratio — this week vs previous week
  const lastWeek = weeks[weeks.length-1];
  const prevWeek = weeks[weeks.length-2];
  const lwLoad = lastWeek ? weekMap[lastWeek].total : 0;
  const pwLoad = prevWeek ? weekMap[prevWeek].total : 0;
  const ratio = pwLoad > 0 ? (lwLoad/pwLoad).toFixed(2) : '—';
  const ratioColor = ratio === '—' ? 'var(--muted)' : parseFloat(ratio) > 1.3 ? 'var(--loss)' : parseFloat(ratio) < 0.7 ? '#60a5fa' : 'var(--win)';
  const ratioLabel = ratio === '—' ? '—' : parseFloat(ratio) > 1.3 ? '⚠ Sobrecarga' : parseFloat(ratio) < 0.7 ? '↓ Subcarga' : '✓ Óptimo';

  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:10px;flex-wrap:wrap">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:2px;color:var(--muted)">CARGA SEMANAL ACUMULADA · ${cat}</div>
      <div style="background:rgba(10,15,30,0.6);border:1px solid rgba(26,45,90,0.6);border-radius:6px;padding:4px 12px">
        <span style="font-size:10px;color:var(--muted);font-family:'Barlow Condensed',sans-serif">RATIO CARGA:DESCANSO </span>
        <span style="font-size:14px;font-family:'Bebas Neue',sans-serif;color:${ratioColor}">${ratio}</span>
        <span style="font-size:10px;color:${ratioColor};font-family:'Barlow Condensed',sans-serif;margin-left:4px">${ratioLabel}</span>
      </div>
      <div style="font-size:10px;color:var(--muted);font-family:'Barlow Condensed',sans-serif">Promedio: ${Math.round(avgLoad)} UA/semana</div>
    </div>
    <canvas id="gym-chart-${cat}" height="80"></canvas>`;

  setTimeout(()=>{
    const ctx = document.getElementById(`gym-chart-${cat}`)?.getContext('2d');
    if(!ctx) return;
    killChart(`gym-chart-${cat}`);
    new Chart(ctx,{
      type:'bar',
      data:{
        labels: weeks,
        datasets:[{
          label:'Carga total (UA)',
          data: totalsByWeek,
          backgroundColor: totalsByWeek.map(v => v > avgLoad*1.3 ? 'rgba(239,68,68,0.6)' : v < avgLoad*0.7 ? 'rgba(96,165,250,0.6)' : 'rgba(34,197,94,0.6)'),
          borderRadius:4
        }]
      },
      options:{
        responsive:true, animation:{duration:250},
        plugins:{legend:{display:false}},
        scales:{
          x:{ticks:{color:'#5a7099',font:{family:'Barlow Condensed',size:10}},grid:{color:'rgba(26,45,90,0.3)'}},
          y:{ticks:{color:'#5a7099',font:{family:'Barlow Condensed',size:10}},grid:{color:'rgba(26,45,90,0.3)'}}
        }
      }
    });
  },50);
}

    }

    // GPS sessions this week
    const gpsSess=(gpsSessions||[]).filter(s=>s.cat===cat&&s.date&&s.date>=isoDate(monday)&&s.date<=isoDate(sunday));
    if(gpsSess.length){
      html+=`<h3>Sesiones GPS (${gpsSess.length})</h3><table><tr><th>Sesión</th><th>Tipo</th><th>Jugadores</th><th>Dist. prom</th><th>Vel. max</th></tr>`;
      gpsSess.forEach(s=>{
        const avgD=s.players?.length?Math.round(s.players.reduce((a,p)=>a+(p.dist||0),0)/s.players.length):0;
        const maxV=s.players?.length?(s.players.reduce((a,p)=>Math.max(a,p.velmax||0),0)).toFixed(1):0;
        html+=`<tr><td>${esc(s.name||'—')}</td><td>${esc(s.type||'—')}</td><td>${s.players?.length||0}</td><td>${avgD}m</td><td>${maxV} km/h</td></tr>`;
      });
      html+='</table>';
    }

    // Gym sessions this week
    const gymSess=(gymData[cat]||[]).filter(s=>s.date>=isoDate(monday)&&s.date<=isoDate(sunday));
    if(gymSess.length){
      html+=`<h3>Carga Gimnasio (${gymSess.length} sesiones)</h3><table><tr><th>Sesión</th><th>Tipo</th><th>Vol. Total (UA)</th></tr>`;
      gymSess.forEach(s=>{
        const vol=(s.players||[]).reduce((a,p)=>a+(p.load||0),0);
        html+=`<tr><td>${esc(s.name||'—')}</td><td>${esc(s.tipo||'—')}</td><td>${vol}</td></tr>`;
      });
      html+='</table>';
    }

    // Injuries
    const actLes=(lesiones[cat]||[]).filter(l=>l.estado==='activa');
    if(actLes.length){
      html+=`<h3>🩹 Lesionados (${actLes.length})</h3>`;
      html+=actLes.map(l=>`${esc(l.name)} (${l.tipo||'?'} desde ${l.fecha||'?'})`).join(', ');
    }

    // Yellow card alerts
    const alerts=(tarjetas[cat]||[]).filter(p=>p.amarillas>=2);
    if(alerts.length){
      html+=`<h3>🟨 Alertas tarjetas</h3>`;
      html+=alerts.map(p=>`${esc(p.name)} (${p.amarillas} amarillas)`).join(', ');
    }
  });

  html+=`<div class="footer">Generado automáticamente — Plataforma Tigre Juveniles — ${new Date().toLocaleString('es-AR')}</div>
  </body></html>`;

  const w = window.open('','_blank','width=900,height=700');
  if(w){ w.document.write(html); w.document.close(); setTimeout(()=>w.print(),500); }
  else showToast('Permitir ventanas emergentes para exportar');
}

function refreshAlerts(){
  const wrap = document.getElementById('alert-pills');
  if(!wrap) return;
  wrap.innerHTML = '';
  const pills = [];

  // 1. Yellow card warnings (2+ amarillas)
  let amarillaCount = 0;
  CATEGORIES.forEach(cat=>{
    (tarjetas[cat]||[]).forEach(p=>{
      if(p.amarillas >= 2) amarillaCount++;
    });
  });
  if(amarillaCount > 0) pills.push({
    icon:'🟨', text: `${amarillaCount} en alerta`, color:'rgba(245,158,11,0.25)', border:'rgba(245,158,11,0.5)', title:'Jugadores con 2+ amarillas'
  });

  // 2. Active injuries
  let injCount = 0;
  CATEGORIES.forEach(cat=>{ injCount += (lesiones[cat]||[]).filter(l=>l.estado==='activa').length; });
  if(injCount > 0) pills.push({
    icon:'🩹', text: `${injCount} lesionado${injCount>1?'s':''}`, color:'rgba(239,68,68,0.2)', border:'rgba(239,68,68,0.45)', title:'Jugadores con lesión activa'
  });

  // 3. GPS overload: any player >20% above their cat average in the last session
  CATEGORIES.forEach(cat=>{
    const sessions = (gpsSessions||[]).filter(s=>s.cat===cat && s.players?.length).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    if(!sessions.length) return;
    const last = sessions[0];
    const catAvgDist = sessions.slice(0,5).reduce((a,s)=>{
      const avg = s.players.reduce((x,p)=>x+(p.dist||0),0) / s.players.length;
      return a + avg;
    }, 0) / Math.min(5, sessions.length);
    last.players.forEach(p=>{
      if((p.dist||0) > catAvgDist * 1.2) pills.push({
        icon:'⚡', text:`Sobrecarga ${cat}`, color:'rgba(192,21,42,0.2)', border:'rgba(192,21,42,0.45)',
        title:`${p.name} tiene carga >20% sobre promedio en ${cat}`
      });
    });
  });

  // Render pills
  [...new Map(pills.map(p=>[p.text,p])).values()].slice(0,6).forEach(pill=>{
    const el = document.createElement('div');
    el.style.cssText=`display:inline-flex;align-items:center;gap:3px;background:${pill.color};border:1px solid ${pill.border};border-radius:10px;padding:1px 7px;font-family:'Barlow Condensed',sans-serif;font-size:10px;color:#e0e0e0;cursor:default;white-space:nowrap`;
    el.title = pill.title || '';
    el.textContent = `${pill.icon} ${pill.text}`;
    wrap.appendChild(el);
  });
}

function saveGymSession(cat, date, name, tipo){
  const overlay = document.getElementById('gym-overlay');
  const playerInputs = overlay?.querySelectorAll('input[data-player]');
  const sessionPlayers = [];

  if(playerInputs?.length){
    playerInputs.forEach(inp=>{
      const load = parseInt(inp.value)||0;
      if(load > 0){
        const notesInp = overlay.querySelector(`input[data-notes="${inp.dataset.player}"]`);
        sessionPlayers.push({name: inp.dataset.player, load, notes: notesInp?.value||''});
      }
    });
  } else {
    const manual = overlay?.querySelector('#gym-manual-players')?.value||'';
    manual.split('\n').forEach(line=>{
      const m = line.trim().match(/^(.+?)\s+(\d+)\s*(.*)$/);
      if(m) sessionPlayers.push({name: m[1].trim(), load: parseInt(m[2]), notes: m[3].trim()});
    });
  }

  if(!sessionPlayers.length){ showToast('⚠ Cargá al menos una carga'); return; }
  if(!gymData[cat]) gymData[cat]=[];
  gymData[cat].push({id:'g_'+Date.now(), date, name, tipo, players: sessionPlayers});
  overlay?.remove();
  saveData();
  renderCargaCat(cat);
  refreshAlerts();
  showToast(`✓ Sesión "${name}" guardada para ${cat}`);
}

function deleteGymSession(cat, id){
  if(!gymData[cat]) return;
  gymData[cat] = gymData[cat].filter(s=>s.id!==id);
  saveData();
  renderCargaCat(cat);
  showToast('Sesión eliminada');
}

function resolveInjuryWithHistory(cat, id, endDate){
  const lez = (lesiones[cat]||[]).find(l=>l.id===id);
  if(!lez) return;
  lez.estado = 'recuperado';
  lez.fechaFin = endDate || new Date().toISOString().slice(0,10);
  if(!lez.historial) lez.historial = [];
  lez.historial.push({
    tipo: lez.tipo || lez.tipo_lesion || '—',
    nota: lez.nota||'',
    inicio: lez.fecha || lez.fechaInicio || '—',
    fin: lez.fechaFin,
    diasBaja: lez.fecha ? Math.round((new Date(lez.fechaFin)-new Date(lez.fecha))/(1000*60*60*24)) : '—'
  });
  saveRendimiento();
  refreshAlerts();
}

function getWeekRange(offset){
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (day===0?6:day-1) + offset*7);
  monday.setHours(0,0,0,0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate()+6);
  return {monday, sunday};
}

function renderSemana(){
  const {monday, sunday} = getWeekRange(semanaOffset);
  const fmtDate = d => d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
  const isoDate = d => d.toISOString().slice(0,10);

  const label = document.getElementById('semana-label');
  if(label) label.textContent = `${fmtDate(monday)} – ${fmtDate(sunday)}`;

  const wrap = document.getElementById('semana-content');
  if(!wrap) return;

  let html = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">`;

  CATEGORIES.forEach(cat=>{
    const fixtureList = cat==='RESERVA'?RIVALS_RESERVA:RIVALS;
    const catEvents = [];

    // Match results in this week's fixture (we match by fecha order, not date — show all if no date stored)
    // GPS sessions this week
    const gpsSess = (gpsSessions||[]).filter(s=>{
      if(s.cat!==cat) return false;
      if(!s.date) return false;
      const d = new Date(s.date.split('/').reverse().join('-'));
      return d >= monday && d <= sunday;
    });
    gpsSess.forEach(s=>catEvents.push({type:'gps', label:`📡 ${s.name||'GPS'}`, sub:`${s.type||'Entrenamiento'} · ${(s.players||[]).length} jug`, color:'rgba(36,80,192,0.25)', border:'rgba(36,80,192,0.5)'}));

    // Gym sessions this week
    const gymSess = (gymData[cat]||[]).filter(s=>{
      if(!s.date) return false;
      return s.date >= isoDate(monday) && s.date <= isoDate(sunday);
    });
    gymSess.forEach(s=>catEvents.push({type:'gym', label:`🏋 ${s.name||'Gimnasio'}`, sub:`${s.tipo||'—'} · ${(s.players||[]).reduce((a,p)=>a+(p.load||0),0)} UA`, color:'rgba(34,197,94,0.1)', border:'rgba(34,197,94,0.3)'}));

    // Active injuries
    const actLes = (lesiones[cat]||[]).filter(l=>l.estado==='activa');
    if(actLes.length) catEvents.push({type:'injury', label:`🩹 ${actLes.length} lesionado${actLes.length>1?'s':''}`, sub: actLes.map(l=>l.name).join(', '), color:'rgba(239,68,68,0.1)', border:'rgba(239,68,68,0.3)'});

    // Amarilla alerts
    const alertCards = (tarjetas[cat]||[]).filter(p=>p.amarillas>=2);
    if(alertCards.length) catEvents.push({type:'card', label:`🟨 ${alertCards.length} en alerta`, sub: alertCards.map(p=>p.name).join(', '), color:'rgba(245,158,11,0.1)', border:'rgba(245,158,11,0.3)'});

    const eventsHtml = catEvents.length
      ? catEvents.map(e=>`<div style="background:${e.color};border:1px solid ${e.border};border-radius:5px;padding:6px 9px;margin-bottom:5px">
          <div style="font-size:12px;font-family:'Barlow Condensed',sans-serif;color:var(--text2,#d8e4ff)">${e.label}</div>
          <div style="font-size:10px;color:var(--muted,#5a7099);font-family:'Barlow Condensed',sans-serif;margin-top:2px">${e.sub}</div>
        </div>`).join('')
      : `<div style="font-size:11px;color:var(--muted,#5a7099);font-family:'Barlow Condensed',sans-serif;padding:8px 0">Sin actividad registrada</div>`;

    html += `<div style="background:rgba(10,15,30,0.5);border:1px solid rgba(26,45,90,0.5);border-radius:10px;padding:14px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
        <span style="width:8px;height:8px;border-radius:50%;background:${CAT_COLORS[cat]};display:inline-block"></span>
        <span style="font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--text)">${cat}</span>
      </div>
      ${eventsHtml}
    </div>`;
  });

  html += '</div>';
  wrap.innerHTML = html;
}


</script>
</body>
</html>
