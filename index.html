      <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px">

        <div><label style="font-size:10px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;display:block;margin-bottom:4px">TIPO</label>
          <select id="gym-tipo-${cat}" style="width:100%;background:rgba(5,8,15,0.8);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-size:12px;padding:7px 9px;font-family:'Barlow Condensed',sans-serif">
            <option>Fuerza</option><option>Potencia</option><option>Técnica</option>

          </select></div>
        <div style="display:flex;align-items:flex-end">
          <button onclick="openGymSession('${cat}')" style="width:100%;background:linear-gradient(135deg,#1a3a1a,#2a5a2a);border:1px solid #3a7a3a;border-radius:5px;color:#86efac;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;padding:8px;cursor:pointer">CARGAR JUGADORES →</button>
        </div>
      </div>
    </div>` : '';

  const sessionList = sessions.length ? sessions.map(s=>`
    <div style="background:rgba(10,15,30,0.5);border:1px solid rgba(26,45,90,0.5);border-radius:8px;padding:12px;margin-bottom:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div>
          <span style="font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--text)">${esc(s.name)}</span>
          <span style="font-size:11px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;margin-left:8px">${s.date} · ${s.tipo||'—'}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:11px;color:var(--gold2);font-family:'Barlow Condensed',sans-serif">${(s.players||[]).length} jugadores · Vol. total: ${(s.players||[]).reduce((a,p)=>a+(p.load||0),0)} UA</span>
          ${canEdit?`<button onclick="deleteGymSession('${cat}','${s.id}')" style="background:none;border:none;color:rgba(239,68,68,0.5);cursor:pointer;font-size:13px" title="Eliminar">✕</button>`:''}
        </div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${(s.players||[]).map(p=>`
          <div style="background:rgba(26,45,90,0.3);border:1px solid rgba(26,45,90,0.5);border-radius:5px;padding:4px 8px;font-size:11px;font-family:'Barlow Condensed',sans-serif">

function openGymSession(cat){
  const date  = document.getElementById(`gym-date-${cat}`)?.value;
  const name  = document.getElementById(`gym-name-${cat}`)?.value?.trim();
  const tipo  = document.getElementById(`gym-tipo-${cat}`)?.value;
  if(!date||!name){ showToast('⚠ Completá fecha y nombre'); return; }

  // Get player list from plantel or matchData
  const recentMatch = Object.values(matchData[cat]||{}).find(m=>m.titulares?.length);
  const players = recentMatch
    ? [...(recentMatch.titulares||[]), ...(recentMatch.suplentes||[])].map(p=>p.nombre)
    : [];

  const overlay = document.createElement('div');
  overlay.id = 'gym-overlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(5,8,15,0.9);display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:20px;box-sizing:border-box';

  const playerRows = players.length
    ? players.map(n=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(26,45,90,0.2)">
        <span style="flex:1;font-size:12px;font-family:'Barlow Condensed',sans-serif;color:var(--text2,#d8e4ff)">${esc(n)}</span>
        <input type="number" min="0" max="9999" placeholder="UA" data-player="${esc(n)}"
          style="width:72px;background:rgba(5,8,15,0.8);border:1px solid rgba(26,45,90,0.6);border-radius:4px;color:var(--text,#fff);font-size:12px;padding:4px 7px;text-align:center">
        <input type="text" placeholder="Nota (opcional)" data-notes="${esc(n)}"
          style="width:140px;background:rgba(5,8,15,0.8);border:1px solid rgba(26,45,90,0.6);border-radius:4px;color:var(--text,#fff);font-size:11px;padding:4px 7px">
      </div>`).join('')
    : `<div style="margin-bottom:8px;font-size:11px;color:var(--muted,#5a7099);font-family:'Barlow Condensed',sans-serif">Sin jugadores en plantel — agregá manualmente:</div>
       <textarea id="gym-manual-players" placeholder="Un jugador por línea:\nRojas Josue 450\nLuongo Alan 380" style="width:100%;height:120px;background:rgba(5,8,15,0.8);border:1px solid rgba(26,45,90,0.6);border-radius:5px;color:#d8e4ff;font-size:12px;padding:8px;font-family:'Barlow Condensed',sans-serif;resize:vertical;box-sizing:border-box"></textarea>`;

  overlay.innerHTML=`<div style="background:#0a0f1e;border:1px solid #1a2d5a;border-radius:12px;padding:20px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;color:#c9a227;margin-bottom:4px">CARGA INDIVIDUAL — ${cat}</div>
    <div style="font-size:11px;color:#5a7099;font-family:'Barlow Condensed',sans-serif;margin-bottom:16px">${name} · ${date} · ${tipo}</div>
    <div id="gym-player-rows">${playerRows}</div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button onclick="document.getElementById('gym-overlay').remove()" style="flex:1;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:6px;color:#f87171;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;padding:9px;cursor:pointer">CANCELAR</button>
      <button onclick="saveGymSession('${cat}','${esc(date)}','${esc(name)}','${esc(tipo)}')" style="flex:2;background:linear-gradient(135deg,#1a4a1a,#2a6a2a);border:1px solid #4a8a4a;border-radius:6px;color:#86efac;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;padding:9px;cursor:pointer">💾 GUARDAR SESIÓN</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
}

function saveGymSession(cat, date, name, tipo){
  const overlay = document.getElementById('gym-overlay');
  const playerInputs = overlay?.querySelectorAll('input[data-player]');
  const sessionPlayers = [];

  if(playerInputs?.length){
    playerInputs.forEach(inp=>{
      const load = parseInt(inp.value)||0;
      if(load > 0){
        const notesInp = overlay.querySelector(`input[data-notes="${inp.dataset.player}"]`);
        sessionPlayers.push({name: inp.dataset.player, load, notes: notesInp?.value||''});
      }
    });
  } else {
    const manual = overlay?.querySelector('#gym-manual-players')?.value||'';
    manual.split('\n').forEach(line=>{
      const m = line.trim().match(/^(.+?)\s+(\d+)\s*(.*)$/);
      if(m) sessionPlayers.push({name: m[1].trim(), load: parseInt(m[2]), notes: m[3].trim()});
    });
  }

  if(!sessionPlayers.length){ showToast('⚠ Cargá al menos una carga'); return; }
  if(!gymData[cat]) gymData[cat]=[];
  gymData[cat].push({id:'g_'+Date.now(), date, name, tipo, players: sessionPlayers});
  overlay?.remove();
  saveData();
  renderCargaCat(cat);
  refreshAlerts();
  showToast(`✓ Sesión "${name}" guardada para ${cat}`);
}

function deleteGymSession(cat, id){
  if(!gymData[cat]) return;
  gymData[cat] = gymData[cat].filter(s=>s.id!==id);
  saveData();
  renderCargaCat(cat);
  showToast('Sesión eliminada');
}

function resolveInjuryWithHistory(cat, id, endDate){
  const lez = (lesiones[cat]||[]).find(l=>l.id===id);
  if(!lez) return;
  lez.estado = 'recuperado';
  lez.fechaFin = endDate || new Date().toISOString().slice(0,10);
  if(!lez.historial) lez.historial = [];
  lez.historial.push({
    tipo: lez.tipo || lez.tipo_lesion || '—',
    nota: lez.nota||'',
    inicio: lez.fecha || lez.fechaInicio || '—',
    fin: lez.fechaFin,
    diasBaja: lez.fecha ? Math.round((new Date(lez.fechaFin)-new Date(lez.fecha))/(1000*60*60*24)) : '—'
  });
  saveRendimiento();
  refreshAlerts();
}

// ============================================================
//  SEMANA MODULE — unified weekly view
// ============================================================
let semanaOffset = 0; // weeks offset from current

function buildSemanaModule(){
  const p = document.getElementById('panel-semana');
  p.innerHTML = `<div class="main">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <h2 style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px;color:var(--gold2);flex:1">📅 VISTA SEMANAL</h2>
      <button onclick="semanaOffset--;renderSemana()" style="background:rgba(26,45,90,0.3);border:1px solid var(--border2);border-radius:5px;color:var(--text2);font-size:14px;padding:5px 12px;cursor:pointer">◀</button>
      <span id="semana-label" style="font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:2px;color:var(--muted);min-width:120px;text-align:center"></span>
      <button onclick="semanaOffset++;renderSemana()" style="background:rgba(26,45,90,0.3);border:1px solid var(--border2);border-radius:5px;color:var(--text2);font-size:14px;padding:5px 12px;cursor:pointer">▶</button>
      <button onclick="semanaOffset=0;renderSemana()" style="background:rgba(201,162,39,0.1);border:1px solid rgba(201,162,39,0.3);border-radius:5px;color:var(--gold2);font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px;padding:5px 10px;cursor:pointer">HOY</button>
      <button onclick="exportWeeklyReport(null)" style="background:rgba(192,21,42,0.1);border:1px solid rgba(192,21,42,0.3);border-radius:5px;color:var(--red);font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px;padding:5px 10px;cursor:pointer">📄 REPORTE</button>
    </div>
    <div id="semana-content"></div>
  </div>`;
  renderSemana();
}

function getWeekRange(offset){
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (day===0?6:day-1) + offset*7);
  monday.setHours(0,0,0,0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate()+6);
  return {monday, sunday};
}

function renderSemana(){
  const {monday, sunday} = getWeekRange(semanaOffset);
  const fmtDate = d => d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
  const isoDate = d => d.toISOString().slice(0,10);

  const label = document.getElementById('semana-label');
  if(label) label.textContent = `${fmtDate(monday)} – ${fmtDate(sunday)}`;

  const wrap = document.getElementById('semana-content');
  if(!wrap) return;

  let html = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">`;

  CATEGORIES.forEach(cat=>{
    const fixtureList = cat==='RESERVA'?RIVALS_RESERVA:RIVALS;
    const catEvents = [];

    // Match results in this week's fixture (we match by fecha order, not date — show all if no date stored)
    // GPS sessions this week
    const gpsSess = (gpsSessions||[]).filter(s=>{
      if(s.cat!==cat) return false;
      if(!s.date) return false;
      const d = new Date(s.date.split('/').reverse().join('-'));
      return d >= monday && d <= sunday;
    });
    gpsSess.forEach(s=>catEvents.push({type:'gps', label:`📡 ${s.name||'GPS'}`, sub:`${s.type||'Entrenamiento'} · ${(s.players||[]).length} jug`, color:'rgba(36,80,192,0.25)', border:'rgba(36,80,192,0.5)'}));

    // Gym sessions this week
    const gymSess = (gymData[cat]||[]).filter(s=>{
      if(!s.date) return false;
      return s.date >= isoDate(monday) && s.date <= isoDate(sunday);
    });
    gymSess.forEach(s=>catEvents.push({type:'gym', label:`🏋 ${s.name||'Gimnasio'}`, sub:`${s.tipo||'—'} · ${(s.players||[]).reduce((a,p)=>a+(p.load||0),0)} UA`, color:'rgba(34,197,94,0.1)', border:'rgba(34,197,94,0.3)'}));

    // Active injuries
    const actLes = (lesiones[cat]||[]).filter(l=>l.estado==='activa');
    if(actLes.length) catEvents.push({type:'injury', label:`🩹 ${actLes.length} lesionado${actLes.length>1?'s':''}`, sub: actLes.map(l=>l.name).join(', '), color:'rgba(239,68,68,0.1)', border:'rgba(239,68,68,0.3)'});

    // Amarilla alerts
    const alertCards = (tarjetas[cat]||[]).filter(p=>p.amarillas>=2);
    if(alertCards.length) catEvents.push({type:'card', label:`🟨 ${alertCards.length} en alerta`, sub: alertCards.map(p=>p.name).join(', '), color:'rgba(245,158,11,0.1)', border:'rgba(245,158,11,0.3)'});

    const eventsHtml = catEvents.length
      ? catEvents.map(e=>`<div style="background:${e.color};border:1px solid ${e.border};border-radius:5px;padding:6px 9px;margin-bottom:5px">
          <div style="font-size:12px;font-family:'Barlow Condensed',sans-serif;color:var(--text2,#d8e4ff)">${e.label}</div>
          <div style="font-size:10px;color:var(--muted,#5a7099);font-family:'Barlow Condensed',sans-serif;margin-top:2px">${e.sub}</div>
        </div>`).join('')
      : `<div style="font-size:11px;color:var(--muted,#5a7099);font-family:'Barlow Condensed',sans-serif;padding:8px 0">Sin actividad registrada</div>`;

    html += `<div style="background:rgba(10,15,30,0.5);border:1px solid rgba(26,45,90,0.5);border-radius:10px;padding:14px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
        <span style="width:8px;height:8px;border-radius:50%;background:${CAT_COLORS[cat]};display:inline-block"></span>
        <span style="font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--text)">${cat}</span>
      </div>
      ${eventsHtml}
    </div>`;
  });

  html += '</div>';
  wrap.innerHTML = html;
}
