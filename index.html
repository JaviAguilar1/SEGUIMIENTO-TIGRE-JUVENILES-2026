// ── Modo 2: ficha individual de un jugador (desde la tabla de PLANTEL) ────
// Perfil acumulado de un jugador (Item 2): junta en una sola vista lo que
// hoy está disperso -- totales de temporada (jugadoresStats, futdetail),
// el detalle de goles por fecha/minuto/penal (golesEfectivos, ya existía
// pero solo se veía adentro de Goleadores) y, si Brian ya cargó datos en
// BL GPS Performance, un resumen de sus partidos ahí. Se abre haciendo
// click en el nombre dentro de la tabla de PLANTEL.
function abrirPerfilJugador(cat, nombre){
  const roster = plantelFutdetail[cat]||[];
  // Match por subconjunto de palabras, no por igualdad exacta: el nombre
  // puede llegar acá en otro formato ("APELLIDO, NOMBRE" desde Goleadores,
  // sin segundos nombres) que nunca va a ser igual al del plantel
  // ("Apellido Nombre Segundo") -- mismo criterio que cometResolvePlayer
  // usa para matchear informes de COMET contra el plantel.
  const nombreWords = cometNameWords(nombre);
  const sonMismoJugador = otro => {
    const otroWords = cometNameWords(otro);
    return otroWords.length>0 && nombreWords.length>0 &&
      (otroWords.every(w=>nombreWords.includes(w)) || nombreWords.every(w=>otroWords.includes(w)));
  };
  const jugador = roster.find(p=>p.nombre===nombre) || roster.find(p=>sonMismoJugador(p.nombre));
  const statsPorNombre={};
  (jugadoresStats[cat]||[]).forEach(j=>{ statsPorNombre[normNombreOrdenIndependiente(j.jugador)]=j; });
  const jStat = (jugadoresStats[cat]||[]).find(j=>sonMismoJugador(j.jugador));
  const s = statsPorNombre[normNombreOrdenIndependiente(nombre)] || jStat || {};

  // Escudo del rival de una fecha (mismo fixture -- RIVALS -- que usa el
  // resto de la app para mayores/menores), usado en "Partidos jugados".
  const escudoDeFecha = fecha=>{
    const rivalCanon = RIVALS.find(x=>x.f===fecha)?.r;
    const archivo = rivalCanon ? RIVAL_INFO[rivalCanon]?.escudo : null;
    return archivo ? `<img src="escudos/${archivo}" style="width:18px;height:18px;object-fit:contain;border-radius:50%;flex-shrink:0" alt="">` : '';
  };

  // Mismo criterio de "palabras ordenadas alfabeticamente" que ya se usa
  // para emparejar nombres entre fuentes distintas en el resto de la app
  // (ej. futdetail vs plantel) -- asi "Nombre Apellido" de BL empareja con
  // "Apellido Nombre" del plantel sin tener que vincular nada a mano.
  const ordenIndep = str => (str||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .split(/\s+/).filter(Boolean).sort().join(' ');
  const blEntry = Object.entries(blPlayers).find(([n])=>ordenIndep(n)===ordenIndep(nombre));
  const blMatches = blEntry ? (blEntry[1].match||[]) : [];
  // Catapult directo, si hay -- se prefiere por sobre BL para ESTE jugador
  // (misma lógica que topSpeedInfo en la tarjeta chica/PDF). catapultPlayers
  // ya viene separado por categoría real, así que el cruce por nombre acá
  // no corre riesgo de mezclar a alguien de otra categoría (Javi, 2026-09-02:
  // esta ficha completa -- el radar -- se había quedado sin este arreglo,
  // solo se había hecho en la tarjeta chica y el PDF).
  const catapultEntry = catapultResolverJugador(cat, nombre);
  const catapultMatches = catapultEntry ? (catapultEntry[1].match||[]) : [];
  const gpsMatches = catapultMatches.length ? catapultMatches : blMatches;

  // Cruza contra matchData (citaciones) de TODAS las fechas de la categoría
  // -- veces titular, veces entró desde el banco, veces salió. Match por id
  // si la citación ya lo trae (parseCitacionRaw lo resuelve contra el
  // plantel al cargar); si no, cae al mismo criterio de nombre "orden
  // independiente" que usa el resto de la app para cruzar fuentes distintas.
  const nombreNorm = normNombreOrdenIndependiente(nombre);
  const esMismoJugador = p => (jugador?.id!=null && p.id===jugador.id) || normNombreOrdenIndependiente(p.nombre)===nombreNorm;
  const idJ = jugador?.id!=null ? jugador.id : null;
  const DURACION_PARTIDO = 90; // partidos de COMET son de 90' (confirmado con el reglamento del torneo)
  let vecesTitular=0, vecesBanco=0, vecesEntroDeBanco=0, vecesSalio=0;
  let minCometSum=0, golCometSum=0, amCometSum=0, rojCometSum=0;
  const partidosJugados=[]; // {fecha, rival, cond, res:[gf,gc], eventos:[..chips]}
  Object.entries(matchData[cat]||{}).forEach(([fechaStr,d])=>{
    const fecha=parseInt(fechaStr,10);
    const enTit=(d.titulares||[]).find(esMismoJugador);
    const enSup=(d.suplentes||[]).find(esMismoJugador);
    if(enTit) vecesTitular++;
    if(enSup) vecesBanco++;
    if(!enTit && !enSup) return;
    const partido=(partidos[cat]||{})[fecha];
    const eventos=[];
    if(partido && idJ!=null){
      // "Entró"/"Salió" y los minutos exactos salen del informe de COMET
      // (partido.titulares/suplentes), no de la citación -- la citación es
      // la lista declarada ANTES del partido, nunca tiene el minuto real de
      // entrada/salida. Titular/en banco (arriba) sí quedan de la citación,
      // que cubre el 100% de las fechas.
      const titComet=(partido.titulares||[]).find(x=>x.id===idJ);
      const supComet=(partido.suplentes||[]).find(x=>x.id===idJ);
      if(titComet){
        if(titComet.minutoSalida!=null) vecesSalio++;
        minCometSum += titComet.minutoSalida!=null ? titComet.minutoSalida : DURACION_PARTIDO;
      } else if(supComet && supComet.minutoEntrada!=null){
        vecesEntroDeBanco++;
        minCometSum += DURACION_PARTIDO-supComet.minutoEntrada;
      }
      // Autogol no suma a golCometSum (gol en contra, no es un gol a favor
      // del jugador) pero sigue apareciendo en la línea de tiempo de la
      // ficha con su propio ícono, para que no desaparezca el dato.
      (partido.goles||[]).filter(g=>g.id===idJ).forEach(g=>{
        if(g.autogol){ eventos.push(`⚫${minSuf(g.minuto)} (autogol)`); return; }
        golCometSum++; eventos.push(`⚽${minSuf(g.minuto)}${g.penal?' (P)':''}`);
      });
      (partido.amarillas||[]).filter(a=>a.id===idJ).forEach(a=>{ amCometSum++; eventos.push(`🟨${minSuf(a.minuto)}`); });
      (partido.rojas||[]).filter(a=>a.id===idJ).forEach(a=>{ rojCometSum++; eventos.push(`🟥${minSuf(a.minuto)}`); });
    }
    partidosJugados.push({fecha, rival:d.rival||'—', cond:condicionCat(cat,fecha), res:results[cat]?.[fecha]||null, eventos});
  });
  partidosJugados.sort((a,b)=>a.fecha-b.fecha);
  // Minutos: gana COMET (más preciso, partido a partido), pero como no
  // cubre el 100% de las fechas, si futdetail (acumulado de toda la
  // temporada) da un número más alto, se usa ese -- nunca mostrar de menos
  // por una fecha sin informe de COMET cargado. OJO: futdetail no separa
  // "Torneo LPF" de amistosos en este acumulado (a diferencia del fixture),
  // así que para goles/tarjetas NO se usa -- un jugador con un gol en
  // amistoso terminaba mostrando un gol de más (caso real: Schenone Elías,
  // 6TA, 2026-09-03). En su lugar:
  // - Goles: golesEfectivos(cat) (carga manual + COMET, ya 100% torneo,
  //   mismo número que "Mi carga" en Confiabilidad).
  // - Tarjetas: COMET vs. statfutbol (la tabla oficial LPF, tampoco tiene
  //   amistosos) en vez de COMET vs. futdetail.
  const convocatorias = vecesTitular+vecesBanco;
  const minutosFinal = Math.max(minCometSum, parseInt(s.minutos_jugados)||0);
  const geEntry = golesEfectivos(cat).find(g=>sonMismoJugador(g.name));
  const golesFinal = geEntry ? geEntry.goals : golCometSum;
  const sfJ = ((TABLA_DATA&&TABLA_DATA.statfutbol_jugadores&&TABLA_DATA.statfutbol_jugadores[cat])||[])
    .find(j=>sonMismoJugador(j.nombre));
  const amarillasFinal = Math.max(amCometSum, sfJ?(parseInt(sfJ.am)||0):0);
  const rojasFinal = Math.max(rojCometSum, sfJ?(parseInt(sfJ.roja)||0):0);

  // Radar de arriba de la ficha: goles y minutos son 100% propios (tasa
  // sobre las convocatorias del jugador, nunca comparado contra nadie);
  // sprints/vel. máxima/mts por partido salen de BL GPS Performance si ya
  // hay carga -- reemplaza a la vieja sección "RENDIMIENTO FÍSICO (BL)"
  // (una tabla partido a partido que quedaba redundante con esto).
  // Referencia = el mejor dato del plantel de esta categoría en cada
  // métrica (no un techo inventado) -- así el radar responde "qué tan
  // cerca está de la vara más alta del propio plantel", no una tasa fija
  // sin contexto. Goles/Minutos salen de jugadoresStats (mismo dato que ya
  // se ve en la tabla de PLANTEL); Sprints/Vel. máxima/Mts por minuto
  // salen de BL GPS Performance, entre los jugadores de esta categoría que
  // ya tengan carga. Mts/min (no Dist. Total cruda) para que un suplente
  // que jugó menos minutos no quede siempre por debajo de un titular solo
  // por haber corrido menos metros en total -- a pedido de Javi, 2026-09-01.
  const statsCat = jugadoresStats[cat]||[];
  const refGoles = statsCat.reduce((max,j)=>Math.max(max, parseInt(j.goles)||0), 0);
  const refMinutos = statsCat.reduce((max,j)=>Math.max(max, parseInt(j.minutos_jugados)||0), 0);
  const gpsNumsDe = (p,i) => (p.match||[]).map(m=>m.metrics?.[i]).filter(v=>v!=null).map(Number);
  const gpsPromDe = (p,i) => { const n=gpsNumsDe(p,i); return n.length ? n.reduce((a,b)=>a+b,0)/n.length : null; };
  const gpsMaxDe  = (p,i) => { const n=gpsNumsDe(p,i); return n.length ? Math.max(...n) : null; };
  const sprintsProm = gpsPromDe({match:gpsMatches}, 5);
  const velMax = gpsMaxDe({match:gpsMatches}, 6);
  const mtsProm = gpsPromDe({match:gpsMatches}, 1);
  // Referencia (mejor dato del plantel): por cada jugador de la categoría,
  // se usa Catapult si tiene carga, sino BL -- mismo criterio de preferencia
  // que arriba, jugador por jugador.
  let refSprints=0, refVelMax=0, refMts=0;
  const nombresConGps = new Set([
    ...Object.keys(catapultPlayersDeCategoria(cat)),
    ...Object.keys(blPlayersDeCategoria(cat)),
  ]);
  const catapultCat = catapultPlayersDeCategoria(cat), blCat = blPlayersDeCategoria(cat);
  nombresConGps.forEach(n=>{
    const cEntry = catapultCat[n], bEntry = blCat[n];
    const matches = (cEntry && cEntry.match.length) ? cEntry.match : (bEntry ? bEntry.match : []);
    const sp=gpsPromDe({match:matches},5), vm=gpsMaxDe({match:matches},6), mt=gpsPromDe({match:matches},1);
    if(sp!=null) refSprints=Math.max(refSprints, sp);
    if(vm!=null) refVelMax =Math.max(refVelMax, vm);
    if(mt!=null) refMts    =Math.max(refMts, mt);
  });
  const radarGoles   = refGoles   ? Math.min(100, Math.round(golesFinal/refGoles*100)) : 0;
  const radarMinutos = refMinutos ? Math.min(100, Math.round(minutosFinal/refMinutos*100)) : 0;
  const radarSprints = (refSprints && sprintsProm!=null) ? Math.min(100, Math.round(sprintsProm/refSprints*100)) : 0;
  const radarVelMax  = (refVelMax  && velMax!=null)      ? Math.min(100, Math.round(velMax/refVelMax*100))      : 0;
  const radarMts     = (refMts     && mtsProm!=null)     ? Math.min(100, Math.round(mtsProm/refMts*100))       : 0;
  const hayGps = gpsMatches.length>0;
  const radarHTML = `
    <div style="position:relative;width:100%;height:240px;margin:6px 0">
      <canvas id="radar-perfil-jugador" role="img" aria-label="Radar de ${esc(nombre)}: cada eje es el porcentaje respecto al mejor dato del plantel de ${esc(cat)} en goles, minutos jugados${hayGps?', sprints, velocidad maxima y metros por minuto':''}${hayGps?'':' -- sprints, velocidad maxima y metros por minuto todavia pendientes de carga GPS'}"></canvas>
    </div>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:14px;font-size:10.5px;color:var(--muted);margin-bottom:6px">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#2a78d6"></span>Dato real</span>
      ${hayGps?'':'<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--muted)"></span>Pendiente (GPS)</span>'}
    </div>
    <div style="font-size:10.5px;color:var(--muted);text-align:center;margin-bottom:14px">Cada eje es el % respecto al mejor dato del plantel de ${esc(cat)} en esa métrica.${hayGps?'':' Sprints, Vel. máxima y Mts/min se completan solos cuando Brian cargue en BL GPS Performance.'}</div>`;

  const partidosJugadosHTML = partidosJugados.length
    ? `<div class="table-wrap"><table><thead><tr><th>F</th><th>Rival</th><th>Res.</th><th>Eventos</th></tr></thead><tbody>
        ${partidosJugados.map(pj=>{
          const condTxt = pj.cond==='L'?'L':pj.cond==='V'?'V':'';
          const r = pj.res;
          const resTxt = (r && r[0]!=null && r[1]!=null) ? `${r[0]}-${r[1]}` : '—';
          const resColor = r ? (getResult(r[0],r[1])==='W'?'var(--win)':getResult(r[0],r[1])==='D'?'var(--draw)':'var(--loss)') : 'var(--muted)';
          return `<tr><td>F${pj.fecha}</td><td style="display:flex;align-items:center;gap:6px">${escudoDeFecha(pj.fecha)}${esc(pj.rival)}${condTxt?` <span class="cond-badge cond-${pj.cond}" style="font-size:9px">${condTxt}</span>`:''}</td>
            <td style="color:${resColor};font-weight:700">${resTxt}</td>

    : `<div style="color:var(--muted);font-size:12px;padding:6px 0">Sin partidos con citación cargada todavía.</div>`;

  let m=document.getElementById('perfil-jugador-modal');

  m.id='perfil-jugador-modal'; m.className='modal-bg';

      ${[['Convoc.',convocatorias],['Titular',vecesTitular],['Minutos',minutosFinal],['Amar.',amarillasFinal]]
        .map(([label,val])=>`<div style="background:var(--surface2);border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase">${label}</div>
          <div style="font-size:18px;font-weight:700;color:var(--gold2)">${val||0}</div></div>`).join('')}
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">Convoc./titular: tus citaciones · minutos/amarillas: COMET, completado con futdetail donde falte informe. Goles: ver arriba (radar) y en Partidos jugados. Entró de banco: ${vecesEntroDeBanco} · Salió: ${vecesSalio}</div>
    <div class="st"><div class="stbar"></div>🗓️ PARTIDOS JUGADOS</div>
    ${partidosJugadosHTML}

  document.body.appendChild(m);

    type: 'radar',

        ['Sprints', sprintsProm!=null ? `${fmtGps(sprintsProm)}/partido · ${radarSprints}%` : 'pendiente'],
        ['Vel. máxima', velMax!=null ? `${fmtGps(velMax)} km/h · ${radarVelMax}%` : 'pendiente'],

// Mi plantel guarda "Apellido Nombre" (ej. "Ortiz Ignacio") y Catapult
// exporta "Nombre Apellido" (ej. "Ignacio Ortiz") — normNombre (que solo
// pasa a minúsculas) no alcanza acá porque el ORDEN de las palabras es
// distinto. Ordenando las palabras alfabéticamente antes de comparar, el
// orden deja de importar.
function normNombreOrdenIndependiente(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean).sort().join(' ');
}
// Busca un jugador dentro de catapultPlayers[cat] tolerando lo mismo que ya
// tolera el scraper del lado servidor (_catapult_resolver_categoria en
// scrape_tablas.py) -- normNombreOrdenIndependiente sola solo reordena
// palabras, no alcanza para nombres con una letra distinta entre Catapult
// y el plantel (ej. "Miqueas Olocco" vs "Olocco Mikeas", "Cuba Giovanni" vs
// "Cuba Gio") (Javi, 2026-09-02: la ficha completa/radar seguía sin mostrar
// el dato de estos jugadores por esto). Devuelve [nombreEnCatapult, datos]
// o null. 1) exacto, 2) subconjunto de palabras (nombre incompleto de un
// lado), 3) parecido de texto (LCS) con umbral alto -- solo si hay una
// única coincidencia en cada nivel, nunca se adivina entre varias.
function catapultResolverJugador(cat, nombre){
  const dict = catapultPlayers[cat] || {};
  const nn = normNombreOrdenIndependiente(nombre);
  if(!nn) return null;
  const exacto = Object.entries(dict).find(([n])=>normNombreOrdenIndependiente(n)===nn);
  if(exacto) return exacto;

  const palabras = new Set(nn.split(' '));
  const subconjunto = Object.entries(dict).filter(([n])=>{
    const np = new Set(normNombreOrdenIndependiente(n).split(' '));
    return [...palabras].every(w=>np.has(w)) || [...np].every(w=>palabras.has(w));
  });
  if(subconjunto.length===1) return subconjunto[0];
  if(subconjunto.length>1) return null;

  const lcsRatio = (a,b) => {
    const dp = Array.from({length:a.length+1}, ()=>new Array(b.length+1).fill(0));
    for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
    return (a.length+b.length) ? 2*dp[a.length][b.length]/(a.length+b.length) : 0;
  };
  let mejorScore=0, mejores=[];
  Object.entries(dict).forEach(([n,v])=>{
    const score = lcsRatio(nn, normNombreOrdenIndependiente(n));
    if(score>mejorScore){ mejorScore=score; mejores=[[n,v]]; }
    else if(score===mejorScore) mejores.push([n,v]);
  });
  return (mejorScore>=0.84 && mejores.length===1) ? mejores[0] : null;
}



// ============================================================
//  ALERT SYSTEM — header badges
// ============================================================
// Jugadores de una categoría con 4+ amarillas en la temporada (riesgo de
// suspensión), contadas desde los informes de COMET ya cargados. Compartida
// entre el pill del header (agregado de 4TA/5TA/6TA) y el aviso dentro de
// cada categoría (ver renderStatsSingle) — antes solo existía en el header
// y había que pasar el mouse por arriba para ver quién era.
function amarillasEnAlerta(cat){
  const AMARILLAS_ALERTA = 4;
  const AMARILLAS_SUSPENSION = 5; // a la 5ta amarilla se cumple 1 fecha y el conteo arranca de cero
  const porJugador = {}; // id -> {nombre, count}
  // El conteo es por CICLO, no por total de temporada: se reinicia en cero
  // apenas el jugador es expulsado (roja directa o doble amarilla), o al
  // llegar a la 5ta amarilla acumulada -- en los dos casos ya cumplió una
  // suspensión y el conteo relevante es el que lleva desde ahí, no el
  // acumulado entero. Por eso hace falta procesar los partidos en orden
  // cronológico (por fecha), no en el orden en que estén en Firebase.
  const fechasOrdenadas = Object.keys(partidos[cat]||{}).map(Number).sort((a,b)=>a-b);
  fechasOrdenadas.forEach(fecha=>{
    const partido = partidos[cat][fecha];
    (partido.amarillas||[]).forEach(a=>{
      if(!a.id) return;
      if(!porJugador[a.id]) porJugador[a.id]={nombre:plantelNombreDeId(cat,a.id)||a.nombre, count:0};
      porJugador[a.id].count++;
    });
    const expulsados = new Set((partido.rojas||[]).map(r=>r.id).filter(Boolean));
    Object.keys(porJugador).forEach(id=>{
      if(porJugador[id].count>=AMARILLAS_SUSPENSION || expulsados.has(id)) porJugador[id].count=0;
    });
  });
  // Solo jugadores que siguen en el plantel actual y no fueron archivados
  // a mano -- uno que ya se fue no va a sumar más amarillas y no afecta al
  // equipo hoy, aunque su carga histórica de tarjetas se mantenga intacta
  // (Javi, 2026-09-02, caso Poblete Matías en 5TA -- seguía apareciendo
  // porque futdetail todavía no lo había sacado de su propio plantel; el
  // filtro por plantelFutdetail solo no alcanza, hace falta también poder
  // archivarlo a mano con el botón nuevo de PLANTEL).
  return Object.entries(porJugador)
    .map(([id,p])=>({...p, ciclo: p.count, id}))
    .filter(p=>p.ciclo>=AMARILLAS_ALERTA && plantelNombreDeId(cat,p.id)!=null && !estaArchivado(cat, p.nombre));
}
// El pill "N en alerta" del header se sacó a pedido de Javi -- el mismo
// aviso (4+ amarillas, riesgo de suspensión) ya se ve adentro de cada
// categoría (renderStatsSingle, vía amarillasEnAlerta) y quedaba
// duplicado. La función queda (llamada desde varios lugares tras guardar
// datos) pero ahora solo limpia el contenedor por si venía de una versión
// vieja con algo dibujado.
function refreshAlerts(){
  const wrap = document.getElementById('alert-pills');
  if(wrap) wrap.innerHTML = '';
  refreshConfiabilidadBadge();
}


</script>
