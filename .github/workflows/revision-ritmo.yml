name: Revision sync video por ritmo (no guarda en Firebase)

# Solo a mano. Corre scripts/revisar_sync_ritmo.py en modo revision (lee el
# ultimo backup del repo, NO escribe en Firebase) y deja la tabla en
# data/revision_ritmo.txt. Si estan los secrets CATAPULT_USER/CATAPULT_PASS
# usa la senal densa de Catapult; si no, los esfuerzos guardados.
on:
  workflow_dispatch:
    inputs:
      categorias:
        description: "Categorias separadas por espacio (vacio = todas)"
        required: false
        default: "4TA"

permissions:
  contents: write

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install yt-dlp imageio-ffmpeg numpy pytesseract pillow
      - name: Revision
        env:
          CATAPULT_USER: ${{ secrets.CATAPULT_USER }}
          CATAPULT_PASS: ${{ secrets.CATAPULT_PASS }}
        run: python -u scripts/revisar_sync_ritmo.py ${{ github.event.inputs.categorias }} 2>&1 | tee data/revision_ritmo.txt
      - name: Guardar resultado en el repo
        if: always()
        run: |
          git config user.name  "revision-bot"
          git config user.email "actions@github.com"
          git add data/revision_ritmo.txt
          git commit -m "Revision sync por ritmo" || exit 0
          git pull --rebase
          git push
