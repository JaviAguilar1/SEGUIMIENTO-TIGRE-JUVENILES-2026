name: Actualizar tablas LPF

# Corre solo, sin intervencion manual.
on:
  schedule:
    # Cada 30 minutos, todos los dias (UTC)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # boton "Run workflow" por si queres forzar una actualizacion

permissions:
  contents: write   # necesario para que la Action commitee el JSON

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Arregla errores de "self-signed certificate" que a veces tira la
      # imagen de Ubuntu del runner al conectar a HTTPS (paquete
      # ca-certificates desactualizado en la imagen, no es un problema de
      # los sitios de origen -- confirmado 2026-09-01 conectando a los
      # mismos sitios desde otra red sin problema).
      - name: Actualizar certificados CA
        run: sudo apt-get update -qq && sudo apt-get install -y --reinstall ca-certificates && sudo update-ca-certificates

      # continue-on-error: si alguna fuente fallo, el script sale con error
      # (para que quede registrado), pero igual queremos commitear el dato
      # parcial que si funciono -- por eso el paso siguiente corre igual.
      - name: Ejecutar scraper
        id: scraper
        continue-on-error: true
        env:
          FUTDETAIL_USER: ${{ secrets.FUTDETAIL_USER }}
          FUTDETAIL_PASS: ${{ secrets.FUTDETAIL_PASS }}
          BL_USER: ${{ secrets.BL_USER }}
          BL_PASS: ${{ secrets.BL_PASS }}
        run: python scripts/scrape_tablas.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name  "tablas-bot"
          git config user.email "actions@github.com"
          git add data/tablas.json
          if git diff --staged --quiet; then
            echo "Sin cambios en la tabla."
          else
            git commit -m "Actualizacion automatica de tablas LPF"
            git push
          fi

      # Recien aca se deja que el run quede marcado como fallido -- asi
      # GitHub manda el aviso por mail (notificacion default de Actions),
      # pero sin haber bloqueado el commit del dato parcial de arriba.
      - name: Marcar el run como fallido si el scraper tuvo errores
        if: steps.scraper.outcome == 'failure'
        run: exit 1
