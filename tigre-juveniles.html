<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tigre Juveniles">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Tigre Juveniles — Plataforma de Análisis</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
/* ══════════════════════════════════════════════════════════
   TIGRE JUVENILES — Design System
══════════════════════════════════════════════════════════ */
:root {
  --bg:        #05080f;
  --surface:   #0a0f1e;
  --surface2:  #0d1528;
  --surface3:  #111e38;
  --border:    #1a2d5a;
  --border2:   #243f7a;
  --red:       #c0152a;
  --red2:      #e01830;
  --red-glow:  rgba(192,21,42,0.35);
  --blue:      #1a3a8f;
  --blue2:     #2450c0;
  --gold:      #c9a227;
  --gold2:     #f0c040;
  --win:       #22c55e;
  --draw:      #f59e0b;
  --loss:      #ef4444;
  --text:      #d8e4ff;
  --muted:     #5a7099;
  --white:     #ffffff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Barlow',sans-serif;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 70% 35% at 20% 0%,rgba(26,58,143,0.2) 0%,transparent 65%),
    radial-gradient(ellipse 50% 25% at 80% 0%,rgba(192,21,42,0.12) 0%,transparent 60%);
}

/* ── HEADER ─────────────────────────────────────────── */
header {
  background:linear-gradient(180deg,#0d1528 0%,#08111f 100%);
  border-bottom:3px solid var(--red);
  padding:0 20px;
  display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:300;
  min-height:66px;
  box-shadow:0 4px 40px rgba(0,0,0,0.7);
}
header::after{
  content:'';position:absolute;bottom:-1px;left:0;right:0;
  height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.crest-img{width:48px;height:48px;object-fit:contain;
  filter:drop-shadow(0 0 10px rgba(192,21,42,0.55));}
.header-titles h1{
  font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:5px;
  color:var(--white);line-height:1;
  text-shadow:0 0 30px rgba(192,21,42,0.4);
}
.header-titles p{color:var(--muted);font-size:10px;margin-top:2px;
  letter-spacing:2px;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;}
.header-right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.season-pill{background:var(--red);color:white;font-family:'Bebas Neue',sans-serif;
  font-size:11px;letter-spacing:2px;padding:2px 10px;border-radius:20px;}
#admin-badge{display:none;align-items:center;gap:6px;}
.admin-tag{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);
  border-radius:4px;padding:2px 8px;font-family:'Barlow Condensed',sans-serif;
  font-size:10px;letter-spacing:1px;color:#22c55e;}
.role-tag{background:rgba(240,192,64,0.15);border:1px solid rgba(240,192,64,0.3);
  border-radius:4px;padding:2px 8px;font-family:'Barlow Condensed',sans-serif;
  font-size:10px;letter-spacing:1px;color:var(--gold2);}
#btn-login{display:flex;align-items:center;gap:5px;
  background:rgba(26,58,143,0.3);border:1px solid rgba(36,80,192,0.5);
  border-radius:4px;color:#60a5fa;font-size:10px;padding:3px 8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;transition:all .2s;}
#btn-login:hover{background:rgba(26,58,143,0.6);}
#btn-logout{display:none;align-items:center;gap:5px;
  background:rgba(192,21,42,0.2);border:1px solid rgba(192,21,42,0.4);
  border-radius:4px;color:#fca5a5;font-size:10px;padding:3px 8px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}

/* ── NAV TABS (módulos) ─────────────────────────────── */
.nav-modules{
  background:linear-gradient(180deg,#09122a,#05080f);
  border-bottom:2px solid var(--border);
  display:flex;overflow-x:auto;scrollbar-width:none;
  position:sticky;top:66px;z-index:200;
}
.nav-modules::-webkit-scrollbar{display:none;}
.mod-tab{
  padding:14px 28px;
  font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;
  color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;
  transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:8px;
}
.mod-tab:hover{color:var(--text);background:rgba(26,58,143,0.1);}
.mod-tab.active{color:var(--gold2);border-bottom-color:var(--red);background:rgba(26,58,143,0.15);}
.mod-tab .mod-icon{font-size:16px;}

/* ── CAT SUBTABS ────────────────────────────────────── */
.cat-subtabs{
  background:rgba(8,17,31,0.8);
  border-bottom:1px solid var(--border);
  display:flex;overflow-x:auto;scrollbar-width:none;padding:0 16px;
}
.cat-subtabs::-webkit-scrollbar{display:none;}
.cat-tab{
  padding:9px 16px;
  font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
  transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.cat-tab:hover{color:var(--text);}
.cat-tab.active{border-bottom-color:currentColor;}
.cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* ── MAIN CONTENT ───────────────────────────────────── */
.main{padding:20px;max-width:1500px;margin:0 auto;}
.module-panel{display:none;}
.module-panel.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── SECTION TITLE ──────────────────────────────────── */
.st{
  font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;
  color:var(--gold2);margin:20px 0 14px;display:flex;align-items:center;gap:10px;
}
.st .stbar{width:4px;height:16px;background:linear-gradient(180deg,var(--red2),var(--blue2));
  border-radius:2px;flex-shrink:0;}
.st::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}

/* ── STAT CARDS ─────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin-bottom:20px;}
.stat-card{
  background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center;
  transition:all .2s;position:relative;overflow:hidden;
}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:10px 10px 0 0;}
.stat-card.pts::before{background:var(--gold);}
.stat-card.win::before{background:var(--win);}
.stat-card.draw::before{background:var(--draw);}
.stat-card.loss::before{background:var(--loss);}
.stat-card.gf::before{background:var(--blue2);}
.stat-card.gc::before{background:var(--red2);}
.stat-card.dg::before{background:#a78bfa;}
.stat-card.pj::before{background:var(--muted);}
.stat-card:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:0 6px 20px rgba(0,0,0,0.4);}
.stat-card .val{font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;margin-bottom:4px;}
.stat-card .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;}
.stat-card.pts .val{color:var(--gold2);}
.stat-card.win .val{color:var(--win);}
.stat-card.draw .val{color:var(--draw);}
.stat-card.loss .val{color:var(--loss);}
.stat-card.gf .val{color:#60a5fa;}
.stat-card.gc .val{color:#f87171;}
.stat-card.dg .val{color:#c4b5fd;}
.stat-card.pj .val{color:var(--text);}

/* ── PERIOD TABS ────────────────────────────────────── */
.periodo-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.ptab{
  padding:5px 13px;background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
  transition:all .2s;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;
}
.ptab:hover{color:var(--text);border-color:var(--red);}
.ptab.active{background:var(--red);color:white;border-color:var(--red);box-shadow:0 2px 10px var(--red-glow);}

/* ── CHARTS ─────────────────────────────────────────── */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.chart-card{background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:12px;padding:18px;}
.chart-card h3{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;
  color:var(--gold);margin-bottom:14px;}
.pies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;margin-bottom:24px;}
.pie-card{background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;}
.pie-card h4{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1.5px;
  color:var(--gold);margin-bottom:10px;}
.pie-stat-row{display:flex;justify-content:center;gap:8px;margin-top:8px;
  font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:600;}

/* ── RESULTS TABLE ──────────────────────────────────── */
.table-wrap{overflow-x:auto;margin-bottom:24px;border-radius:10px;
  border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,0.4);}
table{width:100%;border-collapse:collapse;font-size:12px;}
table thead tr.thead-top th{
  background:linear-gradient(180deg,var(--red) 0%,#8a0f1e 100%);
  color:white;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:2px;
  padding:8px 10px;text-align:center;white-space:nowrap;
  border-right:1px solid rgba(255,255,255,0.1);}
table thead tr.thead-sub th{
  background:linear-gradient(180deg,#0d1a3a,#08111f);color:var(--gold);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;
  text-transform:uppercase;letter-spacing:1px;padding:6px 8px;
  border-bottom:1px solid var(--border2);border-right:1px solid var(--border);
  white-space:nowrap;text-align:center;}
table td{padding:5px 7px;border-bottom:1px solid rgba(26,45,90,0.4);
  border-right:1px solid rgba(26,45,90,0.25);text-align:center;vertical-align:middle;}
table td:last-child,table th:last-child{border-right:none;}
table tr:nth-child(even) td{background:rgba(10,15,30,0.4);}
table tr:hover td{background:rgba(26,58,143,0.15);}
.divider-row td{
  background:linear-gradient(90deg,rgba(192,21,42,0.12),transparent)!important;
  font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:11px;
  color:var(--red2)!important;text-align:left!important;padding:5px 14px!important;
  border-left:3px solid var(--red)!important;}
.fecha-num{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--muted);width:30px;}
.rival-name{text-align:left!important;font-family:'Barlow Condensed',sans-serif;
  font-weight:600;font-size:13px;min-width:140px;}
.cond-badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1px;}
.cond-L{background:rgba(26,58,143,0.4);color:#93c5fd;border:1px solid rgba(36,80,192,0.4);}
.cond-V{background:rgba(192,21,42,0.3);color:#fca5a5;border:1px solid rgba(192,21,42,0.4);}
.score-cell{display:flex;align-items:center;justify-content:center;gap:4px;}
.score-input{width:32px;background:rgba(5,8,15,0.9);border:1px solid var(--border2);
  border-radius:4px;color:white;font-size:14px;font-weight:700;text-align:center;
  padding:3px 2px;transition:all .2s;font-family:'Barlow Condensed',sans-serif;}
.score-input:focus{outline:none;border-color:var(--gold);background:rgba(26,58,143,0.3);}
.score-input:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none;}
.score-sep{color:var(--muted);font-weight:900;font-size:13px;}
.result-badge{display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:21px;border-radius:4px;font-weight:800;font-size:10px;
  font-family:'Barlow Condensed',sans-serif;}
.result-W{background:rgba(34,197,94,.2);color:var(--win);border:1px solid rgba(34,197,94,.35);}
.result-D{background:rgba(245,158,11,.2);color:var(--draw);border:1px solid rgba(245,158,11,.35);}
.result-L{background:rgba(239,68,68,.2);color:var(--loss);border:1px solid rgba(239,68,68,.35);}
.link-cell{min-width:76px;max-width:110px;}
.link-wrap{display:flex;gap:3px;align-items:center;}
.link-input{flex:1;min-width:0;background:rgba(5,8,15,0.6);border:1px solid rgba(26,45,90,0.5);
  border-radius:4px;color:#93c5fd;font-size:9px;padding:3px 5px;transition:all .2s;
  font-family:'Barlow',sans-serif;}
.link-input:focus{outline:none;border-color:var(--gold);}
.link-input::placeholder{color:rgba(90,112,153,0.4);font-style:italic;}
.link-input:disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;}
.link-btn{display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;flex-shrink:0;background:rgba(26,58,143,0.3);
  border:1px solid var(--border2);border-radius:4px;color:#93c5fd;font-size:10px;
  cursor:pointer;text-decoration:none;transition:all .2s;}
.link-btn:hover{background:var(--red);border-color:var(--red);color:white;}
.link-btn.empty{opacity:0.2;pointer-events:none;}

/* ── GOLEADORES ─────────────────────────────────────── */
.goleadores-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:14px;margin-bottom:24px;}
.goleadores-card{background:linear-gradient(135deg,var(--surface2),var(--surface));
  border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.goleadores-card .gc-header{
  background:linear-gradient(135deg,var(--red),#8a0f1e);
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;}
.goleadores-card .gc-header h3{font-family:'Bebas Neue',sans-serif;font-size:15px;
  letter-spacing:2px;color:white;}
.goleadores-card .gc-body{padding:0;}
.gol-row{display:flex;align-items:center;gap:10px;padding:8px 14px;
  border-bottom:1px solid rgba(26,45,90,0.4);transition:background .15s;}
.gol-row:hover{background:rgba(26,58,143,0.15);}
.gol-row:last-child{border-bottom:none;}
.gol-rank{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted);
  width:24px;text-align:center;flex-shrink:0;}
.gol-rank.gold{color:var(--gold2);}
.gol-rank.silver{color:#94a3b8;}
.gol-rank.bronze{color:#b45309;}
.gol-name{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;}
.gol-count{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold2);}
.gol-add-row{padding:8px 14px;display:flex;gap:6px;align-items:center;
  border-top:1px solid var(--border);}
.gol-input{flex:1;background:rgba(5,8,15,0.7);border:1px solid var(--border2);
  border-radius:5px;color:var(--text);font-size:12px;padding:5px 8px;
  font-family:'Barlow',sans-serif;}
.gol-input:focus{outline:none;border-color:var(--gold);}
.gol-fecha-input{width:50px;background:rgba(5,8,15,0.7);border:1px solid var(--border2);
  border-radius:5px;color:var(--text);font-size:12px;padding:5px 6px;text-align:center;
  font-family:'Barlow Condensed',sans-serif;}
.gol-fecha-input:focus{outline:none;border-color:var(--gold);}
.btn-add-gol{background:var(--blue2);border:none;border-radius:5px;color:white;
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;
  padding:5px 12px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-add-gol:hover{background:var(--blue);}
.gol-empty{padding:16px;text-align:center;color:var(--muted);font-size:12px;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}

/* ── GENERAL COMPARISON TABLE ───────────────────────── */
.gen-table-wrap{overflow-x:auto;margin-bottom:24px;border-radius:10px;border:1px solid var(--border);}
table.gen-table thead tr th{
  background:linear-gradient(180deg,var(--red),#8a0f1e);color:white;
  font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1.5px;
  padding:10px 12px;text-align:center;border-right:1px solid rgba(255,255,255,0.1);}
table.gen-table tbody td{padding:8px 12px;border-bottom:1px solid var(--border);
  border-right:1px solid rgba(26,45,90,0.3);text-align:center;}
table.gen-table tbody tr:nth-child(even) td{background:rgba(10,15,30,0.4);}
table.gen-table tbody tr:hover td{background:rgba(26,58,143,0.12);}
table.gen-table .cat-cell{font-family:'Bebas Neue',sans-serif;font-size:15px;
  letter-spacing:1px;text-align:left!important;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}

/* ── MISC UI ────────────────────────────────────────── */
.scroll-top{position:fixed;bottom:20px;right:20px;width:40px;height:40px;
  background:linear-gradient(135deg,var(--red),var(--blue));border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:white;font-size:17px;font-weight:800;
  box-shadow:0 4px 20px rgba(192,21,42,0.5);z-index:99;transition:transform .2s;}
.scroll-top:hover{transform:scale(1.1);}

/* ── LOGIN MODAL ────────────────────────────────────── */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,15,0.92);
  display:flex;align-items:center;justify-content:center;z-index:10000;}
.modal-box{background:linear-gradient(135deg,#0d1528,#08111f);
  border:1px solid var(--border);border-top:3px solid var(--red);
  border-radius:16px;padding:36px;width:320px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.8);}
.modal-box .m-crest{width:60px;margin-bottom:16px;
  filter:drop-shadow(0 0 10px rgba(192,21,42,0.5));}
.modal-box h2{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px;
  color:var(--gold2);margin-bottom:4px;}
.modal-box p{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);
  margin-bottom:24px;letter-spacing:1px;}
.m-input{width:100%;background:rgba(5,8,15,0.8);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:14px;padding:10px 14px;
  margin-bottom:10px;outline:none;font-family:'Barlow',sans-serif;transition:border-color .2s;}
.m-input:focus{border-color:var(--gold);}
.m-btn{width:100%;background:linear-gradient(135deg,var(--red),#8a0f1e);border:none;
  border-radius:8px;color:white;font-family:'Bebas Neue',sans-serif;font-size:18px;
  letter-spacing:3px;padding:12px;cursor:pointer;margin-bottom:10px;
  box-shadow:0 4px 16px var(--red-glow);transition:opacity .2s;}
.m-btn:hover{opacity:.85;}
.m-cancel{background:none;border:none;color:var(--muted);font-family:'Barlow Condensed',sans-serif;
  font-size:12px;cursor:pointer;letter-spacing:1px;}
.m-error{color:var(--loss);font-size:12px;margin-top:8px;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;display:none;}

/* ── TOASTS ─────────────────────────────────────────── */
#save-toast{position:fixed;bottom:68px;right:20px;
  background:linear-gradient(135deg,#1a3a8f,#0d1528);
  border:1px solid var(--win);border-radius:8px;padding:7px 14px;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;
  color:var(--win);z-index:999;box-shadow:0 4px 16px rgba(0,0,0,0.5);
  transition:opacity .4s;pointer-events:none;opacity:0;}

/* ── RESPONSIVE ─────────────────────────────────────── */
@media(max-width:750px){
  .charts-row{grid-template-columns:1fr;}
  .pies-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .stats-grid{grid-template-columns:repeat(4,1fr);}
  .stat-card .val{font-size:26px;}
  .main{padding:10px;}
  header{padding:8px 12px;min-height:56px;gap:10px;}
  .crest-img{width:38px;height:38px;}
  .header-titles h1{font-size:20px;letter-spacing:3px;}
  .header-titles p{display:none;}
  .nav-modules{top:56px;}
  .mod-tab{padding:12px 16px;font-size:14px;letter-spacing:2px;}
  .link-cell{min-width:64px;max-width:88px;}
  .link-input{font-size:9px;padding:3px 4px;}
  .rival-name{min-width:100px;font-size:11px;}
  .score-input{width:28px;font-size:13px;}
  .goleadores-grid{grid-template-columns:1fr;}
}
@media(max-width:400px){
  .stats-grid{grid-template-columns:repeat(4,1fr);gap:6px;}
  .stat-card{padding:10px 6px;}
  .stat-card .val{font-size:22px;}
}

/* ══════════════════════════════════════════════════
   PLANTEL MODULE — CSS
══════════════════════════════════════════════════ */

/* ── Toolbar ─────────────────────────────────── */
.plantel-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.plantel-toolbar input[type="text"] {
  flex: 1;
  min-width: 180px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  padding: 8px 14px;
  font-family: 'Barlow', sans-serif;
  outline: none;
  transition: border-color .2s;
}
.plantel-toolbar input[type="text"]:focus { border-color: var(--gold); }
.plantel-toolbar input[type="text"]::placeholder { color: var(--muted); }
.pos-filter {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.pos-pill {
  padding: 5px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 11px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  letter-spacing: .5px;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s;
}
.pos-pill:hover { color: var(--text); border-color: var(--blue2); }
.pos-pill.active { background: var(--blue2); color: white; border-color: var(--blue2); }
.btn-add-player {
  background: linear-gradient(135deg, var(--red), #8a0f1e);
  border: none;
  border-radius: 8px;
  color: white;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  padding: 8px 18px;
  cursor: pointer;
  transition: opacity .2s;
  white-space: nowrap;
  box-shadow: 0 3px 12px var(--red-glow);
}
.btn-add-player:hover { opacity: .85; }

/* ── Player grid ─────────────────────────────── */
.players-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 28px;
}
.player-card {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}
.player-card:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.player-card .pc-top {
  background: linear-gradient(135deg, var(--red), #6a0d1b);
  padding: 14px 14px 10px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  position: relative;
}
.player-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  color: white;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.3);
  overflow: hidden;
}
.player-avatar img { width: 100%; height: 100%; object-fit: cover; }
.pc-name-block { flex: 1; min-width: 0; }
.pc-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: white;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pc-pos {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 11px;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.65);
  margin-top: 2px;
}
.pc-body {
  padding: 10px 14px 12px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 10px;
}
.pc-field { }
.pc-field .pf-lbl {
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: 'Barlow Condensed', sans-serif;
}
.pc-field .pf-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.pc-cat-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 2px 7px;
  border-radius: 10px;
  background: rgba(0,0,0,0.35);
  color: white;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-state .es-icon { font-size: 48px; margin-bottom: 14px; opacity: .5; }
.empty-state h3 { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 13px; }

/* ── Player MODAL (ficha completa) ───────────── */
.ficha-modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(5,8,15,0.92);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  z-index: 5000;
  padding: 20px;
  overflow-y: auto;
}
.ficha-modal {
  background: linear-gradient(160deg, #0d1528, #08111f);
  border: 1px solid var(--border);
  border-top: 3px solid var(--red);
  border-radius: 16px;
  width: 100%;
  max-width: 680px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.8);
  overflow: hidden;
  position: relative;
  margin: auto;
}
.ficha-header {
  background: linear-gradient(135deg, var(--red), #6a0d1b);
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.ficha-avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  color: white;
  flex-shrink: 0;
  border: 3px solid rgba(255,255,255,0.35);
  overflow: hidden;
  cursor: pointer;
  transition: border-color .2s;
}
.ficha-avatar:hover { border-color: var(--gold2); }
.ficha-avatar img { width: 100%; height: 100%; object-fit: cover; }
.ficha-name-block h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 3px;
  color: white;
  line-height: 1;
}
.ficha-name-block p {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  margin-top: 4px;
  letter-spacing: 1px;
}
.ficha-close {
  position: absolute;
  top: 14px;
  right: 16px;
  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  color: white;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .2s;
}
.ficha-close:hover { background: rgba(255,255,255,0.3); }
.ficha-body { padding: 22px 24px 28px; }
.ficha-section {
  margin-bottom: 22px;
}
.ficha-section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--gold);
  border-bottom: 1px solid var(--border2);
  padding-bottom: 6px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ficha-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 20px;
}
.ficha-fields.three { grid-template-columns: 1fr 1fr 1fr; }
.ficha-field label {
  display: block;
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: 'Barlow Condensed', sans-serif;
  margin-bottom: 4px;
}
.ficha-field input,
.ficha-field select {
  width: 100%;
  background: rgba(5,8,15,0.7);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  padding: 7px 10px;
  font-family: 'Barlow', sans-serif;
  transition: border-color .2s;
  outline: none;
}
.ficha-field input:focus,
.ficha-field select:focus { border-color: var(--gold); background: rgba(26,58,143,0.15); }
.ficha-field input:disabled,
.ficha-field select:disabled { opacity: .55; cursor: not-allowed; }
.ficha-field select option { background: #0d1528; }
.ficha-actions {
  display: flex;
  gap: 10px;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.btn-save-ficha {
  flex: 1;
  background: linear-gradient(135deg, var(--blue2), var(--blue));
  border: none;
  border-radius: 8px;
  color: white;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 2px;
  padding: 11px;
  cursor: pointer;
  transition: opacity .2s;
}
.btn-save-ficha:hover { opacity: .85; }
.btn-del-ficha {
  background: rgba(192,21,42,0.15);
  border: 1px solid rgba(192,21,42,0.4);
  border-radius: 8px;
  color: #f87171;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 1px;
  padding: 11px 16px;
  cursor: pointer;
  transition: all .2s;
}
.btn-del-ficha:hover { background: rgba(192,21,42,0.3); }

/* ── Count badge ──────────────────────────────── */
.player-count {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 14px;
  letter-spacing: .5px;
}
.player-count span { color: var(--gold2); font-weight: 700; }

@media(max-width:600px){
  .ficha-fields { grid-template-columns: 1fr 1fr; }
  .ficha-fields.three { grid-template-columns: 1fr 1fr; }
  .ficha-modal { margin: 10px; width: calc(100% - 20px); }
  .players-grid { grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); }
}


/* ══════════════════════════════════════════════════════
   RENDIMIENTO MODULE — CSS
══════════════════════════════════════════════════════ */

/* ── Rendimiento cat subtabs content ────────────────── */
#rend-content { }

/* ── FORMA RECIENTE ─────────────────────────────────── */
.forma-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.forma-card {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.forma-card .fc-header {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.forma-card .fc-header h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 15px;
  letter-spacing: 2px;
}
.forma-badges {
  display: flex;
  gap: 5px;
  padding: 12px 16px;
  align-items: center;
}
.forma-badge {
  width: 32px; height: 32px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  font-weight: 800;
  flex-shrink: 0;
}
.forma-badge.W { background: rgba(34,197,94,.25); color: var(--win); border: 1px solid rgba(34,197,94,.4); }
.forma-badge.D { background: rgba(245,158,11,.25); color: var(--draw); border: 1px solid rgba(245,158,11,.4); }
.forma-badge.L { background: rgba(239,68,68,.25); color: var(--loss); border: 1px solid rgba(239,68,68,.4); }
.forma-badge.empty { background: rgba(255,255,255,.05); color: var(--muted); border: 1px solid var(--border); }
.forma-pts {
  padding: 0 16px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: .5px;
}
.forma-pts span { color: var(--gold2); font-weight: 700; }

/* ── LOCAL VS VISITANTE ─────────────────────────────── */
.lvv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.lvv-card {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.lvv-card .lv-header {
  background: linear-gradient(135deg, var(--red), #6a0d1b);
  padding: 10px 16px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 15px;
  letter-spacing: 2px;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lvv-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border);
}
.lvv-half {
  background: var(--surface2);
  padding: 14px;
  text-align: center;
}
.lvv-half .lvv-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.lvv-stats-mini {
  display: flex;
  justify-content: center;
  gap: 8px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
}
.lvv-pts-big {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  color: var(--gold2);
  line-height: 1;
  margin-bottom: 4px;
}
.lvv-sub {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  color: var(--muted);
}

/* ── ÍNDICE DE RENDIMIENTO ──────────────────────────── */
.indice-table-wrap {
  overflow-x: auto;
  margin-bottom: 24px;
  border-radius: 10px;
  border: 1px solid var(--border);
}
.indice-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.indice-table thead th {
  background: linear-gradient(180deg, var(--red), #8a0f1e);
  color: white;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 1.5px;
  padding: 9px 12px;
  text-align: center;
  border-right: 1px solid rgba(255,255,255,.1);
  white-space: nowrap;
}
.indice-table tbody td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid rgba(26,45,90,.3);
  text-align: center;
  vertical-align: middle;
}
.indice-table tbody tr:nth-child(even) td { background: rgba(10,15,30,.4); }
.indice-table tbody tr:hover td { background: rgba(26,58,143,.15); }
.indice-name { text-align: left !important; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 13px; min-width: 140px; }
.indice-bar-wrap { min-width: 80px; }
.indice-bar {
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--blue2), var(--gold2));
  transition: width .4s;
}
.indice-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
}

/* ── LESIONES ───────────────────────────────────────── */
.lesiones-toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  align-items: center;
}
.lesiones-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}
.lesion-item {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-left: 4px solid var(--red);
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: border-color .2s;
}
.lesion-item.recovered { border-left-color: var(--win); opacity: .65; }
.lesion-item .li-icon { font-size: 20px; flex-shrink: 0; }
.lesion-item .li-body { flex: 1; min-width: 0; }
.lesion-item .li-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--text);
}
.lesion-item .li-detail {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  font-family: 'Barlow Condensed', sans-serif;
}
.lesion-badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  white-space: nowrap;
}
.lesion-badge.active { background: rgba(239,68,68,.2); color: var(--loss); border: 1px solid rgba(239,68,68,.3); }
.lesion-badge.recovered { background: rgba(34,197,94,.15); color: var(--win); border: 1px solid rgba(34,197,94,.25); }
.btn-lesion-toggle {
  background: none;
  border: 1px solid var(--border2);
  border-radius: 5px;
  color: var(--muted);
  font-size: 11px;
  padding: 3px 8px;
  cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: .5px;
  transition: all .2s;
}
.btn-lesion-toggle:hover { border-color: var(--win); color: var(--win); }
.btn-del-lesion {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 6px;
  transition: color .2s;
}
.btn-del-lesion:hover { color: var(--loss); }

/* ── ADD LESION FORM ────────────────────────────────── */
.add-lesion-form {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 24px;
  display: grid;
  grid-template-columns: 2fr 2fr 1fr 1fr auto;
  gap: 8px;
  align-items: end;
}
.add-lesion-form label {
  display: block;
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: 'Barlow Condensed', sans-serif;
  margin-bottom: 4px;
}
.add-lesion-form input,
.add-lesion-form select {
  width: 100%;
  background: rgba(5,8,15,.8);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  padding: 7px 10px;
  font-family: 'Barlow', sans-serif;
  outline: none;
  transition: border-color .2s;
}
.add-lesion-form input:focus,
.add-lesion-form select:focus { border-color: var(--gold); }
.add-lesion-form select option { background: #0d1528; }
.btn-add-lesion {
  background: var(--red);
  border: none;
  border-radius: 6px;
  color: white;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  padding: 7px 14px;
  cursor: pointer;
  transition: opacity .2s;
  white-space: nowrap;
}
.btn-add-lesion:hover { opacity: .85; }

/* ── TARJETAS ───────────────────────────────────────── */
.tarjetas-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.tarjetas-cat-card {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.tarjetas-cat-card .tc-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tarjetas-cat-card .tc-header h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
}
.tarjeta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 14px;
  border-bottom: 1px solid rgba(26,45,90,.3);
  transition: background .15s;
}
.tarjeta-row:hover { background: rgba(26,58,143,.1); }
.tarjeta-row:last-child { border-bottom: none; }
.tarjeta-name {
  flex: 1;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600;
  font-size: 13px;
}
.tarjeta-counts {
  display: flex;
  gap: 6px;
  align-items: center;
}
.tc-amarilla {
  background: rgba(245,158,11,.2);
  color: var(--draw);
  border: 1px solid rgba(245,158,11,.3);
  border-radius: 4px;
  padding: 2px 8px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  min-width: 28px;
  text-align: center;
}
.tc-roja {
  background: rgba(239,68,68,.2);
  color: var(--loss);
  border: 1px solid rgba(239,68,68,.3);
  border-radius: 4px;
  padding: 2px 8px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  min-width: 28px;
  text-align: center;
}
.tc-alert {
  background: rgba(239,68,68,.15);
  border: 1px solid rgba(239,68,68,.3);
  border-radius: 4px;
  padding: 2px 7px;
  font-size: 10px;
  color: var(--loss);
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 1px;
  animation: pulse 1.5s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.tc-tarj-btns {
  display: flex;
  gap: 3px;
}
.tc-tarj-btns button {
  width: 22px; height: 22px;
  border-radius: 3px;
  border: none;
  cursor: pointer;
  font-size: 11px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .2s;
}
.tc-tarj-btns button:hover { opacity: .75; }
.btn-add-am { background: rgba(245,158,11,.5); color: white; }
.btn-add-ro { background: rgba(239,68,68,.5); color: white; }
.btn-sub-am { background: rgba(245,158,11,.2); color: var(--draw); }
.btn-sub-ro { background: rgba(239,68,68,.2); color: var(--loss); }
.tarjetas-add-row {
  padding: 8px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
}
.tarjetas-add-row input {
  flex: 1;
  background: rgba(5,8,15,.7);
  border: 1px solid var(--border2);
  border-radius: 5px;
  color: var(--text);
  font-size: 12px;
  padding: 5px 8px;
  font-family: 'Barlow', sans-serif;
  outline: none;
}
.tarjetas-add-row input:focus { border-color: var(--gold); }
.btn-add-tarjeta {
  background: var(--blue2);
  border: none;
  border-radius: 5px;
  color: white;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px;
  letter-spacing: 1px;
  padding: 5px 10px;
  cursor: pointer;
}

/* ── ALERTAS BANNER ─────────────────────────────────── */
.alertas-banner {
  background: linear-gradient(135deg, rgba(239,68,68,.1), rgba(192,21,42,.05));
  border: 1px solid rgba(239,68,68,.3);
  border-left: 4px solid var(--loss);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 20px;
}
.alertas-banner h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--loss);
  margin-bottom: 10px;
}
.alerta-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  font-size: 12px;
  font-family: 'Barlow Condensed', sans-serif;
  border-bottom: 1px solid rgba(239,68,68,.1);
}
.alerta-item:last-child { border-bottom: none; }
.alerta-item .ai-cat {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px;
  padding: 1px 7px;
  border-radius: 3px;
  min-width: 36px;
  text-align: center;
}

/* ── PDF CITACIONES ─────────────────────────────────── */
.pdf-section {
  background: linear-gradient(135deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 24px;
}
.pdf-section h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  letter-spacing: 2px;
  color: var(--gold2);
  margin-bottom: 16px;
}
.pdf-form {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 10px;
  align-items: end;
  margin-bottom: 14px;
}
.pdf-form label {
  display: block;
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: 'Barlow Condensed', sans-serif;
  margin-bottom: 4px;
}
.pdf-form input,
.pdf-form select {
  width: 100%;
  background: rgba(5,8,15,.8);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  padding: 8px 10px;
  font-family: 'Barlow', sans-serif;
  outline: none;
  transition: border-color .2s;
}
.pdf-form input:focus,
.pdf-form select:focus { border-color: var(--gold); }
.pdf-form select option { background: #0d1528; }
.btn-gen-pdf {
  background: linear-gradient(135deg, var(--gold2), var(--gold));
  border: none;
  border-radius: 6px;
  color: #08111f;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  padding: 8px 18px;
  cursor: pointer;
  transition: opacity .2s;
  white-space: nowrap;
}
.btn-gen-pdf:hover { opacity: .85; }
.players-checklist {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
  gap: 6px;
  max-height: 240px;
  overflow-y: auto;
  padding: 4px;
}
.check-player {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: rgba(5,8,15,.4);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: all .2s;
  user-select: none;
}
.check-player:hover { border-color: var(--blue2); background: rgba(26,58,143,.1); }
.check-player.selected { border-color: var(--win); background: rgba(34,197,94,.1); }
.check-player input[type="checkbox"] { accent-color: var(--win); width: 14px; height: 14px; }
.check-player span { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600; }

@media(max-width:750px){
  .add-lesion-form { grid-template-columns: 1fr 1fr; }
  .pdf-form { grid-template-columns: 1fr 1fr; }
  .pdf-form .btn-gen-pdf { grid-column: 1/-1; }
  .lvv-grid,.tarjetas-grid,.forma-grid { grid-template-columns: 1fr; }
}

</style>

function getResult(gf,gc){ if(gf===null||gc===null)return null; return gf>gc?'W':gf===gc?'D':'L'; }
function calcStats(cat,from,to){
  let pj=0,pg=0,pe=0,pp=0,gf=0,gc=0;
  for(let f=from;f<=to;f++){
    const r=results[cat][f];
    if(r){pj++;gf+=r[0];gc+=r[1];const x=getResult(r[0],r[1]);if(x==='W')pg++;else if(x==='D')pe++;else pp++;}
  }
  return{pj,pg,pe,pp,gf,gc,dg:gf-gc,pts:pg*3+pe};
}
function calcStatsAll(from,to){
  let pj=0,pg=0,pe=0,pp=0,gf=0,gc=0;
  CATEGORIES.forEach(cat=>{const s=calcStats(cat,from,to);pj+=s.pj;pg+=s.pg;pe+=s.pe;pp+=s.pp;gf+=s.gf;gc+=s.gc;});
  return{pj,pg,pe,pp,gf,gc,dg:gf-gc,pts:pg*3+pe};
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function killChart(id){ const c=Chart.getChart(id); if(c)c.destroy(); }
function chartDef(){ return{responsive:true,animation:{duration:250},plugins:{legend:{labels:{color:'#5a7099',font:{family:'Barlow Condensed',size:11}}}},scales:{x:{ticks:{color:'#5a7099',font:{family:'Barlow Condensed'}},grid:{color:'rgba(26,45,90,0.4)'}},y:{ticks:{color:'#5a7099',font:{family:'Barlow Condensed'}},grid:{color:'rgba(26,45,90,0.4)'}}}}; }
function statsHTML(s){
  const dgC=s.dg>0?'var(--win)':s.dg<0?'var(--loss)':'var(--muted)',dgS=s.dg>0?'+':'';
  return `<div class="stats-grid">
    <div class="stat-card pts"><div class="val">${s.pts}</div><div class="lbl">Puntos</div></div>
    <div class="stat-card pj"><div class="val">${s.pj}</div><div class="lbl">Jugados</div></div>
    <div class="stat-card win"><div class="val">${s.pg}</div><div class="lbl">Ganados</div></div>
    <div class="stat-card draw"><div class="val">${s.pe}</div><div class="lbl">Empates</div></div>
    <div class="stat-card loss"><div class="val">${s.pp}</div><div class="lbl">Perdidos</div></div>
    <div class="stat-card gf"><div class="val">${s.gf}</div><div class="lbl">GF</div></div>
    <div class="stat-card gc"><div class="val">${s.gc}</div><div class="lbl">GC</div></div>
    <div class="stat-card dg"><div class="val" style="color:${dgC}">${dgS}${s.dg}</div><div class="lbl">Dif Gol</div></div>
  </div>`; }
function drawPie(id,s){
  if(s.pj===0)return; killChart(id);
  new Chart(document.getElementById(id).getContext('2d'),{type:'doughnut',
    data:{labels:['G','E','P'],datasets:[{data:[s.pg,s.pe,s.pp],
      backgroundColor:['rgba(34,197,94,.82)','rgba(245,158,11,.82)','rgba(192,21,42,.75)'],
      borderColor:['#22c55e','#f59e0b','#c0152a'],borderWidth:2}]},
    options:{responsive:true,plugins:{legend:{display:false}}}});
}
function pieMini(id,s,label){
  return `<div class="pie-card"><h4>${label}</h4><canvas id="${id}" height="150"></canvas>
    <div class="pie-stat-row">
      <span style="color:var(--win)">▲${s.pg}G</span>
      <span style="color:var(--draw)">${s.pe}E</span>
      <span style="color:var(--loss)">▼${s.pp}P</span>
      <span style="color:var(--gold2)">${s.pts}pts</span>
    </div></div>`; }

function initFirebase(){
  return new Promise((resolve,reject)=>{
    if(typeof firebase==='undefined'){reject('no sdk');return;}
    try{
      if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
      db=firebase.database();
      fbReady=true;
      firebase.auth().onAuthStateChanged(user=>{
        if(user){
          // Real-time role listener
          db.ref('users/'+user.uid+'/role').on('value', snap=>{
            currentRole = snap.val() || 'viewer';
            isAdmin     = currentRole==='admin';
            canEdit     = ['admin','videoanalista','videoanalista_reserva'].includes(currentRole);
            catRole     = currentRole; // store for cat filtering
            applyViewMode();
            updateAuthUI();
            // Re-render active module with correct permissions
            refreshActiveModule();
          });
          // Real-time data sync — listen for remote changes
          db.ref('stats').on('value', snap=>{
            const p=snap.val();
            if(!p) return;
            CATEGORIES.forEach(cat=>{
              if(p.results?.[cat]) RIVALS.forEach(r=>{ if(p.results[cat][r.f]) results[cat][r.f]=p.results[cat][r.f]; });
              if(p.links?.[cat])   RIVALS.forEach(r=>{ if(p.links[cat][r.f]) links[cat][r.f]=p.links[cat][r.f]; });
              if(p.goleadores?.[cat]) goleadores[cat]=p.goleadores[cat];
            });
            refreshActiveModule();
          });
          db.ref('plantel').on('value', snap=>{ loadPlayers(snap.val()); refreshPlantelIfActive(); });
          db.ref('rendimiento').on('value', snap=>{ loadRendimiento(snap.val()); refreshRendimientoIfActive(); });
        } else {
          isAdmin=false; canEdit=false; currentRole='viewer'; catRole='viewer';
          applyViewMode(); updateAuthUI();
        }
      });
      resolve();
    }catch(e){reject(e);}
  });
}

function applyViewMode(){
  document.querySelectorAll('.score-input,.link-input,.gol-input,.gol-fecha-input').forEach(el=>{
    el.disabled=!canEdit;
    el.style.opacity=canEdit?'1':'0.6';
  });
  document.querySelectorAll('.btn-add-gol,.btn-del-gol').forEach(el=>{
    el.style.display=canEdit?'':'none';
  });
  const resetBtn=document.getElementById('btn-reset');
  if(resetBtn) resetBtn.style.display=isAdmin?'':'none';

  // Filter category tabs for category-specific roles
  // e.g. role 'cat_4TA' only sees 4TA
  if(currentRole && currentRole.startsWith('cat_')){
    const allowedCat = currentRole.replace('cat_','').toUpperCase();
    document.querySelectorAll('.cat-tab[data-cat]').forEach(t=>{
      if(t.dataset.cat!=='GENERAL' && t.dataset.cat!==allowedCat){
        t.style.display='none';
      }
    });
  }
}

function updateAuthUI(){
  const loginBtn  =document.getElementById('btn-login');
  const logoutBtn =document.getElementById('btn-logout');
  const badge     =document.getElementById('admin-badge');
  const roleTagEl =document.getElementById('role-tag-txt');
  if(canEdit||isAdmin){
    if(loginBtn)  loginBtn.style.display='none';
    if(logoutBtn) logoutBtn.style.display='flex';
    if(badge)     badge.style.display='flex';
    const roleLabels={'admin':'ADMIN','videoanalista':'VIDEOANALISTA',
      'videoanalista_reserva':'VIDEO RESERVA',
      'director':'DIR. DEPORTIVO','coordinador':'COORDINADOR',
      'reserva_viewer':'RESERVA (VISTA)','cat_RESERVA':'RESERVA'};
    if(roleTagEl) roleTagEl.textContent=roleLabels[currentRole]||currentRole.toUpperCase();
  } else {
    if(loginBtn)  loginBtn.style.display='flex';
    if(logoutBtn) logoutBtn.style.display='none';
    if(badge)     badge.style.display='none';
  }
}

// ── Save ─────────────────────────────────────────────────────
function saveData(){
  if(!fbReady||!db||!canEdit) return;
  clearTimeout(saveTimeout);
  saveTimeout=setTimeout(()=>{
    const payload={results:{},links:{},goleadores:{},rivalData:rivalData};
    CATEGORIES.forEach(cat=>{
      payload.results[cat]={};
      payload.links[cat]={};
      payload.goleadores[cat]=goleadores[cat]||[];
      RIVALS.forEach(r=>{
        payload.results[cat][r.f]=results[cat][r.f]||null;
        payload.links[cat][r.f]=links[cat][r.f]||{};
      });
    });
    db.ref('stats').set(payload)
      .then(()=>showToast('☁ GUARDADO'))
      .catch(e=>console.warn('save error:',e));
  },800);
}

// ── Load ─────────────────────────────────────────────────────
function loadData(){
  return new Promise(resolve=>{
    if(!fbReady||!db){resolve();return;}
    showLoading(true);
    db.ref('stats').once('value').then(snap=>{
      const p=snap.val();
      if(p){
        CATEGORIES.forEach(cat=>{
          if(p.results?.[cat]) RIVALS.forEach(r=>{ if(p.results[cat][r.f]) results[cat][r.f]=p.results[cat][r.f]; });
          if(p.links?.[cat])   RIVALS.forEach(r=>{ if(p.links[cat][r.f]) links[cat][r.f]=p.links[cat][r.f]; });
          if(p.goleadores?.[cat]) goleadores[cat]=p.goleadores[cat];
          // Load RESERVA fixture
          if(cat==='RESERVA'&&p.rivalData?.['RESERVA']){
            Object.assign(rivalData['RESERVA'], p.rivalData['RESERVA']);
          }
        });
      }
      showLoading(false); resolve();
    }).catch(e=>{console.warn('load error:',e);showLoading(false);resolve();});
  });
}

function clearData(){
  if(!isAdmin||!confirm('⚠️ ¿Borrar TODOS los datos?')) return;
  db.ref('stats').remove().then(()=>location.reload());
}

function showLoginModal(){
  let m=document.getElementById('login-modal');
  if(m){m.style.display='flex';return;}
  m=document.createElement('div');
  m.id='login-modal'; m.className='modal-bg';
  m.innerHTML=`<div class="modal-box">
    <img class="m-crest" src="${document.getElementById('escudoImg').src}">
    <h2>ACCESO</h2><p>TIGRE JUVENILES — ANÁLISIS</p>
    <input id="m-email" class="m-input" type="email" placeholder="Email" value="${ADMIN_EMAIL}">
    <input id="m-pass"  class="m-input" type="password" placeholder="Contraseña" value="${ADMIN_PASSWORD}">
    <button class="m-btn" onclick="doLogin()">INGRESAR</button>
    <button class="m-cancel" onclick="document.getElementById('login-modal').style.display='none'">CANCELAR — SOLO VER</button>
    <div class="m-error" id="m-err">Email o contraseña incorrectos</div>
  </div>`;
  document.body.appendChild(m);
  document.getElementById('m-pass').addEventListener('keydown',e=>{ if(e.key==='Enter')doLogin(); });
}
function doLogin(){
  const email=document.getElementById('m-email').value;
  const pass =document.getElementById('m-pass').value;
  document.getElementById('m-err').style.display='none';
  firebase.auth().signInWithEmailAndPassword(email,pass)
    .then(()=>{ document.getElementById('login-modal').style.display='none'; })
    .catch(()=>{ document.getElementById('m-err').style.display='block'; });
}
function doLogout(){ firebase.auth().signOut(); }

function showToast(msg){
  let el=document.getElementById('save-toast');
  if(!el){el=document.createElement('div');el.id='save-toast';document.body.appendChild(el);}
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(()=>{el.style.opacity='0';},2000);
}
function showLoading(on){
  let el=document.getElementById('loading-overlay');
  if(on&&!el){
    el=document.createElement('div');el.id='loading-overlay';
    el.style.cssText='position:fixed;inset:0;background:rgba(5,8,15,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;';
    el.innerHTML=`<img src="${document.getElementById('escudoImg').src}" style="width:72px;margin-bottom:18px;animation:spin 1.5s linear infinite">
      <div style="font-family:Bebas Neue,sans-serif;font-size:20px;letter-spacing:4px;color:var(--gold2)">CARGANDO...</div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
    document.body.appendChild(el);
  }else if(!on&&el) el.remove();
}

// ── GENERAL VIEW ─────────────────────────────────────────────
function renderStatsCat(cat){
  const content=document.getElementById('stats-content');
  if(cat==='GENERAL') renderStatsGeneral(content);
  else renderStatsSingle(cat, content);
}

function renderStatsGeneral(content){
  const blocks=getBlocks(), periods=getPeriodos();
  const ptHTML=periods.map((p,i)=>`<div class="ptab${i===0?' active':''}" data-gpidx="${i}">${p.label}</div>`).join('');

  // Summary table rows
  let trows=CATEGORIES.map(cat=>{
    const s=calcStats(cat,1,35);
    const dgC=s.dg>0?'var(--win)':s.dg<0?'var(--loss)':'var(--muted)';
    const pct=s.pj>0?Math.round(s.pts/(s.pj*3)*100):0;
    return `<tr>
      <td class="cat-cell"><span class="dot" style="background:${CAT_COLORS[cat]}"></span>${cat}</td>
      <td style="color:var(--gold2);font-weight:700">${s.pts}</td><td>${s.pj}</td>
      <td style="color:var(--win)">${s.pg}</td><td style="color:var(--draw)">${s.pe}</td>
      <td style="color:var(--loss)">${s.pp}</td><td style="color:#60a5fa">${s.gf}</td>
      <td style="color:#f87171">${s.gc}</td>
      <td style="color:${dgC};font-weight:700">${s.dg>0?'+':''}${s.dg}</td>
      <td style="color:var(--muted)">${pct}%</td></tr>`;
  }).join('');
  const tot=calcStatsAll(1,35);
  const tDgC=tot.dg>0?'var(--win)':tot.dg<0?'var(--loss)':'var(--muted)';
  const tPct=tot.pj>0?Math.round(tot.pts/(tot.pj*3)*100):0;
  trows+=`<tr style="background:rgba(192,21,42,0.1);font-weight:700;">
    <td class="cat-cell" style="color:var(--gold2)">TOTAL</td>
    <td style="color:var(--gold2)">${tot.pts}</td><td>${tot.pj}</td>
    <td style="color:var(--win)">${tot.pg}</td><td style="color:var(--draw)">${tot.pe}</td>
    <td style="color:var(--loss)">${tot.pp}</td><td style="color:#60a5fa">${tot.gf}</td>
    <td style="color:#f87171">${tot.gc}</td>
    <td style="color:${tDgC}">${tot.dg>0?'+':''}${tot.dg}</td>
    <td style="color:var(--muted)">${tPct}%</td></tr>`;

  content.innerHTML=`
    <div class="st"><div class="stbar"></div>RESUMEN GENERAL</div>
    <div class="periodo-tabs" id="gen-ptabs">${ptHTML}</div>
    <div id="gen-stats-area"></div>

    <div class="gen-table-wrap"><table class="gen-table">
      <thead><tr>
        <th>CAT</th><th>PTS</th><th>PJ</th><th>PG</th><th>PE</th>
        <th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>%</th>
      </tr></thead><tbody>${trows}</tbody></table></div>

    <div class="st"><div class="stbar"></div>PUNTOS POR BLOQUE — TODAS LAS CATEGORÍAS</div>
    <div class="chart-card" style="margin-bottom:20px">
      <h3>COMPARATIVA DE PUNTOS</h3>
      <canvas id="cgen-pts" height="200"></canvas>
    </div>
    <div class="charts-row">
      <div class="chart-card"><h3>GOLES A FAVOR</h3><canvas id="cgen-gf" height="180"></canvas></div>
      <div class="chart-card"><h3>GOLES EN CONTRA</h3><canvas id="cgen-gc" height="180"></canvas></div>
    </div>

    <div class="st"><div class="stbar"></div>TORTAS POR CATEGORÍA (TEMPORADA)</div>
    <div class="pies-grid" id="gen-pies-cat"></div>

    <div class="st"><div class="stbar"></div>TORTAS GENERALES POR BLOQUE</div>
    <div class="pies-grid" id="gen-pies-blk"></div>

    <div class="st"><div class="stbar"></div>🏆 TOP GOLEADORES — TODAS LAS CATEGORÍAS</div>
    <div id="gen-top-goleadores"></div>
  `;

  // Period filter
  document.getElementById('gen-ptabs').addEventListener('click',e=>{
    if(!e.target.classList.contains('ptab'))return;
    document.getElementById('gen-ptabs').querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
    e.target.classList.add('active');
    const idx=parseInt(e.target.dataset.gpidx);
    const p=getPeriodos()[idx];
    document.getElementById('gen-stats-area').innerHTML=statsHTML(calcStatsAll(p.from,p.to));
  });
  document.getElementById('gen-stats-area').innerHTML=statsHTML(calcStatsAll(1,35));

  // Charts
  const def=chartDef(), blocks2=getBlocks(), labels=blocks2.map(b=>b.label);
  const mkDs=(cat,field)=>({label:cat,data:blocks2.map(b=>calcStats(cat,b.from,b.to)[field]),
    backgroundColor:CAT_COLORS[cat]+'bb',borderColor:CAT_COLORS[cat],borderWidth:1,borderRadius:4,borderSkipped:false});
  const defLeg={...def,plugins:{...def.plugins,legend:{labels:{color:'#5a7099',font:{family:'Barlow Condensed'}}}}};

  killChart('cgen-pts');
  new Chart(document.getElementById('cgen-pts').getContext('2d'),{type:'bar',
    data:{labels,datasets:CATEGORIES.map(c=>mkDs(c,'pts'))},options:defLeg});
  killChart('cgen-gf');
  new Chart(document.getElementById('cgen-gf').getContext('2d'),{type:'bar',
    data:{labels,datasets:CATEGORIES.map(c=>mkDs(c,'gf'))},options:defLeg});
  killChart('cgen-gc');
  new Chart(document.getElementById('cgen-gc').getContext('2d'),{type:'bar',
    data:{labels,datasets:CATEGORIES.map(c=>({...mkDs(c,'gc'),backgroundColor:CAT_COLORS[c]+'66'}))},options:defLeg});

  // Pies per cat
  const gpCat=document.getElementById('gen-pies-cat'); gpCat.innerHTML='';
  CATEGORIES.forEach(cat=>{
    const s=calcStats(cat,1,35),id=`gpc-${cat}`;
    gpCat.insertAdjacentHTML('beforeend',pieMini(id,s,`<span class="dot" style="background:${CAT_COLORS[cat]}"></span>${cat}`));
    setTimeout(()=>drawPie(id,s),0);
  });

  // Pies per block
  const gpBlk=document.getElementById('gen-pies-blk'); gpBlk.innerHTML='';
  blocks.forEach(b=>{
    const s=calcStatsAll(b.from,b.to),id=`gpb-${b.from}`;
    gpBlk.insertAdjacentHTML('beforeend',pieMini(id,s,b.label+' — TODAS'));
    setTimeout(()=>drawPie(id,s),0);
  });

  // Top 3 goleadores all categories
  const topWrap = document.getElementById('gen-top-goleadores');
  if(topWrap) renderTopGoleadores(topWrap);
}

function renderTopGoleadores(wrap){
  // Flatten all goleadores across all categories
  const all = {};
  CATEGORIES.forEach(cat=>{
    (goleadores[cat]||[]).forEach(g=>{
      const key = g.name.trim().toLowerCase();
      if(!all[key]) all[key] = {name:g.name, goals:0, cats:{}};
      all[key].goals += g.goals;
      all[key].cats[cat] = (all[key].cats[cat]||0) + g.goals;
    });
  });
  const sorted = Object.values(all).sort((a,b)=>b.goals-a.goals).slice(0,3);

  if(sorted.length===0){
    wrap.innerHTML='<div style="text-align:center;padding:24px;color:var(--muted);font-family:Barlow Condensed,sans-serif;letter-spacing:1px;font-size:13px">Sin goleadores registrados aún</div>';
    return;
  }

  const medals=['🥇','🥈','🥉'];
  const colors=['var(--gold2)','#94a3b8','#b45309'];

// ── SINGLE CATEGORY VIEW ──────────────────────────────────────
function renderStatsSingle(cat, content){
  const isLink=LINK_CATS.includes(cat);
  const periods=getPeriodos();
  const ptHTML=periods.map((p,i)=>`<div class="ptab${i===0?' active':''}" data-cpidx="${i}" data-cat="${cat}">${p.label}</div>`).join('');

  // Table rows
  let rows='';
  RIVALS.forEach(r=>{
    if((r.f-1)%5===0&&r.f>1){
      const span=6+(isLink?LINK_TYPES.length:0);
      rows+=`<tr class="divider-row"><td colspan="${span}">── BLOQUE F${r.f}–F${Math.min(r.f+4,35)}</td></tr>`;
    }
    const stored=results[cat][r.f];
    const gf=stored?stored[0]:'', gc=stored?stored[1]:'';
    const res=stored?getResult(stored[0],stored[1]):null;
    const rb=res?`<span class="result-badge result-${res}">${res}</span>`:'—';
    const pts=res==='W'?3:res==='D'?1:res==='L'?0:'—';
    const ptC=res==='W'?'var(--win)':res==='D'?'var(--draw)':res==='L'?'var(--loss)':'var(--muted)';

    // RESERVA: use editable rivalData, other cats use fixed RIVALS
    const isReserva = cat === 'RESERVA';
    const rName = isReserva ? (rivalData['RESERVA'][r.f]?.rival || '') : r.r;
    const rCond = isReserva ? (rivalData['RESERVA'][r.f]?.cond  || 'L') : r.c;

    // Rival + cond cells
    const rivalCell = isReserva && canEdit
      ? `<td><input class="rival-edit-input" type="text" value="${esc(rName)}"
            data-fecha="${r.f}" data-field="rival"
            placeholder="Rival…"
            style="background:rgba(5,8,15,0.6);border:1px solid var(--border2);border-radius:4px;
            color:var(--text);font-size:12px;padding:3px 7px;width:130px;font-family:Barlow Condensed,sans-serif;
            font-weight:600;outline:none;"
            onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='var(--border2)'"></td>`
      : `<td class="rival-name">${esc(rName)||'—'}</td>`;

    const condCell = isReserva && canEdit
      ? `<td><select class="cond-edit-select" data-fecha="${r.f}" data-field="cond"
            style="background:rgba(5,8,15,0.7);border:1px solid var(--border2);border-radius:4px;
            color:var(--text);font-size:11px;padding:3px 6px;font-family:Barlow Condensed,sans-serif;
            font-weight:700;outline:none;cursor:pointer;">
            <option value="L" ${rCond==='L'?'selected':''}>LOCAL</option>
            <option value="V" ${rCond==='V'?'selected':''}>VISIT.</option>
          </select></td>`
      : `<td><span class="cond-badge cond-${rCond}">${rCond==='L'?'LOCAL':'VISIT.'}</span></td>`;

    let linkCols='';
    if(isLink){
      LINK_TYPES.forEach(lt=>{
        const val=links[cat][r.f][lt.key]||'',has=val.trim()!=='';
        linkCols+=`<td class="link-cell"><div class="link-wrap">
          <input class="link-input" type="url" value="${esc(val)}" placeholder="${lt.label}…"
            data-cat="${cat}" data-fecha="${r.f}" data-lkey="${lt.key}" title="${lt.label}"
            ${canEdit?'':'disabled'}>
          <a class="link-btn${has?'':' empty'}" href="${has?esc(val):'#'}" target="_blank" rel="noopener" title="${lt.label}">${lt.icon}</a>
        </div></td>`;
      });
    }
    rows+=`<tr>
      <td class="fecha-num">${r.f}</td>${rivalCell}${condCell}
      <td><div class="score-cell">
        <input class="score-input" type="number" min="0" max="99" value="${gf}"
          data-cat="${cat}" data-fecha="${r.f}" data-side="0" placeholder="—" ${canEdit?'':'disabled'}>
        <span class="score-sep">-</span>
        <input class="score-input" type="number" min="0" max="99" value="${gc}"
          data-cat="${cat}" data-fecha="${r.f}" data-side="1" placeholder="—" ${canEdit?'':'disabled'}>
      </div></td>
      <td>${rb}</td><td style="font-weight:700;color:${ptC}">${pts}</td>
      ${linkCols}</tr>`;
  });

  // Link headers
  let linkGH='', linkSH='';
  if(isLink){
    linkGH=`<th colspan="${LINK_TYPES.length}" style="background:linear-gradient(135deg,#0d1a3a,#08111f);color:var(--blue2);border-top:2px solid var(--blue2);font-size:12px;letter-spacing:2px;">🔗 LINKS</th>`;
    LINK_TYPES.forEach(lt=>{ linkSH+=`<th title="${lt.label}">${lt.icon} ${lt.label}</th>`; });
  }

  content.innerHTML=`
    <div class="st" style="margin-top:4px"><div class="stbar"></div>
      RESULTADOS · <span style="color:${CAT_COLORS[cat]}">${cat}</span>
    </div>
    <div class="table-wrap"><table>
      <thead>
        <tr class="thead-top">
          <th colspan="6" style="background:linear-gradient(135deg,#0a0f1e,#08111f);color:var(--muted);font-size:10px;letter-spacing:2px;">DATOS DEL PARTIDO</th>
          ${linkGH}
        </tr>
        <tr class="thead-sub"><th>#</th><th>RIVAL</th><th>COND</th><th>RESULTADO</th><th>RES</th><th>PTS</th>${linkSH}</tr>
      </thead>
      <tbody id="tbody-${cat}">${rows}</tbody>
    </table></div>

    <div class="st"><div class="stbar"></div>ESTADÍSTICAS · ${cat}</div>
    <div class="periodo-tabs" id="ptabs-${cat}">${ptHTML}</div>
    <div id="stats-area-${cat}"></div>

    <div class="st"><div class="stbar"></div>GRÁFICOS · ${cat}</div>
    <div class="charts-row">
      <div class="chart-card"><h3>PUNTOS POR BLOQUE</h3><canvas id="cpts-${cat}" height="200"></canvas></div>
      <div class="chart-card"><h3>GF / GC POR BLOQUE</h3><canvas id="cgls-${cat}" height="200"></canvas></div>
    </div>
    <div class="charts-row">
      <div class="chart-card"><h3>DIFERENCIA DE GOL ACUMULADA</h3><canvas id="cdg-${cat}" height="200"></canvas></div>
      <div class="chart-card"><h3>RESULTADOS TOTALES</h3><canvas id="cpie-${cat}" height="200"></canvas></div>
    </div>
    <div class="st"><div class="stbar"></div>TORTAS POR BLOQUE · ${cat}</div>
    <div class="pies-grid" id="piesgrid-${cat}"></div>

    <div class="st"><div class="stbar"></div>GOLEADORES · <span style="color:${CAT_COLORS[cat]}">${cat}</span></div>
    <div id="goleadores-${cat}"></div>
  `;

  // Events
  attachTableEvents(cat);
  // Period filter
  document.getElementById(`ptabs-${cat}`).addEventListener('click',e=>{
    if(!e.target.classList.contains('ptab'))return;
    document.getElementById(`ptabs-${cat}`).querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
    e.target.classList.add('active');
    const idx=parseInt(e.target.dataset.cpidx);
    const p=getPeriodos()[idx];
    document.getElementById(`stats-area-${cat}`).innerHTML=statsHTML(calcStats(cat,p.from,p.to));
  });
  document.getElementById(`stats-area-${cat}`).innerHTML=statsHTML(calcStats(cat,1,35));
  renderCatCharts(cat);
  renderGoleadores(cat);
}

// ── TABLE EVENTS ──────────────────────────────────────────────
function attachTableEvents(cat){
  const tbody=document.getElementById(`tbody-${cat}`);
  if(!tbody)return;
  tbody.addEventListener('change',e=>{
    if(e.target.classList.contains('score-input')){
      const f=parseInt(e.target.dataset.fecha),s=parseInt(e.target.dataset.side);
      const v=e.target.value===''?null:parseInt(e.target.value);
      if(!results[cat][f])results[cat][f]=[null,null];
      results[cat][f][s]=v;
      if(results[cat][f][0]===null&&results[cat][f][1]===null)results[cat][f]=null;
      rebuildRow(cat,f);
      document.getElementById(`stats-area-${cat}`).innerHTML=statsHTML(calcStats(cat,1,35));
      renderCatCharts(cat);
      saveData();
    }
    if(e.target.classList.contains('link-input')){
      const f=parseInt(e.target.dataset.fecha),key=e.target.dataset.lkey,val=e.target.value.trim();
      links[cat][f][key]=val;
      const btn=e.target.nextElementSibling;
      if(btn){btn.href=val||'#';btn.classList.toggle('empty',!val);}
      saveData();
    }
    // RESERVA editable rival/cond
    if(e.target.classList.contains('rival-edit-input')||e.target.classList.contains('cond-edit-select')){
      const f=parseInt(e.target.dataset.fecha),field=e.target.dataset.field;
      if(!rivalData['RESERVA'][f]) rivalData['RESERVA'][f]={rival:'',cond:'L'};
      rivalData['RESERVA'][f][field]=e.target.value;
      saveData();
    }
  });
}

function rebuildRow(cat,fecha){
  const tbody=document.getElementById(`tbody-${cat}`);
  if(!tbody)return;
  tbody.querySelectorAll('tr').forEach(tr=>{
    const inp=tr.querySelectorAll('.score-input');
    if(!inp.length||parseInt(inp[0].dataset.fecha)!==fecha)return;
    const r=results[cat][fecha],res=r?getResult(r[0],r[1]):null;
    tr.children[4].innerHTML=res?`<span class="result-badge result-${res}">${res}</span>`:'—';
    const pts=res==='W'?3:res==='D'?1:res==='L'?0:'—';
    tr.children[5].textContent=pts;
    tr.children[5].style.color=res==='W'?'var(--win)':res==='D'?'var(--draw)':res==='L'?'var(--loss)':'var(--muted)';
    tr.children[5].style.fontWeight='700';
  });
}

// ── CAT CHARTS ────────────────────────────────────────────────
function renderCatCharts(cat){
  const blocks=getBlocks(),labels=blocks.map(b=>b.label),col=CAT_COLORS[cat],def=chartDef();

  killChart(`cpts-${cat}`);
  new Chart(document.getElementById(`cpts-${cat}`).getContext('2d'),{type:'bar',
    data:{labels,datasets:[{label:'Puntos',
      data:blocks.map(b=>calcStats(cat,b.from,b.to).pts),
      backgroundColor:blocks.map(b=>{const v=calcStats(cat,b.from,b.to).pts;return v>=9?'rgba(34,197,94,.75)':v>=5?'rgba(201,162,39,.75)':'rgba(192,21,42,.65)';}),
      borderRadius:5,borderSkipped:false}]},options:def});

  killChart(`cgls-${cat}`);
  new Chart(document.getElementById(`cgls-${cat}`).getContext('2d'),{type:'bar',
    data:{labels,datasets:[
      {label:'GF',data:blocks.map(b=>calcStats(cat,b.from,b.to).gf),backgroundColor:'rgba(36,80,192,.7)',borderRadius:4},
      {label:'GC',data:blocks.map(b=>calcStats(cat,b.from,b.to).gc),backgroundColor:'rgba(192,21,42,.55)',borderRadius:4}
    ]},options:def});

  let dgAcc=[],acc=0,dgL=[];
  RIVALS.forEach(r=>{const x=results[cat][r.f];if(x){acc+=(x[0]-x[1]);dgAcc.push(acc);dgL.push('F'+r.f);}});
  killChart(`cdg-${cat}`);
  new Chart(document.getElementById(`cdg-${cat}`).getContext('2d'),{type:'line',
    data:{labels:dgL,datasets:[{label:'DG Acum.',data:dgAcc,borderColor:col,
      backgroundColor:col+'22',fill:true,tension:.3,pointRadius:3,
      pointBackgroundColor:dgAcc.map(v=>v>=0?'#22c55e':'#ef4444')}]},
    options:{...def,scales:{...def.scales,y:{...def.scales.y,grid:{color:ctx=>ctx.tick.value===0?'#5a7099':'rgba(26,45,90,0.4)'}}}}});

  const tot=calcStats(cat,1,35);
  killChart(`cpie-${cat}`);
  new Chart(document.getElementById(`cpie-${cat}`).getContext('2d'),{type:'doughnut',
    data:{labels:['Ganados','Empates','Perdidos'],datasets:[{data:[tot.pg,tot.pe,tot.pp],
      backgroundColor:['rgba(34,197,94,.82)','rgba(245,158,11,.82)','rgba(192,21,42,.75)'],
      borderColor:['#22c55e','#f59e0b','#c0152a'],borderWidth:2}]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#5a7099',font:{family:'Barlow Condensed'}}}}}});

  // Block pies
  const grid=document.getElementById(`piesgrid-${cat}`);
  if(!grid)return;
  grid.innerHTML='';
  blocks.forEach(b=>{
    const s=calcStats(cat,b.from,b.to),id=`pb-${cat}-${b.from}`;
    grid.insertAdjacentHTML('beforeend',pieMini(id,s,b.label));
    setTimeout(()=>drawPie(id,s),0);
  });
}

// ── GOLEADORES ────────────────────────────────────────────────
function renderGoleadores(cat){
  const wrap=document.getElementById(`goleadores-${cat}`);
  if(!wrap)return;
  const list=goleadores[cat]||[];
  // Group by player name
  const map={};
  list.forEach(g=>{
    if(!map[g.name])map[g.name]={name:g.name,goals:0,fechas:[]};
    map[g.name].goals+=g.goals;
    map[g.name].fechas.push(`F${g.fecha}`);
  });
  const sorted=Object.values(map).sort((a,b)=>b.goals-a.goals);

  let rowsHTML='';
  if(sorted.length===0){
    rowsHTML=`<div class="gol-empty">Sin goleadores registrados</div>`;
  } else {
    sorted.forEach((g,i)=>{
      const rankClass=i===0?'gold':i===1?'silver':i===2?'bronze':'';
      rowsHTML+=`<div class="gol-row">
        <div class="gol-rank ${rankClass}">${i+1}</div>
        <div class="gol-name">${esc(g.name)}<br><span style="font-size:10px;color:var(--muted);font-weight:400">${g.fechas.join(', ')}</span></div>
        <div class="gol-count">${g.goals}</div>
        ${canEdit?`<button class="btn-del-gol" onclick="delGoleador('${cat}','${esc(g.name)}')"
          style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;"
          title="Eliminar">✕</button>`:''}
      </div>`;
    });
  }

  wrap.innerHTML=`<div class="goleadores-grid">
    <div class="goleadores-card">
      <div class="gc-header">
        <h3>⚽ GOLEADORES ${cat}</h3>
        <span style="font-family:Bebas Neue,sans-serif;font-size:20px;color:rgba(255,255,255,0.7)">${sorted.length}</span>
      </div>
      <div class="gc-body">${rowsHTML}</div>
      ${canEdit?`<div class="gol-add-row">
        <input class="gol-input" id="gol-name-${cat}" placeholder="Nombre del jugador…" autocomplete="off">
        <input class="gol-fecha-input" id="gol-fecha-${cat}" type="number" min="1" max="35" placeholder="F#">
        <input class="gol-fecha-input" id="gol-count-${cat}" type="number" min="1" max="9" value="1" style="width:40px">
        <button class="btn-add-gol" onclick="addGoleador('${cat}')">+ GOL</button>
      </div>`:''}
    </div>
  </div>`;
}

function addGoleador(cat){
  const nameEl=document.getElementById(`gol-name-${cat}`);
  const fechaEl=document.getElementById(`gol-fecha-${cat}`);
  const countEl=document.getElementById(`gol-count-${cat}`);
  const name=nameEl.value.trim();
  const fecha=parseInt(fechaEl.value);
  const count=parseInt(countEl.value)||1;
  if(!name||!fecha||fecha<1||fecha>35){
    nameEl.style.borderColor='var(--red)';
    setTimeout(()=>nameEl.style.borderColor='',1500);
    return;
  }
  if(!goleadores[cat])goleadores[cat]=[];
  goleadores[cat].push({name,goals:count,fecha});
  nameEl.value=''; fechaEl.value=''; countEl.value='1';
  saveData();
  renderGoleadores(cat);
}

function delGoleador(cat,name){
  if(!confirm(`¿Eliminar todos los goles de ${name} en ${cat}?`))return;
  goleadores[cat]=(goleadores[cat]||[]).filter(g=>g.name!==name);
  saveData();
  renderGoleadores(cat);
}

const POSITIONS   = ['Arquero','Defensor Central','Lateral Der.','Lateral Izq.',
                     'Mediocampista Def.','Mediocampista','Mediocampista Of.',
                     'Extremo Der.','Extremo Izq.','Delantero Centro','Segundo Delantero'];
const PIERNAS     = ['Derecha','Izquierda','Ambas'];

// players[cat] = [ {id, name, pos, pierna, altura, peso, nacimiento, dni, credencial, domicilio, contacto, foto} ]
const players = {};
CATEGORIES.forEach(cat => { players[cat] = []; });

let plantelCurrentCat = 'GENERAL';
let plantelSearch     = '';
let plantelPosFilter  = 'TODOS';
let editingPlayer     = null; // { cat, id } while modal open

// ── Save/load players via Firebase ───────────────────────────
function savePlayers() {
  if (!fbReady || !db || !canEdit) return;
  clearTimeout(window._savePlayersTimeout);
  window._savePlayersTimeout = setTimeout(() => {
    const payload = {};
    CATEGORIES.forEach(cat => { payload[cat] = players[cat] || []; });
    db.ref('plantel').set(payload)
      .then(() => showToast('☁ GUARDADO'))
      .catch(e => console.warn('save plantel error:', e));
  }, 800);
}

function loadPlayers(payload) {
  if (!payload) return;
  CATEGORIES.forEach(cat => {
    if (payload[cat]) players[cat] = payload[cat];
  });
}

// ── Extend loadData to include plantel ───────────────────────
const _origLoadData = loadData;
async function loadData() {
  await _origLoadData();
  if (!fbReady || !db) return;
  return db.ref('plantel').once('value').then(snap => {
    loadPlayers(snap.val());
  }).catch(() => {});
}

// ── Build plantel module ──────────────────────────────────────
function buildPlantelModule() {
  const panel = document.getElementById('panel-plantel');
  panel.innerHTML = `
    <div class="cat-subtabs" id="plantel-subtabs"></div>
    <div class="main" id="plantel-content"></div>`;
  buildCatSubtabs('plantel-subtabs', cat => {
    plantelCurrentCat = cat;
    renderPlantel();
  }, 'GENERAL');
  plantelCurrentCat = 'GENERAL';
  renderPlantel();
}

// ── Render plantel view ───────────────────────────────────────
function renderPlantel() {
  const content = document.getElementById('plantel-content');
  if (!content) return;

  // Gather players for current cat
  const allPlayers = plantelCurrentCat === 'GENERAL'
    ? CATEGORIES.flatMap(cat => (players[cat]||[]).map(p => ({...p, _cat: cat})))
    : (players[plantelCurrentCat]||[]).map(p => ({...p, _cat: plantelCurrentCat}));

  // Filter
  const q = plantelSearch.toLowerCase();
  const filtered = allPlayers.filter(p => {
    const matchQ = !q || p.name.toLowerCase().includes(q) || (p.pos||'').toLowerCase().includes(q);
    const matchP = plantelPosFilter === 'TODOS' || p.pos === plantelPosFilter;
    return matchQ && matchP;
  });

  // Position filter pills
  const allPos = ['TODOS', ...POSITIONS];
  const posPills = allPos.map(pos =>
    `<div class="pos-pill${plantelPosFilter===pos?' active':''}" onclick="setPosFilter('${pos}')">${pos}</div>`
  ).join('');

  content.innerHTML = `
    <div class="st" style="margin-top:4px">
      <div class="stbar"></div>
      PLANTEL${plantelCurrentCat!=='GENERAL'?' · <span style="color:'+CAT_COLORS[plantelCurrentCat]+'">'+plantelCurrentCat+'</span>':''}
    </div>

    <div class="plantel-toolbar">
      <input type="text" placeholder="🔍  Buscar jugador o posición…"
        value="${esc(plantelSearch)}"
        oninput="plantelSearch=this.value;renderPlantel()"
        id="plantel-search-input">
      ${canEdit ? `<button class="btn-add-player" onclick="openFichaModal(null,'${plantelCurrentCat==='GENERAL'?'4TA':plantelCurrentCat}')">+ JUGADOR</button>` : ''}
    </div>

    <div class="pos-filter">${posPills}</div>

    <div class="player-count">
      Mostrando <span>${filtered.length}</span> de <span>${allPlayers.length}</span> jugadores
    </div>

    <div class="players-grid" id="players-grid">
      ${filtered.length > 0 ? filtered.map(p => playerCardHTML(p)).join('') : emptyStateHTML()}
    </div>`;
}

function setPosFilter(pos) {
  plantelPosFilter = pos;
  renderPlantel();
}

  return `<div class="player-card" onclick="openFichaModal('${p.id}','${p._cat}')">
    <div class="pc-top">
      <div class="player-avatar">
        ${p.foto ? `<img src="${esc(p.foto)}" alt="${esc(p.name)}">` : initials}
      </div>
      <div class="pc-name-block">
        <div class="pc-name">${esc(p.name||'Sin nombre')}</div>
        <div class="pc-pos">${p.pos||'—'}</div>
      </div>
      <div class="pc-cat-badge" style="color:${catColor}">${p._cat}</div>
